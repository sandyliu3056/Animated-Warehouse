D.FEDEX_GUIDE=[["h","開始之前","Before we start"],["p","這份筆記講 FedEx 美國國內包裹的計費。目標是讓你打開一張 FedEx 帳單，認得出每一列在收什麼錢，以及那筆錢是怎麼算出來的。","These notes cover how FedEx prices US domestic parcels. The goal is that you can open a FedEx invoice, recognize what every line is charging for, and follow how the number was reached."],["f","總費用 = 基本運費 ＋ 附加費 ＋ 燃油","Total = base transportation + surcharges + fuel"],["p","基本運費看服務、Zone 和計費重量；附加費看這件包裹麻不麻煩、送到哪裡；燃油是把前面兩項加起來乘一個百分比。三塊的順序固定。","The base rate follows the service, the zone and the billable weight. Surcharges follow how awkward the parcel is and where it is going. Fuel takes the first two together and multiplies by a percentage. The order never changes."],["a","先建立一個習慣：拿到一票，第一件事永遠是確認「這是哪一個服務」。FedEx 的服務分成兩大家族，費率表、Zone、燃油全部各自獨立，服務認錯後面每一步都會錯。","Build one habit first: with any shipment, establish which service it went on. FedEx runs two service families with entirely separate rate tables, zones and fuel percentages. Get the service wrong and every later step is wrong."],["h","服務種類：Express 一套，Ground 一套","Services: one Express family, one Ground family"],["p","飛的叫 Express，開車的叫 Ground。兩邊各有自己的費率表、自己的 Zone、自己的燃油百分比，不能互相套用。","What flies is Express, what drives is Ground. Each has its own rate table, its own zones and its own fuel percentage, and they never substitute for each other."],["t",[["服務","Service"],["家族","Family"],["什麼時候到","When it arrives"]],[["FedEx First Overnight","Express",["隔天一大早，最快也最貴","Next business day, first thing; fastest and dearest"]],["FedEx Priority Overnight","Express",["隔天上午","Next business day, morning"]],["FedEx Standard Overnight","Express",["隔天下午","Next business day, afternoon"]],["FedEx 2Day A.M.","Express",["第 2 個工作天上午","2nd business day, morning"]],["FedEx 2Day","Express",["第 2 個工作天下班前","End of the 2nd business day"]],["FedEx Express Saver","Express",["第 3 個工作天下午","3rd business day, afternoon"]],["FedEx Ground","Ground",["1-5 個工作天，送企業地址","1-5 business days, to business addresses"]],["FedEx Home Delivery","Ground",["1-5 個工作天，送住家","1-5 business days, to homes"]],["FedEx Ground Economy","Ground",["最慢，末端常交郵局","Slowest; the final leg often goes via the post office"]]]],["a","Express Saver 是最容易記錯的一個。它叫 Saver、要三天、聽起來像陸運，但它屬於 Express，吃 Express 的費率表和 Express 的燃油。","Express Saver is the one people misremember. It is called Saver, takes three days and sounds like ground, but it belongs to Express: Express rate table, Express fuel."],["p","帳單上怎麼分辨：服務名稱直接印在費用說明欄裡。看到 Overnight、2Day、Express 字樣就是 Express 家族；Ground、Home Delivery、Ground Economy 是 Ground 家族。","How to tell on the invoice: the service name is printed in the charge description. Overnight, 2Day and Express belong to the Express family; Ground, Home Delivery and Ground Economy to the Ground family."],["h","Ground 和 Home Delivery：一件事，兩個服務名稱","Ground and Home Delivery: one job, two service names"],["p","送到企業地址叫 FedEx Ground，送到住家叫 FedEx Home Delivery。兩者跑同一批車、同一個網路，但在報表和帳單上是分開的兩行。","Deliveries to a business go as FedEx Ground; deliveries to a home go as FedEx Home Delivery. They move on the same network and the same trucks, but they appear as two separate lines on reports and invoices."],["a","做量體分析時，只抓 Ground 會漏掉住宅那一半。要看陸運總量，兩個服務要一起加。","When sizing volume, counting only Ground misses the residential half. To see total ground volume, add both services together."],["p","住宅還是會有住宅配送費，不是換個服務名稱就不收。而且判定住宅的是 FedEx，不是客戶在系統裡勾什麼——公寓、大樓、在家工作的辦公室通常都會被判成住宅。","A residential delivery charge still applies; the different service name does not remove it. And FedEx decides what counts as residential, not the box the customer ticked -- flats, apartment blocks and home offices normally read as residential."],["h","計費重量","Billable weight"],["p","FedEx 收錢看的是計費重量，不是磅秤上的數字。實際重量和材積重量比大的，無條件進位。","FedEx bills on the billable weight, not what the scale said. Compare the actual weight against the dimensional weight, take the larger, and round up."],["f","材積重量 = 長 × 寬 × 高 ÷ 139　　計費重量 = 進位( 實重 與 材積重 取大的 )","DIM weight = L x W x H / 139   Billable = round up( the larger of actual and DIM )"],["p","為什麼要算材積重：一台車的車廂大小是固定的。裝滿泡棉的大箱子沒多重，但它佔掉的空間就是那麼多，那一趟的油錢和司機成本並不會因為它輕而變少。","Why dimensional weight exists: the truck has a fixed amount of space. A big box of foam weighs almost nothing, but it takes up what it takes up, and the fuel and driver for that trip cost the same either way."],["p","139 是美國國內常見的除數，合約可以談。方向記住：除數越小，算出來越重、越貴。","139 is the usual US domestic divisor and it is negotiable. Remember the direction: the smaller the divisor, the heavier the result and the dearer the parcel."],["h","量尺寸：先排序，再算長度加周長","Measuring: sort first, then length plus girth"],["p","客戶填的長寬高常常是隨手填的。FedEx 不看欄位名稱，只看三個數字裡哪個最大。所以拿到尺寸第一件事永遠是由大到小排。","Whatever the customer typed under length, width and height is usually whatever came to hand. FedEx does not read the column names, only which of the three numbers is biggest, so the first thing you do is sort them."],["f","長度加周長 = 最長邊 ＋ 2 ×（第二長邊 ＋ 第三邊）","Length + girth = longest + 2 x (second + third)"],["p","周長就是把箱子橫著繞一圈。這個數字專門抓細細長長的東西——一支釣竿、一片門板，單看任何一邊都不誇張，繞一圈才看得出來有多佔位。","Girth is the distance round the box the short way. It is what catches long thin things: a fishing rod or a door panel has no single alarming measurement, and only the girth reveals how awkward it is."],["a","這個數字後面判斷 Additional Handling 和 Oversize 都要用。量錯一邊，後面全錯。","This number drives both the additional handling and the oversize tests below. Get one side wrong and everything downstream is wrong."],["h","Zone：距離的代號","Zone: the code for distance"],["p","Zone 是「這一趟有多遠」的代號，數字越大越遠也越貴。它由寄件地和收件地一起決定，不是收件地自己的屬性。","A zone codes how far the parcel is going: bigger means further and dearer. It comes from origin and destination together, not from the destination alone."],["p","同一個客戶，從加州出貨和從紐澤西出貨會落在不同的 Zone。所以換倉庫會直接改變整個成本結構。","The same customer sits in different zones depending on whether you ship from California or New Jersey, which is why changing warehouse changes the whole cost structure."],["a","Express 和 Ground 的 Zone 是分開算的。同一組寄收 ZIP，Express 一個數字、Ground 另一個數字，不能互相套。","Express and Ground zone independently. The same pair of ZIPs is one number on Express and another on Ground; they do not transfer."],["p","怎麼查：FedEx 對每個寄件地出一份 Zone Locator，列出收件 ZIP 範圍對應的 Zone。從 FedEx 官網用寄件 ZIP 下載。","How to look it up: FedEx issues a zone locator per origin, listing destination ZIP ranges against zones. Download one from fedex.com using your origin ZIP."],["h","Additional Handling：這件比較麻煩","Additional handling: this one is awkward"],["p","分揀場靠輸送帶跑。包裹丟上帶子、自動掃描、自動分流，全程沒有人碰它，成本最低。有些東西上不了帶子，得靠人工搬，這一筆就是收那個成本。","The hubs run on conveyors: a parcel goes on the belt, gets scanned and sorted, and nobody touches it. Some things cannot ride the belt and have to be moved by hand, and this charge pays for that."],["t",[["類別","Category"],["什麼情況會中","What triggers it"]],[[["Additional Handling - Weight","AH - Weight"],["單件實際重量超過門檻","The actual weight of one piece is over the threshold"]],[["Additional Handling - Dimensions","AH - Dimensions"],["最長邊、第二長邊或長度加周長超過門檻","The longest side, the second side or length plus girth is over"]],[["Additional Handling - Packaging","AH - Packaging"],["不是完整瓦楞紙箱：桶、輪胎、軟包裝、木箱","Not fully encased in corrugated: drums, tyres, poly bags, wooden crates"]]]],["p","三類同時成立時不會收三次，取最高的一種。包裝那一類是用眼睛判斷的，量尺寸量不出來。","Where more than one category applies it is charged once, at the dearest. The packaging category is judged by eye rather than by tape measure."],["a","門檻每年會調。判斷一票會不會中，要查當年度的 FedEx 服務指南，不要憑記憶。","The thresholds are revised annually. Check the current FedEx Service Guide rather than going from memory."],["h","Oversize：比 Additional Handling 更上一級","Oversize: the tier above"],["p","再大一級就從 Additional Handling 跳到 Oversize Charge，金額差好幾倍。觸發條件是最長邊或長度加周長超過更大的門檻。","One size up and the charge moves from additional handling to the oversize charge, several times the amount. It triggers on a longer longest side or a bigger length plus girth."],["p","Oversize 還會拉高計費重量：不管箱子多輕，都要照一個最低重量計價。","Oversize also floors the billable weight: however light the box, it rates at a minimum weight."],["a","同一件不會既收 Additional Handling 又收 Oversize，大的會吸收小的。兩筆同時出現在同一個追蹤號上，值得追。","One parcel does not take both additional handling and oversize -- the larger absorbs the smaller. Both on one tracking number is worth chasing."],["h","Unauthorized Package：規定上不收，實際上照送然後重罰","Unauthorized package: not accepted on paper, carried anyway and penalised"],["p","超過重量或尺寸上限的包裹，條款上寫的是「不接受運送」。但實際運作不是把它退回櫃台——這種包裹一旦流進 FedEx 的系統，通常還是會送到，然後在帳單上加一筆 Unauthorized Package Charge。","A parcel past the weight or size limits is, in the terms, not accepted for carriage. In practice it is not handed back at the counter: once it is inside the FedEx network it usually gets delivered, and an unauthorized package charge appears on the invoice."],["a","所以「不收」的意思不是寄不出去，而是「你不該寄，寄了要付代價」。這一筆很重，金額通常比整票運費還高——它的用意是嚇阻，不是計價。","So not accepted does not mean it will not go. It means you should not have sent it, and there is a price for having done so. The charge is heavy, usually more than the freight itself: it is there to deter, not to price the work."],["p","FedEx 也保留把包裹退回寄件人的權利。所以兩種結果都可能：送到並收罰款，或是退回來，而運費不退。","FedEx also reserves the right to return the parcel to the shipper, so either outcome is possible: delivered with a penalty, or sent back with the freight not refunded."],["a","常見的上限量級是 150 磅、最長邊 108 英吋、長度加周長 165 英吋，確切數字看當年度服務指南。看到這一筆一定要回頭查出貨端是誰放行的。","The usual limits are around 150 lb, 108 inches on the longest side and 165 inches length plus girth; confirm against the current Service Guide. When one appears, trace it back to whoever let it out of the door."],["f","Unauthorized Package 是「另外加收」，不是取代 Oversize。","The unauthorized package charge is added ON TOP, not instead of the oversize charge."],["p","前面說 Additional Handling 和 Oversize 互斥，那是它們兩個之間的規則。Unauthorized Package 不在那個規則裡——它是疊在所有其他費用之上的，一件超限的包裹同時看到 Oversize 和 Unauthorized 是正常的。","The mutual exclusion described earlier is a rule between additional handling and oversize only. The unauthorized package charge sits outside it and stacks on everything else, so seeing both oversize and unauthorized on one over-limit parcel is normal."],["a","旺季還會再加一筆 Demand — Ground Unauthorized Package Charge。所以一件超限的包裹在十二月可能同時掛三到四筆，這也是為什麼它幾乎一定是整張帳單上最貴的一列。","At peak a demand charge for unauthorized packages is added as well. So one over-limit parcel in December can carry three or four charges at once, which is why it is almost always the dearest line on the invoice."],["h","住宅與偏遠","Residential and remote"],["p","住宅配送費看收件地址是不是住家。Delivery Area Surcharge（DAS，偏遠地區附加費）看收件 ZIP 有沒有在 FedEx 的偏遠清單上——那是一份清單，跟 Zone 沒有關係。","The residential delivery charge asks whether the address is a home. The delivery area surcharge asks whether the destination ZIP is on the FedEx remote list -- that is a list, and it has nothing to do with the zone."],["p","所以會出現這種畫面：寄到 Zone 8 的大城市沒有 DAS，寄到 Zone 3 的鄉下反而有。Zone 小卻收 DAS，不是錯帳。","So a Zone 8 city address can carry no DAS while a Zone 3 country address does. A low zone with a DAS line is not a billing error."],["p","偏遠是三筆不同的附加費，帳單上是三個不同的名稱，不是一筆分級。收件 ZIP 落在哪一份清單就收哪一個，一票只會中一個。","Remote is three separate surcharges under three different names on the invoice, not one graded charge. Whichever list the destination ZIP sits on is the one charged, and a shipment only ever takes one."],["t",[["帳單上的名稱","On the invoice"],["中文","What it is"],["大概是什麼地方","Roughly where"]],[["Delivery Area Surcharge",["一般偏遠","Standard remote"],["本土 48 州清單上的一般偏遠地址","Listed addresses in the contiguous 48"]],["DAS Extended",["延伸偏遠","Extended"],["更外圍的清單，路程更長","A further-out list, longer routes"]],["DAS Remote",["極偏遠","Remote"],["最難到達的地方，含阿拉斯加與夏威夷","The hardest places to reach, including Alaska and Hawaii"]]]],["p","每一層再分住宅和商業，金額也依 Ground 或 Express 而不同。Remote 最貴，跟一般 DAS 差距很大。清單每年更新，年初帳單突然多出這一筆，先確認是不是清單變了。","Each tier splits into residential and commercial, and the amounts differ between Ground and Express. Remote is much the dearest. The lists are updated annually, so when one appears out of nowhere in January, check the new list first."],["a","記帳時不要把三個一律歸成 DAS。金額差很多，分開統計才看得出成本落在哪裡。","Do not book all three as DAS. The amounts differ enough that only separate tracking shows where the cost actually sits."],["f","偏遠有兩邊：Pickup Area Surcharge 看的是「你從哪裡出貨」。","Remote cuts both ways: the pickup area surcharge reads where you ship FROM."],["a","取件地也在偏遠清單上的話，每一票都會固定產生這一筆，跟收件地無關。倉庫的位置本身就是一個成本因素，這一點在挑倉庫時要先算進去。","If the pickup address is on the list, every single shipment carries this charge regardless of destination. The location of the warehouse is itself a cost factor, and one to price in before signing a lease."],["h","燃油：兩張表，每週一換","Fuel: two tables, reset every Monday"],["p","FedEx 用指數式燃油：Express 綁航空煤油價，Ground 綁柴油價，資料來源是美國能源部（EIA），每週一調整。","FedEx uses an index-based fuel surcharge: Express pegged to jet fuel and Ground to diesel, both from US Energy Information Administration data and reset every Monday."],["a","看哪一週的比例，是看取件日，不是帳單日期，也不是送達日。一張跨兩週的帳單本來就會有兩個以上的燃油比例，那不是錯帳。","Which week applies follows the pickup date -- not the invoice date and not the delivery date. An invoice spanning two weeks legitimately carries two or more percentages."],["p","燃油是算在運費加上部分附加費之上，不是只算附加費。所以一筆附加費有雙重傷害：自己收一筆，還把燃油的基數墊高。","Fuel is charged on the freight plus some of the surcharges, not on the surcharges alone. So a surcharge hurts twice: once itself, and again by raising the base that fuel is charged on."],["h","FedEx 的附加費一覽","The FedEx surcharge list"],["p","下面用帳單上實際印的英文名稱列，看到才認得出來。","Listed by the English names actually printed on the invoice, so you can match them by eye."],["t",[["帳單上的名稱","On the invoice"],["中文","What it is"],["什麼時候會出現","When it lands"]],[["Residential Delivery Charge",["住宅配送費","Residential delivery"],["收件地址是住家","The destination is a home"]],["Delivery Area Surcharge",["偏遠地區附加費","Delivery area surcharge"],["收件 ZIP 在偏遠清單上","The destination ZIP is on the remote list"]],["DAS Extended / Remote",["更外圍的偏遠","Extended / remote area"],["更難到達的清單，收得更高","A harder-to-reach list, priced higher"]],["Pickup Area Surcharge",["偏遠取件費","Pickup area surcharge"],["取件地在偏遠清單上","The pickup address is on the list"]],["Additional Handling",["額外處理費","Additional handling"],["重量、尺寸或包裝超標","Weight, dimensions or packaging over the line"]],["Oversize Charge",["超尺寸費","Oversize"],["更大一級，另有最低計費重量","A tier larger, with a weight floor"]],["Unauthorized Package",["未授權包裹","Unauthorized package"],["超過重量或尺寸上限","Past the weight or size limits"]],["Address Correction",["地址更正費","Address correction"],["FedEx 幫你修正地址","FedEx had to fix the address"]],["Delivery Signature Options",["簽名服務","Signature options"],["客戶加購，分間接／直接／成人","Bought by the customer: indirect, direct or adult"]],["Declared Value",["申報價值","Declared value"],["保額超過基本責任額","Cover above the basic liability"]],["Saturday Delivery / Pickup",["週六派送／取件","Saturday delivery / pickup"],["兩筆分開收","Two separate charges"]],["Return Pickup / Call Tag",["退貨取件","Return pickup"],["去客戶端取回","Collecting from the customer"]],["Hazardous Materials",["危險品","Hazardous materials"],["危險品或鋰電池","Dangerous goods or lithium batteries"]],["Fuel Surcharge",["燃油附加費","Fuel"],["每週一調","Reset weekly"]]]],["h","旺季會多一組 Demand 附加費","Peak adds a set of demand surcharges"],["p","年底旺季 FedEx 會另外加一組 Demand 附加費，名稱就是原本那筆前面加 Demand。帳單上會同時看到兩行。","At peak FedEx adds a set of demand surcharges, named by prefixing the original charge. Both lines appear on the invoice."],["t",[["平常","Normal"],["旺季多的那一筆","The peak twin"]],[["Residential Delivery Charge","Demand — Residential Delivery Charge"],["Additional Handling","Demand — Additional Handling Surcharge"],["Oversize Charge","Demand — Oversize Charge"],["Unauthorized Package","Demand — Ground Unauthorized Package Charge"]]],["a","同一個追蹤號上住宅費出現兩行、名稱只差 Demand 兩個字，那不是重複計費，是旺季加價。","Two residential lines on one tracking number differing only by the word Demand is not double billing -- it is the peak surcharge."],["h","哪些附加費要吃燃油","Which surcharges take fuel"],["p","FedEx 公告的 Ground 燃油適用範圍包含：額外處理、地址更正、退貨取件、偏遠地區附加費、簽名服務、危險品、超尺寸費、未授權包裹、住宅配送費，以及上面那組 Demand 附加費。","The published FedEx ground fuel basis covers additional handling, address correction, return pickup, the delivery area surcharge, signature options, hazardous materials, oversize, unauthorized package, residential delivery and the demand surcharges above."],["a","這份清單每年會調整。數字對不上時，回頭查當期公告的適用範圍，不要憑印象。","The list is revised annually. When the arithmetic will not close, go back to the schedule in force rather than working from memory."],["h","帳單怎麼看","Reading the invoice"],["p","FedEx 帳單透過 FedEx Billing Online 下載，可以匯出成檔案再進 Excel 或系統。","FedEx invoices come through FedEx Billing Online and export to a file for Excel or a system."],["a","Express 和 Ground 常常是分開的帳單號。只對到其中一張就以為對完了，是很常見的疏漏。","Express and Ground often carry separate invoice numbers. Reconciling one and stopping there is a common miss."],["p","看一票的順序：先找追蹤號，再看基本運費，再看附加費，最後看調整或更正。","Work a shipment in order: find the tracking number, then the base charge, then the surcharges, then any adjustment or correction."],["p","FedEx 會事後更正重量尺寸和地址。分揀場自動量測，跟申報的不一樣就補收差額；地址不完整或住商寫錯就收地址更正費。這兩筆都是資料錯誤造成的，靠出貨端的流程就能壓下來——秤要準、尺寸要量對、地址要完整。","FedEx corrects weight, dimensions and addresses after the fact: the hubs measure automatically and bill the difference, and an incomplete or misclassified address draws a correction fee. Both come from bad data and both can be reduced on the dock -- weigh properly, measure properly, complete the address."],["h","其他要知道的幾筆","A few others worth knowing"],["t",[["項目","Item"],["重點","What matters"]],[[["申報價值","Declared value"],["沒申報的基本責任額很低，高價品要另外申報並付費","Basic liability without a declaration is low; high-value goods must be declared and paid for"]],[["準點保證","Money-back guarantee"],["依服務與期間而定，旺季常暫停，要看當期公告","Depends on service and period; often suspended at peak, so check the current notice"]],[["FedEx One Rate","FedEx One Rate"],["Express 的固定費率包裝，重量在限制內就同一個價","Flat-rate Express packaging: one price while the weight stays inside the limit"]],[["付款方式","Billing terms"],["寄件人付、收件人付、第三方付；後兩者另有手續費","Shipper, receiver or third party; the latter two carry a fee"]],[["帳號填錯","Invalid account"],["會改由寄件人付款並加收處理費","Rebilled to the shipper with a handling fee"]]]],["h","一票對不上的時候，照這個順序查","When a shipment will not reconcile"],["t",["",["先確認","Check"],["最常見的錯","Most common failure"]],[["1",["Express 還是 Ground","Express or Ground"],["Express Saver 被當成陸運查表","Express Saver rated against a ground table"]],["2",["Ground 還是 Home Delivery","Ground or Home Delivery"],["只抓 Ground，漏掉住宅那一半","Counting only Ground and missing the residential half"]],["3",["Zone","Zone"],["拿 Express 的 Zone 查 Ground 費率表","An Express zone read against a Ground table"]],["4",["計費重量","Billable weight"],["忘了材積重，或忘了 Oversize 的最低重量","DIM weight, or the oversize weight floor, forgotten"]],["5",["偏遠","Remote"],["只查了收件地，漏掉取件地的 Pickup Area Surcharge","Only the destination checked, missing the pickup area surcharge"]],["6",["旺季","Peak"],["把 Demand 那一行當成重複計費","A Demand line mistaken for double billing"]],["7",["燃油","Fuel"],["用錯週別，或用帳單日期而不是取件日","The wrong week, or the invoice date instead of the pickup date"]],["8",["帳單張數","Invoice count"],["Express 和 Ground 分開出帳，只對到一張","Express and Ground billed separately, only one reconciled"]]]],["h","第一階段目標","Where to get to first"],["p","看得懂一張 FedEx 帳單在講什麼，分得出 Express 和 Ground、Ground 和 Home Delivery，認得出帳單上那些附加費的英文名稱，遇到對不上的時候知道從哪一步開始查。費率細節可以慢慢累積。","Be able to read what a FedEx invoice is saying, tell Express from Ground and Ground from Home Delivery, recognize the surcharge names printed on the bill, and know which step to start from when something will not reconcile. The rate detail accumulates later."],["a","門檻和金額每年公告一次。這份筆記寫的是規則的形狀，實際數字請以當年度 FedEx 服務指南與公司合約為準。","Thresholds and amounts are published annually. These notes describe the shape of the rules; for the actual figures use the current FedEx Service Guide and your contract."]];
D.FEDEX_HEAD={"zh":["FedEx 計費筆記","給第一次看 FedEx 帳單的人"],"en":["FedEx Billing Notes","For anyone opening a FedEx invoice for the first time"],"es":["Apuntes de facturación de FedEx","Para quien abre una factura de FedEx por primera vez"]};
D.FEDEX_FOOT={"zh":"本文件為內部教材。實際費率、附加費門檻與規則以當年度 FedEx 服務指南與公司合約為準。","en":"Internal training material. Actual rates, surcharge thresholds and rules follow the current FedEx Service Guide and your contract.","es":"Material de capacitación interna. Las tarifas, los umbrales de recargo y las reglas reales se rigen por la Guía de Servicio vigente de FedEx y por tu contrato."};
D.USPS_GUIDE=[["h","開始之前","Before we start"],["p","這份筆記講 USPS 美國國內包裹的計費。郵政是政府機構，法律上有普及服務義務——每天要送到全美每一個地址。這件事決定了它幾乎所有的計價方式。","These notes cover how USPS prices US domestic parcels. The postal service is a government agency with a universal service obligation: by law it delivers to every address in the country every day. That single fact shapes almost everything about how it charges."],["f","沒有住宅附加費。沒有偏遠地區附加費。週六本來就送。燃油自 2026/4/26 起才有，固定 8%，限期到 2027/1/17。","No residential surcharge. No delivery area surcharge. Saturday delivery is standard. Fuel exists only from 2026-04-26: a flat 8% scheduled to lapse 2027-01-17."],["p","這四句不是簡化說法，是真的沒有這些收費項目。距離和投遞難度直接反映在 Zone 1 到 9 的基本郵資裡，不會另外拉出來收一筆。","None of that is a simplification -- those charges do not exist. Distance and difficulty are priced into the zone 1 to 9 base postage rather than pulled out as separate lines."],["a","但不要以為 USPS 比較單純。它的複雜度在別的地方：服務之間的規則差很多、尺寸規則很細、產品線改過名字，而且付錢的方式跟商業快遞完全不同。","Do not read that as simple, though. The complexity sits elsewhere: the services differ sharply from one another, the size rules are fine-grained, the product line has been renamed, and paying works nothing like a commercial courier."],["h","郵資是先付的，沒有月結帳單","Postage is paid up front; there is no monthly invoice"],["p","商業快遞是先寄後付：這週寄，下週收到帳單，再去對帳。USPS 相反——郵資在印標籤的當下就從郵資帳戶扣掉了。","A commercial courier ships first and bills later: you ship this week, the invoice arrives next week, and you reconcile it. USPS is the other way round -- the postage comes out of the account the moment the label prints."],["p","所以沒有一張月結帳單等你去挑錯。成本資料要從郵資帳戶紀錄，或是出標籤的平台去拉。","So there is no monthly invoice to audit. The cost data comes from the postage account records or from whatever platform generated the labels."],["a","這代表兩件事：USPS 幾乎不會有事後補收，但你也幾乎沒有事後爭議的空間。標籤印錯規格、郵資算錯，錢當下就付掉了。","Which cuts both ways: there is almost no back-billing with USPS, and almost no room to dispute afterwards. Print a label at the wrong specification and the money has already gone."],["p","唯一比較接近事後調整的，是郵局在分揀時發現實際規格跟你付的不符，會另外收差額或退件。電商小包偶爾會遇到。","The nearest thing to a later adjustment is the post office finding that the parcel does not match what was paid for, and collecting the shortfall or returning it. It does happen on e-commerce parcels."],["h","服務種類：先看全貌","The services at a glance"],["t",[["服務","Service"],["時效","Speed"],["重量上限","Max weight"],["尺寸上限（長度加周長）","Max length + girth"]],[["USPS Ground Advantage",["2-5 個工作天","2-5 business days"],"70 lb","130 in"],["Priority Mail",["1-3 個工作天","1-3 business days"],"70 lb","108 in"],["Priority Mail Express",["隔夜到第 2 天","Overnight to two days"],"70 lb","108 in"],["Media Mail",["最慢","Slowest"],"70 lb","108 in"]]],["a","70 磅是所有 USPS 國內郵件的絕對上限，沒有例外。超過就是 nonmailable（不可寄遞），只能改走商業快遞或貨運。","70 lb is the absolute ceiling for every USPS domestic class, without exception. Past it the item is nonmailable and has to move by commercial courier or freight."],["a","尺寸上限差很多，這是最容易踩的一條：同一個箱子 Ground Advantage 收得下（130 in），Priority Mail 可能就超過了（108 in）。換服務前一定要重算長度加周長。","The size ceilings differ sharply, and this is the easiest trap: the same box that Ground Advantage accepts at 130 inches may be too big for Priority Mail at 108. Recompute length plus girth before switching service."],["h","USPS Ground Advantage","USPS Ground Advantage"],["p","電商小包的主力，2-5 個工作天，最大 70 磅，長度加周長上限 130 英吋，是 USPS 裡最寬鬆的。含追蹤，也含基本保額。","The workhorse for small e-commerce parcels: 2-5 business days, up to 70 lb, and at 130 inches length plus girth the most generous ceiling USPS offers. Tracking and a basic level of insurance are included."],["p","它的計價分成兩段。1 磅以下按盎司分級，級距是 4 oz、8 oz、12 oz、15.999 oz，往上取——4.2 oz 就照 8 oz 的價格。超過 15.999 oz 之後改成按磅計價，一樣往上取，8.3 磅照 9 磅算。","It prices in two halves. Under a pound it steps by ounce at 4 oz, 8 oz, 12 oz and 15.999 oz, rounded up -- 4.2 oz pays the 8 oz price. Above 15.999 oz it prices by the pound, also rounded up, so 8.3 lb pays the 9 lb price."],["a","Ground Advantage 是 2023 年 7 月整併出來的，把三個舊服務收成一個：First-Class Package Service、Parcel Select Ground、USPS Retail Ground。舊資料上看到那三個名字，講的都是現在這一個。","Ground Advantage was consolidated in July 2023, folding three services into one: First-Class Package Service, Parcel Select Ground and USPS Retail Ground. When older material names any of those three, it means this."],["h","First-Class：一個名字，兩種東西","First-Class: one name, two different things"],["p","客戶或舊文件講「First Class」的時候，可能是在講兩件完全不同的東西：一件是包裹，一件是信件。先確定是哪一個，重量上限才有意義——這兩邊的數字長得很像，混在一起看就會亂。","When a customer or an older document says \"First Class\", it can mean either of two unrelated things: a parcel product or a letter product. Establish which one before looking at any weight limit, because the two sets of numbers resemble each other and are easy to run together."],["t",[["名字","The name"],["這是什麼","What it is"],["重量上限","Weight ceiling"],["現在還有嗎","Still sold?"]],[[["First-Class Package Service（FCPS）","First-Class Package Service (FCPS)"],["包裹。2023 年 7 月併入 Ground Advantage","A parcel service, folded into Ground Advantage in July 2023"],["15.999 oz","15.999 oz"],["沒有了。名字還在，服務沒了","No. The name survives; the service does not"]],[["First-Class Mail","First-Class Mail"],["信件與大型信封，不是包裹","Letters and large envelopes -- not parcels"],["信件 3.5 oz／大型信封 13 oz","Letters 3.5 oz / large envelopes 13 oz"],["還在，照常販售","Yes, still sold as normal"]]]],["p","第一列是我們會碰到的那一個。它已經不是獨立服務，而是 Ground Advantage 裡 1 磅以下的那一段價格。但這個名字還活在舊 SOP、舊系統、平台的服務選單和客戶的口頭習慣裡，所以還是得認得。","The first row is the one this job runs into. It is no longer a service of its own but the sub-pound stretch of the Ground Advantage price list. The name still lives in older SOPs, older systems, platform dropdowns and the way customers talk, so it still has to be recognized."],["f","超過 15.999 oz，價格改吃 Ground Advantage 的磅計價。服務沒有換，只是換一段價目表。","Past 15.999 oz the price moves to the Ground Advantage per-pound table. The service does not change -- only which part of the price list applies."],["p","那 15.999 oz 是商業費率的上限，也就是線上或用 API 買標籤的價格，我們的客戶全部走這一種。走進郵局櫃台用零售價買，上限只到 13 oz。同一段價格、兩個上限，差別只在從哪裡買。","That 15.999 oz is the commercial ceiling -- the price paid for labels bought online or through an API, which is what every customer here uses. Bought retail over the post office counter, the ceiling is 13 oz instead. Same price tier, two ceilings, and the only difference is where the label was bought."],["a","客戶問「First Class 是不是要 1 磅以下」，答案是：要再低一點，15.999 oz。他如果講的其實是信件，那是上表第二列，跟包裹的規則完全無關。","Asked whether First Class has to be under a pound, the answer is: a little under -- 15.999 oz. And if what the customer actually means is letter mail, that is the second row above and none of the parcel rules apply to it."],["h","Priority Mail","Priority Mail"],["p","比 Ground Advantage 快，1-3 個工作天，最大 70 磅，含基本保額。但尺寸上限降到長度加周長 108 英吋。","Faster than Ground Advantage at 1-3 business days, up to 70 lb, with basic insurance included. But the ceiling drops to 108 inches length plus girth."],["p","Priority Mail 有兩種特別的計價方式，都是 USPS 獨有的。","Priority Mail carries two pricing methods that are peculiar to USPS."],["t",[["方式","Method"],["怎麼算","How it prices"],["什麼時候划算","When it wins"]],[[["Flat Rate","Flat Rate"],["用郵局指定的箱子或信封，不管重量、不管 Zone，同一個價（70 磅以內）","Use the post office's own box or envelope: one price regardless of weight or zone, up to 70 lb"],["重、體積小、寄得遠","Heavy, compact, going far"]],[["Cubic","Cubic"],["體積 0.5 立方英尺以內、20 磅以內，按體積級距計價而不是按重量","Under half a cubic foot and under 20 lb, priced by volume tier rather than weight"],["小而重的東西，常常最便宜","Small dense items, often the cheapest route of all"]]]],["a","Flat Rate 划不划算完全看你裝什麼。裝羽毛是虧的，裝金屬零件寄到 Zone 8 是賺的。判斷方式很簡單：先按一般郵資算一次，兩邊比。","Whether Flat Rate is a bargain depends entirely on what goes in it. Feathers, no. Metal parts to zone 8, yes. The test is simple: price it the ordinary way first and compare."],["p","Cubic 要透過有資格的平台或第三方郵資商才拿得到，郵局櫃台買不到。","Cubic is only available through a qualifying platform or third-party postage provider, not over the retail counter."],["h","Priority Mail Express","Priority Mail Express"],["p","最快的服務，隔夜到第 2 天，一樣 70 磅、108 英吋。","The fastest service, overnight to two days, with the same 70 lb and 108 inch limits."],["a","它是 USPS 唯一有準點退費保證的服務。其他服務的時效都是估計值，不是承諾，晚到沒得申訴。這一點跟客戶溝通時要先講清楚。","It is the only USPS service with a money-back guarantee. Every other service quotes an estimate rather than a commitment, and a late parcel gives you nothing to claim. Say that to the customer in advance."],["h","Media Mail","Media Mail"],["p","最便宜也最慢，但有品項限制：只能寄書籍、教材、影音這類合格品項。寄不符合資格的東西被抓到，要補足郵資差額。","The cheapest and slowest, but restricted by content: books, educational material and recorded media only. Ship something ineligible and the shortfall gets collected."],["f","Media Mail 不分 Zone，只看重量，也不計材積重。","Media Mail is not zoned. It prices on weight alone and takes no dimensional weight."],["a","所以一箱書用 Media Mail 寄，材積重的規則整組不適用，實重多少就算多少。這是它便宜的主要原因。","So a box of books on Media Mail escapes the dimensional weight rules entirely and bills on the actual weight. That is most of why it is cheap."],["h","重量與尺寸規則","Weight and size rules"],["p","USPS 也有材積重，但適用範圍比商業快遞窄得多——只有在包裹體積超過 1 立方英尺（1,728 立方英吋），而且寄到比較遠的 Zone 時才算。小箱子基本上就是按實重計價。","USPS has dimensional weight too, but it applies far more narrowly: only above one cubic foot (1,728 cubic inches) and only to the further zones. Small boxes simply price on the actual weight."],["a","這條規則直接造就了「小而重的東西走 USPS 划算」這個經驗法則。一個小箱子裝滿螺絲，在這裡完全不吃材積重。","That single rule is behind the shipper's maxim that small dense items go USPS. A little box full of screws escapes dimensional weight entirely here."],["p","適用時的除數在 2026 年 7 月從 166 調成 139，等於同一個大箱子算出來的計費重量變高。舊資料上還會寫 166，實際數字請對當年度價目表。","When it does apply, the divisor moved from 166 to 139 in the July 2026 change, which raises the billable weight on the same large box. Older material still says 166, so confirm against the current price list."],["h","大而輕的包裹：Balloon Pricing","Big but light: balloon pricing"],["p","箱子很大但東西很輕的時候，USPS 不讓你按實重付。長度加周長超過門檻，就有一個最低計費重量。","When the box is large but the contents are light, USPS will not let you pay the actual weight: past a length-plus-girth threshold a floor weight applies."],["a","這一條看的是長度加周長，跟任何附加費都無關，它是重量規則。英文叫 balloon pricing，看郵局公告時會看到這個字。","This reads length plus girth and has nothing to do with any surcharge -- it is a weight rule. USPS calls it balloon pricing, which is the term you will meet in postal notices."],["h","Nonstandard Fee：太長或太大的加收","The nonstandard fee: too long or too bulky"],["p","USPS 沒有額外處理費，也沒有大型包裹附加費。對應的東西叫 Nonstandard Fee，只看長度和體積，跟重量完全無關。","USPS has no additional handling charge and no large package surcharge. Its equivalent is the nonstandard fee, and it reads length and cube only -- weight does not enter into it."],["t",[["觸發","Trigger"],["門檻","Threshold"]],[[["最長邊超過","Longest side over"],"22 in"],[["最長邊再超過","Longest side also over"],"30 in"],[["材積體積超過","Cube over"],["3,456 in³（＝2 立方英尺）","3,456 in3 (= 2 cubic feet)"]]]],["p","三條各自判斷，中幾條就加幾筆。一根 40 吋的桿子就算只有 3 磅，前兩條都會中。","The three are judged separately, so a parcel can pick up more than one. A 40-inch pole weighing three pounds trips both length rules."],["a","這一筆很容易漏，因為它跟重量無關。很輕的長件，郵資本身便宜，Nonstandard Fee 可能比郵資還高。金額每年公告，請查當年度價目表。","It gets missed precisely because weight is irrelevant. On a long light parcel the postage is cheap and the nonstandard fee can exceed it. The amounts are published annually; check the current price list."],["h","住宅、偏遠：都不收","Residential and remote: neither is charged"],["p","USPS 不分住宅和商業。郵政的普及服務義務讓它本來就要每天送到每一個地址，市區辦公大樓和山裡一戶人家都一樣，既然車本來就要去，就沒有理由對住家多收。","USPS does not distinguish residential from commercial. Its universal service obligation means it already delivers to every address every day, whether a downtown office block or one house up a mountain. If the van is going anyway, there is nothing to surcharge."],["p","偏遠也沒有額外收費。距離和投遞難度直接反映在 Zone 1 到 9 的基本郵資裡，所以也沒有一份偏遠 ZIP 清單要比對。","Remote areas carry no extra charge either. Distance and difficulty are priced into the zone 1 to 9 base postage, so there is no remote ZIP list to check."],["h","但有一個例外：exception ZIP 清單","One exception: the exception ZIP list"],["p","USPS 有一份 exception ZIP code 清單，涵蓋大約 13% 的投遞點，多半是難以到達的鄉下。寄到這些 ZIP，協商折扣不適用，要回到一般商業費率。","USPS publishes an exception ZIP code list covering roughly 13% of delivery points, mostly hard-to-reach rural areas. Shipments to those ZIPs do not receive negotiated discounts and revert to standard commercial rates."],["a","注意它的形式：這不是多一筆附加費，而是「折扣不給你」。所以你找不到一個叫偏遠費的項目，只會覺得某幾票怎麼比預期貴。找不到多收的東西時，先去比對這份清單。","Note the shape of it: nothing is added, a discount is withheld. So there is no remote-area line to find -- certain shipments simply come in dearer than expected. When you cannot find the extra charge, check that list."],["h","USPS 才做得到的幾件事","Things only USPS can do"],["t",[["項目","Item"],["說明","Why it matters"]],[[["PO Box","PO Boxes"],["郵政信箱只有 USPS 送得到","Only USPS delivers to a post office box"]],[["軍郵地址","APO / FPO / DPO"],["美軍海外地址一樣只有 USPS","Overseas military addresses, again USPS only"]],[["離島與屬地","Islands and territories"],["阿拉斯加、夏威夷、波多黎各多半按國內郵資","Alaska, Hawaii and Puerto Rico usually price as domestic"]],[["週六","Saturdays"],["週六本來就送，不另外收費","Saturday delivery is standard, at no extra charge"]]]],["a","看到訂單地址是 PO Box 或 APO，不用比價，只能走 USPS。這是同仁最常卡住的一種訂單——標籤一直建不出來，原因是選錯物流商。","When an order ships to a PO Box or an APO address there is nothing to compare: it goes USPS. This is a common place for staff to get stuck, with a label that will not generate because the carrier is wrong."],["h","零售價與商業價","Retail and commercial pricing"],["p","同一個服務有好幾層價格：郵局櫃台的零售價最高，線上或透過平台出標籤拿到的商業價比較低，量大的還有更低的一層。","The same service carries several price levels: the retail counter is dearest, labels bought online or through a platform get commercial pricing, and volume earns a further tier."],["a","報價時一定要問清楚是哪一層價。拿郵局櫃台的價格去跟合約價比，結論一定是錯的。","Always establish which tier a quote uses. Comparing counter prices against a negotiated rate produces a conclusion that is simply wrong."],["p","USPS 的漲價一年常常不只一次，一月和七月各一次是常見的節奏。","USPS raises prices more than once in a typical year, commonly in January and again in July."],["h","保險、追蹤與保證","Insurance, tracking and guarantees"],["t",[["項目","Item"],["重點","What to know"]],[[["追蹤","Tracking"],["主要包裹服務都含追蹤","Included on the main parcel services"]],[["基本保額","Included cover"],["主要包裹服務含基本保額，要更高要加保","The main parcel services include a basic amount; more must be bought"]],[["準點保證","Guarantee"],["只有 Priority Mail Express 有退費保證","Only Priority Mail Express carries a refund guarantee"]],[["理賠","Claims"],["有申請期限，需要證明價值與寄件紀錄","There is a filing window, and you need proof of value and of mailing"]]]],["h","第一階段目標","Where to get to first"],["p","分得出 Ground Advantage、First-Class 的那一段、Priority Mail、Priority Mail Express 和 Media Mail 各自的重量與尺寸上限；知道材積重什麼時候才算；知道郵資是先付的。有這些就足以處理日常訂單。","Be able to tell Ground Advantage, the First-Class tier, Priority Mail, Priority Mail Express and Media Mail apart by their weight and size limits; know when dimensional weight applies at all; and know that postage is paid up front. That is enough for day-to-day orders."],["a","實際郵資、附加費金額與尺寸門檻請以當年度 USPS 價目表與 DMM 郵政手冊為準。","For actual postage, fee amounts and size thresholds, follow the current USPS price list and the Domestic Mail Manual."]];

function pPlate(x,y,S,col){

  g.fillStyle=gd; g.fill();

  g.beginPath(); g.ellipse(x, y-S(0.6), S(17), S(4.4), 0, 0, 7);
  g.fillStyle=mix(base,-0.09); g.fill();

  g.beginPath(); g.ellipse(x-S(8), y-S(2.4), S(6), S(1.5), -0.22, 0, 7);

function pSteam(x,y,S,t,n){                     /* 熱食的蒸氣 */

    g.strokeStyle="rgba(226,220,206,"+(0.42*(1-u)).toFixed(2)+")";

    g.quadraticCurveTo(x+S(ox)+S(3.4), y-S(7)-u*S(13), x+S(ox), y-S(12)-u*S(13));

    g.quadraticCurveTo(x+S(o), y-S(10.4)+S(dy), x+S(o)+S(3.6), y-S(7)+S(dy));

function foodDraw(kind, x, y, s){
  s = s || 1; const S = v=>v*s;
  /* 一道一張圖優先。查不到才退回舊的六種通用畫法——
     那六種現在只給還沒單獨畫的東西用。 */
  if(DISH[kind]){ DISH[kind](x, y, S); return; }
  if(kind==="burger"){ burger(x,y,0.5*s); return; }
  if(kind==="taco"){                       /* 塔可：兩個並排放在紙盤上 */
    g.beginPath(); g.ellipse(x,y+S(2),S(14),S(4),0,0,7); g.fillStyle="#E4D8C2"; g.fill();
    taco(x-S(6),y,0.62*s); taco(x+S(7),y-S(1),0.58*s);
    return;
  }
  if(kind==="rice"){                       /* 叉燒飯：白飯上兩片紅燒肉 */
    g.beginPath(); g.ellipse(x,y,S(11),S(6),0,Math.PI,0); g.fillStyle="#F6F1E4"; g.fill();
    R(x-S(6),y-S(8),x+S(1),y-S(5),"#B4472F");
    R(x-S(1),y-S(9),x+S(6),y-S(6),"#C4573A");
    g.beginPath(); g.ellipse(x,y,S(12),S(4),0,0,Math.PI); g.fillStyle="#4E6E7A"; g.fill();
    if(typeof doodleLine==="function") doodleLine([x-S(11),y+S(1),x-S(7),y-S(5),x-S(1),y-S(7),x+S(6),y-S(6),x+S(11),y+S(1)],"#8B6B4A",Math.max(0.8,S(0.8)));
    return;
  }
  if(kind==="noodle"){                     /* 河粉：湯碗加麵和蔥花 */
    g.beginPath(); g.ellipse(x,y-S(4),S(11),S(5),0,Math.PI,0); g.fillStyle="#E8DCC0"; g.fill();
    [[-5,-6],[0,-7],[5,-6]].forEach(([a,b])=>R(x+S(a)-S(1),y+S(b),x+S(a)+S(1),y+S(b)+S(2),"#5FA36A"));
    g.beginPath(); g.ellipse(x,y-S(3),S(12),S(8),0,0,Math.PI); g.fillStyle="#F2F0E8"; g.fill();
    g.strokeStyle="#C9C3B4"; g.lineWidth=1; g.stroke();
    if(typeof doodleLine==="function") doodleLine([x-S(12),y+S(1),x-S(7),y+S(3),x,y+S(4),x+S(7),y+S(3),x+S(12),y+S(1)],"#8A6A4A",Math.max(0.8,S(0.8)));
    return;
  }
  if(kind==="dumpling"){                   /* 水餃：三顆排在盤上 */
    g.beginPath(); g.ellipse(x,y,S(13),S(4),0,0,7); g.fillStyle="#E4E7EA"; g.fill();
    [[-6,-1],[0,-3],[6,-1]].forEach(([a,b])=>{
      g.beginPath(); g.ellipse(x+S(a),y+S(b),S(4.6),S(3.4),0,Math.PI,0);
      g.fillStyle="#F2E9D6"; g.fill();
      g.strokeStyle="#D6C9B0"; g.lineWidth=1; g.stroke(); });
    if(typeof doodleLine==="function") doodleLine([x-S(13),y+S(1),x-S(7),y+S(4),x,y+S(4.6),x+S(7),y+S(4),x+S(13),y+S(1)],"#8A6A4A",Math.max(0.8,S(0.8)));
    return;
  }
  /* bento：便當盒，分格 */
  R(x-S(12),y-S(9),x+S(12),y+S(3),"#8A5030","#6E3C22",1);
  R(x-S(10),y-S(7),x+S(1),y+S(1),"#F6F1E4");
  R(x+S(2),y-S(7),x+S(10),y-S(3),"#B4472F");
  R(x+S(2),y-S(2),x+S(10),y+S(1),"#5FA36A");
  if(typeof doodleLine==="function") doodleLine([x-S(12),y-S(8),x-S(8),y-S(10),x-S(1),y-S(9),x+S(5),y-S(10),x+S(12),y-S(8)],"#68442F",Math.max(0.8,S(0.8)));
}

/* 挑店家：直接把動作鍵那一列換成五家店，選完再換回來。
   另外做一個浮層的話，放大模式和橫向手機都要各自對位一次；
   借用既有的按鈕列，那些排版問題全部自動繼承。 */
function actBarRestore(){
  const box=document.getElementById("acts"); if(!box) return;
  box.innerHTML="";
  SCENE_ACTS.forEach(([k,fn])=>{ const b=document.createElement("button");
    b.textContent=tr(k)||k; b.addEventListener("click",fn); box.appendChild(b); });
  actsHint(box);
}
function actBarSet(items){
  const box=document.getElementById("acts"); if(!box) return;
  box.innerHTML="";
  items.forEach(([label,fn])=>{ const b=document.createElement("button");
    b.textContent=label; b.addEventListener("click",fn); box.appendChild(b); });
}
/* 午休分兩層：先問怎麼吃，選了外出才列店家。
   一次把七顆按鈕全攤開的話，手機上要捲兩行才看得完。 */
function eatMenuOpen(){
  actBarSet([
    [triv(["自備便當","Brought lunch","Traje comida"]),
      ()=>{ actBarRestore(); startBreak("lunch"); }],
    [triv(["外出覓食","Go get takeout","Salir por comida"]), eatShopMenu],
    [triv(["取消","Cancel","Cancelar"]), actBarRestore],
  ]);
}
function eatShopMenu(){
  /* 人已經在外面的話，換一家是「走去隔壁」，不是「回倉庫再出門一次」。
     原本一律走 startEatOut，而它會 sceneReset()＋重設 SS.eat，
     等於把整段外出取消掉，畫面就跳回倉庫。 */
  const out = !!SS.eat;
  const items = EATS.map(e=>[triv(e.name), ()=>{
    actBarRestore();
    if(out) switchShop(e.key); else startEatOut(e.key);
  }]);
  items.push(out
    ? [triv(["← 不換了","← Never mind","← Da igual"]),
       ()=>{ actBarRestore(); const E=SS.eat; if(E){ E.phase="menu"; eatMenuBook(); } }]
    : [triv(["← 回上一層","← Back","← Atrás"]), eatMenuOpen]);
  actBarSet(items);
}
/* 在外面直接換一家：保留「已經出門」這件事，只換店家並重新挑餐。
   走路那一段跳過——人本來就在店門口那條街上。 */
function switchShop(key){
  const shop = eatBy(key), E = SS.eat;
  if(!E) return startEatOut(key);
  E.key   = shop.key;
  E.phase = "menu";
  E.t     = 0;
  E.page  = 0;
  E.pick  = 0;
  E.mode  = null;
  E.ordered = false;
  E.menuShut = false;      /* 換店要重新打開，不然關過一次就再也不跳出來 */
  store("eat.last", shop.key);
  sfxDoor();
  eatMenuBook();
}

/* ---- 出去買飯 ---- */
const EAT_WALK = 150;                       /* 走出去的時間 */
/* 在店裡的節奏。原本是一進門就「點完了」，兩句台詞每半秒互相蓋掉，
   看起來像在跟店員搶話，而且完全沒有等餐這件事。
   拆成八段，一段只講一件事：看菜單 → 主餐 → 配菜 → 飲料 → 店員複誦
   → 等出餐 → 取餐 → 拿好要走。單位是幀，60 幀 ＝ 1 秒。 */
/* 價目表。每一家四款，順序跟 sets 一樣。單位美元——倉庫在美國，
   跟工具其他地方的幣別一致。 */
const EAT_PRICE = {
  burger: [8.90, 8.20, 8.60, 5.40],
  hk:     [9.60, 11.80, 8.80, 10.40],
  vn:     [10.20, 9.80, 8.40, 9.60],
  cn:     [9.80, 11.20, 10.60, 8.60],
  mx:     [9.50, 11.50, 13.50, 15.50],
  tw:     [7.80, 9.20, 9.60, 7.20],
};
const eatPrice = (key,i)=>((EAT_PRICE[key]||[9.00])[i] ?? 9.00);
const eatMoney = v => "$"+v.toFixed(2);   /* 計費那邊已經有一個 money()，不要撞名 */
const EAT_STAGES = [
  ["menu",  80],   /* 抬頭看燈箱，燈箱的 highlight 在跑 */
  ["main",  95],   /* 點主餐 */
  ["side",  85],   /* 再點配菜 */
  ["drink", 85],   /* 再點飲料 */
  ["ack",   65],   /* 店員：好，稍等 */
  ["pay",   90],   /* 付錢：客人遞鈔票，店員收下找零 */
  ["wait", 165],   /* 等出餐，這段沒人講話 */
  ["pick",  85],   /* 餐放上檯面，客人伸手拿 */
  ["done",  75],   /* 拿好，準備回倉庫 */
];
const EAT_SHOP = EAT_STAGES.reduce((a,b)=>a+b[1],0);
function eatStage(t){
  let acc=0;
  for(let i=0;i<EAT_STAGES.length;i++){
    const [k,d]=EAT_STAGES[i];
    if(t < acc+d) return {k:k, i:i, u:(t-acc)/d};
    acc+=d;
  }
  return {k:"done", i:EAT_STAGES.length-1, u:1};
}
/* 到店之後停下來讓人挑，挑完再問內用或外帶。
   點餐本來就不該被計時器追著跑，所以 menu 和 mode 這兩段時間是不走的。 */
const DINE_T = 1800;                    /* 內用吃 30 秒（60 fps） */
function startEatOut(key){
  const shop = eatBy(key);
  sceneReset();
  SS.run = false;
  SS.eat = { key: shop.key, phase: "out", t: 0,
             pick: 0, mode: null, ordered: false, menuShut: false };
  store("eat.last", shop.key);
  sfxDoor();
}
/* ---- 手上那本菜單 ----
   原本挑餐是把四款套餐塞成四顆長按鈕，字擠成一行，也看不到餐長什麼樣。
   改成一本拿在手上的菜單：一頁一款，有餐點圖、配菜、飲料、價格，
   下面三顆按鈕──上一頁、下一頁、就點這個。

   為什麼一頁只放一款：手機上四款並排的話每一款只剩 90px 寬，
   放不下圖。一頁一款換來的是圖夠大、字夠大，代價是要翻頁，
   而翻頁本來就是看菜單會做的事。 */
function eatMenuBook(){
  const E=SS.eat; if(!E) return;
  const shop=eatBy(E.key), n=shop.sets.length;
  if(E.page==null) E.page = E.pick||0;
  const cur = shop.sets[E.page];
  actBarSet([
    ["◀ " + triv(["上一頁","Prev","Anterior"]),
      ()=>{ E.page=(E.page-1+n)%n; sfxClick(); eatMenuBook(); }],
    [triv(["就點這個","Order this","Pedir este"]) + "　" + triv(cur.n),
      ()=>{ E.pick=E.page; E.phase="mode"; sfxChime(); eatModeMenu(); }],
    [triv(["下一頁","Next","Siguiente"]) + " ▶",
      ()=>{ E.page=(E.page+1)%n; sfxClick(); eatMenuBook(); }],
    [triv(["← 換一家","← Another shop","← Otro sitio"]), eatShopMenu],
  ]);
}
/* 菜單關掉之後的動作列：留一顆再打開，另外可以直接換一家或回倉庫。
   關掉不等於放棄點餐——人還在店裡站著。 */
function eatClosedMenu(){
  const E=SS.eat; if(!E) return;
  actBarSet([
    ["📖　"+triv(["打開菜單","Open the menu","Ver el menú"]),
      ()=>{ E.menuShut=false; sfxClick(); eatMenuBook(); }],
    [triv(["← 換一家","← Another shop","← Otro sitio"]), eatShopMenu],
    [triv(["回倉庫","Back to warehouse","Volver al almacén"]),
      ()=>{ actBarRestore(); E.phase="back"; E.t=0; sfxDoor(); }],
  ]);
}
/* ---- 菜單卡上的小圖 ----
   配菜和飲料原本只有文字。套餐的賣點就是「一份主餐＋一樣配菜＋一杯飲料」，
   三樣都畫出來才看得懂那是一套。 */
function isSoup(name){
  const n=String(name||"");
  return ["湯","Soup","soup","Sopa","味噌","miso","Miso"].some(w=>n.indexOf(w)>=0);
}
/* 飲料杯：外帶杯配杯蓋和吸管，顏色照 drinkColour */
function cupDraw(x, y, s, name){
  s=s||1; const S=v=>v*s, col=drinkColour(name);
  P([x-S(13),y-S(26), x+S(13),y-S(26), x+S(10),y+S(6), x-S(10),y+S(6)],
    "rgba(255,255,255,.92)", "#C9BCA4", 1.6);                 /* 杯身 */
  P([x-S(11),y-S(20), x+S(11),y-S(20), x+S(9),y+S(2), x-S(9),y+S(2)], col);
  R(x-S(15),y-S(31),x+S(15),y-S(25),"#E4E7EA","#B4BCC2",1.4); /* 杯蓋 */
  R(x-S(15),y-S(28),x+S(15),y-S(26),"#C9CFD4");
  L([x+S(4),y-S(31), x+S(9),y-S(46)], "#C24B3A", Math.max(1.5,S(2.6)), "round"); /* 吸管 */
  O(x-S(14),y+S(4),x+S(14),y+S(10),"rgba(20,26,30,.10)");
}
/* 湯碗：熱湯要有蒸氣，才跟冷飲分得開 */
function soupDraw(x, y, s, t){
  s=s||1; const S=v=>v*s;
  g.beginPath(); g.ellipse(x,y-S(6),S(20),S(7),0,0,7);
  g.fillStyle="#C9762E"; g.fill();                            /* 湯面 */
  g.beginPath(); g.ellipse(x,y-S(6),S(20),S(7),0,0,Math.PI);
  g.fillStyle="#F2ECDC"; g.fill();                            /* 碗的前緣 */
  P([x-S(20),y-S(6), x+S(20),y-S(6), x+S(13),y+S(12), x-S(13),y+S(12)],
    "#F2ECDC", "#C9BCA4", 1.6);
  R(x-S(15),y+S(12),x+S(15),y+S(15),"#D8CDB6");               /* 碗座 */
  [-7,0,7].forEach((ox,i)=>{                                   /* 蒸氣 */
    const u=((t*0.9+i*40)%110)/110;
    g.strokeStyle="rgba(200,192,178,"+(0.55*(1-u)).toFixed(2)+")";
    g.lineWidth=Math.max(1.2,S(1.8)); g.lineCap="round";
    g.beginPath();
    g.moveTo(x+S(ox), y-S(10)-u*S(16));
    g.quadraticCurveTo(x+S(ox)+S(5), y-S(18)-u*S(16), x+S(ox), y-S(26)-u*S(16));
    g.stroke(); });
}
/* 配菜碟：一個小盤，上面依名稱給不同的東西 */
function sideDraw(x, y, s, name){
  s=s||1; const S=v=>v*s; const n=String(name||"");
  const has=(...k)=>k.some(w=>n.indexOf(w)>=0);
  g.beginPath(); g.ellipse(x,y,S(19),S(6),0,0,7);
  g.fillStyle="#E4E7EA"; g.fill();
  g.strokeStyle="#C3C9CE"; g.lineWidth=1.4; g.stroke();
  if(has("薯條","Fries","Papas")){
    [[-8,-1],[-4,-3],[0,-4],[4,-3],[8,-1]].forEach(([a,b],i)=>
      P([x+S(a)-S(2),y+S(b), x+S(a)+S(2),y+S(b)-S(1),
         x+S(a)+S(2),y-S(13)+S(b), x+S(a)-S(2),y-S(12)+S(b)],
        i%2?"#E8B93C":"#F0C95E"));
  } else if(has("青菜","Greens","Verduras","油菜","炒青菜","燙青菜","沙拉","Salad",
                "Ensalada","生菜","Lettuce","Lechuga","涼拌","Slaw","小菜","黃瓜","Cucumber","Pepino")){
    [[-9,-2,7],[-2,-5,8],[6,-3,7]].forEach(([a,b,r])=>
      O(x+S(a)-S(r),y+S(b)-S(r*0.7),x+S(a)+S(r),y+S(b)+S(r*0.5),"#5FA36A"));
    O(x-S(4),y-S(7),x+S(2),y-S(3),"#7FBE86");
  } else if(has("水餃","Dumpling","鍋貼","雲吞")){
    [[-8,-1],[0,-3],[8,-1]].forEach(([a,b])=>{
      g.beginPath(); g.ellipse(x+S(a),y+S(b),S(6),S(4.4),0,Math.PI,0);
      g.fillStyle="#F2E9D6"; g.fill();
      g.strokeStyle="#D6C9B0"; g.lineWidth=1.2; g.stroke(); });
  } else if(has("春捲","rolls","Rolls","Rollitos","雞塊","Nuggets","洋蔥圈","Rings","Aros",
                "豆腐","tofu","Tofu","豆干","滷蛋","egg","Egg","Huevo","玉米","Corn","Elote")){
    [[-8,-2],[0,-4],[8,-2]].forEach(([a,b])=>
      R(x+S(a)-S(6),y+S(b)-S(7),x+S(a)+S(6),y+S(b),"#D9A257","#B4823C",1.2));
  } else {                                    /* 其餘：小菜一碟 */
    P([x-S(11),y-S(3), x+S(11),y-S(3), x+S(8),y-S(11), x-S(8),y-S(11)],"#B4756B");
    O(x-S(5),y-S(12),x+S(3),y-S(8),"#C98C7E");
  }
}

/* ---- 座位區 ----
   六家共用同一組卡座的話，換了店只有配色不同。這裡照每一家該有的座位型式畫：
   美式卡座、港式圓凳圓桌、越式矮凳、中式方桌木椅、墨西哥彩繪桌、台式塑膠椅。
   另外要有其他客人——空無一人的餐廳看起來是打烊的。 */

/* 坐著的客人。用既有的 person()，但只畫到桌面高度以上，
   下半身被桌子擋住就不用處理腿的姿勢。 */
function diner(x, floorY, o){
  worker(x, floorY, 0, Object.assign({sc:0.86, face:o.face||1}, o));
}
function seatingDraw(shop, FLR, t){
  const k = shop.key, ty = FLR-14;
  const sg = shop.sign, aw = shop.awn;
  /* 每一家：桌子的 x 位置、有沒有客人 */
  /* 座位往右挪並拉開間距。原本第一張桌子在 x=96，正好壓在飲料機上
     （飲料機在 W*0.045≈40，寬 60），客人和機器疊在一起。
     間距原本 150，桌板 80 寬，三張連起來像一條長桌；改成 168。 */
  const SEATS = [150, 318, 486];

  SEATS.forEach((tx, i) => {
    if(k==="burger"){
      /* 美式：卡座，高靠背 */
      [-52,52].forEach(o=>{ const bx=tx+o;
        R(bx-26,ty-84,bx+26,ty-34,mix(sg,-0.18),mix(sg,-0.34),1.5);
        R(bx-26,ty-84,bx+26,ty-76,mix(sg,-0.04));
        R(bx-28,ty-38,bx+28,ty-26,"#9A6B42","#7A4E2C",1.5);
        R(bx-24,ty-26,bx-16,ty,"#7A4E2C"); R(bx+16,ty-26,bx+24,ty,"#7A4E2C"); });
      R(tx-40,ty-52,tx+40,ty-42,"#8A5F3C","#6E4626",1.5);
      R(tx-40,ty-52,tx+40,ty-48,"#9A6E48");
      R(tx-8,ty-42,tx+8,ty-4,"#6E4626");
      R(tx-26,ty-4,tx+26,ty+4,"#5E3C20","#4A2E18",1.2);
    } else if(k==="hk"){
      /* 港式：圓桌配圓凳，凳子沒有靠背 */
      [-46,46].forEach(o=>{ const bx=tx+o;
        O(bx-18,ty-42,bx+18,ty-30,"#B4472F","#8A2E1C",1.5);
        R(bx-4,ty-32,bx+4,ty,"#6E4626"); R(bx-12,ty-2,bx+12,ty+3,"#5E3C20"); });
      O(tx-44,ty-58,tx+44,ty-42,"#D9CBB0","#A89A80",1.6);
      O(tx-40,ty-56,tx+40,ty-46,"#EDE2CC");
      R(tx-6,ty-46,tx+6,ty-4,"#8A7A5E");
      O(tx-22,ty-6,tx+22,ty+4,"#6E5E44");
    } else if(k==="vn"){
      /* 越式：矮桌矮凳，金屬管椅腳 */
      [-42,42].forEach(o=>{ const bx=tx+o;
        R(bx-16,ty-30,bx+16,ty-22,"#3E7A5E","#2A5A44",1.4);
        L([bx-12,ty-22,bx-14,ty],"#9AA4AA",2.6); L([bx+12,ty-22,bx+14,ty],"#9AA4AA",2.6); });
      R(tx-38,ty-46,tx+38,ty-38,"#D9C08A","#B49A62",1.5);
      L([tx-28,ty-38,tx-32,ty],"#9AA4AA",3); L([tx+28,ty-38,tx+32,ty],"#9AA4AA",3);
      L([tx-30,ty-18,tx+30,ty-18],"#9AA4AA",2);
    } else if(k==="cn"){
      /* 中式：方桌配木椅，椅背有橫檔 */
      [-50,50].forEach(o=>{ const bx=tx+o;
        R(bx-20,ty-76,bx+20,ty-34,"#8A5030","#6E3C22",1.5);
        R(bx-16,ty-70,bx+16,ty-64,"#A3653F"); R(bx-16,ty-56,bx+16,ty-50,"#A3653F");
        R(bx-22,ty-36,bx+22,ty-28,"#9A6B42","#7A4E2C",1.4);
        R(bx-20,ty-28,bx-14,ty,"#6E4626"); R(bx+14,ty-28,bx+20,ty,"#6E4626"); });
      R(tx-42,ty-54,tx+42,ty-44,"#8A5030","#5E3418",1.6);
      R(tx-42,ty-54,tx+42,ty-50,"#A3653F");
      R(tx-36,ty-44,tx-28,ty,"#6E4626"); R(tx+28,ty-44,tx+36,ty,"#6E4626");
    } else if(k==="mx"){
      /* 墨西哥：彩繪桌面，木椅塗色 */
      [-48,48].forEach(o=>{ const bx=tx+o;
        const c=(i%2)?"#4E8CC4":"#E8734F";
        R(bx-19,ty-72,bx+19,ty-36,c,mix(c,-0.28),1.5);
        R(bx-13,ty-66,bx+13,ty-58,"#F3D9A8");
        R(bx-22,ty-38,bx+22,ty-28,"#E8B93C","#B4823C",1.4);
        R(bx-18,ty-28,bx-12,ty,"#B4823C"); R(bx+12,ty-28,bx+18,ty,"#B4823C"); });
      R(tx-42,ty-52,tx+42,ty-42,"#E8734F","#A8422A",1.6);
      [-28,-9,10,29].forEach(o=>R(tx+o-5,ty-51,tx+o+5,ty-44,"#F3D9A8"));
      R(tx-8,ty-42,tx+8,ty-4,"#B4823C");
      R(tx-26,ty-4,tx+26,ty+4,"#8A5F3C");
    } else {
      /* 台式：塑膠圓凳配鐵桌 */
      [-44,44].forEach(o=>{ const bx=tx+o;
        const c=(i%2)?"#C9302A":"#3E6E8C";
        O(bx-16,ty-38,bx+16,ty-26,c,mix(c,-0.28),1.4);
        R(bx-3,ty-28,bx+3,ty,"#8E979D"); O(bx-11,ty-3,bx+11,ty+3,"#7E888E"); });
      R(tx-40,ty-50,tx+40,ty-42,"#D9DCE0","#A8AEB4",1.6);
      R(tx-40,ty-50,tx+40,ty-46,"#EDF0F2");
      L([tx-30,ty-42,tx-34,ty],"#9AA4AA",3); L([tx+30,ty-42,tx+34,ty],"#9AA4AA",3);
      L([tx-32,ty-16,tx+32,ty-16],"#9AA4AA",2);
    }

    /* 桌上的餐與客人。第三桌留空，不然整排滿座反而擁擠。 */
    const topY = (k==="hk") ? ty-58 : (k==="vn") ? ty-46 : (k==="cn"||k==="mx") ? ty-54 : ty-52;
    if(i<2){
      foodDraw(shop.food, tx-14, topY, 0.62);
      O(tx+16,topY-6,tx+28,topY+4,"#E4E7EA");
      R(tx+12,topY-4,tx+14,topY,"#8A8272");
    }
  });

  /* 客人畫在桌椅之後，但桌面要再補畫一次疊在他們前面——
     原本桌面在客人之後，整條桌板從他們的手和碗上橫穿過去。
     這是主角那邊已經用過的做法（「畫完再把桌面補畫一次蓋在他前面」）。

     客人：坐在桌子的另一側。
     位置刻意錯開，讓每一桌的人數不同——整排都坐滿看起來像複製貼上。

     第二桌（SEATS[1]）整桌留空：內用的時候主角就坐在那裡（tx=246）。
     原本在 SEATS[1]+46 放了一位，主角坐下去會跟他疊在一起。
     第三桌也留著，讓畫面有呼吸空間。 */
  /* 客人坐在椅子上。兩個數字必須跟椅子的實際幾何一致：

     ・x：每家的椅子偏移不同（美式 ±52、港式 ±46、越式 ±42、
       中式 ±50、墨西哥 ±48、台式 ±44）。固定用 ±44 的話只有台式坐得準。
     ・y：椅面在 ty-38，而客人原本踩在 FLR-34 ＝ ty-20，低了 18px——
       人就浮在椅子前面而不是坐在上面。

     第二桌整桌留空：內用時主角坐那裡（tx=318）。 */
  const CHAIR_DX = {burger:52, hk:46, vn:42, cn:50, mx:48, tw:44}[k] || 46;
  const SEAT_Y   = ty-38;

  const GUESTS = [
    {seat:0, side:-1, skin:0, coat:"#5B7FA6", hair:"#2E2622", hs:"short", ph:0},
    {seat:0, side:+1, skin:2, coat:"#7A6E8A", hair:"#4A3526", hs:"long",  ph:150},
    {seat:2, side:-1, skin:1, coat:"#6E9A72", hair:"#5A3B28", hs:"bob",   ph:290},
  ];
  GUESTS.forEach(gst=>{
    const gx = SEATS[gst.seat] + CHAIR_DX*gst.side;
    /* 吃飯的循環：手從桌面舉到嘴邊再放下。ph 不同，三個人的節奏才錯開。 */
    const cyc = ((t||0) + gst.ph) % 200;
    const u = cyc < 120 ? (Math.sin(cyc/120*Math.PI*2 - Math.PI/2)*0.5+0.5) : 0;
    /* 面向桌子：坐左邊的朝右、坐右邊的朝左 */
    const fc = -gst.side;
    const hx = gx + (11 - 4*u)*fc;
    const hy = SEAT_Y - 12 - 18*u;
    diner(gx, SEAT_Y, {skin:SKIN[gst.skin], tint:gst.coat, hair:gst.hair,
                       hairStyle:gst.hs, face:fc, outfit:"tee",
                       crouch:0.45, hold:[hx,hy], holdSide:fc});
    chopsticks(hx, hy+2, fc, 0.72);
  });

  /* 桌面本來想補畫一次疊在客人前面（主角那邊是這樣做的），但客人是坐在
     「桌子兩側的凳子」上，不像主角坐在桌子正後方——補畫的桌板會橫在他們
     胸前。桌腳和凳子已經標示了位置，不補反而正確：人坐在桌邊，餐點在桌上。 */
}
/* ---- 各家餐廳的牆面 ----
   共用的零件：掛畫（有畫框）、菜單黑板、掛盤、霓虹燈牌、掛簾。
   每一家挑自己會有的東西，位置也不同——同一組東西換顏色的話，
   走進哪一家看起來都一樣。 */
function wFrame(x, y, w, h, fill, frame){
  R(x-w/2-4, y-h/2-4, x+w/2+4, y+h/2+4, frame||"#6E5233", mix(frame||"#6E5233",-0.28), 1.6);
  R(x-w/2, y-h/2, x+w/2, y+h/2, fill);
  R(x-w/2, y-h/2, x+w/2, y-h/2+3, "rgba(255,255,255,.22)");
}
function wallDecor(shop, W, FLR, t){
  const k = shop.key;
  if(k==="burger"){
    /* 美式：霓虹燈牌、可樂海報、黑白格帶 */
    for(let x=-10;x<W;x+=40){
      R(x,70,x+20,86,"#D8D2C4"); R(x+20,70,x+40,86,"#2E3A42"); }
    { const nx=W*0.22, ny=132;                       /* 霓虹「OPEN」 */
      R(nx-56,ny-26,nx+56,ny+26,"#2A2018","#4A3722",2);
      const on = Math.floor(t/45)%8 !== 0;           /* 偶爾閃一下 */
      TXT_(nx,ny+7,"OPEN", on?"#FF6B5C":"#5E4038", 26, true);
      if(on) O(nx-64,ny-34,nx+64,ny+34,"rgba(255,107,92,.10)"); }
    wFrame(W*0.44,128,86,64,"#C24B3A","#E4E7EA");    /* 可樂海報 */
    O(W*0.44-20,112,W*0.44+20,140,"rgba(255,255,255,.30)");
    wFrame(W*0.55,128,64,64,"#E8B93C","#E4E7EA");
    TXT_(W*0.55,136,"1955","#8A5030",18,true);
  } else if(k==="hk"){
    /* 港式：紅底金字的招牌、掛鴨、直式菜牌 */
    R(0,66,W,76,"#A8322C");
    { const bx=W*0.20;                                /* 燒臘櫥窗：掛著的燒鴨 */
      R(bx-58,92,bx+58,168,"#3A2A1E","#5E4632",2);
      R(bx-52,98,bx+52,162,"rgba(255,190,120,.14)");
      [-34,-10,14,38].forEach((o,i)=>{
        L([bx+o,98,bx+o,110],"#8A7A5E",1.6);
        P([bx+o-9,110, bx+o+9,110, bx+o+7,144, bx+o-7,144],
          i%2?"#A8422A":"#B44A2E","#7E2E1C",1.2);
        R(bx+o-7,110,bx+o+7,118,"#C4603A"); }); }
    [0.42,0.50,0.58].forEach((u,i)=>{                 /* 直式菜牌 */
      const px2=W*u;
      R(px2-15,92,px2+15,172,"#C9302A","#8A211C",1.6);
      [0,1,2,3].forEach(j=>R(px2-8,104+j*17,px2+8,116+j*17,"rgba(255,214,140,.55)")); });
  } else if(k==="vn"){
    /* 越式：竹編掛飾、河粉插畫、綠色調 */

  /* 尺寸照實際量到的來。碗裝那幾道最深到錨點下方 21 個單位（碗座＋落影），

  const FS=3.2, DEEP=21, TALL=35;

  foodDraw(set.art || shop.food, px, FB-10-DEEP*FS, FS);

  /* 配菜也可能是湯（港式套餐的「例湯」）。判斷用同一個 isSoup，

  if(isSoup(triv(set.s))) soupDraw(rx0+34, y0+158, 0.80, t);
  else                    sideDraw(rx0+34, y0+164, 1.0, triv(set.s));

  TXT_(rx0+66, y0+170, triv(set.s), "#5A4A38", 14, false, "left");

  if(isSoup(triv(set.d))) soupDraw(rx0+34, y0+224, 0.92, t);

  TXT_(rx0+66, y0+232, triv(set.d), "#5A4A38", 14, false, "left");

  R(rx0+6, y1-84, rx1-6, y1-38, mix(shop.sign,0.32), mix(shop.sign,-0.12), 2);
  TXT_((rx0+rx1)/2, y1-52, eatMoney(eatPrice(shop.key, page)), "#3B2A1B", 25, true);

  const n=shop.sets.length, dx=(x0+x1)/2-(n-1)*11;

/* 到了店裡：把這一家的四款套餐列出來，選了才往下走 */
/* 舊的四顆長按鈕換成翻頁菜單。留一層轉接，因為外面有好幾處呼叫 eatSetMenu。 */
function eatSetMenu(){ eatMenuBook(); }
function eatModeMenu(){
  const E=SS.eat; if(!E) return;
  actBarSet([
    ["🍽　"+triv(["內用","Eat in","Comer aquí"]),   ()=>{ E.mode="in";  eatGo(); }],
    ["🛍　"+triv(["外帶","Takeaway","Para llevar"]),()=>{ E.mode="out"; eatGo(); }],
    [triv(["← 換一款","← Change dish","← Otro plato"]),
     ()=>{ E.phase="menu"; E.page=E.pick; eatSetMenu(); }],
  ]);
}
function eatGo(){
  const E=SS.eat; if(!E) return;
  actBarRestore();
  E.phase="shop"; E.t=0; E.st="";
  sfxChime();
}
function stepEat(dt){
  const E = SS.eat; if(!E) return;
  /* 選單那兩段不計時：使用者慢慢挑，畫面停在店裡等他 */
  if(E.phase === "menu" || E.phase === "mode") return;
  E.t += dt;
  if(E.phase === "out"   && E.t > EAT_WALK){
    E.phase="menu"; E.t=0; sfxChime(); eatSetMenu(); return;
  }
  else if(E.phase === "shop"){
    /* 一段一段報一個聲音：三句點餐各嗶一聲，出餐好了叮一聲。
       原本只在 t>150 那一刻嗶一次，聽起來像整份餐一句話點完。 */
    const st = eatStage(E.t).k;
    if(st !== E.st){
      if(st==="main"||st==="side"||st==="drink") sfxBeep();
      else if(st==="pick") sfxChime();
      E.st = st;
    }
    E.ordered = (st==="pick"||st==="done");
    if(E.t > EAT_SHOP){
      if(E.mode==="in"){                                  /* 內用：留在店裡吃 */
        E.phase="dine"; E.t=0;
        /* 在外面的時候要有出口：吃到一半想走、或想再換一家，都不用等計時器 */
        actBarSet([
          [triv(["回倉庫","Back to warehouse","Volver al almacén"]),
           ()=>{ actBarRestore(); E.phase="back"; E.t=0; sfxDoor(); }],
          [triv(["再去一家","Another restaurant","Otro restaurante"]), eatShopMenu],
        ]);
      }
      else { E.phase="back"; E.t=0; sfxDoor(); }
    }
  }
  else if(E.phase === "dine" && E.t > DINE_T){
    actBarRestore(); E.phase="back"; E.t=0; sfxDoor(); }
  else if(E.phase === "back" && E.t > EAT_WALK){
    const key=E.key, mode=E.mode, E0pick=E.pick;
    SS.eat = null;
    /* 外帶才回倉庫開飯；內用的已經在店裡吃過了，回來直接上工 */
    if(mode==="in"){ SS.run = true; CREW.forEach(m=>{ m.job=null; m.sit=false; }); }
    else startBreak("lunch", key, E0pick);
  }
}

   是「把飼料倒進四個碗」。改成每一隻自己想吃什麼：按下餵貓狗的時候，
   每一隻先冒一個泡泡講自己要什麼，碗裡就裝那一種。
   一輪換一次，所以不會每次都一樣。 */
function startFeed(){
  if(SS.feed) return;
  let best=null;
  /* 跟清貓砂同一個問題：收工後大家都在畫面外 1700px，照「離飼料碗最近」
     挑會挑到他們，然後要走好幾千幀才看得到人——使用者看到的是按了沒反應。
     現場只剩留守那一位的時候，餵貓狗就是他的事。 */
  best = freeCrew(BOWL_X);
  if(best===null){ noOne(["現場沒有人","Nobody on the floor","No hay nadie en el piso"]); return; }
  CREW[best].job="feed";
  SS.feed={who:best, phase:"go", t:0, tip:0};
  sfxClick();
}
function sack(x,y,tip){
  /* a feed sack, tipped over the bowls while it pours */
  g.save(); g.translate(x,y); g.rotate(tip*1.15);
  brk(-9,-20,9,2,"#C79A66",0,"#9A7343");
  R(-7,-23,7,-19,"#9A7343");
  TXT_(0,-9,"\u2022",'#8A5F3C',9,true);
  g.restore();
  if(tip>0.55){ for(let i=0;i<5;i++){ const d=(SS.frame*0.9+i*7)%26;
    O(x+7-2+d*0.5,y+2+d,x+7+2+d*0.5,y+5+d,"#B8874F"); } }
}
/* 動物打鬧：三段——走到定位面對面、正面互撲、各自散開。
   全部的動物都要參加：狗一排、貓一排，面對面。v38 只搬主角那兩隻，
   多選的還在旁邊自己晃，看起來是兩隻在打、其他在圍觀。 */
const FIGHT_X=452, FIGHT_GAP=17, FIGHT_LEN=330, FIGHT_ROW=27;
function fightSlots(){
  /* 回傳每一隻的定位與面向。狗往左排、貓往右排，但不要排得像兩隊在集合：
     每一隻各自往中間插一點、前後錯開、節奏也各自不同，打起來才像一團亂。
     偏移量由 id 決定，不是每幀重抽——亂數每幀重抽會讓牠們原地發抖。 */
  const L=petRoster(), out=[];
  let d=0,c=0;
  L.forEach((a,i)=>{
    /* 用雜湊而不是「字元碼乘一乘再相加」：x0/x1/x2 相鄰的 id 在那種算法下
       每一步剛好加 40，個位數永遠一樣，三隻會拿到同一組節奏。 */
    let hv=2166136261, key=a.id+"#"+i;
    for(let n=0;n<key.length;n++){ hv^=key.charCodeAt(n); hv=Math.imul(hv,16777619)>>>0; }
    const jx=(hv%13)-6, jy=((hv>>>7)%7)-3, ph=((hv>>>13)%17)*0.37, sw=0.8+((hv>>>19)%5)*0.13;
    if(a.kind==="dog"){
      out.push({a:a, x:FIGHT_X-FIGHT_GAP-d*FIGHT_ROW+jx+d*6, dy:jy-d*4, f:1, ph:ph, sw:sw});
      d++;
    } else {
      out.push({a:a, x:FIGHT_X+FIGHT_GAP+c*FIGHT_ROW+jx-c*6, dy:jy+c*4, f:-1, ph:ph, sw:sw});
      c++;
    }
  });
  return out;
}
function startFight(){ SS.fightF=SS.frame; SS.dogT=null; SS.fightHit=0; sfxBark(); }
function fightPhase(){                 /* 0 走位 1 開打 2 散開，-1 沒在打 */
  if(SS.fightF===null) return -1;
  const u=(SS.frame-SS.fightF)/FIGHT_LEN;
  return u<0.26?0:(u<0.80?1:2);
}
/* ---- 叫料補貨 ----------------------------------------------------------
   揀貨位空了一格，堆高機去高位貨架把整板叉下來補上。教的是儲位分兩層：
   上面是存貨位、下面是揀貨位，揀貨的人只在下面走動。 */
const REPL_BAY=[118, 293, 468];        /* 三排貨架的中心 */
const REPL_FACE=560;                   /* 揀貨位（待運區左邊那一段） */
function startRepl(){
  if(SS.repl) return;
  SS.run=true;
  SS.repl={phase:"go", t:0, bay:REPL_BAY[(Math.random()*3)|0], lift:0, carry:false};
  sfxDrop();
}
function stepRepl(dt){
  const R_=SS.repl; if(!R_) return;
  R_.t+=dt;
  const go=(tx,sp)=>{ const d=tx-SS.forkX;
    if(Math.abs(d)>3){ SS.forkX+=Math.sign(d)*(sp||2.2)*dt; SS.forkC=Math.sign(d)>0; return false; }
    return true; };
  if(R_.phase==="go"){ if(go(R_.bay)) { R_.phase="lift"; R_.t=0; } }
  else if(R_.phase==="lift"){ R_.lift=Math.min(1,R_.lift+0.02*dt);
    if(R_.lift>=1){ R_.carry=true; R_.phase="down"; R_.t=0; sfxDrop(); } }
  else if(R_.phase==="down"){ R_.lift=Math.max(0.18,R_.lift-0.02*dt);
    if(R_.lift<=0.18){ R_.phase="carry"; R_.t=0; } }
  else if(R_.phase==="carry"){ if(go(REPL_FACE)) { R_.phase="drop"; R_.t=0; } }
  else if(R_.phase==="drop"){ R_.lift=Math.max(0,R_.lift-0.02*dt);
    if(R_.lift<=0){ R_.carry=false; R_.phase="done"; R_.t=0; sfxDrop();
      SS.bub.push({x:REPL_FACE, y:FORK_Y-70, s:triv(REPL_SAY), until:SS.frame+150}); } }
  else if(R_.phase==="done" && R_.t>170) SS.repl=null;
}
const REPL_SAY=["補到揀貨位了","Replenished to the pick face","Repuesto en la posición de surtido"];

/* ---- 盤點 --------------------------------------------------------------
   兩個人到貨架前，一個念一個記，一格一格數過去，最後把帳上與實數並列。
   差異不是「有人偷東西」，多半是收貨或出貨少刷了一筆——這才是要教的。 */
function startCount(){
  if(SS.count) return;
  SS.run=true;
  const bay=(Math.random()*3)|0;
  const book=44+((Math.random()*8)|0);
  const real=book-((Math.random()<0.6)?1:0)-((Math.random()<0.25)?1:0);
  /* 誰去數：現場還在、手上沒事的人，最多兩位。原本寫死 CREW[0] 和 CREW[1]，
     收工之後那兩位已經走到畫面外 1700px，按下去等於把他們從場外叫回來，
     要走好幾千幀才看得到人——使用者看到的就是「按了沒反應」。
     夜班只剩留守一位的時候，就一個人自己數，那本來就是夜班在做的事。 */
  const pool=[];
  if(SS.onDuty!==null && CREW[SS.onDuty] && CREW[SS.onDuty].job==="desk"){
    pool.push(SS.onDuty);
  } else {
    CREW.forEach((m,i)=>{ if(m.job || m.x<-50 || m.x>SCENE_W+50) return;
      if(pool.length<2) pool.push(i); });
    /* 一個閒人都沒有的時候，從休息中的把人拉起來——畫面上有人就不該說沒有人 */
    while(pool.length<1){ const k=freeCrew(REPL_BAY[bay]); if(k===null) break; pool.push(k); }
  }
  if(!pool.length){
    SS.bub.push({x:SCENE_W*0.5, y:WALK_Y-72, until:SS.frame+150,
      s:triv(["現場沒有人可以盤點","Nobody on the floor to count","No hay quien cuente"])});
    return;
  }
  SS.count={phase:"go", t:0, bay:bay, x:REPL_BAY[bay], cell:0, book:book, real:real,
            who:pool};
  pool.forEach(i=>{ CREW[i].job="count"; });
  sfxClick();
}
function stepCount(dt){
  const Q=SS.count; if(!Q) return;
  Q.t+=dt;
  const a=CREW[Q.who[0]], b2=(Q.who.length>1)?CREW[Q.who[1]]:null;
  const walk=(m,tx)=>{ if(!m) return true; const d=tx-m.x;
    if(Math.abs(d)>3){ m.x+=Math.sign(d)*1.9*dt; m.ph+=0.14*dt; return false; }
    return true; };
  if(Q.phase==="go"){
    const p1=walk(a,Q.x-26), p2=walk(b2,Q.x+26);
    if(p1&&p2){ Q.phase="count"; Q.t=0; }
  } else if(Q.phase==="count"){
    if(Q.t> (Q.cell+1)*48){ Q.cell++; sfxBeep();   /* 一格慢一點，看得清楚在數哪一格 */
      if(Q.cell>=6){ Q.phase="say"; Q.t=0;
        SS.bub.push({x:Q.x, y:FLOOR_Y-96, until:SS.frame+240,
          s:"A"+(Q.bay+1)+"  "+triv(CNT_BOOK)+" "+Q.book+" / "+triv(CNT_REAL)+" "+Q.real});
        if(Q.real!==Q.book) sfxAlarm(); } }
  } else if(Q.phase==="say"){
    /* 數完不是結束。盤點的產出是一筆「調整」，要回寫 WMS，系統上的可售
       數量才會跟架上一致。不回寫，帳實不符會一路傳到平台變成超賣。 */
    if(Q.t>250){ Q.phase="wms"; Q.t=0;
      /* 回寫的人：兩個人的時候是第二位，一個人的時候就他自己走一趟 */
      const one=CREW[Q.who[Q.who.length>1?1:0]];
      one.job="wms";
      Q.deskX=DESK_X-10;
      SS.bub.push({x:Q.x, y:FLOOR_Y-96, until:SS.frame+200,
        s:triv(Q.real===Q.book?CNT_OK:CNT_ADJ)});
    }
  } else if(Q.phase==="wms"){
    /* 有人走到辦公桌把差異打進系統 */
    const one=CREW[Q.who[Q.who.length>1?1:0]];
    const d=Q.deskX-one.x;
    if(Math.abs(d)>3){ one.x+=Math.sign(d)*2.0*dt; one.ph+=0.13*dt; }
    else if(!Q.typed){ Q.typed=true; Q.t=0; sfxCalc();
      SS.bub.push({x:DESK_X-6, y:WALK_Y-72, until:SS.frame+240,
        s:triv(Q.real===Q.book?WMS_OK:WMS_ADJ)}); }
    if(Q.typed && Q.t>260){
      Q.who.forEach(i=>{ CREW[i].job=null; });
      SS.count=null;
    }
  }
}

/* ---- 交接班 ------------------------------------------------------------
   夜班從門口進來，跟留守的那位在辦公桌前對一輪，日班才走。這一段接的是
   收工：留守那位不是被忘在現場，是等人來換他。 */
function startHand(){
  if(SS.hand) return;
  /* 已經有人接班在現場，就不能再交一次——連按會把同仁一個一個送走，
     按到最後倉庫沒人。要再交班得先按「開始上工」。 */
  if(SS.nightOn){
    SS.bub.push({x:DESK_X-6, y:WALK_Y-72, until:SS.frame+150,
      s:triv(["這一班剛交過了","This shift's just been handed over","Este turno ya se relevó"])});
    return;
  }
  SS.run=true;
  /* 被換的那一位：收工後是留守的那個；平常上班按下去就換離辦公桌最近的
     那一位。原本只認 SS.onDuty，平常上班時它是空的，整段就空轉——
     人走進來講兩句然後沒事發生。 */
  let off = SS.onDuty;
  if(off===null || !CREW[off] || CREW[off].job==="leave"){
    off=0;
    CREW.forEach((m,i)=>{ if(m.job) return;
      if(Math.abs(m.x-DESK_X) < Math.abs(CREW[off].x-DESK_X)) off=i; });
  }
  SS.hand={phase:"in", t:0, x:-60, off:off, said:0,
           todo:shuffle(HAND_TODO).slice(0,3)};
  sfxDoor();
}
function stepHand(dt){
  const H=SS.hand; if(!H) return;
  H.t+=dt;
  if(H.phase==="in"){
    /* 走到要被換的那位旁邊。原本一律走到辦公桌，被換的人可能在三百多
       px 外，兩個人隔著整個廠房對喊完，一個就走了——那不像交班。 */
    const you = CREW[H.off] ? CREW[H.off].x : DESK_X-10;
    const meet = you - 36;
    if(H.x < meet){ H.x=Math.min(meet, H.x+2.2*dt); }
    else { H.x=meet; H.phase="talk"; H.t=0;
      SS.bub.push({x:H.x, y:WALK_Y-72, s:triv(HAND_SAY[0]), until:SS.frame+150}); }
  } else if(H.phase==="talk"){
    /* 交代事項一條一條講，講完才換人。原本只講一句，聽起來像打招呼不像交班。 */
    const said=H.said|0;
    if(said<H.todo.length && H.t> 20+said*140){
      H.said=said+1;
      /* 交代的是被換的那位，泡泡要在他頭上，不是掛在辦公桌上方 */
      const spx = CREW[H.off] ? CREW[H.off].x : DESK_X-10;
      SS.bub.push({x:spx, y:WALK_Y-72, s:triv(H.todo[said]), until:SS.frame+132});
    }
    if(H.t> 40+H.todo.length*140){ H.phase="swap"; H.t=0;
      /* 交完班，被換的那位就下班；夜班的人接手他的位置。
         這一下一定要真的發生，不然按鈕只是播一段對話。 */
      const off=H.off;
      if(CREW[off]){
        H.post=CREW[off].x;                      /* 接班的人站到他原本的崗位 */
        CREW[off].lift=0;
        CREW[off].job="leave"; CREW[off].wave=0; CREW[off].byeAt=SS.frame+10;
      }
      SS.onDuty=null; }
  } else if(H.phase==="swap"){
    /* 接班的人走到那個崗位站定，這一段才算交接完成 */
    if(H.post!==undefined){
      const d=H.post-H.x;
      if(Math.abs(d)>3) H.x+=Math.sign(d)*1.9*dt;
    }
    /* 交完班，接班的人留在現場——SS.hand 收掉之後由 SS.nightOn 常駐，
       不然桌子會空著，等於前一班走了、沒有人接。 */
    if(H.t>260){ SS.nightOn={x:(H.post!==undefined?H.post:DESK_X-10)}; SS.hand=null; }
  }
}

/* ---- 停電 --------------------------------------------------------------
   全場暗下只剩緊急照明，輸送帶和堆高機停住，幾秒後恢復。畫面效果最強，
   但它教的其實是一件很實際的事：復電之後要確認線上還有沒有貨。 */
function startVisit(){
  if(SS.visit) return;
  /* Will Call 要有人交貨。收工後現場只剩留守那位，就由他接待。 */
  if(!CREW.some(m=>!m.job && m.x>-50 && m.x<SCENE_W+50)){
    if(freeCrew(SCENE_W*0.5)===null){
      noOne(["現場沒有人可以交貨","Nobody on the floor to hand it over",
             "No hay quien entregue"]);
      return;
    }
  }
  /* he comes in with nothing, finds whoever is nearest the door, and only
     leaves once a parcel has actually changed hands */
  let who=0;
  CREW.forEach((m,i)=>{ if(m.x>CREW[who].x) who=i; });
  SS.visit={phase:"in", t:0, x:960, who:who, hand:0};
  sfxHonk();
}
/* ---- 收工後的戶外場景 ----
   人走出畫面之後不是直接回到空倉庫，而是切到廠區外面：天空、廠房外觀、
   月台門、停在場上的聯結車，同仁從門口走出來、過馬路、下班。

   構圖沿用封面那張廠區外觀（同一套天空色、同樣的 DOCK 門），
   所以兩邊看起來是同一個地方，不是兩個世界。 */
const OUT_T = 1600;
const OUT_GND = SCENE_H-190;      /* 場地地平線，drawOutside 的 GND 同一個值 */
const OUT_EMERGE = 90;            /* 從門口走到走道上要幾幀 */
/* 出口那扇門在建築的中間那一格 */
const DOOR_X = SCENE_W*0.40;   /* 開著的那一扇月台門的中心 */                    /* 這一段跑多久（幀） */
function startOutside(){
  if(SS.outside) return;
  if(SS.outside) return;
  /* 全部從同一扇門出來，一個一個間隔一段時間，然後往右走出畫面。
     人員和寵物都由同一個 outside 狀態管理，收工時不會只剩主角那一隻。 */
  const who = CREW.map((m,i)=>i).filter(i=>i!==SS.onDuty).map((i,k)=>({
    src: i,
    x: DOOR_X,
    e: 0,
    delay: 40 + k*160,
    sp: 1.00 + (k%3)*0.06,
    waved: false
  }));
  const pets=[];
  (SEL.dogs||[]).forEach((breed,k)=>pets.push({kind:"dog",breed,x:DOOR_X,e:0,delay:150+k*72,sp:.82+(k%3)*.06,slot:k}));
  (SEL.cats||[]).forEach((breed,k)=>pets.push({kind:"cat",breed,x:DOOR_X,e:0,delay:150+((SEL.dogs||[]).length+k)*72,sp:.78+(k%3)*.06,slot:(SEL.dogs||[]).length+k}));
  SS.outside = {t:0,who,pets,petCheer:false};
  sfxDoor();
}
function stepOutside(dt){
  const O = SS.outside; if(!O) return;
  O.t += dt;
  /* 人員與寵物都先走出門、再沿外側走道離場；寵物延遲一點出現，
     讓畫面讀起來像牠們特地跑出來送大家，而不是和人重疊。 */
  O.who.forEach(w=>{
    if(O.t <= w.delay) return;
    if(w.e < 1){ w.e = Math.min(1, (O.t - w.delay) / OUT_EMERGE);
                 w.x = DOOR_X + 46*w.e; }
    else w.x += w.sp*dt;
  });
  O.pets.forEach(p=>{
    if(O.t <= p.delay) return;
    const wasIn = p.e;
    if(p.e < 1){ p.e = Math.min(1, (O.t - p.delay) / OUT_EMERGE);

  return "#"+((1<<24)+(f(r)<<16)+(f(gg)<<8)+f(b)).toString(16).slice(1);}
/* 兩色相混。mix 只能把顏色往白或往黑推，夜景要的是往藍推，所以另外一個。 */
function blend(a,b,k){
  k=Math.max(0,Math.min(1,k));
  const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  const f=(x,y)=>Math.round(x+(y-x)*k);
  return "#"+((1<<24)+(f((A>>16)&255,(B>>16)&255)<<16)
                     +(f((A>>8)&255,(B>>8)&255)<<8)
                     + f(A&255,B&255)).toString(16).slice(1);
}
const NIGHT_TINT="#141C30";

   接縫處就會變成左邊入夜、右邊還在中午。 */
function nightK(S){
  S=S||((typeof skyNow==="function")?skyNow():{body:"sun"});
  return S.body==="moon"?1:(S.body==="sun"?0:0.45);

function dusk(col,k){ return k?blend(col,NIGHT_TINT,0.62*k):col; }

function coatAt(B,k){
  if(!k) return B;
  const o=Object.assign({},B);
  ["b","c","e","stripes","pt","patch1","patch2"].forEach(p=>{
    if(o[p]) o[p]=dusk(o[p],k*0.6); });

function vp(x,y,k){return [x+(VP[0]-x)*k,y+(VP[1]-y)*k];}

/* 字型：手寫感排前面，圓體殿後。中文的手寫字型系統上不一定有，
   只能有就用、沒有自然往後退——指定死的話 Windows 會掉到宋體。 */

   原本排最前面的 Bradley Hand、Marker Felt、Segoe Print、Ink Free
   都是鋼筆／馬克筆那種連筆字，在 iPhone 上會被選中，字就糊成一團
   （回報：手機版的太草了）。
   改成 Chalkboard 打頭——粉筆體，筆畫端正、字距清楚，但仍是手寫的，
   而且 iOS 和 macOS 都有。中文一律落到圓體，中文手寫體太細看不清。 */

   Marigold 用圓體（筆畫收圓，配粉奶油），Barnaby 用黑體（筆畫收方，配牛皮紙）。
   Barnaby 那一套是拿來投影帶班的，字距和字重另外調——見 body.th-barney。
   萬一兩邊都落到同一支系統字（Windows 沒有內建圓體就會這樣），字重和字距

const ZH_STACK={
  goldie:'"Yuanti TC","Yuanti SC","Hiragino Maru Gothic ProN","PingFang TC","Noto Sans TC","Microsoft JhengHei"',
  barney:'"Heiti TC","PingFang TC","Hiragino Sans","Noto Sans TC","Source Han Sans TC","Microsoft JhengHei"',
  poppy:'"ZCOOL KuaiLe","Klee One","Yuanti TC","PingFang TC","Noto Sans TC","Microsoft JhengHei"',
  doodle:'"Klee One","Yuanti TC","Yuanti SC","PingFang TC","Noto Sans TC","Microsoft JhengHei"'

let CUTE_FONT = ZH_LATIN+','+ZH_STACK.goldie+',sans-serif';

  else{const a=vp(x0,y0,k),b=vp(x0,y1,k);P([x0,y0,a[0],a[1],b[0],b[1],x0,y1],side,o,1);}

/* =====================================================================
   Lego primitives. The cover is built out of bricks, so the floor is too:
   every surface here is a brick with a bevel and a row of studs.
   ===================================================================== */
function stud(cx,cy,r,col){
  O(cx-r,cy-r*0.62,cx+r,cy+r*0.62,mix(col,0.07));
  O(cx-r,cy-r*1.02,cx+r,cy+r*0.22,mix(col,0.26));

function brk(x0,y0,x1,y1,col,studs,edge){

  R(x0,y0,x1,y1,col,edge||null,1);
  R(x0,y0,x1,y0+h*0.18,mix(col,0.12));
  R(x0,y1-h*0.16,x1,y1,mix(col,-0.17));
  R(x0,y0,x0+w*0.07,y1,mix(col,0.07));
  R(x1-w*0.07,y0,x1,y1,mix(col,-0.12));
  /* 圓釘的半徑要同時被寬度和厚度綁住。原本只除寬度，所以一塊 142 寬、
     4 高的層板會長出半徑 48 的圓釘——畫面上那不是圓釘，是一顆蓋住整層
     貨架的球。倉庫的貨架、棧板、箱子全部中這一條，看起來像堆了一排布袋。 */
  if(studs>0){ const r=Math.max(1.6,Math.min(w/(studs*2)*0.68, h*0.34));
    for(let i=0;i<studs;i++) stud(x0+w*(i+0.5)/studs,y0,r,col); }

function studField(x0,y0,x1,y1,step,col,alpha){

  g.restore();

  brk(x,y-6*s,x+w,y,C.wood,0,C.wood2);}
/* A Lego minifig, keeping the same vertical proportions the scene was laid out

   mood) works exactly as before. */
function person(x,y,ph,coat,o){o=o||{};const s=o.sc||1,S=v=>v*s,cr=o.crouch||0,fa=o.face||0;

       以及髮質（直／捲／編）。每一款都必須在這三項上有差別，

      long:{len:20,   fringe:0, taper:1},         /* 過肩，尾端收尖 */
      bob:{len:11,   fringe:1, blunt:1, wide:1},  /* 到下巴、切齊、蓬、齊瀏海 */
      curly:{len:2,    fringe:0, curl:1},        /*   蓬                   */
      bun:{len:-2.2,   fringe:0, bun:1},         /*   盤起來，帽後一顆      */
      sidepart:{len:-2.2, fringe:0, part:1},     /*   旁分：帽簷下一道斜線   */
      middle:{len:1,   fringe:0, part:-1},       /*   中分：正中間一道縫     */

      if(s.a.kind==="dog") dog(x,y,SS.frame+i*9,s.f,false,DOG_BREEDS[s.a.b]||DOG_BREEDS.corgi);
      else catDraw(x,y,SS.frame+i*9,s.f,false,0,CAT_BREEDS[s.a.b]||CAT_BREEDS.ragdoll);
      g.restore();
    });
    if(scrap){                                 /* 撞在一起的星星，位置也各自跳 */
      [[0,-6,0.5],[-22,4,1.7],[24,-2,2.9]].forEach(([ox,oy,ph],j)=>{
        if(Math.sin(n*0.4+ph)<0.35) return;

        const sz=4+2.2*Math.sin(n*0.5+j);

       而且頭根本沒碰到碗。頭在身體前方 22 個單位，所以吃的時候整隻往
       後退一點，嘴巴才落在碗上——用 dogEat 這個 0~1 的值帶著走，
       不會在開始吃的那一幀跳一下。 */

          dk<0.1 && (SS.dogT===null||Math.abs(SS.dogX-SS.dogT)>4),
          dk, squatK("dog"));

        ck2<0.1, Math.max(squatK("cat")*0.7,catPottyK("cat")), ck2);
    SS.extra.forEach((p,i)=>{
      const e2 = p.eating?1:0;

      if(p.kind==="dog") dog(p.x-15*p.f*e2, FLOOR_Y+62+(e2?0:sw), SS.frame+p.ph, p.f,
                             !p.eating, DOG_BREEDS[p.b], 0, e2, squatK("x"+i));
      else catDraw(p.x-11*p.f*e2, FLOOR_Y+62+(e2?0:sw), SS.frame+p.ph, p.f,
                   !p.eating, Math.max(squatK("x"+i)*0.7,catPottyK("x"+i)), CAT_BREEDS[p.b], e2); });
    /* 名牌畫在最後，蓋在所有動物上面。畫在每一隻自己那一段裡的話，
       後畫的那一隻會蓋掉前一隻的名字。 */

      const nm=(SEL.petNames||{})[a.b]; if(!nm) return;
      const nx=petX(a), ny=FLOOR_Y+62-(a.kind==="dog"?38:32);
      const wd=Math.max(26,nm.length*(lang==="zh"?11:7)+12);

  SS.bub.forEach(b=>{
    if(b.who){ const q=spkAt(b.who); bubble(q.x,q.y,b.s); return; }

  TXT_(SCENE_W-22,SCENE_H-35,"Pallets loaded: "+SS.pallets+" / 6",C.cream,10,true,"right");

function stepScene(dt){

  SS.frame++; if(SS.run && !scolded && !SS.brk)SS.beltT+=dt; SS.wp+=(SS.run?0.13:0.022)*dt;   /* 線停了還在對空氣打包很奇怪；放慢成待機，完全凍住又像當掉 */

    /* 取放貨改成四段：走去待運區 → 停下來叉起一板 → 開到車廂裡 → 停下來放下。

    if(SS.forkP==="toStack"){

    } else if(SS.forkP==="pick"){

    p.x+=p.f*p.sp*dt;

    if(SS.pet){
      const P0=SS.pet, m0=CREW[P0.who];
      const jog=Math.sin(SS.frame*0.13)*5;          /* 你擠我我擠你 */
      SS.dogT = m0.x+26+jog;
      const cg = m0.x+56-jog;
      SS.catX += (cg-SS.catX)*0.10*dt;              /* 用跑的，不是慢慢飄過來 */
    } else if(!SS.catPotty){
      const catGoal = SS.brk ? bowlFor({kind:"cat",id:"cat"},BRK_BOWL_X)
                    : (SS.bowl>0 ? bowlFor({kind:"cat",id:"cat"}) : (SS.dogX-34*SS.dogF));
      SS.catX+=(catGoal-SS.catX)*0.04*dt;
    }
  }
  /* 貓的排便路線由 stepCatPotty 控制：先走到貓砂盆，坐進去，再回原位。 */
  stepCatPotty(dt);
  /* 吃／不吃之間用一個 0~1 的值帶過去，頭才不會在到碗的那一幀「啪」一下

  {
    const near=(a,x)=>Math.abs(x-bowlFor(a,SS.brk?BRK_BOWL_X:undefined))<14;
    const dE = fph<0 && (SS.brk||SS.bowl>0) && near({kind:"dog",id:"dog"},SS.dogX);
    const cE = fph<0 && (SS.brk||SS.bowl>0) && near({kind:"cat",id:"cat"},SS.catX);
    SS.dogEat=Math.max(0,Math.min(1,SS.dogEat+(dE?0.09:-0.13)*dt));
    SS.catEat=Math.max(0,Math.min(1,SS.catEat+(cE?0.09:-0.13)*dt));

  if(SS.nightOn){

    const tx = gathering
      ? (SS.brk ? BRK_X+BRK_HALF-24 : SS.bossX + (GATHER_OFF[GATHER_OFF.length-1]||60) + 46)
      : N.home;

    if(Math.abs(d)>3){ N.x+=Math.sign(d)*2.0*dt; N.walk=true; N.face=Math.sign(d); }
    else { N.x=tx; N.walk=false; N.face=gathering?-1:0; }
  }

     但盤點、交接、清潔、餵食、Will Call 這些流程各自有自己的計時器，
     照樣跑下去——燈都熄了還有人在數貨架，那不叫停電。 */
  if(SS.visit) stepVisit(dt);
  if(SS.count) stepCount(dt);
  if(SS.hand)  stepHand(dt);
  /* 排便分成兩條完全不同的流程：狗在自己的地面位置蹲下並留下地面便便；
     貓先走到 WC 旁的貓砂盆，坐進盆裡完成，再離開。吃飯、打鬧、被摸時都不觸發。 */
  if(SS.run && fph<0 && !SS.pet && !SS.brk){
    if(SS.squat){
      /* 這個狀態只允許狗使用。 */
      SS.squat.t+=dt;

          if(a.kind==="dog"){
            const fdir= a.id==="dog" ? SS.dogF : (a.ref?a.ref.f:1);
            /* 狗屁股朝向地板，便便落在牠停下的地面，不進貓砂盆。 */

          }else{

    } else if(fph===1){                            /* 面對面互撲，輪流叫 */

      if(n-SS.fightHit>=22){ SS.fightHit=n;
        const step=Math.round(n/22)%3;
        if(step===0) sfxBark(); else if(step===1) sfxHiss(); else sfxMeow();

      slots.forEach(s=>{ petSetX(s.a, petX(s.a)+(s.f>0?-1.5:1.2)*dt); });

    }

      SS.extra.forEach(p=>{ p.f=p.x<FIGHT_X?-1:1; }); }
  }
  if(SS.shiftF){
    SS.shiftF.t+=dt;
    if(SS.shiftF.mode==="in"){
      if(CREW.every(m=>!m.job)){
        const then=SS.shiftF.then; SS.shiftF=null;
        if(then==="morning") startMorning();    /* briefing once they are in */
      }
    } else if(CREW.every(m=>m.x<-50 || m.job==="desk")){

  if(SS.eat) stepEat(dt);

let rafOn=false,lastT=0;
let fitTick=0;
function loop(now){ const dt=Math.min(4,(now-lastT)/16.667)||1; lastT=now;
  if(++fitTick>=15){ fitTick=0;                 /* 每 15 幀確認一次顯示尺寸 */

    if(cv){ const n=refitIfNeeded(cv,SCENE_W,SCENE_H); if(n){ g0=n; } }
    const gc=document.getElementById("gcv");
    if(gc){ const n=refitIfNeeded(gc,GW,GH); if(n){ gg=n; } }
    for(const id in SUB){ const S_=SUB[id];
      const n=refitIfNeeded(S_.c,S_.w,S_.h); if(n) S_.ctx=n; }
  }
  if(tab===0 && g0){ g=g0; stepScene(dt); drawScene(); }
  if(tab===4 && gg){ g=gg; gameLoop(dt); }   /* 小遊戲是第 5 頁（index 4）。
     tabGuide 加回 RENDER 之後遊戲從 index 3 移到 4，這兩個判斷沒跟著改，
     結果 gameLoop 從來沒被呼叫過——整頁的畫布是死的。 */
  if(SFX.ctx) sfxHum(SFX.on && tab===0 && SS.run);
  runSubs(dt);
  requestAnimationFrame(loop);
}


/* =====================================================================
   對話：開會 / 訓話 / 早會。稿是抽的，逐句換泡泡，長度由稿決定——
   和桌面版同一套規矩（一句 MEET_LINE 或 SCOLD_LINE 格，最後加 MEET_TAIL）。
   ===================================================================== */
const SPK_X = {boss:430, left:350, right:510};   /* 只當找不到人時的備援 */
function spkAt(who){
  if(who==="boss") return {x:SS.bossX, y:WALK_Y-92};   /* 老闆放大 1.22，頭比別人高 */
  const on=CREW.filter(m=>m.job!=="leave");
  if(!on.length) return {x:SPK_X[who]||430, y:WALK_Y-58};
  let m=on[0];
  on.forEach(k=>{ if(who==="right" ? k.x>m.x : k.x<m.x) m=k; });
  return {x:m.x, y:m.y-74};
}
let script_=null, scriptSpan=0, scriptStart=0, scriptLine=-1;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let scoldBag=[];
function meetCall(lines, span){
  if(SS.brk){ SS.brk=null; CREW.forEach(m=>{m.job=null;m.sit=false;}); SS.dogT=null; }
  SS.run=true;
  script_=lines; scriptSpan=span; scriptStart=SS.frame; scriptLine=-1;
  SS.meetU = SS.frame + lines.length*span + D.MEET_TAIL;
}
function startMeeting(){
  const topic = D.MEET_TOPICS[Math.floor(Math.random()*D.MEET_TOPICS.length)];
  meetCall([D.CALL_LINE].concat(topic), D.MEET_LINE);
  SS.bossOn=true; SS.scold=false;
}
function startMorning(){
  meetCall([D.CALL_LINE].concat(D.MORNING_TOPIC), D.MEET_LINE);
  SS.bossOn=true; SS.scold=false;
}
function startScold(){
  /* 一次訓三件事：抽三組，中間用「還有」接。 */
  if(scoldBag.length<3) scoldBag=shuffle(D.SCOLD_TOPICS);
  const open=["boss",["都停一下，過來","Everyone stop what you're doing and come here","Órale, paren todos. Vénganse"]];
  const more=["boss",["還有","One more thing","Otra cosa"]];
  const close=["boss",["聽懂了就回去做事","If that's clear, back to work","Si quedó claro, de regreso al trabajo"]];
  let lines=[open];
  for(let i=0;i<3;i++){ if(i) lines.push(more); lines=lines.concat(scoldBag.shift()); }
  lines.push(close);
  meetCall(lines, D.SCOLD_LINE);
  SS.bossOn=true; SS.scold=true;
}
function stepDialogue(){
  if(!script_ || SS.frame>=SS.meetU){ script_=null; return; }
  const u=SS.frame-scriptStart, idx=Math.floor(u/scriptSpan);

    /* 存角色而不是存座標：座標在講話那一瞬間就凍住了，人還在走。 */
    SS.bub=[{who:who, s:txt, until:SS.frame+Math.floor(scriptSpan*0.88)}];
