cscnight":"巡邏","gspick":"指定下一件量出來的結果：","gsok":"一般件","gswatch":"AHS 邊界","gsover":"超限件","dlvpick":"尾程：住宅或商業","dlvhouse":"住宅","dlvshop":"商業","rma":"RMA 退貨區：判定與入庫","rmanote":"退回來的東西在判定完成之前不是庫存，是一批不知道能不能賣的貨。這一區把它與可售庫位分開存放，逐件刷 RMA、建檔、拆箱比對，再判到四個去處之一。判錯的成本不是一件商品，是把瑕疵品放回可售庫存之後的第二次退貨與平台績效。","rmaflow":"退件到倉  →  刷 RMA・拍照建檔  →  拆箱比對品項與數量  →  判定（重新上架／整新加工／隔離待判／報廢）  →  回寫平台與 WMS","rmawarn":"判定要受過訓的人來做，不是揀貨的人順手決定。隔離品和報廢品在判定前後倉租照算，隔離區越堆越高，是最常見的隱形倉租。每個平台的退貨政策和可售標準都不一樣，實際看客戶合約和平台當期規定。","prep":"中轉作業：送進 FBA 與 Walmart","prepnote":"3PL 不是只有「出貨給消費者」這一條路。跨境賣家很常把整批貨先運到我們倉庫，由我們驗收、貼標、重新裝箱、打板，再送進 Amazon 或 Walmart 自己的倉庫，之後由平台出貨給買家。這一段叫中轉，英文常寫 Prep & Forward。名詞對照：工廠運到我們倉庫的那一段是頭程（first mile），我們送到買家手上的那一段是尾程（last mile）；中間在倉庫裡發生的事不叫哩程，叫作業。","prepflow":"工廠／賣家  ──頭程──▶  3PL 倉庫（驗收・貼標・重新裝箱・打板）  ──中段──▶  Amazon FBA／Walmart WFS  ──尾程──▶  買家","prepwarn":"這一段最常出事的是標籤和預約，不是運費。標籤貼錯、外箱標漏貼、超重沒貼 Team Lift、沒約到時段——中任何一項，整批都可能被退回來，而退回來要花的錢比運費貴得多。","whatis":"第三方物流的業務範圍","whatisnote":"3PL 就是第三方物流。賣家不用自己租倉庫、不用請人揀貨包裝，也不用每天跑物流商。貨寄到我們倉庫之後，剩下的事我們接手。","flow":"賣家／客戶  ──頭程──▶  3PL 倉庫（收貨・庫存・出貨）  ──尾程──▶  物流商 UPS／FedEx／USPS  ──▶  買家","jobs":"倉庫作業職務","manuals":"同仁入門手冊","carrier":"物流運輸商","carrierpick":"運輸商","servicepick":"服務別","carrier_ups":"UPS｜美國本土包裹的主力。費用由五項決定：服務、Zone、計費重量、地址類型、附加費。","carrier_fedex":"FedEx｜Ground 和 Express 是兩套網路，Ground 又分 Ground（企業）和 Home Delivery（住宅）。附加費名稱自成一套，而且偏遠不只看收件地，取件地也算。細節看 FedEx 計費教材。","carrier_usps":"USPS｜美國郵政，跟前面兩家差最多：沒有住宅附加費、沒有偏遠地區附加費、上限 70 磅，而且郵資是先付不是月結。2026 年 4 月起首度加收燃油，固定 8%，限期到 2027/1/17，不像另外兩家每週浮動。PO Box 和軍郵地址也只有它送得到。細節看 USPS 計費教材。","package":"包裹資料","address":"地址類型","commercial":"商業地址","residential":"住宅地址","from":"寄件 ZIP Code","to":"收件 ZIP Code","zone":"Zone 區域","zonehelp":"兩個 ZIP 填好即自動帶入。","zoneimport":"匯入 Zone 表","zoneimportnote":"從上面的連結下載 UPS Zone 表原始檔後匯入，存進本機快取；之後這個起運點不用連網也查得到 Zone。","feegloss":"倉儲作業收費項目","feeglossnote":"帳單的另外一半。運費由運輸商計收，以下各項則由倉庫計收；新進同仁多半在接觸 AHS 之前，就會先遇到這些名詞。本表僅說明各項費用所對應之作業內容，不列金額——各家 3PL 報價互異，此處列出數字會被誤讀為市場行情。","manzh":"3PL 入門手冊（中文版 PDF）","manen":"3PL 入門手冊（英文版 PDF）","manes":"3PL 入門手冊（西班牙文版 PDF）","rateload":"載入費率表（CSV）","ratelodnote":"內建的是示範費率，不是任何一家的公告價。要算真實金額，把公告費率表或客戶合約費率存成 CSV 載進來：第一列是 Zone 號碼，之後每列開頭是重量。","rateexport":"匯出／範本（CSV）","zoneimp":"匯入路線表（CSV）","zoneexp":"匯出／範本","zonebooknote":"欄位為 origin_zip, dest_zip, zone, das_tier；das_tier 可留白。匯出鍵會把目前已記錄的路線寫成同格式的檔案，空的時候則寫出一份範例。","lgnote":"下面所有門檻都用同一個量法。先把三個邊由大到小排：最長邊、第二長、第三長。長度加周長 ＝ 最長邊 ＋ 2 ×（第二長 ＋ 第三長）。欄位叫「長度」不代表它就是最長邊，要先排序再算。材積則是三邊相乘，1 立方英尺 ＝ 1,728 in³。","maint":"維護工具","advanced":"顯示進階門檻（尺寸細項、材積門檻、尺寸上限）","profile":"規則版本","profileload":"載入","profilesave":"另存目前設定","selftest":"跑一次自我測試","selftestnote":"用五個已核對過的案例跑一次計算引擎，比對計費重與總額。改完門檻或費率就按一次。","units":"輸入單位","unit_imp":"英制（in / lb）","unit_met":"公制（cm / kg）","weight":"實際重量（lb）","length":"長度（in）","width":"寬度（in）","height":"高度（in）","signature":"簽名服務","dastier":"偏遠地區附加費","das_none":"沒有（收件地不在任何偏遠清單）","das_das":"DAS 一般偏遠","das_edas":"Extended DAS 延伸偏遠","das_ras":"RAS 極偏遠／離島","ahspack":"包裝不符（未用瓦楞紙箱完整包覆，如輪胎、軟包裝、木箱）","nstdcard":"非標準尺寸費（Nonstandard Fee）","nstdnote":"包裹過長或體積過大者，USPS 另行加收非標準尺寸費。其判定僅依長度與體積，與重量無涉。以下三條分別判定，觸發幾條即加收幾筆。","nstdl1":"最長邊門檻（in）","nstdl2":"最長邊較高門檻（in）","nstdcu":"體積門檻（in³）","nstdfeecard":"非標準尺寸費金額","nstdfeenote":"金額為示範值，請依當年度 USPS 價目表更新。觸發條件在「規則設置」分頁。","nstdf1":"第一段加收（$）","nstdf2":"第二段再加收（$）","nstdfc":"逾體積門檻加收（$）","nstdeg":"舉例：一根 40 吋長的桿子，就算只有 3 磅，前兩條都中，加收 $22。如果箱子體積又超過 2 立方英尺，再加 $30。\n門檻（22／30／3456）是官方規則；金額是示範值，請依當年度 USPS 價目表改。","rulesnote":"本頁設定包裹的計費重量。運費並非依磅秤讀數計收，而是依計費重量計收；以下四組規則即為將磅秤讀數轉換為計費重量的程序。\n　　一、材積除數：將包裹體積換算為重量\n　　二、材積重適用條件：判斷本件是否適用材積重\n　　三、最低計費重量：觸發特定附加費後，重量下限的規定\n　　四、包裹尺寸與重量上限：逾此範圍者須改走貨運（詳見下方「包裹尺寸與重量上限」）","divisorhelp":"承運車輛的容積固定，體積大而重量輕的包裹佔用的空間並不因其輕而減少，故須將所佔體積換算為重量計價。算式為長×寬×高÷除數；除數越小，換算所得重量越高，運費亦越高。","minnote":"最低計費重量係指：包裹觸發特定附加費後，無論實際重量多輕，一律以規定的下限重量計價。\n例如 12 磅之大型空箱觸發 AHS－尺寸者，以 40 磅計價；觸發 LPS 者，以 90 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列，僅能由計費重量的異常察覺。","ahsnote":"AHS 是「這件有點麻煩」的加價。分揀場靠輸送帶跑，包裹丟上帶子自動掃描分流，全程沒有人碰它，成本最低。有些東西上不了帶子，要靠人工搬，這一筆就是收那個成本。\n下面每一格是一個門檻，任何一項超過就算中，不用全部超過。全部都是「大於」不是「大於等於」——剛好等於不算。","lpsnote":"LPS 是比 AHS 更上一級的加價，金額大約是 AHS 的五倍。\n中了 LPS 就不收 AHS，不是兩個都收——LPS 已經是最麻煩那一級，AHS 被吸收掉了。\n同樣每一格是一個門檻，中一項就算。","rules":"計費重量規則","divisor":"材積除數","dimcube":"體積要超過","dimzone":"in³，而且 Zone 要到這個數字以上，才算材積重：","dimnote":"此二欄位用以判斷本件是否適用材積重。\n　　填 0：不設條件，所有包裹一律適用。UPS 與 FedEx 屬此。\n　　填數字：兩項條件均成立方適用。USPS 屬此（1728 與 5）。\n\n以同一包裹說明——20×15×10 吋、體積 3,000 in³、實重 10 磅：\n　　UPS（0、0）　　　　　　　無條件限制 → 適用材積重 → 計費 22 磅\n　　USPS 寄至 Zone 7　　　　 體積與 Zone 均達標 → 適用材積重 → 計費 22 磅\n　　USPS 寄至 Zone 3　　　　 Zone 未達 5 → 不適用 → 計費 10 磅\n　　USPS 小型包裹（480 in³） 體積未達 1728 → 不適用 → 依實重計費\n\n同一包裹因寄送距離不同，USPS 分別以 10 磅與 22 磅計價，差異顯著。","usemin":"套用最低計費重量","ahsmin":"AHS 最低計費重量（lb）","lpsmin":"LPS 最低計費重量（lb）","balloonlg":"大而輕：長度加周長超過","balloonmin":"in，就至少照這個重量計費（lb）：","balloonnote":"包裹體積大而重量輕者，USPS 不以實際重量計價。逾門檻即適用下限重量，與是否觸發附加費無關，屬重量規則。\n英文叫 balloon pricing，看帳單和郵局公告時會看到這個字。","ahs":"額外處理費規則（AHS）","autoahs":"自動判斷 AHS","ahsw":"實際重量超過（lb）","ahsl":"最長邊超過（in）","ahss":"第二長邊超過（in）","ahsg":"長度加周長超過（in）","ahscu":"材積體積超過（in³）","lps":"大型包裹規則（LPS）","autolps":"自動判斷 LPS","lpsw":"實際重量超過（lb）","lpsl":"最長邊超過（in）","lpsg":"長度加周長超過（in）","lpscu":"材積體積超過（in³）","omax":"包裹尺寸與重量上限","maxw":"最大重量（lb）","maxl":"最長邊上限（in）","maxlg":"長度加周長上限（in）","omaxon":"超限仍照寄，計算 Over Maximum Limits 罰款","omaxfee":"Over Maximum Limits（每件）","pkomax":"Demand－超過上限 Over Maximum（$）","omaxnote":"三項數值隨運輸商與服務別自動切換，此處顯示的即為目前所選者的上限。任一項超過，該件即不屬包裹範疇，須改走貨運。逕行交寄者，承運商得逕予退運或加收高額費用。","base":"基本運費","baseintro":"用計費重量 + Zone 查這張表。一磅一列，到 150 lb 為止。","zonefees":"依 Zone 變動的附加費","zonefeenote":"AHS 和 LPS 分四段 Zone 計價。數字可以直接改，改了就用你的。這裡是示範值，正式作業要看合約。","f_ahs_w":"AHS－重量","f_ahs_s":"AHS－尺寸","f_ahs_p":"AHS－包裝","f_lps_c":"LPS－商業","f_lps_r":"LPS－住宅","fees":"固定金額的附加費","dascom":"DAS 商業（$）","dasres":"DAS 住宅（$）","edascom":"Extended DAS 商業（$）","edasres":"Extended DAS 住宅（$）","rascom":"RAS 商業（$）","rasres":"RAS 住宅（$）","sigfee":"簽名服務費（$）","ressur":"住宅附加費（$）","fuel":"燃油附加費（%）","feenote":"金額照合約填。偏遠分三個層級，收件 ZIP 落在哪一份清單就收哪一個，一票只會中一個，而且住宅一律比商業貴。三個都跟 Zone 無關。\n住宅附加費和 DAS 住宅是兩筆不同的錢，數字也不一樣：一個看「是不是住家」，一個看「ZIP 在不在偏遠清單上」。","peak":"旺季計價（Demand Surcharge）","peakhelp":"勾選後，本次試算加上 Demand。此為旺季限定，約每年 10 月到隔年 1 月，其他時間不會有這一筆。金額在「費率與附加費」分頁的 Demand 卡片。","peakcard":"旺季附加費金額（Demand）","peaknote":"Demand 是旺季限定的加價，約每年 10 月到隔年 1 月，期間以外不會出現。\n它不會自成一列，而是掛在既有的附加費上，帳單寫成 Demand — Residential Delivery Charge。所以同一單出現兩列住宅費、只差 Demand 字樣，那不是重複計費。\n下面是示範金額。實際金額每年公告、依上期量級分級，並計入燃油基數。","peakon":"本次試算計入 Demand（預設不計）","pkres":"Demand－住宅（$）","pkahs":"Demand－額外處理 AHS（$）","pklps":"Demand－大型包裹 LPS（$）","fuelcard":"燃油附加費","fuelnote":"燃油每週一換一次，陸運和空運各一張表。按下面的按鈕會直接開該運輸商的燃油頁面，當週的百分比在那裡看得到，看完填進上面的欄位。程式也會在背景試著自己抓，抓到就列在下面。","fuelfetch":"開啟燃油頁面","fuellink":"燃油頁面（每週一更新）","fuelcol_date":"生效日","fuelcol_g":"陸運 %","fuelcol_a":"空運 %","result":"計算結果","calc":"開始計算","recalc":"重新計算","lang":"語言","footer":"Internal Training Use Only  •  Developed by Sandy Liu","yes":"是","no":"否","none":"無","error":"請檢查資料","unexpected":"程式發生錯誤"},"en":{"title":"Animated Warehouse","sub":"3PL logistics training","tabs":["1. Warehouse","2. Carrier & Parcel","3. Rule Setup","4. Rates & Surcharges","5. Calculation Result"],"lvtabs":["Chapter 1 · Warehouse Operations","Chapter 2 · Prep, Forwarding & Storage Fees","Chapter 3 · Palletizing & Freight"],"mission":"Practice Case","missionhelp":"Pick a case and the data loads itself. Change anything you like.","guess":"Your prediction: what is the main result?","casebasic":"Standard Parcel","casedim":"DIM Weight Trap","caseahsw":"AHS - Weight","caseahss":"AHS - Size","caselps":"Large Package","casemixed":"Multiple AHS Triggers","guessnone":"No special surcharge","guessahsw":"AHS - Weight","guessahss":"AHS - Size / Packaging","guesslps":"LPS","caseapply":"Load Case","actfeed":"Feed the animals","actvisit":"Will Call pickup","actstart":"Start the shift","actlunch":"Meal break","actcount":"Cycle count","acthand":"Shift handover","actwrap":"Wrap it up","actscrap":"Animals tussle","actbreak":"Water break","actmeet":"Floor meeting","actboss":"Boss's rounds","actclean":"Clean the litter box","actmop":"Call the cleaner","actdog":"Pet the animals","actscold":"Boss lays into the crew","actwc":"Bathroom break","tzpick":"Warehouse clock","dockhint":"The dog, the cat, the food bowls, the water bowl, the litter tray, the forklift, the label bench and the scanner all respond to a click; click a food bowl and both animals come to eat, click the water bowl and they come for a drink, click the litter tray and somebody comes to scoop, double-click and they come over to you.","sfxon":"🔊 Sound: on","sfxoff":"🔇 Sound: off (muted)","sfxnote":"This switch covers all five tabs, not just this scene.","tload":"Pallet build to trailer load: one line","tlnote":"Past a certain volume the cartons stop travelling one at a time. At that point the freight goes on pallets and a truck comes for it, and it is priced on a completely different basis from parcels. This card is the build itself: cartons come off the line and go onto a deck course by course, then the stack is wrapped and labelled.","tlflow":"Picked cartons  →  build the courses (heavy low, flush to the edge)  →  wrap down to the deck  →  measure height and weight  →  label all four faces  →  move to staging","tship":"2. Loading the trailer","tshipnote":"The second half of the same line. The pallet is built; what is left is getting it aboard. The work here is routes and paperwork rather than hands: a fork truck runs the pallets out of staging and into the trailer with somebody spotting at the door, the trailer closes when it is full, and the bill of lading and the delivery slot have to be in place before the truck ever arrives.","tshipflow":"Staging  →  fork truck picks up  →  into the trailer (heavy forward, no gaps)  →  doors down  →  check the BOL, photograph the load  →  away on the booked slot","fba":"Into FBA: choosing between SPD and LTL/FTL","fbanote":"There are two ways into an Amazon building: carton by carton as small parcels (SPD), or palletised on a freight carrier (LTL or FTL). They are not two prices for the same thing -- the labels differ, the appointment rules differ, and they fail in different ways.","fbawarn":"What is written here is the shape of the process, not Amazon’s current rules. Pallet heights, weights, label formats and the way appointments are booked all get revised; the shipping and routing requirements in Seller Central are what govern. Prices come from three live quotes, never from this card.","tllimit":"The limits (general figures, not contract terms)","tlwarn":"Every figure above is a general one. What governs is the receiving building's current documentation and your own contract: the FBA height and weight limits are revised, freight class and fuel are the carrier's own, and what a 53 ft trailer can actually carry depends on the tare weight of the tractor and trailer under it. This section teaches the shape of the job; it is not a quoting source. For a real shipment, put three quotes side by side.","tlpick":"Jump to a stage:","tlbuild":"Start a pallet","tlwrap":"Wrap and label","tlstage":"Push to staging","tltruck":"Fill and dispatch","rmapick":"Assign the next disposition as:","rmab0":"Restock","rmab1":"Rework","rmab2":"Quarantine","rmab3":"Scrap","cspick":"Call up a sequence:","csctruck":"Next trailer","cscdog":"Stray dog","cscnight":"Patrol","gspick":"Set what the next parcel measures:","gsok":"Ordinary","gswatch":"AHS borderline","gsover":"Over limits","dlvpick":"Last mile: residential or commercial","dlvhouse":"Residential","dlvshop":"Commercial","rma":"RMA Returns: Disposition and Put-away","rmanote":"Until a disposition has been recorded, a return is not inventory; it is goods of unknown sellable status. This area keeps them separate from sellable locations. Each piece is scanned against its RMA, registered, opened, and verified, and is then assigned to one of four dispositions. An incorrect disposition does not cost one unit. It costs the second return and the platform performance penalty that follow when a defective unit is returned to sale.","rmaflow":"Return received  →  scan the RMA, photograph, register  →  open and verify item and quantity  →  assign disposition (restock / rework / quarantine / scrap)  →  update the platform and the WMS","rmawarn":"Disposition is a trained function, not a decision made in passing by picking staff. Storage accrues on quarantined and scrap stock for the entire time it is held, and a growing quarantine area is the most common hidden storage charge in the building. Return policies and sellable criteria differ by platform; the client contract and the platform's current rules govern.","prep":"Prep and Forward: Inbound to FBA and Walmart","prepnote":"Shipping to consumers is not the only route. Cross-border sellers very often send a bulk shipment to our warehouse first, and we receive it, inspect it, relabel, repack and palletize before sending it on into Amazon's or Walmart's own fulfillment network, where the platform ships it to the buyer. This leg is called prep and forward.","prepflow":"Factory / seller  →  3PL warehouse (receive · label · repack · palletize)  →  Amazon FBA / Walmart WFS  →  platform ships to the buyer","prepwarn":"What goes wrong here is labels and appointments, not freight. A wrong label, a missing carton label, an overweight carton without a team-lift label, an unbooked slot -- any one of them can get the whole shipment refused, and sending it back costs far more than the freight did.","whatis":"Scope of Third-Party Logistics","whatisnote":"3PL stands for third-party logistics. The seller is relieved of leasing warehouse space, employing picking and packing staff, and dealing with carriers directly. Goods are consigned to our facility and all subsequent handling is performed on the seller’s behalf.","flow":"Seller / client  →  3PL warehouse (receiving · stock · shipping)  →  Carrier: UPS / FedEx / USPS  →  Buyer","jobs":"Warehouse Roles","manuals":"Staff manual","carrier":"Carrier","carrierpick":"Carrier","servicepick":"Service","carrier_ups":"UPS -- the workhorse for US domestic parcels. Cost follows five things: service, zone, billable weight, address type and surcharges.","carrier_fedex":"FedEx -- Ground and Express run as two networks, and Ground splits again into Ground for businesses and Home Delivery for homes. Its surcharge names are its own, and remote areas count on the pickup side as well as the destination. See the FedEx billing guide.","carrier_usps":"USPS -- the postal service, and the furthest from the other two: no residential surcharge, no delivery area surcharge, a 70 lb ceiling, and postage paid up front rather than invoiced. Since April 2026 it does charge fuel: a flat 8% running to 2027-01-17, rather than a figure that moves weekly. PO Boxes and military addresses are USPS-only. See the USPS guide.","package":"Package Info","address":"Address Type","commercial":"Commercial","residential":"Residential","from":"From ZIP Code","to":"To ZIP Code","zone":"Zone","zonehelp":"Filled in automatically once both ZIPs are complete.","zoneimport":"Import zone chart","zoneimportnote":"Download the UPS zone chart from the link above and import it here. It goes into the local cache, and this origin resolves offline from then on.","feegloss":"Warehouse Charges","feeglossnote":"The other half of the invoice. Freight is charged by the carrier; the items below are charged by the warehouse, and staff generally encounter them well before they encounter AHS. Each entry states the operation being paid for. Amounts are omitted deliberately: every 3PL prices its own, and a figure shown here would be read as a market rate.","manzh":"Staff manual (Chinese PDF)","manen":"Staff manual (English PDF)","manes":"Staff manual (Spanish PDF)","rateload":"Load a rate table (CSV)","ratelodnote":"The built-in grid is a demonstration set, not any carrier’s published price. To rate at real money, save the published or contracted table as CSV and load it: first row zone numbers, every later row starting with a weight.","rateexport":"Export / template (CSV)","zoneimp":"Import lanes (CSV)","zoneexp":"Export / template","zonebooknote":"Columns are origin_zip, dest_zip, zone, das_tier; the tier may be left blank. Export writes the lanes already recorded in the same format, or a worked example when the book is still empty.","lgnote":"Every threshold below is measured the same way. Sort the three sides largest first: longest, second, third. Length + girth = longest + 2 x (second + third). The field called Length is not necessarily the longest side, so the sort comes first. Cube is the three sides multiplied; one cubic foot is 1,728 in³.","maint":"Maintenance","advanced":"Show advanced thresholds (size detail, DIM triggers, size ceilings)","profile":"Rule set","profileload":"Load","profilesave":"Save current","selftest":"Run self-test","selftestnote":"Runs five checked cases through the engine and compares billable weight and total. Press it after editing a threshold or a rate.","units":"Input units","unit_imp":"Imperial (in / lb)","unit_met":"Metric (cm / kg)","weight":"Weight (lb)","length":"Length (in)","width":"Width (in)","height":"Height (in)","signature":"Signature","dastier":"Remote area surcharge","das_none":"None (not on any remote list)","das_das":"DAS - standard","das_edas":"Extended DAS","das_ras":"RAS - remote / island","ahspack":"Packaging (not fully encased in corrugated cardboard: tires, soft packs, wood crates)","nstdcard":"Nonstandard Fee","nstdnote":"USPS levies a nonstandard fee on parcels that are excessively long or bulky. It is assessed on length and cube alone; weight is not considered. The three rules below are judged separately, and a parcel is charged for each one it triggers.","nstdl1":"Longest side threshold (in)","nstdl2":"Higher longest side threshold (in)","nstdcu":"Cube threshold (in3)","nstdfeecard":"Nonstandard fee amounts","nstdfeenote":"The amounts are illustrative; set them from the current USPS price list. The thresholds that trigger them are on the Rule Setup tab.","nstdf1":"First step, add ($)","nstdf2":"Second step, add ($)","nstdfc":"Over the cube threshold, add ($)","nstdeg":"For example: a 40-inch pole weighing three pounds trips both length rules, so $22. If the box is also over two cubic feet, another $30.\nThe thresholds (22 / 30 / 3456) are the published rule; the amounts are illustrative -- set them from the current USPS price list.","rulesnote":"This page sets the billable weight of a parcel. Freight is charged on the billable weight rather than on the scale reading; the four groups of rules below are the procedure that converts one into the other.\n    1. DIM divisor: converts volume into a weight\n    2. Conditions for dimensional weight: whether it applies to this parcel\n    3. Minimum billable weight: the floor imposed once certain surcharges apply\n    4. Size and weight limits: past these the item has to move as freight (see Parcel Size and Weight Limits below)","divisorhelp":"Vehicle capacity is fixed, and a bulky but light parcel occupies its space regardless of what it weighs, so the volume it takes up is converted into a weight for pricing. The calculation is length x width x height divided by this number; the smaller the divisor, the greater the resulting weight and the higher the charge.","minnote":"A minimum billable weight means that once a parcel triggers certain surcharges it is rated at a floor weight, however light it actually is.\nA 12 lb box that triggers AHS by size is rated at 40 lb; one that triggers LPS is rated at 90 lb.\nThis is a weight rule rather than a charge. It carries no line of its own on the invoice and is visible only as a billable weight that does not match the scale.","ahsnote":"AHS is the charge for an awkward parcel. A hub runs on conveyors: a parcel goes on the belt, gets scanned and sorted, and nobody touches it. Some things cannot ride the belt and have to be moved by hand, and this charge pays for that.\nEach box below is a threshold, and any single one being exceeded is enough. All of them are strictly greater than -- landing exactly on the number does not trigger it.","lpsnote":"LPS is the tier above AHS, roughly five times the amount.\nWhere LPS applies, AHS does not -- not both. LPS is already the severe grade and it absorbs the milder one.\nAgain each box is a threshold, and one is enough.","rules":"Billable Weight Rules","divisor":"DIM Divisor","dimcube":"Cube must exceed","dimzone":"in3, AND the zone must reach this, before DIM counts:","dimnote":"These two boxes ask one question: does this parcel get dimensional weight at all?\n    0 = no condition, every parcel gets it. That is UPS and FedEx.\n    A number = both conditions must hold first. That is USPS (1728 and 5).\n\nOne box makes it clear -- 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb:\n    UPS (0, 0)              no condition -> DIM applies -> billed 22 lb\n    USPS to zone 7          cube and zone both pass -> DIM applies -> billed 22 lb\n    USPS to zone 3          zone below 5 -> no DIM -> billed 10 lb\n    USPS, small box (480 in3)   cube under 1728 -> no DIM -> actual weight\n\nThe gap is large: the same box billed at 10 lb going near and 22 lb going far.","usemin":"Use Minimum Billable Weight","ahsmin":"AHS Minimum Weight (lb)","lpsmin":"LPS Minimum Weight (lb)","balloonlg":"Big but light: length + girth over","balloonmin":"in, bill at least (lb):","balloonnote":"Where a parcel is large in dimension but light in weight, USPS does not rate it on actual weight. Past the threshold a floor weight applies. It is unrelated to surcharges and is a weight rule.\nUSPS calls it balloon pricing, which is the term you will see on the invoice and in postal notices.","ahs":"Additional Handling Rules","autoahs":"Check AHS Automatically","ahsw":"Weight Over (lb)","ahsl":"Longest Side Over (in)","ahss":"Second Side Over (in)","ahsg":"Length + Girth Over (in)","ahscu":"Cubic Volume Over (in3)","lps":"Large Package Rules","autolps":"Check LPS Automatically","lpsw":"Weight Over (lb)","lpsl":"Longest Side Over (in)","lpsg":"Length + Girth Over (in)","lpscu":"Cubic Volume Over (in3)","omax":"Parcel Size and Weight Limits","maxw":"Maximum Weight (lb)","maxl":"Maximum Longest Side (in)","maxlg":"Maximum Length + Girth (in)","omaxon":"Ship over limit anyway and charge Over Maximum Limits","omaxfee":"Over Maximum Limits (per package)","pkomax":"Demand - Over Maximum Limits ($)","omaxnote":"These three values follow the carrier and service selected above, so the figures shown are the limits that apply to the current selection. Exceed any one of them and the item is no longer a parcel and must move as freight. Tendered anyway, it may be returned or charged at a substantial penalty.","base":"Base Transportation","baseintro":"Billable weight + zone, looked up here. One row per pound, up to 150 lb.","zonefees":"Zone-Dependent Surcharges","zonefeenote":"AHS and LPS price in four zone bands. Edit any cell and the calculation uses yours. Demo figures -- check the contract for real work.","f_ahs_w":"AHS - Weight","f_ahs_s":"AHS - Size","f_ahs_p":"AHS - Packaging","f_lps_c":"LPS - Commercial","f_lps_r":"LPS - Residential","fees":"Flat Surcharges","dascom":"DAS - commercial ($)","dasres":"DAS - residential ($)","edascom":"Extended DAS - commercial ($)","edasres":"Extended DAS - residential ($)","rascom":"RAS - commercial ($)","rasres":"RAS - residential ($)","sigfee":"Signature Fee ($)","ressur":"Residential Surcharge ($)","fuel":"Fuel (%)","feenote":"Set these to your contract. Remote areas come in three tiers -- whichever list the destination ZIP sits on is the one charged, only ever one per shipment, and residential is always dearer than commercial. None of the three has anything to do with the zone.\nThe residential surcharge and DAS residential are two different charges carrying two different amounts: one asks whether it is a home, the other whether the ZIP is on the remote list.","peak":"Peak season pricing (demand surcharge)","peakhelp":"Tick this and the quote adds the demand surcharge. It is peak-season only, roughly October to January; outside that window there is no such charge. The amounts sit on the rates tab.","peakcard":"Demand Surcharge Amounts","peaknote":"Demand applies only during peak season, roughly October to January. Outside that window it does not appear.\nIt is never a line of its own: it rides on an existing surcharge and is billed as Demand - Residential Delivery Charge. Two residential lines on one shipment differing only by the word Demand are not double billing.\nThe amounts below are demonstration values. Real ones are published annually, banded by volume, and included in the fuel basis.","peakon":"Include Demand in this quote (off by default)","pkres":"Demand - Residential ($)","pkahs":"Demand - Additional Handling ($)","pklps":"Demand - Large Package ($)","fuelcard":"Fuel Surcharge","fuelnote":"Fuel changes every Monday, on separate tables for ground and air. The button opens that carrier's own fuel page, where the week's percentage is published; read it and type it in above. The tool also tries to fetch it in the background, and lists what it finds below.","fuelfetch":"Open the fuel page","fuellink":"The fuel page, updated every Monday","fuelcol_date":"Effective","fuelcol_g":"Ground %","fuelcol_a":"Air %","result":"Calculation Result","calc":"Calculate","recalc":"Calculate Again","lang":"Language","footer":"Internal Training Use Only  •  Developed by Sandy Liu","yes":"Yes","no":"No","none":"None","error":"Please Check","unexpected":"Something Went Wrong"},"es":{"title":"Animated Warehouse","sub":"Formación en logística 3PL","tabs":["1. Almacén","2. Transportista y paquete","3. Reglas","4. Tarifas y recargos","5. Resultado"],"lvtabs":["Capítulo 1 · Operativa de almacén","Capítulo 2 · Preparación y tarifas de almacenaje","Capítulo 3 · Paletizado y carga"],"mission":"Caso de práctica","missionhelp":"Elige un caso y los datos se cargan solos. Puedes cambiar lo que quieras.","guess":"Tu pronóstico: ¿cuál será el resultado principal?","casebasic":"Paquete normal","casedim":"Trampa de peso volumétrico","caseahsw":"AHS - Peso","caseahss":"AHS - Tamaño","caselps":"Paquete grande (LPS)","casemixed":"Varias condiciones de AHS","guessnone":"Sin recargo especial","guessahsw":"AHS - Peso","guessahss":"AHS - Tamaño / Embalaje","guesslps":"LPS","caseapply":"Cargar caso","actfeed":"Dar de comer","actvisit":"Recogida Will Call","actstart":"Iniciar el turno","actlunch":"Hora de comer","actcount":"Conteo cíclico","acthand":"Relevo de turno","actwrap":"Cerrar la jornada","actscrap":"Perro y gato alborotan","actbreak":"Ir por agua","actmeet":"Reunión en el piso","actboss":"Ronda del jefe","actclean":"Limpiar arenero","actmop":"Llamar a la limpieza","actdog":"Acariciar animales","actscold":"El jefe los regaña","actwc":"Ir al baño","tzpick":"Reloj del almacén","dockhint":"El perro, el gato, los platos de comida, el bebedero, el montacargas, la mesa de etiquetado y el escáner responden al clic; haz clic en un plato y los dos animales vienen a comer, haz clic en el bebedero y vienen a beber, y con doble clic se te acercan.","sfxon":"🔊 Sonido: activado","sfxoff":"🔇 Sonido: desactivado (silencio)","sfxnote":"Este control aplica a las cinco pestañas, no solo a esta escena.","tload":"1. Armar la tarima","tlnote":"A partir de cierto volumen ya no se entregan cajas una por una. La mercancía va en tarimas y la recoge una línea de carga, y la tarificación no se parece en nada a la de paquetería. Esta tarjeta es el armado: las cajas bajan de la línea, se acomodan en camas sobre la tarima, se emplayan y se etiquetan.","tlflow":"Cajas surtidas  →  armar las camas (lo pesado abajo, al ras del borde)  →  emplayar hasta la base  →  medir altura y peso  →  etiquetar las cuatro caras  →  pasar a la zona de salida","tship":"2. Cargar el remolque","tshipnote":"La tarima ya está armada; falta subirla. Aquí lo importante no son las manos sino el recorrido y los documentos: el montacargas saca las tarimas de la zona de salida y las mete al remolque con alguien dirigiendo en la puerta, se cierra cuando está lleno, y el BOL y la cita tienen que estar listos antes de que llegue el camión.","tshipflow":"Zona de salida  →  el montacargas levanta  →  al remolque (lo pesado adelante, sin huecos)  →  cerrar puertas  →  revisar el BOL y fotografiar  →  salida en la cita reservada","fba":"Entrada a FBA: elegir entre SPD y LTL/FTL","fbanote":"Hay dos maneras de entrar a una bodega de Amazon: caja por caja como paquetería (SPD), o paletizado con una línea de carga (LTL o FTL). No son dos precios de lo mismo: cambian las etiquetas, cambian las reglas de cita y fallan de maneras distintas.","fbawarn":"Aquí está la forma del proceso, no las reglas vigentes de Amazon. Las alturas, los pesos, los formatos de etiqueta y la manera de reservar cita se revisan cada año; lo que manda son los requisitos de envío y ruteo de Seller Central. Los precios salen de tres cotizaciones reales, nunca de esta tarjeta.","tllimit":"Los límites (valores generales, no términos de contrato)","tlwarn":"Cada cifra de arriba es general. Lo que manda es la documentación vigente del almacén receptor y tu propio contrato: los límites de altura y peso de FBA se revisan, la clase de flete y el combustible son del transportista, y lo que realmente carga un remolque de 53 pies depende de la tara del tractor y del remolque. Esta sección enseña la forma del trabajo; no es una fuente de cotización. Para un embarque real, compara tres cotizaciones.","tlpick":"Ir a una etapa:","tlbuild":"Empezar tarima","tlwrap":"Emplayar y etiquetar","tlstage":"Pasar a salida","tltruck":"Llenar y despachar","rmapick":"Clasificar el siguiente como:","rmab0":"Reubicar","rmab1":"Reacond.","rmab2":"Cuarentena","rmab3":"Desecho","cspick":"Llamar una secuencia:","csctruck":"Siguiente remolque","cscdog":"Perro callejero","cscnight":"Ronda","gspick":"Fijar la medida del siguiente:","gsok":"Normal","gswatch":"Límite AHS","gsover":"Fuera de límites","dlvpick":"Última milla: residencial o comercial","dlvhouse":"Residencial","dlvshop":"Comercial","rma":"Zona de devoluciones RMA: clasificar y guardar","rmanote":"Hasta que se clasifica, una devolución no es inventario: es mercancía de la que nadie sabe si se puede vender. Esta zona la mantiene fuera de las ubicaciones vendibles: cada pieza se escanea contra su RMA, se registra, se abre y se coteja, y después se clasifica hacia uno de cuatro destinos. Clasificar mal no cuesta un artículo; cuesta la segunda devolución y la métrica de la plataforma.","rmaflow":"Llega la devolución  →  escanear el RMA, fotografiar, registrar  →  abrir y cotejar artículo y cantidad  →  clasificar (reubicar / reacondicionar / cuarentena / desecho)  →  actualizar la plataforma y el WMS","rmawarn":"La clasificación es trabajo de personal capacitado, no algo que decide de paso quien surte. El almacenaje sigue corriendo sobre la mercancía en cuarentena y en desecho, y una zona de cuarentena que crece es el costo oculto de almacenaje más común. Las políticas de devolución cambian por plataforma; manda el contrato del cliente y la regla vigente.","prep":"Preparación y reenvío: entrada a FBA y Walmart","prepnote":"Enviar al consumidor no es la única ruta. Los vendedores transfronterizos mandan muy seguido un embarque completo primero a nuestro almacén, y nosotros lo recibimos, lo revisamos, lo reetiquetamos, lo reempacamos y lo paletizamos antes de mandarlo a la red de Amazon o de Walmart, donde la plataforma lo envía al comprador. A este tramo se le llama preparación y reenvío (prep and forward).","prepflow":"Fábrica / vendedor  →  Almacén 3PL (recibo · etiquetado · reempaque · paletizado)  →  Amazon FBA / Walmart WFS  →  la plataforma envía al comprador","prepwarn":"Aquí lo que falla son las etiquetas y las citas, no el flete. Una etiqueta equivocada, una caja sin etiqueta, una caja con sobrepeso sin etiqueta de Team Lift, una cita no reservada: cualquiera de ellas puede hacer que rechacen el embarque completo, y devolverlo cuesta mucho más que el flete.","whatis":"Ámbito de la logística de terceros","whatisnote":"3PL significa logística de terceros. El vendedor queda relevado de arrendar bodega, emplear personal de surtido y empaque, y tratar directamente con los transportistas. La mercancía se consigna a nuestras instalaciones y todo el manejo posterior se realiza por cuenta del vendedor.","flow":"Vendedor / cliente  →  Almacén 3PL (recibo · inventario · envío)  →  Transportista: UPS / FedEx / USPS  →  Comprador","jobs":"Puestos de operación en almacén","manuals":"Manual del personal","carrier":"Transportista","carrierpick":"Transportista","servicepick":"Servicio","carrier_ups":"UPS: el caballo de batalla de la paquetería nacional en Estados Unidos. El costo lo deciden cinco cosas: el servicio, la zona, el peso facturable, el tipo de dirección y los recargos.","carrier_fedex":"FedEx: Ground y Express son dos redes distintas, y Ground se divide a su vez en Ground (para empresas) y Home Delivery (para domicilios). Los nombres de sus recargos son propios, y las zonas remotas cuentan tanto en la recolección como en el destino. Consulta la guía de facturación de FedEx.","carrier_usps":"USPS: el servicio postal, y el más distinto de los tres: sin recargo de combustible, sin recargo residencial, tope de 70 lb, y el franqueo se paga por adelantado en lugar de facturarse. Los apartados postales y las direcciones militares solo los cubre USPS. Consulta la guía de USPS.","package":"Datos del paquete","address":"Tipo de dirección","commercial":"Comercial","residential":"Residencial","from":"Código postal de origen","to":"Código postal de destino","zone":"Zona","zonehelp":"Se llena solo en cuanto los dos códigos postales estén completos.","zoneimport":"Importar tabla de zonas","zoneimportnote":"Descarga la tabla de zonas de UPS desde el enlace de arriba e impórtala aquí. Se guarda en la memoria local y desde entonces este origen se resuelve sin conexión.","feegloss":"Cargos por operación de almacén","feeglossnote":"La otra mitad de la factura. El flete lo cobra el transportista; los conceptos siguientes los cobra el almacén, y el personal suele encontrarlos bastante antes que el AHS. Cada entrada indica la operación que se está pagando. Los importes se omiten de forma deliberada: cada 3PL fija los suyos, y una cifra aquí se interpretaría como precio de mercado.","manzh":"Manual del personal (PDF en chino)","manen":"Manual del personal (PDF en inglés)","manes":"Manual del personal (PDF en español)","rateload":"Cargar tabla de tarifas (CSV)","ratelodnote":"La tabla incluida es una muestra de demostración, no el precio publicado de ningún transportista. Para cotizar con dinero real, guarda la tabla publicada o contratada como CSV y cárgala: la primera fila lleva los números de zona y cada fila siguiente empieza con un peso.","rateexport":"Exportar / plantilla (CSV)","zoneimp":"Importar rutas (CSV)","zoneexp":"Exportar / plantilla","zonebooknote":"Las columnas son origin_zip, dest_zip, zone, das_tier; el nivel puede quedar en blanco. Exportar escribe las rutas ya registradas en el mismo formato, o un ejemplo resuelto cuando todavía no hay ninguna.","lgnote":"Todos los umbrales de abajo se miden igual. Ordena los tres lados de mayor a menor: el más largo, el segundo y el tercero. Largo + contorno = el más largo + 2 × (segundo + tercero). El campo que se llama Largo no es necesariamente el lado más largo, así que primero se ordena. El volumen es el producto de los tres lados; un pie cúbico son 1,728 in³.","maint":"Mantenimiento","advanced":"Mostrar umbrales avanzados (detalle de tamaño, disparadores de volumétrico, topes de tamaño)","profile":"Juego de reglas","profileload":"Cargar","profilesave":"Guardar el actual","selftest":"Ejecutar autoprueba","selftestnote":"Pasa cinco casos ya verificados por el motor y compara el peso facturable y el total. Presiónalo después de editar un umbral o una tarifa.","units":"Unidades de entrada","unit_imp":"Imperial (in / lb)","unit_met":"Métrico (cm / kg)","weight":"Peso (lb)","length":"Largo (in)","width":"Ancho (in)","height":"Alto (in)","signature":"Firma","dastier":"Recargo por zona remota","das_none":"Ninguno (no está en ninguna lista remota)","das_das":"DAS - estándar","das_edas":"Extended DAS","das_ras":"RAS - remota / isla","ahspack":"Embalaje (no va totalmente cubierto de cartón corrugado: llantas, bolsas flexibles, huacales de madera)","nstdcard":"Cargo por tamaño no estándar","nstdnote":"USPS aplica un cargo por tamaño no estándar a los paquetes excesivamente largos o voluminosos. Se determina solo por largo y volumen; el peso no se toma en cuenta. Las tres reglas de abajo se evalúan por separado, y el paquete paga por cada una que active.","nstdl1":"Umbral del lado más largo (in)","nstdl2":"Umbral superior del lado más largo (in)","nstdcu":"Umbral de volumen (in³)","nstdfeecard":"Importes del cargo por tamaño no estándar","nstdfeenote":"Los importes son ilustrativos; ajústalos según la lista de precios vigente de USPS. Los umbrales que los activan están en la pestaña de Reglas.","nstdf1":"Primer tramo, agregar ($)","nstdf2":"Segundo tramo, agregar ($)","nstdfc":"Sobre el umbral de volumen, agregar ($)","nstdeg":"Por ejemplo: una barra de 40 pulgadas que pesa tres libras activa las dos reglas de largo, o sea $22. Si además la caja pasa de dos pies cúbicos, otros $30.\nLos umbrales (22 / 30 / 3456) son la regla publicada; los importes son ilustrativos: ajústalos según la lista de precios vigente de USPS.","rulesnote":"Esta página fija el peso facturable de un paquete. El flete se cobra sobre el peso facturable y no sobre lo que marca la báscula; los cuatro grupos de reglas de abajo son el procedimiento que convierte uno en el otro.\n    1. Divisor volumétrico: convierte el volumen en peso\n    2. Condiciones del peso volumétrico: si aplica o no a este paquete\n    3. Peso facturable mínimo: el piso que se impone cuando aplican ciertos recargos\n    4. Límites de tamaño y peso: pasados estos el artículo tiene que ir como carga (ver Límites de tamaño y peso del paquete más abajo)","divisorhelp":"La capacidad del vehículo es fija, y un paquete voluminoso pero ligero ocupa su espacio sin importar lo que pese, así que el volumen que ocupa se convierte en peso para cobrarlo. El cálculo es largo × ancho × alto entre este número; mientras más chico el divisor, mayor el peso resultante y más alto el cargo.","minnote":"Un peso facturable mínimo significa que, en cuanto un paquete activa ciertos recargos, se cobra a un peso piso por muy ligero que sea en realidad.\nUna caja de 12 lb que activa AHS por tamaño se cobra a 40 lb; una que activa LPS se cobra a 90 lb.\nEsto es una regla de peso, no un cargo. No lleva renglón propio en la factura y solo se nota como un peso facturable que no cuadra con la báscula.","ahsnote":"AHS es el cargo por un paquete incómodo. Un centro de distribución funciona con bandas: el paquete se sube a la banda, se escanea y se clasifica, y nadie lo toca. Algunas cosas no pueden ir en la banda y hay que moverlas a mano, y este cargo paga eso.\nCada casilla de abajo es un umbral, y basta con que una sola se rebase. Todas son estrictamente mayor que: quedar justo en el número no lo activa.","lpsnote":"LPS es el nivel arriba de AHS, más o menos cinco veces el importe.\nDonde aplica LPS, no aplica AHS: no se cobran los dos. LPS ya es el grado severo y absorbe al leve.\nOtra vez, cada casilla es un umbral y con una basta.","rules":"Reglas del peso facturable","divisor":"Divisor volumétrico","dimcube":"El volumen debe pasar de","dimzone":"in³, Y la zona debe llegar a esto, antes de que cuente el volumétrico:","dimnote":"Estas dos casillas contestan una sola pregunta: ¿este paquete lleva peso volumétrico o no?\n    0 = sin condición, todos los paquetes lo llevan. Así son UPS y FedEx.\n    Un número = las dos condiciones deben cumplirse primero. Así es USPS (1728 y 5).\n\nUna sola caja lo deja claro: 20 × 15 × 10 in, 3,000 in³, peso real 10 lb:\n    UPS (0, 0)                   sin condición → aplica volumétrico → se cobran 22 lb\n    USPS a la zona 7             volumen y zona pasan → aplica volumétrico → se cobran 22 lb\n    USPS a la zona 3             zona menor a 5 → no aplica → se cobran 10 lb\n    USPS, caja chica (480 in³)   volumen bajo 1728 → no aplica → peso real\n\nLa diferencia es grande: la misma caja cobrada a 10 lb yendo cerca y a 22 lb yendo lejos.","usemin":"Aplicar el peso facturable mínimo","ahsmin":"Peso mínimo de AHS (lb)","lpsmin":"Peso mínimo de LPS (lb)","balloonlg":"Grande pero ligero: largo + contorno arriba de","balloonmin":"in, cobrar al menos (lb):","balloonnote":"Cuando un paquete es grande de dimensiones pero ligero de peso, USPS no lo cobra por peso real. Pasado el umbral aplica un peso piso. No tiene relación con los recargos y es una regla de peso.\nUSPS le llama balloon pricing, y así aparece en la factura y en los avisos postales.","ahs":"Reglas de manejo adicional (AHS)","autoahs":"Revisar AHS automáticamente","ahsw":"Peso mayor a (lb)","ahsl":"Lado más largo mayor a (in)","ahss":"Segundo lado mayor a (in)","ahsg":"Largo + contorno mayor a (in)","ahscu":"Volumen mayor a (in³)","lps":"Reglas de paquete grande (LPS)","autolps":"Revisar LPS automáticamente","lpsw":"Peso mayor a (lb)","lpsl":"Lado más largo mayor a (in)","lpsg":"Largo + contorno mayor a (in)","lpscu":"Volumen mayor a (in³)","omax":"Límites de tamaño y peso del paquete","maxw":"Peso máximo (lb)","maxl":"Lado más largo máximo (in)","maxlg":"Largo + contorno máximo (in)","omaxon":"Enviar fuera de límite y cobrar Over Maximum Limits","omaxfee":"Over Maximum Limits (por paquete)","pkomax":"Demand - Over Maximum Limits ($)","omaxnote":"Estos tres valores siguen al transportista y al servicio elegidos arriba, así que las cifras mostradas son los límites que aplican a la selección actual. Si se rebasa cualquiera de ellos, el artículo deja de ser paquete y tiene que moverse como carga. Si aun así se entrega, puede devolverse o cobrarse con una penalización fuerte.","base":"Flete base","baseintro":"Peso facturable + zona, se busca aquí. Un renglón por libra, hasta 150 lb.","zonefees":"Recargos que dependen de la zona","zonefeenote":"AHS y LPS cobran en cuatro bandas de zona. Edita cualquier celda y el cálculo usa la tuya. Son cifras de demostración: para trabajo real, revisa el contrato.","f_ahs_w":"AHS - Peso","f_ahs_s":"AHS - Tamaño","f_ahs_p":"AHS - Embalaje","f_lps_c":"LPS - Comercial","f_lps_r":"LPS - Residencial","fees":"Recargos de importe fijo","dascom":"DAS - comercial ($)","dasres":"DAS - residencial ($)","edascom":"Extended DAS - comercial ($)","edasres":"Extended DAS - residencial ($)","rascom":"RAS - comercial ($)","rasres":"RAS - residencial ($)","sigfee":"Cargo por firma ($)","ressur":"Recargo residencial ($)","fuel":"Combustible (%)","feenote":"Ajústalos a tu contrato. Las zonas remotas vienen en tres niveles: se cobra el de la lista donde caiga el código postal de destino, nunca más de uno por envío, y residencial siempre sale más caro que comercial. Ninguno de los tres tiene que ver con la zona.\nEl recargo residencial y el DAS residencial son dos cargos distintos con dos importes distintos: uno pregunta si es domicilio, el otro si el código postal está en la lista remota.","peak":"Precio de temporada alta (recargo por demanda)","peakhelp":"Al marcar esta casilla, la cotización suma el recargo por demanda. Solo existe en temporada alta, de octubre a enero aproximadamente; fuera de esa ventana no hay tal cargo. Los importes están en la pestaña de tarifas.","peakcard":"Importes del recargo por demanda","peaknote":"Demand solo aplica en temporada alta, aproximadamente de octubre a enero. Fuera de esa ventana no aparece.\nNunca es un renglón propio: va montado sobre un recargo existente y se factura como Demand - Residential Delivery Charge. Dos renglones residenciales en un mismo envío que solo se diferencian por la palabra Demand no son doble cobro.\nLos importes de abajo son de demostración. Los reales se publican cada año, se escalonan por volumen y entran en la base del combustible.","peakon":"Incluir Demand en esta cotización (desactivado por defecto)","pkres":"Demand - Residencial ($)","pkahs":"Demand - Manejo adicional ($)","pklps":"Demand - Paquete grande ($)","fuelcard":"Recargo por combustible","fuelnote":"El combustible cambia cada lunes, en tablas separadas para terrestre y aéreo. El botón abre la página de combustible del propio transportista, donde se publica el porcentaje de la semana; léelo y escríbelo arriba. La herramienta también intenta consultarlo en segundo plano y lista abajo lo que encuentre.","fuelfetch":"Abrir la página de combustible","fuellink":"La página de combustible, se actualiza cada lunes","fuelcol_date":"Vigencia","fuelcol_g":"Terrestre %","fuelcol_a":"Aéreo %","result":"Resultado del cálculo","calc":"Calcular","recalc":"Calcular de nuevo","lang":"Idioma","footer":"Internal Training Use Only  •  Developed by Sandy Liu","yes":"Sí","no":"No","none":"Ninguno","error":"Revisa los datos","unexpected":"Ocurrió un error"}},"JOBS":{"zh":[["收貨 / 上架","核對到貨的 SKU、數量、外箱狀況，然後把商品放到正確的庫位。這一步做錯，後面全部會錯。"],["庫存管理","記錄庫存數量、放在哪一格、可不可以賣。盤點和異常也在這裡處理。"],["訂單履約","接到訂單後揀貨、包裝、貼標、出貨，再將 Tracking 回傳給賣家系統。"],["退貨處理","確認退回來的東西狀況，決定重新上架、隔離、報廢還是退回客戶。"],["加工作業","換標、組裝、重新包裝這類客製需求，每個客戶要求都不一樣。"],["客服 / 系統","查訂單、庫存、配送狀態，處理 WMS、平台和物流商之間的資料。"],["中轉 / 備貨","把賣家的整批貨驗收、貼標、重新裝箱、打板，再送進 Amazon FBA 或 Walmart 的倉庫。"]],"en":[["Receiving","Check the arriving SKU, quantity and carton condition, then put the goods in the right location. Get this wrong and everything downstream is wrong."],["Inventory","Record how much is on hand, where it sits, and whether it is sellable. Cycle counts and discrepancies live here too."],["Fulfillment","Pick, pack, label and ship the order, then write the tracking number back."],["Returns","Inspect what came back and decide: restock, quarantine, scrap, or send it to the client."],["Value-added","Relabeling, kitting, repacking -- client-specific work, different for every account."],["Support","Check orders, stock and delivery status; move data between the WMS, the platforms and the carriers."],["Prep & forward","Receive a seller's bulk shipment, inspect it, relabel, repack, palletize, and send it on into an Amazon FBA or Walmart fulfillment center."]],"es":[["Recibo","Revisa el SKU, la cantidad y el estado de las cajas que llegan, y acomoda la mercancía en la ubicación correcta. Si esto sale mal, todo lo que viene después sale mal."],["Inventario","Registra cuánto hay, dónde está y si se puede vender. Los conteos cíclicos y las diferencias también viven aquí."],["Surtido y envío","Surte, empaca, etiqueta y envía el pedido, y después regresa el número de rastreo al sistema."],["Devoluciones","Revisa lo que regresó y decide: se resurte, se aparta, se destruye o se manda al cliente."],["Valor agregado","Reetiquetado, armado de kits, reempaque: trabajo específico de cada cliente, distinto en cada cuenta."],["Soporte y sistemas","Consulta pedidos, existencias y estado de entrega; mueve datos entre el WMS, las plataformas y los transportistas."],["Preparación y reenvío","Recibe el embarque completo de un vendedor, lo revisa, lo reetiqueta, lo reempaca, lo paletiza y lo manda a un centro de Amazon FBA o de Walmart."]]},"PREP":{"zh":[["Amazon FBA","最常見。要貼 FNSKU 商品標和外箱標，箱重和尺寸有上限，超過要貼 Team Lift。出貨計畫從 Seller Central 建，系統會指定送到哪一個 FC。"],["Walmart WFS","流程類似 FBA，但標籤格式和收貨要求是 Walmart 自己一套，不能拿亞馬遜的標直接用。"],["TikTok Shop","近年才起來的通路，倉庫和規則還在變，出貨前先確認當期文件。"],["整箱 vs 打板","量小走 SPD（一箱一箱交給 UPS／FedEx），量大走 LTL／FTL（打成棧板叫貨運）。兩者的成本結構完全不同。"],["預約進倉","LTL 進 FBA 要先預約時段，沒有預約或遲到，整車可能被退回。"]],"en":[["Amazon FBA","The common one. Every item needs an FNSKU label and every carton a box label; carton weight and size are capped, and over the limit a team-lift label is required. The shipment plan comes from Seller Central and names the destination center."],["Walmart WFS","Similar in shape to FBA, but the label formats and receiving requirements are Walmart's own -- Amazon labels do not transfer."],["TikTok Shop","A newer channel whose warehouses and rules are still moving; check the current documentation before shipping."],["Cartons vs pallets","Small volumes go SPD, carton by carton via UPS or FedEx. Large volumes go LTL or FTL on pallets. The cost structures are nothing alike."],["Delivery appointments","An LTL delivery into an FBA center needs a booked slot. Turn up without one, or late, and the whole trailer can be turned away."]],"es":[["Amazon FBA","El caso más común. Cada artículo necesita etiqueta FNSKU y cada caja su etiqueta de caja; el peso y el tamaño de la caja tienen tope, y pasando el límite se exige etiqueta de Team Lift. El plan de embarque sale de Seller Central y ahí se indica el centro de destino."],["Walmart WFS","Parecido a FBA en su forma, pero los formatos de etiqueta y los requisitos de recibo son propios de Walmart: las etiquetas de Amazon no sirven."],["TikTok Shop","Un canal nuevo cuyos almacenes y reglas siguen cambiando; revisa la documentación vigente antes de enviar."],["Cajas contra tarimas","Los volúmenes chicos van SPD, caja por caja con UPS o FedEx. Los volúmenes grandes van LTL o FTL en tarimas. Las estructuras de costo no se parecen en nada."],["Citas de entrega","Una entrega LTL a un centro de FBA necesita cita reservada. Llegar sin ella, o tarde, y pueden regresar el tráiler completo."]]},"RMA":{"zh":[["RMA 是什麼","Return Merchandise Authorization，退貨授權編號。沒有 RMA 的包裹到倉是無主件——查不出是誰的、哪一張單、該退款還是換貨。收貨端第一件事是刷 RMA，不是拆箱。"],["收件與建檔","刷 RMA、拍外箱狀況、記到貨日期。外箱破了或封條被開過的，拆箱前先拍照——之後要跟買家或運輸商吵，就只有這張照片能講話。"],["拆箱與比對","打開來對：東西、數量、序號跟 RMA 上寫的一不一樣。對不起來的就不要往下判，直接列成爭議件交給客服。"],["判定四類","① 良品重新上架 ② 需要整新加工（換標、換包裝、清潔）③ 隔離待判（疑似瑕疵、含電池、疑似仿品）④ 報廢。這個判定要受過訓的人做，不是揀貨的人順手決定。"],["入庫與扣帳","只有良品與整新完成者得回可售庫存，且須即時回寫平台與 WMS。所謂回寫，係指將庫存數量更新至銷售平台與倉儲系統。回寫延遲者，平台顯示之可售數量高於實際庫存，買家仍可下單，此即超賣。超賣之後果為取消訂單、退款、平台績效扣分，其損失遠高於該件商品之售價。"],["計費項目","退貨處理費通常按件計收，整新加工另依工時或材料計價。報廢品與隔離品在判定完成之前仍佔用庫位，倉租照常計收。此類成本不會另立名目，僅併入每月倉租，故稱隱形倉租——帳單上看不出它來自退貨。判定拖延越久，隔離區堆得越高，這筆金額也越大。"]],"en":[["Definition of an RMA","Return Merchandise Authorization. A parcel that arrives without one cannot be matched to an order, and no refund or replacement decision can be made. The first step at the returns bench is to scan the RMA, not to open the carton."],["Receiving and registration","Scan the RMA, photograph the outer carton, and record the arrival date. If the carton is damaged or the seal has already been broken, photograph it before opening. That photograph is the only evidence available in a later dispute with the buyer or the carrier."],["Inspection and verification","Verify the contents against the RMA: item, quantity, and serial number. A discrepancy is not passed on for disposition; it is referred to customer service as a disputed return."],["Disposition: four outcomes","1. Sellable, returned directly to available inventory. 2. Rework required, such as relabeling, repacking, or cleaning. 3. Quarantine, for a suspected defect, a battery, or a suspected counterfeit. 4. Scrap. Disposition must be performed by trained staff; it is not a decision a picker makes in passing."],["Put-away and system update","Only sellable and reworked stock returns to available inventory, and the platform and the WMS are updated at the same time. A delayed update leaves the platform displaying more stock than exists, which results in an oversell. The cost of an oversell exceeds the value of the item."],["Applicable charges","Returns handling is normally billed per piece, with rework billed separately as labor or materials. Storage continues to accrue on quarantined and scrap stock until a disposition is recorded. A growing quarantine area is the most common source of unexplained storage charges."]]},"TRUCKLOAD":{"zh":[["疊箱","重的放下面、輕的放上面，箱角對齊棧板邊。交錯疊（每層轉向）比較穩；直疊比較耐壓，外箱有標 ISTA 抗壓值的就直疊。"],["外突","箱子不可以超出棧板邊，沒有 2 in 的緩衝這種事：FBA 完全不給，LTL 承運人的條款也要求切齊，實務上建議往內縮 1 in 左右。凸出來的箱角是最先被撞到的地方；而且承運人量的是最外緣，凸出去等於整板變大，價錢跟著變。排不進 48 x 40 in 的話，就改排列方式，或換一個尺寸合的棧板。（另外有兩個常見的 2 in 規格：護角厚度至少 2 in、封箱膠帶寬度至少 2 in，跟外突無關，不要記混。）"],["纏膜","從下往上纏，最後收到棧板底座，讓貨跟板變成一件。底座至少繞三圈，頂層要壓過去。膜沒下到底座，車一開整疊就會位移。"],["標籤","每一板都要有 BOL 上的板號、收貨方、件數；進 FBA 還要貼板標，四面都貼。板標貼錯或少一面，收貨端可以直接拒收。"],["打完先量","板高、板重、最外緣尺寸，在推去待運區之前就要量完。到了月台才發現超高，就要拆掉重打。"]],"en":[["Stacking","Heavy at the bottom, light on top, carton corners flush with the pallet edge and nothing overhanging. Interlocked courses ride better; column stacking is stronger in compression, so where the carton carries an ISTA rating, stack in columns."],["Overhang","There is no two-inch allowance: FBA permits none at all, carrier tariffs ask for flush, and the practical target is an inch of underhang. A carton over the deck edge is the first corner anything hits, and the carrier measures to the outermost point, so the overhang enlarges the whole pallet and the rate with it. Change the pattern, or use a pallet sized for the goods."],["Wrapping","Wrap from the bottom up and take the film down onto the deck, so the load and the pallet become one object. Three turns round the base at least, and a turn over the top course. Film that never reached the deck lets the whole stack walk."],["Labels","Every pallet carries its number from the BOL, the consignee and the piece count. Into FBA it also carries pallet labels on all four sides. A wrong or missing label is grounds for the receiving dock to refuse it."],["Measure it here","Height, weight and the widest point, measured while the pallet is still on the build spot. Finding out at the dock that it is over height means stripping it and building it again."]]},"TRUCKLOAD_SHIP":{"zh":[["三種走法","SPD 是一箱一箱交給 UPS／FedEx，按件算。LTL 是打成棧板跟別人的貨共用車廂，按板數和貨物等級算。FTL 是包整台車，按趟算。量已經到了門檻卻沒換走法，運費可以差好幾倍。"],["何時應打板","現場的粗略分界：六板以內走 LTL，超過就評估 FTL；六箱以內而且單箱不重的，多半還是 SPD 划算。真的要決定就拿三家報價比，這個數字只能當初判。"],["裝車順序","先裝的放車廂最裡面，重的板靠車頭。板跟板之間不要留空隙；真的避不掉就用氣囊或木撐固定。沒固定的貨在路上一定會移動，一移動就會撞。"],["地面指揮","堆高機開進車廂的時候，駕駛看不到後面，門口一定要有人指揮，還要先確認拖車上了輪擋、月台鎖扣好了。裝載中拖車滑走是會死人的。"],["預約進倉","LTL／FTL 要進 FBA、Walmart 這種大型收貨點，一定要先拿到預約時段（ISA／carrier appointment）。沒預約或遲到，整車退回，重新排通常要等好幾天。"],["BOL 與存證","提單上的板數、件數、重量要跟車上實際的一樣，司機簽收前逐項對一遍。關門前拍一張全車照片；之後如果吵貨損，這張照片就是「東西上車時是好的」的主要證據。"]],"en":[["Three ways to ship","SPD hands cartons to UPS or FedEx one at a time and is priced per piece. LTL puts them on pallets sharing a trailer with other freight, priced by pallet count and freight class. FTL takes the whole trailer, priced by the run. Staying on the wrong one as volume grows costs multiples, not percentages."],["When to palletize","The rough line on the floor is LTL up to about six pallets and FTL beyond it, while six cartons or fewer of no great weight usually still go SPD. The real answer is three live quotes side by side, not this rule of thumb."],["Loading order","First in goes furthest forward, heavy toward the nose, and no gaps between pallets -- or fill them with airbags or bracing. Freight that can move will move, and moving freight hits something."],["Somebody on the ground","The driver cannot see behind the truck going into a trailer, so there is a spotter at the door. Check the wheel chocks and the dock lock first: a trailer rolling away mid-load kills people."],["Appointments","LTL and FTL into an FBA or Walmart building need a booked slot. Arrive without one, or late, and the trailer is turned away; a reschedule is usually days."],["BOL and proof","Pallet count, piece count and weight on the bill of lading have to match what is actually aboard; check them line by line before the driver signs. Photograph the load before the doors come down -- in a damage claim that photograph is the only thing that shows it left here intact."]]},"TRUCKLOAD_LIMITS":{"zh":[["標準棧板","北美 GMA 標準板 48 x 40 in（約 122 x 102 cm），四面進叉。歐規 EUR 板是 120 x 80 cm，兩者不通用。"],["堆疊高度","含棧板本身通常不超過 72 in（約 183 cm）；FBA 單層堆疊上限就是 72 in，可堆疊板另有規定。超高會被要求重打，或改成雙層計費。"],["單板重量","一般不超過 1,500 lb（約 680 kg）；FBA 多數收貨點上限 1,500 lb。地牛與電動拖板車的額定荷重也在這個量級。"],["外突容許","零。箱子不可以超出棧板邊，沒有 2 in 緩衝：FBA 完全不給，LTL 承運人條款要求切齊，實務上建議往內縮 1 in 左右。超出去，收貨端可以拒收，或者承運人用最外緣重新量、重新計價。"],["整車載重","53 呎乾櫃可裝 26 個 GMA 板（單層）或 52 個（雙層）。惟美國聯邦公路總重上限為 80,000 lb，扣除車頭與拖車自重後，貨重實務上約於 42,000-45,000 lb 達上限。先達重量上限或先達材積上限，視貨物密度而定。"],["材積重","LTL 是按 NMFC 貨物等級計價，等級看密度、易不易損、失竊風險和好不好裝。密度低於 6 lb/ft³ 等級就會往上跳，運費差很多；打板時把空隙壓掉，就是直接省錢。"],["不可疊放","標了 Do Not Stack 的板要加頂錐或錐帽，不然承運人還是會往上疊。壓壞了，舉證責任在託運人這邊——沒標，就等於你同意可以疊。"]],"en":[["Standard pallet","North America runs the GMA pallet, 48 x 40 in, four-way entry. Europe runs the EUR pallet at 120 x 80 cm. They are not interchangeable."],["Stack height","Normally 72 in including the pallet itself, which is also the FBA limit for a single-stacked pallet. Over it and the load is rebuilt or rebilled."],["Weight per pallet","1,500 lb is the usual ceiling and the FBA limit at most receiving buildings. It is also about what the pallet jacks on the floor are rated for."],["Overhang allowance","None. No carton may pass the deck edge and there is no two-inch buffer: FBA allows none, carrier tariffs ask for flush, and the working target is an inch of underhang. Past the edge, the dock may refuse it or the carrier may remeasure to the outermost point."],["Trailer capacity","A 53 ft dry van holds 26 GMA pallets on the floor, or 52 double-stacked. But the US federal gross limit is 80,000 lb, and after the tractor and trailer that leaves roughly 42,000-45,000 lb of freight. Whether you run out of weight or out of floor depends on the goods."],["Density and class","LTL is priced on NMFC freight class, set by density, fragility, theft risk and handling. Below about 6 lb/ft3 the class steps up and the rate with it, which is why squeezing the air out of a pallet is real money."],["Do not stack","A pallet that must not be stacked needs cones or a cap; without them the carrier will stack on it, and the claim fails because an unmarked pallet is a pallet you agreed could be stacked."]]},"FBA_MODES":{"zh": [["SPD：一箱的限制", "Small Parcel Delivery，一箱就是一個包裹，交給 UPS／FedEx，各有各的追蹤號。單箱任一邊不得超過 25 in；單箱不得超過 50 lb。50–100 lb 之間仍可收，但外箱必須加貼 Team Lift（雙人搬運）標；超過 100 lb 一律不收。單一商品本身就超過 25 in 的（例如地毯、桌板）另有例外規定。不用叫車、不用預約、不用打板。"], ["LTL／FTL：一板的限制", "貨打成棧板交給貨運公司。標準板為 40 × 48 in（GMA 板）。含板高度不得超過 72 in；單板總重不得超過 1,500 lb。箱子不得超出板邊（無容許值，實務上往內縮約 1 in）。板必須纏膜到底座，四面各貼一張板標。超高、超重或外突，收貨端可以直接拒收。"], ["LTL 與 FTL 差在哪", "LTL（零擔）：你的板和別人的貨共用同一台拖車，中途會在轉運站上下車好幾次，所以碰撞與遺失的風險高、時效也較不穩，但只付自己那幾板的錢。FTL（整車）：整台拖車只裝你的貨，從出發到目的地不換車、不落地，破損風險低、時效穩定，但無論裝多滿都付一整車的錢。"], ["三種怎麼算錢", "SPD 按件：每一箱各自算材積重與分區，箱數越多總價越高。LTL 按板數與 NMFC 貨物等級：等級由密度、易損性、失竊風險、好不好裝決定，密度低於約 6 lb/ft³ 等級就往上跳，運費差很多——把板上的空隙壓掉就是直接省錢。FTL 按趟：一趟一個價，跟你裝幾箱幾板關係不大。"], ["標籤", "SPD：每箱一張 FBA 外箱標加一張承運商面單，商品本身還要有 FNSKU。LTL／FTL：外箱標照貼，另外每一板四面都要貼板標。少貼一面，收貨端可以拒收整批。"], ["預約", "SPD 不用預約，包裹到了就卸。LTL／FTL 要先在賣家後台登錄承運商，並取得 ISA（進倉預約編號）排定時段。沒有 ISA 或遲到，整車退回，重新排通常要等好幾天。"], ["量體分界（概略）", "六箱以內、單箱不重：SPD 通常划算。超過一板的量：開始評估 LTL。六板以上（約 26 板可裝滿一台 53 呎車的地板）：連 FTL 一起問。這是概略區間不是規則——真的要決定，拿同一批貨去問三家報價。"], ["常見錯誤", "① 單箱 52 lb 沒貼 Team Lift 標，整批被退。② 板高 74 in 超過 72 in，到了月台才發現，要拆掉重打。③ 箱子外突 2 in，承運人用最外緣重新量，整板變大、價錢跟著跳。④ 板都打好了才發現沒建 ISA，車叫不到。⑤ 貨太蓬鬆，密度低於 6 lb/ft³ 害 NMFC 等級往上跳，運費比預估高一截。"]], "en": [["SPD: the per-carton limits", "Small Parcel Delivery. Each carton is its own parcel with its own tracking number, handed to UPS or FedEx. No side may exceed 25 in, and no carton may exceed 50 lb. Between 50 and 100 lb it is still accepted but the carton must carry a Team Lift label; over 100 lb is refused outright. A single item that is itself over 25 in (a rug, a table top) falls under a separate exception. No truck to book, no appointment, no pallets."], ["LTL and FTL: the per-pallet limits", "The cartons go on pallets and a freight carrier collects them. The standard deck is 40 x 48 in (a GMA pallet). Height must not exceed 72 in including the pallet, and no pallet may exceed 1,500 lb. No carton may pass the deck edge -- there is no allowance, and the working target is about an inch of underhang. Film must run down to the deck, and every pallet carries a label on all four faces. Over height, over weight or overhanging, the receiving dock can refuse it."], ["What separates LTL from FTL", "LTL, less than truckload: your pallets share a trailer with other shippers' freight and are unloaded and reloaded at terminals along the way, so handling damage and loss are likelier and transit is less predictable -- but you only pay for your own pallets. FTL, full truckload: the whole trailer carries your load only, from origin to destination without transfers, so damage risk is low and transit is stable -- but you pay for the trailer however full it is."], ["How each is priced", "SPD is per piece: every carton gets its own dimensional weight and zone, so more cartons means more money. LTL is priced on pallet count and NMFC freight class, set by density, fragility, theft risk and handling; below about 6 lb/ft3 the class steps up and the rate with it, which is why squeezing the air out of a pallet is real money. FTL is priced by the run and barely notices how many cartons or pallets are aboard."], ["Labels", "SPD: an FBA carton label on every box plus the carrier's own label, with the FNSKU on the item itself. LTL and FTL: the same carton labels, plus a pallet label on all four faces of every pallet. One face short and the dock can refuse the whole shipment."], ["Appointments", "SPD needs none -- the parcels simply arrive. LTL and FTL need the carrier registered in Seller Central and an ISA, the delivery appointment number, booked to a slot. Without one, or late, the trailer is turned away and a reschedule is usually days."], ["Where the line falls (roughly)", "Six cartons or fewer of no great weight usually still favour SPD. More than a pallet's worth starts to favour LTL. Past about six pallets -- a 53 ft trailer takes 26 on the floor -- price FTL as well. This is a rough band, not a rule. Decide it with three real quotes on the same shipment."], ["What goes wrong", "1. A 52 lb carton with no Team Lift label, and the shipment is refused. 2. A pallet built to 74 in against a 72 in limit, discovered at the dock and stripped down again. 3. Cartons overhanging by two inches, so the carrier remeasures to the outermost point and the pallet -- and the rate -- gets bigger. 4. Pallets built before the ISA was booked, so no truck can be dispatched. 5. Freight too bulky: under about 6 lb/ft3 the NMFC class steps up and the rate comes in well over the estimate."]]},"WAREHOUSE_FEES":[["收貨費 / 卸櫃費","Receiving / Devanning","貨櫃或車輛抵達時卸貨、清點，並核對品項與數量之作業費用。","The charge for unloading arriving freight, counting it and confirming what and how much came in."],["上架費","Putaway","將驗收完成之貨品移入儲位，並於系統登錄儲位編號之作業費用。","The charge for moving counted goods to a storage location and recording where they went."],["倉儲費","Storage","貨品佔用儲位空間之費用，依存放期間計收，計價單位常見為板、才或立方英尺。","Rent for the space the goods occupy while they sit in the warehouse, charged by time."],["揀貨費","Pick fee","依訂單自儲位取出指定品項之作業費用，通常按件或按行計收。","The charge for taking an item off the shelf when an order comes in."],["包裝費 / 耗材費","Pack fee / Materials","商品裝箱、緩衝填充與封箱之作業費用，並含所耗用之紙箱、膠帶等包裝材料。","The charge for boxing, padding and sealing an order, plus the carton and tape it used."],["貼標費","Labelling","依平台規範於商品或外箱黏貼指定標籤之作業費用，例如 Amazon 之 FNSKU 商品標與外箱標。","The charge for putting a required label on an item or carton, such as an Amazon FNSKU."],["打板費","Palletizing","將散箱堆疊成棧板、纏繞膠膜並黏貼板標之作業費用。","The charge for stacking loose cartons into a pallet, wrapping it and labeling it."],["加工費 / 重新包裝","Rework / Repack","對已入庫貨品重新處理之作業費用，包含更換外箱、換貼標籤、拆分或併箱。","The charge for redoing goods already in stock: re-boxing, re-labeling, splitting or combining."],["組裝費","Kitting","將多項商品組合為單一可售單位（SKU）之作業費用。","The charge for combining several items into one new sellable unit."],["退貨處理費","Returns processing","退貨到倉後之驗收、檢查與處置判定之作業費用；整新加工另依工時或材料計價。","The charge for receiving a return, inspecting it, and deciding whether it goes back on the shelf."],["訂單處理費","Order fee","每筆訂單計收一次之行政處理費用，與訂單內品項數量無涉。","An administrative charge taken once per order, whatever is inside it."],["驗貨拍照費","Inspection / photos","進倉時就商品狀況執行額外檢驗或拍照存證之作業費用。","The charge for an extra check of the goods on arrival, or for photographing them as a record."],["銷毀費","Disposal","報廢品或客戶指示銷毀貨品之處置費用，含清運。","The charge for getting rid of goods that are not going to be sold."],["拖車費","Drayage","自港口、機場或貨櫃場至倉庫之短程陸運費用。","The road charge for hauling goods from the port or airport to the warehouse."],["人工工時費","Project labour","無固定費率之專案性或臨時性作業，按投入人數與工時計收。","The charge for odd jobs with no set rate, counted per person per hour."]],"UPS_AHS":{"weight":{"2":46.5,"3-4":50.75,"5-6":56.25,"7+":58.75},"size":{"2":30,"3-4":33.25,"5-6":38.5,"7+":40.5}},"UPS_LPS":{"commercial":{"2":219.5,"3-4":239.5,"5-6":273,"7+":286},"residential":{"2":254.5,"3-4":274.5,"5-6":320.5,"7+":331}},"ZONE_FEE_ROWS":[["f_ahs_w","AHS - Weight"],["f_ahs_s","AHS - Size"],["f_ahs_p","AHS - Packaging"],["f_lps_c","LPS - Commercial"],["f_lps_r","LPS - Residential"]],"SERVICES":{"ups":[["Ground",{},true],["Ground Saver",{},false]],"fedex":[["Ground",{},false],["Home Delivery",{},false],["Ground Economy",{},false]],"usps":[["Ground Advantage",{"maxlg":"130"},false],["First-Class Package",{"maxlg":"130","maxw":"0.999"},false],["Priority Mail",{"maxlg":"108"},false],["Media Mail",{"maxlg":"108","dimcube":"-1"},false]]},"CARRIER_RULES":{"ups":{"divisor":"139","dimcube":"0","dimzone":"0","fuel":"18","nstdl1":"0","nstdl2":"0","nstdcu":"0","nstdf1":"4.00","nstdf2":"18.00","nstdfc":"30.00","balloonlg":"0","balloonmin":"0","maxw":"150","maxl":"108","maxlg":"165"},"fedex":{"divisor":"139","dimcube":"0","dimzone":"0","fuel":"18","nstdl1":"0","nstdl2":"0","nstdcu":"0","nstdf1":"4.00","nstdf2":"18.00","nstdfc":"30.00","balloonlg":"0","balloonmin":"0","maxw":"150","maxl":"108","maxlg":"165"},"usps":{"divisor":"139","dimcube":"1728","dimzone":"5","fuel":"8","maxw":"70","maxl":"108","maxlg":"130","nstdl1":"22","nstdl2":"30","nstdcu":"3456","balloonlg":"84","balloonmin":"20","ressur":"0","dascom":"0","dasres":"0","edascom":"0","edasres":"0","rascom":"0","rasres":"0","pkres":"0"}},"CARRIER_NOTES":{"dimnote":{"ups":["此二欄位用以判斷本件是否適用材積重。UPS 兩欄均為 0，即不設條件，所有包裹一律適用材積重。\n範例：20×15×10 吋、體積 3,000 in³、實重 10 磅 → 適用材積重 → 計費 22 磅。","These two boxes decide whether dimensional weight applies at all. Both are 0 for UPS, meaning no condition: every parcel gets it.\nExample: 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb -> DIM applies -> billed 22 lb.","Estas dos casillas deciden si el peso volumétrico aplica o no. En UPS las dos están en 0, o sea sin condición: todos los paquetes lo llevan.\nEjemplo: 20 x 15 x 10 in, 3,000 in3, peso real 10 lb -> aplica volumétrico -> se cobran 22 lb."],"fedex":["此二欄位用以判斷本件是否適用材積重。FedEx 兩欄均為 0，即不設條件，所有包裹一律適用材積重。\n範例：20×15×10 吋、體積 3,000 in³、實重 10 磅 → 適用材積重 → 計費 22 磅。","These two boxes decide whether dimensional weight applies at all. Both are 0 for FedEx, meaning no condition: every parcel gets it.\nExample: 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb -> DIM applies -> billed 22 lb.","Estas dos casillas deciden si el peso volumétrico aplica o no. En FedEx las dos están en 0, o sea sin condición: todos los paquetes lo llevan.\nEjemplo: 20 x 15 x 10 in, 3,000 in3, peso real 10 lb -> aplica volumétrico -> se cobran 22 lb."],"usps":["此二欄位用以判斷本件是否適用材積重。USPS 須兩項條件均成立方適用：體積逾 1,728 in³（1 立方英尺），且 Zone 達 5 以上。\n以 20×15×10 吋、體積 3,000 in³、實重 10 磅之包裹為例：\n　　寄至 Zone 7　　　體積與 Zone 均達標 → 適用材積重 → 計費 22 磅\n　　寄至 Zone 3　　　Zone 未達 5 → 不適用 → 計費 10 磅\n　　體積 480 in³　　 未逾 1,728 → 不適用 → 依實重計費\n同一包裹因寄送距離不同，分別以 10 磅與 22 磅計價，差異顯著。","These two boxes decide whether dimensional weight applies at all. USPS requires both conditions: over 1,728 in3 (one cubic foot) and zone 5 or beyond.\nTake a parcel of 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb:\n    to zone 7      both conditions met -> DIM applies -> billed 22 lb\n    to zone 3      below zone 5 -> does not apply -> billed 10 lb\n    at 480 in3     under 1,728 -> does not apply -> billed on actual weight\nThe same parcel is rated at 10 lb or at 22 lb depending only on how far it travels.","Estas dos casillas deciden si el peso volumétrico aplica o no. USPS exige que se cumplan las dos condiciones: más de 1,728 in3 (un pie cúbico) y zona 5 o más lejos.\nToma un paquete de 20 x 15 x 10 in, 3,000 in3, peso real 10 lb:\n    a la zona 7     se cumplen las dos -> aplica volumétrico -> se cobran 22 lb\n    a la zona 3     por debajo de la zona 5 -> no aplica -> se cobran 10 lb\n    con 480 in3     por debajo de 1,728 -> no aplica -> se cobra el peso real\nEl mismo paquete se cobra a 10 lb o a 22 lb dependiendo solo de qué tan lejos va."]},"minnote":{"ups":["最低計費重量係指：包裹觸發特定附加費後，無論實際重量多輕，一律以規定的下限重量計價。\n例如 12 磅之大型空箱觸發 AHS－尺寸者，以 40 磅計價；觸發 LPS 者，以 90 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列，僅能由計費重量的異常察覺。","A minimum billable weight means that once a parcel triggers certain surcharges it is rated at a floor weight, however light it actually is.\nA 12 lb box that triggers AHS by size is rated at 40 lb; one that triggers LPS is rated at 90 lb.\nThis is a weight rule rather than a charge. It carries no line of its own on the invoice and is visible only as a billable weight that does not match the scale.","Un peso facturable mínimo significa que, en cuanto un paquete activa ciertos recargos, se cobra a un peso piso por muy ligero que sea en realidad.\nUna caja de 12 lb que activa AHS por tamaño se cobra a 40 lb; una que activa LPS se cobra a 90 lb.\nEs una regla de peso, no un cargo. No lleva renglón propio en la factura y solo se nota como un peso facturable que no cuadra con la báscula."],"usps":["USPS 不設 AHS 或 LPS 的最低計費重量。其唯一的下限重量來自 balloon pricing：長度加周長逾 84 吋者，以 20 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列。","USPS has no AHS or LPS minimum. Its only floor weight comes from balloon pricing: past 84 in of length plus girth a parcel is rated at 20 lb.\nThis is a weight rule rather than a charge and carries no line of its own on the invoice.","USPS no tiene mínimo de AHS ni de LPS. Su único peso piso viene del balloon pricing: pasadas las 84 in de largo más contorno, el paquete se cobra a 20 lb.\nEs una regla de peso, no un cargo, y no lleva renglón propio en la factura."],"fedex":["最低計費重量係指：包裹觸發特定附加費後，無論實際重量多輕，一律以規定的下限重量計價。\n例如 12 磅之大型空箱觸發 AHS－尺寸者，以 40 磅計價；觸發 LPS 者，以 90 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列，僅能由計費重量的異常察覺。","A minimum billable weight means that once a parcel triggers certain surcharges it is rated at a floor weight, however light it actually is.\nA 12 lb box that triggers AHS by size is rated at 40 lb; one that triggers LPS is rated at 90 lb.\nThis is a weight rule rather than a charge. It carries no line of its own on the invoice and is visible only as a billable weight that does not match the scale.","Un peso facturable mínimo significa que, en cuanto un paquete activa ciertos recargos, se cobra a un peso piso por muy ligero que sea en realidad.\nUna caja de 12 lb que activa AHS por tamaño se cobra a 40 lb; una que activa LPS se cobra a 90 lb.\nEs una regla de peso, no un cargo. No lleva renglón propio en la factura y solo se nota como un peso facturable que no cuadra con la báscula."]}},"SERVICE_NOTES":{"('usps', 'Ground Advantage')":["電商小包的主力。長度加周長上限 130 in，是 USPS 裡最大的。","The workhorse for small e-commerce parcels, and at 130 in length plus girth the most generous size ceiling USPS offers.","El caballo de batalla del paquete pequeño de comercio electrónico, y con 130 in de largo más contorno, el tope de tamaño más generoso que ofrece USPS."],"('usps', 'First-Class Package')":["重量上限 15.999 oz（不到 1 磅），郵局櫃台的零售版更低，只到 13 oz。超過就不是這個價，自動變成 Ground Advantage 的磅計價。\n2023 年 7 月已經併進 Ground Advantage，不再是獨立產品，現在它其實是「1 磅以下的價格級距」——級距是 4 oz、8 oz、12 oz、15.999 oz，往上取。舊 SOP 和平台選單上還看得到這個名字，看到就當作 Ground Advantage 處理。\n不要跟 First-Class Mail 搞混：那是信件和扁平件，不是包裹。","The ceiling is 15.999 oz -- just under a pound -- and lower still at 13 oz over the retail counter. Above that it is no longer this price; it becomes Ground Advantage by the pound.\nIt was folded into Ground Advantage in July 2023 and is really a sub-pound price tier now, stepping at 4 oz, 8 oz, 12 oz and 15.999 oz, rounded up. The name survives in older SOPs and platform dropdowns; treat it as Ground Advantage when you see it.\nDo not confuse it with First-Class Mail, which is letters and flats rather than parcels.","El tope son 15.999 oz, poco menos de una libra, y baja a 13 oz en el mostrador de menudeo. Arriba de eso ya no es este precio: pasa a Ground Advantage cobrado por libra.\nEn julio de 2023 se integró a Ground Advantage, así que hoy en realidad es un escalón de precio por debajo de la libra, con cortes en 4 oz, 8 oz, 12 oz y 15.999 oz, redondeando hacia arriba. El nombre sobrevive en SOP viejos y en los menús de las plataformas; cuando lo veas, trátalo como Ground Advantage.\nNo lo confundas con First-Class Mail, que son cartas y piezas planas, no paquetes."],"('usps', 'Priority Mail')":["比較快，1-3 個工作天，但尺寸上限降到 108 in——同一個箱子 Ground Advantage 收得下，Priority 可能就不行。","Faster at 1-3 business days, but the ceiling drops to 108 in. The same box that Ground Advantage accepts may be too big for Priority.","Más rápido, de uno a tres días hábiles, pero el tope baja a 108 in. La misma caja que Ground Advantage acepta puede ser demasiado grande para Priority."],"('usps', 'Priority Mail Express')":["最快，也是 USPS 唯一有準點退費保證的服務。尺寸上限一樣 108 in。","The fastest, and the only USPS service with a money-back guarantee. Same 108 in ceiling.","El más rápido, y el único servicio de USPS con garantía de devolución. El mismo tope de 108 in."],"('usps', 'Media Mail')":["只能寄書籍、教材這類合格品項，寄別的東西被抓到要補郵資。它不分 Zone，只看重量，也不算材積重——所以上面的材積規則整組不適用。","Books and other qualifying media only; ship anything else and the shortfall gets collected. It is not zoned, prices on weight alone, and takes no dimensional weight -- so the DIM rules above do not apply at all.","Solo libros y otros materiales que califiquen; manda cualquier otra cosa y te cobran la diferencia. No va por zonas, cobra únicamente por peso y no toma peso volumétrico, así que las reglas de volumétrico de arriba no aplican en absoluto."],"('ups', 'Ground')":["陸運。1 到 5 個工作天，沒有時效保證，單價最低，美國電商包裹絕大多數走這一個。","Ground. One to five business days with no time guarantee, the cheapest per parcel, and what the great majority of US e-commerce moves on.","Terrestre. De uno a cinco días hábiles, sin garantía de tiempo, el más barato por paquete, y por donde se mueve la gran mayoría del comercio electrónico estadounidense."],"('ups', 'Ground Saver')":["最慢，末端常交郵局。走陸運燃油表。","The slowest; the final leg often goes via the post office. Ground fuel table.","El más lento; el último tramo muchas veces va por el correo. Tabla de combustible terrestre."],"('ups', '3 Day Select')":["卡車送的，但燃油吃「空運」那張表——這是最常記錯的一條。","It moves by truck but takes the AIR fuel table -- the single most misremembered rule.","Va por camión pero toma la tabla de combustible AÉREA: la regla que más se recuerda al revés."],"('fedex', 'Ground')":["送企業地址。住宅要走 Home Delivery，是另一個服務名稱。","For business addresses. Homes go by Home Delivery, which is a separate service name.","Para direcciones comerciales. Los domicilios van por Home Delivery, que es un nombre de servicio aparte."],"('fedex', 'Home Delivery')":["送住家，跑同一個陸運網路，但在報表和帳單上是分開的一行。算量體時不能只抓 Ground。","For homes, on the same ground network, but a separate line on reports and invoices. Sizing volume from Ground alone understates it.","Para domicilios, sobre la misma red terrestre, pero es un renglón aparte en los reportes y en las facturas. Dimensionar el volumen solo con Ground lo subestima."],"('fedex', 'Express Saver')":["名字像陸運、要三天，但它是 Express，吃 Express 的費率表和燃油。","It sounds like ground and takes three days, but it is Express: Express rate table and Express fuel.","Suena a terrestre y tarda tres días, pero es Express: tabla de tarifas Express y combustible Express."]},"DEFAULT":{"zone":"5","weight":"10","length":"20","width":"15","height":"10","divisor":"139","dimcube":"0","dimzone":"0","nstdl1":"0","nstdl2":"0","nstdcu":"0","nstdf1":"4.00","nstdf2":"18.00","nstdfc":"30.00","balloonlg":"0","balloonmin":"0","ahsmin":"40","l
