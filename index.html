:"El mayor, redondeado hacia arriba","STEP 6: Surcharge triggers":"PASO 6: Disparadores de recargo","The nonstandard fee looks only at length and cube. Weight never enters into it, so a long light parcel is caught all the same.":"El cargo por tamaño no estándar solo mira el largo y el volumen. El peso nunca entra, así que un paquete largo y ligero cae igual.","  Automatic checking is switched off.":"  La revisión automática está desactivada.","  LPS applies because:":"  Aplica LPS porque:","When LPS applies, AHS is not charged as well. They never stack.":"Cuando aplica LPS, el AHS no se cobra además. Nunca se suman.","  LPS does not apply.":"  No aplica LPS.","  AHS Weight applies because:":"  Aplica AHS Peso porque:","  AHS Size applies because:":"  Aplica AHS Tamaño porque:","  AHS Packaging applies:":"  Aplica AHS Embalaje:","    not fully encased in corrugated cardboard (ticked by hand; cannot be derived from dimensions)":"    no va totalmente cubierto de cartón corrugado (se marca a mano; no se deduce de las medidas)","Several AHS conditions met -- charged once, at the higher amount.":"Se cumplieron varias condiciones de AHS: se cobra una sola vez, al importe mayor.","  AHS does not apply.":"  No aplica AHS.","STEP 7: Final billable weight":"PASO 7: Peso facturable final","  Minimum billable weight is switched off.":"  El peso facturable mínimo está desactivado.","  No minimum billable weight applies.":"  No aplica ningún peso facturable mínimo.","LPS":"LPS","AHS Size":"AHS Tamaño","Minimum applied":"Mínimo aplicado","A long light parcel is billed at a floor weight although nothing about it is heavy. This rule reads length plus girth and is not a surcharge.":"Un paquete largo y ligero se cobra a un peso piso aunque nada en él sea pesado. Esta regla lee largo más contorno y no es un recargo.","The minimum raised the billable weight. It is a weight rule, not a fee.":"El mínimo subió el peso facturable. Es una regla de peso, no un cargo.","STEP 8: Base transportation":"PASO 8: Flete base","Lookup":"Búsqueda","Weight break used":"Escalón de peso usado","Base rate":"Tarifa base","Built-in demonstration rates, not UPS published rates. Reconcile against your own table.":"Tarifas de demostración incluidas, no las tarifas publicadas de UPS. Concílialas contra tu propia tabla.","Rate tables are stepped; a weight lands on the next break at or above it.":"Las tablas de tarifas van por escalones; un peso cae en el siguiente escalón igual o superior.","Usually the weight is past the end of the table, or that zone has no rates.":"Normalmente el peso pasa del final de la tabla, o esa zona no tiene tarifas.","STEP 9: Surcharge amounts":"PASO 9: Importes de los recargos","All three remote tiers follow which ZIP list the destination sits on, not the zone, and a shipment only ever takes one of them.":"Los tres niveles remotos dependen de en qué lista de códigos postales cae el destino, no de la zona, y un envío nunca toma más de uno.","  No surcharges.":"  Sin recargos.","Subtotal":"Subtotal","STEP 10: Fuel":"PASO 10: Combustible","Fuel basis":"Base del combustible","air":"aéreo","ground":"terrestre","Rate source":"Origen de la tarifa","Air fuel with a Ground base rate -- treat this total as practice, not a reconciliation.":"Combustible aéreo sobre una tarifa base terrestre: toma este total como práctica, no como conciliación.","typed in":"capturado a mano","Total  =  (base + surcharges) x (1 + fuel%)":"Total  =  (base + recargos) × (1 + combustible%)","Base":"Base","Surcharges":"Recargos","Fuel":"Combustible","TOTAL":"TOTAL","This is not a full quote: no base freight was found, so the figure above is surcharges and fuel only.":"Esto no es una cotización completa: no se encontró flete base, así que la cifra de arriba es solo recargos y combustible.","For production work, verify against the carrier's current rates and your customer contract.":"Para trabajo real, verifica contra las tarifas vigentes del transportista y el contrato de tu cliente."},"ES_FEES":{"Receiving / Devanning":["Recibo / Desconsolidado","El cargo por descargar la carga que llega, contarla y confirmar qué y cuánto entró."],"Putaway":["Acomodo","El cargo por llevar la mercancía ya contada a su ubicación de almacenamiento y registrar dónde quedó."],"Storage":["Almacenaje","La renta del espacio que ocupa la mercancía mientras está en el almacén, cobrada por tiempo."],"Pick fee":["Surtido","El cargo por bajar un artículo del anaquel cuando entra un pedido."],"Pack fee / Materials":["Empaque / Materiales","El cargo por encajonar, rellenar y sellar un pedido, más la caja y la cinta que se usaron."],"Labelling":["Etiquetado","El cargo por poner una etiqueta obligatoria en un artículo o una caja, por ejemplo un FNSKU de Amazon."],"Palletizing":["Paletizado","El cargo por acomodar cajas sueltas en una tarima, emplayarla y etiquetarla."],"Rework / Repack":["Reproceso / Reempaque","El cargo por rehacer mercancía que ya está en inventario: cambiar de caja, cambiar etiqueta, separar o juntar."],"Kitting":["Armado de kits","El cargo por combinar varios artículos en una nueva unidad vendible."],"Returns processing":["Proceso de devoluciones","El cargo por recibir una devolución, revisarla y decidir si regresa al anaquel."],"Order fee":["Cargo por pedido","Un cargo administrativo que se cobra una vez por pedido, sin importar qué lleve dentro."],"Inspection / photos":["Inspección / fotos","El cargo por una revisión extra de la mercancía al llegar, o por fotografiarla como constancia."],"Disposal":["Destrucción","El cargo por deshacerse de mercancía que ya no se va a vender."],"Drayage":["Acarreo","El cargo terrestre por trasladar la mercancía del puerto o del aeropuerto al almacén."],"Project labour":["Mano de obra por proyecto","El cargo por trabajos sueltos sin tarifa fija, contados por persona y por hora."]},"GUIDE":[["h","開始之前","Before we start"],["p","你手上會拿到一張 UPS 帳單，密密麻麻幾千列，每一列都是一筆錢。第一次看的人通常有兩個反應：一是「這些英文是什麼」，二是「為什麼一個 10 磅的箱子要收這麼多」。","You are going to be handed a UPS invoice with a few thousand lines on it, every one of them money. First-timers usually react two ways: what is all this English, and why does a ten-pound box cost that much."],["p","這份筆記就是要把這兩件事講完。不會用行話開頭，看不懂的名詞出現時都會先解釋。從頭讀一次大概三十分鐘，之後當字典查。","These notes answer both. No jargon without an explanation first. Read it through once -- about half an hour -- then keep it as a dictionary."],["a","只要記住一件事的話：帳單上的重量，跟你在秤上看到的重量，常常不是同一個數字。這份筆記有一半在解釋為什麼。","If you only remember one thing: the weight on the invoice is often not the weight you saw on the scale. Half of these notes explain why."],["h","一個包裹的錢，是怎麼疊起來的","How the charge on one parcel is built"],["p","先看全貌。任何一件包裹，錢都是三塊疊出來的，順序固定，不會變。","Start with the shape. Every parcel is three pieces of money stacked in a fixed order."],["f","總費用 = 基本運費 ＋ 附加費 ＋ 燃油","Total = base transportation + surcharges + fuel"],["p","基本運費，就是「把這個箱子從 A 送到 B」的錢。查表查出來的，跟重量和距離有關。","Base transportation is the price of moving this box from A to B. You look it up in a table, using weight and distance."],["p","附加費，是「這件比較麻煩」的錢。太重、太大、送到住家、送到偏遠地方、要簽收——每一項各收一筆。","Surcharges are the price of this one being awkward: too heavy, too big, going to a house, going somewhere remote, needing a signature. Each is its own line."],["p","燃油，是把上面兩項加起來，再乘一個百分比。注意它是乘在「運費加附加費」上，不是只乘附加費，這裡很多人第一次會算錯。","Fuel takes the first two, added together, and multiplies by a percentage. It is charged on freight PLUS surcharges, not on the surcharges alone. That trips people up the first time."],["f","燃油 =（基本運費 ＋ 附加費）× 燃油百分比","Fuel = (base + surcharges) x the fuel percentage"],["a","所以附加費有雙重傷害：它自己收一筆，還會把燃油的基數墊高，讓燃油那一筆也變多。一筆 $56 的 AHS，在 25% 燃油之下，實際成本是 $70。","So a surcharge hurts twice: once itself, and again by raising the base that fuel is charged on. A $56 AHS at 25% fuel really costs $70."],["h","計費重量：帳單上的重量不是秤出來的","Billable weight: the invoice weight is not the scale weight"],["p","這是最重要的一節。UPS 收錢看的是「計費重量」，不是你放上秤看到的那個數字。","This is the section that matters most. UPS bills on the BILLABLE weight, not the number you read off the scale."],["p","為什麼？想像一台貨車，車廂就那麼大。今天裝十箱羽毛，車廂塞滿了，但總重可能只有一百磅。裝十箱書，車廂還有空位，卻已經超重。對 UPS 來說，那台車跑一趟的成本是一樣的——油錢、司機、時間都一樣。","Why? Picture a truck with a fixed-size box on the back. Ten cartons of feathers fill it completely and weigh almost nothing. Ten cartons of books leave space but max out the axle. The trip costs UPS the same either way -- same fuel, same driver, same hours."],["p","所以不能只按重量收錢，也要按「佔多少空間」收錢。這個「換算成重量的空間」就叫材積重量（DIM weight，Dimensional Weight）。","So they cannot bill on weight alone; they also have to bill for space taken. Space converted into a weight is called dimensional weight, or DIM weight."],["f","材積重量 = 長 × 寬 × 高 ÷ 139","DIM weight = length x width x height / 139"],["p","長寬高用英吋（inch）量，算出來的是立方英吋，再除以 139，就變成磅。139 這個數字叫材積除數，意思是「139 立方英吋算 1 磅」。","Measure the sides in inches, which gives cubic inches, then divide by 139 to get pounds. That 139 is the DIM divisor: 139 cubic inches counts as one pound."],["p","然後拿材積重跟實際重量比，哪個大就用哪個，小數點無條件進位。","Compare the DIM weight against the actual weight, take whichever is bigger, and round up to the next whole pound."],["f","計費重量 = 進位( 實際重量 與 材積重量 取大的 )","Billable weight = round up( the larger of actual and DIM )"],["p","舉個實際的例子。一個 20 × 15 × 10 英吋的箱子，裡面裝衣服，秤起來 10 磅。","A worked example. A 20 x 15 x 10 inch box full of clothes weighs 10 lb on the scale."],["t",["",["怎麼算","Working"],["結果","Result"]],[["1",["20 × 15 × 10","20 x 15 x 10"],["3,000 立方英吋","3,000 cubic inches"]],["2",["3,000 ÷ 139","3,000 / 139"],"21.58 lb"],["3",["21.58 對上 10，取大的","21.58 against 10, take the larger"],"21.58 lb"],["4",["進位","Round up"],["22 lb ← 帳單收這個","22 lb -- this is what is billed"]]]],["a","10 磅的箱子，按 22 磅收錢。你沒看錯，也沒有被多收。這就是材積重的意思。","A 10 lb box billed as 22 lb. Not a mistake, not an overcharge. That is what DIM weight does."],["p","所以「輕」不等於「便宜」。同樣一件衣服，塞小一點的箱子就便宜，用大箱子亂塞泡棉就變貴。跟客戶溝通時這是最有說服力的一句話。","Light does not mean cheap. The same shirt is cheaper in a smaller box and dearer in a big one padded out with foam. That single sentence wins most customer conversations."],["p","139 是最常見的除數，但不是法律。有些客戶合約談到 166 或別的數字。記住方向就好：除數越小，算出來越重，也就越貴。","139 is the common divisor, not a law. Some contracts say 166 or something else. Just remember the direction: the smaller the divisor, the heavier the result and the dearer the parcel."],["h","量尺寸：先排序，再算長度加周長","Measuring: sort first, then work out length plus girth"],["p","客戶在系統裡填的 Length（長）、Width（寬）、Height（高），常常是隨手填的。UPS 不看欄位名稱，它只看「這三個數字裡最大的是哪個」。","Whatever the customer typed under Length, Width and Height is usually whatever came to hand. UPS does not read the column names. It only asks which of the three numbers is biggest."],["p","所以拿到三個數字，第一件事永遠是由大到小排。最大的叫最長邊，第二大的叫第二長邊。","So the first thing you do with three numbers is sort them, biggest first. The biggest is the longest side, the next one is the second side."],["p","接下來要算一個叫「長度加周長」的東西（英文 Length + Girth）。周長的意思是：把箱子橫著繞一圈的長度。","Next comes something called length plus girth. Girth is the distance round the box, the short way."],["f","長度加周長 = 最長邊 ＋ 2 ×（第二長邊 ＋ 第三邊）","Length + girth = longest + 2 x (second + third)"],["p","為什麼要繞一圈？因為它專門抓「細細長長」的東西。一支釣竿，最長邊很誇張，但另外兩邊很小；一片門板，三邊都不算特別長，但攤開來很佔位。單看一邊都看不出問題，加了周長才看得出來。","Why go round? Because this number is what catches long thin things. A fishing rod has one huge side and two tiny ones; a door panel has no single alarming side but is awkward as anything. No single measurement flags either. Length plus girth does."],["f","20 × 15 × 10 的箱子：20 ＋ 2 ×（15 ＋ 10）＝ 70 英吋","That 20 x 15 x 10 box: 20 + 2 x (15 + 10) = 70 inches"],["a","這個數字後面會一直用到，AHS 和 LPS 都要看它。量錯一邊，後面全錯。","This number comes up again and again -- AHS and LPS both read it. Get one side wrong and everything downstream is wrong."],["h","Zone：距離的代號","Zone: the code for distance"],["p","Zone（區域）就是「這一趟有多遠」的代號。美國國內 Ground 用 2 到 8，數字越大代表越遠，也越貴。沒有 Zone 1。","A zone is a code for how far the parcel is going. US domestic Ground runs from 2 to 8, bigger meaning further and dearer. There is no zone 1."],["p","Zone 不是收件地自己的屬性，是「寄件地 ＋ 收件地」兩個一起決定的。同一個客戶，從加州出貨是 Zone 8，改從紐澤西出貨可能變 Zone 3。所以換倉庫會直接改變運費結構。","A zone is not a property of the destination. It comes from origin AND destination together. The same customer is zone 8 out of California and maybe zone 3 out of New Jersey. Which is why changing warehouse changes the whole cost structure."],["p","怎麼查：UPS 對每一個寄件地的 ZIP Code 前三碼，都出一張 Zone Chart（區域對照表）。拿收件 ZIP 的前三碼去表上對，就得到 Zone。","How to look it up: UPS publishes a zone chart for each origin ZIP Code prefix -- the first three digits. Match the first three digits of the destination ZIP against that chart and you have the zone."],["p","這個工具會自動幫你查。兩個 ZIP 填好，Zone 欄位就會自己跳出數字，下面還會寫是從 UPS 官網查的還是本機快取。查不到才需要自己填。","This tool does that for you. Fill in both ZIPs and the zone appears, with a note saying whether it came from ups.com or the local cache. You only type it in if the lookup fails."],["a","Zone Chart 上有幾欄是空運的，數字長得像 102、302、242。那是空運的編碼，不是 Ground 的 2 到 8。拿去查 Ground 費率表一定出事。","Some columns on the zone chart are for air and read like 102, 302 or 242. Those are air codes, not the Ground 2 to 8. Used against a Ground table they blow up."],["p","另外夏威夷和阿拉斯加有自己的 Zone，會出現 44、45、46 這種數字。那是真的 Ground Zone，只是這個教學工具沒有那幾區的費率，遇到會直接告訴你「超出範圍」，不會硬算給你一個假的答案。","Hawaii and Alaska have their own zones, showing up as 44, 45 or 46. Those are genuine Ground zones; this training tool simply has no rates for them, so it says out of scope rather than inventing a number."],["h","AHS 和 LPS：兩個「這件很麻煩」附加費","AHS and LPS: the two awkward-parcel surcharges"],["p","UPS 的分揀場靠輸送帶跑。一件包裹丟上輸送帶、自動掃描、自動分流，全程沒有人碰它，成本最低。","A UPS hub runs on conveyors. A parcel goes on the belt, gets scanned, gets sorted, and nobody touches it. That is the cheap path."],["p","但有些東西上不了輸送帶：太重機器抬不動、太長會卡住、包裝爛掉會散開。這些就得靠人工搬，成本一下子高很多。附加費就是收這個。","Some things cannot go on the belt: too heavy for the machine, too long and it jams, badly packed and it comes apart. Those get moved by hand, and that costs a great deal more. The surcharge pays for it."],["p","麻煩分兩級。小麻煩叫 AHS（Additional Handling，額外處理費），大麻煩叫 LPS（Large Package Surcharge，大型包裹附加費）。LPS 貴很多，大概是 AHS 的五倍。","There are two grades of awkward. The mild one is AHS, additional handling. The severe one is LPS, the large package surcharge. LPS is far dearer -- roughly five times an AHS."],["t",[["看哪一項","What is measured"],["超過就中 AHS","AHS above"],["超過就中 LPS","LPS above"]],[[["實際重量","Actual weight"],"50 lb","110 lb"],[["最長邊","Longest side"],"48 in","96 in"],[["第二長邊","Second side"],"30 in",["（不看）","(not used)"]],[["長度加周長","Length + girth"],"105 in","130 in"],[["材積體積","Cubic volume"],"10,368 in³","17,280 in³"]]],["p","表上任何一項超過，就算中。不用全部都超過，中一項就收。","Any single row over the line triggers it. You do not need to breach them all -- one is enough."],["a","全部都是「大於」，不是「大於等於」。剛剛好 110.0 磅不算，110.1 磅才算。差這 0.1 磅，帳單上差兩百多美金。這不是誇飾。","Every threshold is strictly greater than. Exactly 110.0 lb does not trigger; 110.1 lb does. That tenth of a pound is worth over two hundred dollars. Not an exaggeration."],["p","AHS 還有一項跟尺寸無關的：包裝不符。沒有用瓦楞紙箱完整包起來的都算——輪胎直接貼標寄、軟包裝（塑膠袋、氣泡袋）、木箱、金屬桶。這一項用眼睛判斷，量尺寸量不出來，所以工具裡是一個要自己勾的選項。","AHS has one trigger that has nothing to do with size: packaging. Anything not fully encased in corrugated cardboard counts -- a bare tyre with a label on it, a poly bag, a wooden crate, a metal drum. It is judged by eye, not by tape measure, which is why the tool makes it a tick box."],["h","AHS 和 LPS 不會一起收","AHS and LPS never come together"],["p","規則很簡單，但同仁幾乎都會搞錯一次：中了 LPS，就不收 AHS。不是兩個都收。因為 LPS 已經是「最麻煩」那一級，AHS 被吸收掉了。","The rule is simple and almost everyone gets it wrong once: if LPS applies, AHS does not. Not both. LPS is already the severe grade, and it absorbs the mild one."],["p","同理，AHS 自己的三種（重量、尺寸、包裝）同時成立時，也只收一次，取金額最高的那一種。","The same inside AHS: if weight, size and packaging all trigger at once, it is still charged once, at whichever of the three is dearest."],["a","看到帳單同一個追蹤號上同時有 AHS 和 LPS，那多半是有一筆之後會被 ADJ 退掉，或是真的算錯了，值得追。","If one tracking number carries both AHS and LPS, either one of them will be refunded by a later adjustment or something genuinely went wrong. Worth chasing."],["h","最低計費重量：一種隱形的加價","Minimum billable weight: a hidden bump"],["p","中了某些附加費之後，UPS 不只多收一筆錢，還會把你的計費重量整個拉高。","Some surcharges do not just add a fee. They also drag the billable weight up."],["t",[["情況","Situation"],["重量至少算","Weight floored at"]],[[["中了 AHS－尺寸","AHS by size"],"40 lb"],[["中了 LPS","LPS"],"90 lb"],[["只中 AHS－重量","AHS by weight only"],["不套用","no floor"]]]],["p","意思是：一個 12 磅的大空箱，只要中了 AHS－尺寸，運費就要照 40 磅算。中了 LPS，照 90 磅算。箱子裡裝什麼、有多輕，完全不影響。","So a 12 lb box that is mostly air, once it trips AHS by size, is rated at 40 lb. Trip LPS and it is rated at 90 lb. What is inside and how light it is stops mattering."],["a","這一項不是附加費，是重量規則。所以它不會在帳單上單獨出現一列，你只會看到「重量怎麼變這麼多」。要自己反推。","This is a weight rule, not a fee, so it never appears as its own invoice line. All you see is a weight that looks wrong. You have to work backwards to it."],["h","包裹上限：規定上不收，實際上照送然後重罰","Parcel limits: not accepted on paper, carried anyway and penalised"],["p","超過下面任何一條線，UPS 的條款就寫「不接受運送」，應該改走貨運（Freight）。","Past any one of the lines below, the UPS terms say the package is not accepted for carriage and it should move as freight instead."],["a","但「不接受」不等於寄不出去。這種包裹流進 UPS 的系統之後通常還是會送到，然後在帳單上加一筆 Over Maximum Limits。所以它是罰款，不是計價——用意是嚇阻，不是反映成本。","But not accepted does not mean it will not go. Once inside the UPS network such a parcel usually gets delivered, with an Over Maximum Limits charge added to the invoice. It is a penalty rather than a price: meant to deter, not to reflect cost."],["p","UPS 同時保留退回寄件人的權利，而且運費不退。所以兩種結果都可能發生。","UPS also reserves the right to return it to the shipper, with the freight not refunded, so either outcome is possible."],["t",[["項目","Limit"],["上限","Maximum"]],[[["實際重量","Actual weight"],"150 lb"],[["最長邊","Longest side"],"108 in"],[["長度加周長","Length + girth"],"165 in"]]],["a","硬寄會被收 Over Maximum Limits，2026 一件大約 $1,875 美金。一件。這通常是整張帳單上最貴的一列，看到務必回頭查出貨端是誰放行的。","Ship one anyway and it takes Over Maximum Limits -- about $1,875 per package in 2026. Per package. It is usually the single dearest line on the invoice, and worth tracing back to whoever let it out of the door."],["f","Over Maximum Limits 是「另外加收」，不是取代 LPS。","Over Maximum Limits is charged ON TOP, not instead of the large package surcharge."],["p","UPS 的條款寫得很直接：超過上限的包裹如果流進系統，會收 Over Maximum Limits，而且是 in addition to all other applicable charges——在所有其他費用之上。長度加周長超過上限的，同時也會收 LPS。","The UPS terms are explicit: a package over the limits that gets into the system takes Over Maximum Limits in addition to all other applicable charges. One that also exceeds the length-plus-girth limit takes the large package surcharge as well."],["a","所以互斥的只有 AHS 和 LPS 那一組。Over Maximum 不在那個規則裡，它是疊上去的——一件超限的包裹很可能同時看到 LPS、最低計費重量 90 磅、和 Over Maximum 三樣，再加上旺季的 Demand。","So the mutual exclusion only covers AHS against LPS. Over Maximum sits outside that rule and stacks: one over-limit parcel can carry the large package surcharge, the 90 lb weight floor and Over Maximum all at once, plus a peak demand charge on top."],["p","順帶一提，Ground 費率表只到 150 磅，就是因為 150 磅是上限。查不到那一列，通常代表前面某一步算錯了，不是表壞了。","That is also why the Ground rate table stops at 150 lb. A row that is not there usually means an earlier step went wrong, not that the table is broken."],["h","地址類型：住宅還是商業","Address type: home or business"],["p","同一個包裹，寄到住家比寄到公司貴。原因一樣是成本：公司地址通常一次送好幾件、上班時間一定有人、停車方便；住家一次一件、可能沒人在、要繞小巷。","The same parcel costs more to a house than to a business, for the same cost reason: a business takes several parcels at once, is open in working hours and is easy to park at. A house takes one, may be empty, and is down a side street."],["p","貴在哪裡？住宅附加費是一筆，另外 LPS 也有住宅和商業兩張表，住宅那張每一格都高一截，DAS 也是住宅收得多。","Where it costs more: there is a residential surcharge, LPS has separate residential and commercial schedules with every cell of the residential one higher, and DAS is dearer to residential too."],["a","誰說了算？UPS 說了算，不是客戶在系統裡勾什麼。公寓、大樓、在家工作的辦公室，通常都被判成住宅。客戶勾商業但 UPS 判住宅，帳單就照住宅收，還可能多一筆地址更正費。","Who decides? UPS does, not the box the customer ticked. Flats, apartment blocks and home offices normally read as residential. Tick commercial and get classified residential, and the invoice bills residential -- plus, sometimes, an address correction fee."],["h","偏遠地區附加費（DAS）","The delivery area surcharge (DAS)"],["p","DAS 全名 Delivery Area Surcharge，中文叫偏遠地區附加費。這一節從頭講，因為它是報價時最容易漏、事後最容易吵架的一筆。","DAS stands for Delivery Area Surcharge. This section starts from scratch, because it is the charge most often missed at quoting time and most often argued about afterwards."],["p","先講成本邏輯。UPS 一台車出去一趟，成本是固定的：司機薪水、油錢、車輛折舊。差別在這一趟送得掉幾件。","Start with the cost logic. One UPS van going out for a day costs a fixed amount: driver, fuel, wear on the vehicle. What varies is how many parcels that day delivers."],["p","市區一條街走下來送二十件，平均一件的成本很低。鄉下開四十分鐘的產業道路只為了送一件，那一件的成本是市區的好幾倍。DAS 就是把這個差額補回來。","Twenty parcels down one city street is cheap per parcel. Forty minutes down a farm road for a single delivery is many times dearer. DAS recovers that difference."],["f","DAS 完全看「收件 ZIP Code」。跟 Zone 一點關係都沒有。","DAS is decided purely by the DESTINATION ZIP Code. It has nothing to do with the zone."],["p","這句話要背起來，因為同仁一定會把它跟 Zone 搞混。差別是這樣：","Memorise that line, because everyone confuses it with the zone at first. The difference:"],["t",[["",""],["是什麼","What it is"],["怎麼決定","How it is decided"]],[["Zone",["距離","Distance"],["寄件地 + 收件地","Origin plus destination"]],["DAS",["清單","A list"],["收件 ZIP 有沒有在清單上","Whether the destination ZIP is on the list"]]]],["p","UPS 每年公布一份 ZIP Code 清單。在清單上就收 DAS，不在就不收，沒有灰色地帶，也不會因為「感覺很遠」就自動有。","UPS publishes a list of ZIP Codes each year. On the list, you pay. Off the list, you do not. No grey area, and no amount of feeling remote puts a ZIP on it."],["a","所以會出現這種畫面：寄到 Zone 8 的鳳凰城市中心，沒有 DAS。寄到 Zone 3 的某個小鎮，有 DAS。Zone 小卻收 DAS，不是錯帳。","Which produces this: downtown Phoenix at zone 8, no DAS. A small town at zone 3, DAS. A low zone with a DAS line is not a billing error."],["p","偏遠不是一筆，是三筆不同的附加費，帳單上是三個不同的名稱。收件 ZIP 落在哪一份清單，就收哪一個，一票只會中其中一個。","Remote is not one charge but three, printed under three different names. Whichever list the destination ZIP sits on is the one charged, and a shipment only ever takes one of them."],["t",[["帳單上的名稱","On the invoice"],["中文","What it is"],["大概是什麼地方","Roughly where"]],[["Delivery Area Surcharge (DAS)",["一般偏遠","Standard remote"],["本土 48 州清單上的一般偏遠地址","Listed addresses in the contiguous 48"]],["Extended DAS",["延伸偏遠","Extended"],["更外圍的清單，路程更長","A further-out list, longer routes"]],["Remote Area Surcharge (RAS)",["極偏遠","Remote"],["最難到達的地方","The hardest places to reach"]]]],["p","每一層再分住宅和商業，住宅一律比商業貴，金額也會依走陸運還是空運而不同。三層裡 RAS 最貴，常常是一般 DAS 的三倍以上。","Each tier splits again into residential and commercial, with residential always dearer, and the amounts differ between ground and air. RAS is the dearest of the three, often more than triple the standard DAS."],["a","RAS 原本只用在阿拉斯加和夏威夷。2022 年 UPS 另外加了一個 US48 Remote Area Surcharge，把本土 48 州裡最偏遠的一批 ZIP 也納進來——所以現在 RAS 出現在本土的訂單上，不是錯帳。","RAS originally applied only to Alaska and Hawaii. In 2022 UPS added a US48 remote area surcharge, bringing the most isolated ZIPs in the contiguous 48 into the same tier -- so RAS on a mainland shipment today is not a billing error."],["a","記帳時不要把三個一律歸成「DAS」。金額差距很大，而且能談到的折扣也不一樣，分開統計才看得出成本落在哪一層。","Do not book all three as DAS. The amounts differ widely and so does the discount you can negotiate on each; only separate tracking shows which tier the cost actually sits in."],["p","還有兩件事要知道。第一，住宅附加費和 DAS 是兩筆不同的錢，一個看「是不是住家」，一個看「ZIP 在不在清單上」。一個住家又剛好在清單上，兩筆都收，那是正常的，不是重複計費。","Two more things. First, the residential surcharge and DAS are different charges: one asks whether it is a home, the other whether the ZIP is on the list. A home that is also on the list takes both, and that is correct, not double billing."],["p","第二，空運一樣收 DAS，Ground Saver 也收。美國國內的服務基本上都逃不掉。","Second, air takes DAS too, and so does Ground Saver. Essentially no US domestic service escapes it."],["p","清單每年會動。今年沒事的 ZIP，明年可能被加進去。所以年初帳單突然多出 DAS，先去確認是不是清單更新了，不要第一時間認定 UPS 算錯。","The list moves each year: a ZIP that was clear can be added next year. So when DAS appears out of nowhere in January, check the new list before deciding UPS got it wrong."],["p","旺季還會再加一筆旺季版的 DAS，等於那幾週同一個地址疊兩層。","Peak season adds a peak DAS on top, so for those weeks the same address carries two layers."],["h","為什麼 DAS 老是報價完才冒出來","Why DAS always surfaces after the quote"],["p","報價的時候，你手上通常只有重量、尺寸、送到哪一州。沒有完整地址，就不可能知道會不會中 DAS。等帳單回來，一件多兩三塊美金——一個月一萬件，就是兩三萬美金的落差。","At quoting time you usually have weight, dimensions and a state. Without a full address there is no way to see DAS coming. It lands on the invoice at a few dollars a parcel; at ten thousand parcels a month that is a serious gap."],["p","實務上三件事可以做：","Three things that work in practice:"],["t",["",["做法","What to do"]],[["1",["出貨前拿收件 ZIP 去比對 UPS 的偏遠清單，先知道會中","Check the destination ZIP against the UPS list before shipping, so you know in advance"]],["2",["報價時對容易中的州別預留緩衝，不要報到見骨","Build a buffer into quotes for the states where it clusters"]],["3",["先跟客戶講 DAS 是什麼，讓它變成預期內的成本","Explain DAS to the customer up front so it becomes an expected cost"]]]],["a","要查某個 ZIP 是不是偏遠：去 UPS 官網下載當年度的 Delivery Area Surcharge ZIP Code 清單，用 Excel 搜尋。檔案裡分好幾個分頁，一般（Standard）跟 Extended 是分開列的。","To check a ZIP: download the current Delivery Area Surcharge ZIP Code listing from ups.com and search it in Excel. The file has several sheets, with standard and extended listed separately."],["h","簽名服務","Signature service"],["p","簽名服務是客戶自己加購的，不會自動發生。一個包裹一個價，分好幾種：一般簽收、成人簽收（要看證件）、指定本人簽收。越嚴格越貴。","Signature service is bought by the customer; it never happens automatically. It is priced per package and comes in grades: plain signature, adult signature with ID, and named-person only. Stricter is dearer."],["p","高價品通常會加購，因為沒簽收又遺失，爭議起來很難處理。這是一筆「用錢換確定性」的費用。","High-value goods usually take it, because a missing parcel with no signature is very hard to argue about. It is money spent on certainty."],["h","基本運費怎麼查","Looking up the base rate"],["p","拿最終計費重量和 Zone，去費率表上交叉查。橫的是 Zone 2 到 8，直的是 1 磅到 150 磅，一磅一列。","Take the final billable weight and the zone, and cross-reference them on the rate table. Zones 2 to 8 across the top, 1 to 150 lb down the side, one row per pound."],["p","表是階梯式的：22.3 磅查的是 23 磅那一列，不會往下取。這也是為什麼前面計費重量要進位。","The table is stepped: 22.3 lb reads the 23 lb row, never down. That is why the billable weight was rounded up earlier."],["a","最重要的一句：每個客戶談到的折扣都不一樣，要用「那個客戶自己的費率表」，不能用 UPS 公布費率。用錯表，整張帳單全部對不上。","The line that matters most: every customer negotiates a different discount, so you use THAT customer's own table, never the published rates. Wrong table and the entire invoice fails to reconcile."],["p","這個工具內建的是示範費率，數字是編出來的，只是為了讓你練習查表的動作。正式作業一定要把客戶的表載進去。","The rates built into this tool are made up, there purely so you can practise the lookup. Real work needs the customer's own table loaded in."],["h","附加費金額大概長怎樣","Roughly what the surcharges cost"],["p","AHS 和 LPS 不是固定金額，會依 Zone 分四段，越遠越貴。下面是示範數字，讓你有個量級的概念，實際請對合約。","AHS and LPS are not flat amounts; they band by zone, dearer further out. The figures below are illustrative -- they give you a sense of scale. Check the contract for real ones."],["t",[["項目","Item"],"Zone 2","Zone 3-4","Zone 5-6","Zone 7+"],[[["AHS－重量","AHS - Weight"],"46.50","50.75","56.25","58.75"],[["AHS－尺寸","AHS - Size"],"30.00","33.25","38.50","40.50"],[["AHS－包裝","AHS - Packaging"],"30.00","33.25","38.50","40.50"],[["LPS－商業","LPS - Commercial"],"219.50","239.50","273.00","286.00"],[["LPS－住宅","LPS - Residential"],"254.50","274.50","320.50","331.00"]]],["a","看一下 LPS 那兩列的量級：一件兩三百美金。一個 110 磅的箱子多裝 0.2 磅，就從 AHS 的五十幾塊跳到 LPS 的兩百八。這就是為什麼出貨端的秤要準。","Look at the scale of those LPS rows: two to three hundred dollars a parcel. An extra fifth of a pound on a 110 lb box jumps you from a fifty-dollar AHS to a two-hundred-and-eighty-dollar LPS. That is why the scale on the dock has to be right."],["h","燃油附加費是怎麼來的","Where the fuel percentage comes from"],["p","燃油不是 UPS 心情好壞決定的，是綁在美國能源部（EIA，能源資訊署）每週公布的油價上，照一張級距表換算成百分比。油價落在哪一格，那一週就收那個百分比。","The fuel percentage is not set by mood. It is pegged to fuel prices published weekly by the US Energy Information Administration and converted through a step table. Whichever band the price lands in is the percentage for that week."],["p","而且是兩張表，陸運一張、空運一張，看的油也不一樣。","And there are two tables, ground and air, watching different fuels."],["t",[["",""],["陸運 Ground","Ground"],["空運 Air","Air"]],[[["看哪種油","Which fuel"],["公路柴油全美均價","National average on-highway diesel"],["美灣區航空煤油","US Gulf Coast jet fuel"]],[["多久換一次","How often"],["每週一","Every Monday"],["每週一","Every Monday"]],[["大概多少","Rough level"],["二十幾 %","Twenty-something per cent"],["比陸運高一點","A little above ground"]]]],["a","決定用哪一週的比例，看的是「取件日」，不是帳單日期，也不是送達日。所以一張跨兩週的帳單，本來就會有兩個以上的燃油比例。看到不只一個，那不是錯帳。","Which week applies is set by the PICKUP date -- not the invoice date, not the delivery date. So an invoice spanning two weeks legitimately carries two or more fuel percentages. Seeing more than one is not an error."],["p","中間還有一週的時間差：UPS 這一週用的是上一週公布的油價。所以油價跌了，帳單要再過一週才反映得出來。","There is also a week of lag: this week's percentage uses last week's published price. When fuel drops, the invoice takes another week to follow."],["h","在工具裡查燃油","Looking fuel up in the tool"],["p","分頁 3 的燃油區塊會直接連 UPS 官網，把 90 天的燃油歷史抓回來，陸運空運兩欄一起顯示，還會列最近幾週，讓你親眼看到它每週在動。選好服務別按按鈕，數字就填好了。","The fuel panel on tab 3 reads the 90-day fuel history straight from ups.com, ground and air side by side, plus the recent weeks so you can watch it move. Pick the service, press the button, and the field fills itself."],["p","查不到的時候它會直說查不到，不會拿舊數字硬湊給你。這種時候點連結去官網看一眼，自己填就好。","When the lookup fails it says so rather than substituting an old figure. Open the link, read the page, type it in."],["h","服務種類：Ground 和空運（Express）","Service types: Ground and air (Express)"],["p","前面講的全部是 Ground。但一張帳單上會混好幾種服務，先分清楚是哪一種，再去查對應的表。","Everything so far has been Ground. One invoice mixes several services, so identify which one before reaching for any table."],["p","怎麼分？看帳單的 Charge Description（費用說明）那一欄，服務名稱就寫在裡面。原則是：越快、時間越指定，越貴。","How? The service name is written in the Charge Description column. The rule of thumb: faster and more precisely timed means dearer."],["t",[["服務","Service"],["走哪個網路","Network"],["什麼時候到","When it arrives"],["燃油用哪張表","Fuel table"]],[["Ground",["卡車","Truck"],["1-5 個工作天，不保證","1-5 business days, no promise"],["陸運","Ground"]],["Ground Saver",["卡車","Truck"],["最慢，末端可能交郵局","Slowest; last leg may go via the post office"],["陸運","Ground"]],["3 Day Select",["卡車","Truck"],["第 3 個工作天下班前","End of the 3rd business day"],["空運","Air"]],["2nd Day Air",["飛機","Plane"],["第 2 個工作天下班前","End of the 2nd business day"],["空運","Air"]],["2nd Day Air A.M.",["飛機","Plane"],["第 2 個工作天中午前","2nd business day, by midday"],["空運","Air"]],["Next Day Air Saver",["飛機","Plane"],["隔天下午","Next business day, afternoon"],["空運","Air"]],["Next Day Air",["飛機","Plane"],["隔天上午","Next business day, morning"],["空運","Air"]],["Next Day Air Early",["飛機","Plane"],["隔天一早，最快最貴","Next business day, first thing; fastest and dearest"],["空運","Air"]]]],["a","第一個要背的陷阱：3 Day Select 是卡車送的，燃油卻用「空運」那張表。看到 3 Day Select 就抓空運燃油，不要因為它是卡車就抓陸運。","The first trap to memorise: 3 Day Select goes by truck but takes the AIR fuel table. See 3 Day Select, reach for the air percentage."],["p","每一種服務有自己的費率表，也有自己的 Zone。同一組寄收 ZIP，Ground 是 Zone 5，空運會是另一個數字，兩邊絕對不能互相套。","Each service has its own rate table and its own zone. The same pair of ZIPs is zone 5 on Ground and something else on air, and the two never substitute."],["p","附加費規則大致共用：材積重、AHS、LPS、住宅、DAS、簽名，空運照樣收。差別在金額，而且空運本身的運費就高很多，所以同一筆附加費佔的比例反而變小。","Most surcharge rules carry over: DIM weight, AHS, LPS, residential, DAS and signature all apply to air. The amounts differ, and because the air base rate is so much higher, the same surcharge is a smaller slice of the total."],["p","空運有準點保證，Ground 沒有。晚到可以申請 GSR（Guaranteed Service Refund，準點保證退費）退運費，但有申請期限，而且旺季常常暫停保證。","Air carries a money-back guarantee; Ground does not. A late air parcel can be claimed back as a GSR refund, but the filing window is short and the guarantee is often suspended over peak."],["p","國際線是另外一組：Worldwide Express Plus、Worldwide Express、Worldwide Saver、Worldwide Expedited。用國際費率表和「國家 Zone」，不是美國國內的 Zone，還要處理關稅和報關。","International is a separate family: Worldwide Express Plus, Worldwide Express, Worldwide Saver and Worldwide Expedited. They use international tables and a country-based zone, not the US domestic one, and bring duties and customs with them."],["a","這個工具只算 Ground。想練空運，費率表、Zone、燃油三樣都要換成空運的。只把燃油改成空運比例、費率表還是 Ground 的，算出來只能當練習，不能拿去對帳。","This tool only rates Ground. Practising air means swapping all three -- table, zone and fuel. Changing only the fuel percentage while the base stays Ground gives you practice, not a reconciliation."],["h","帳單的三種層別：一票可能出現好幾次","The three invoice layers: one shipment, several lines"],["p","同一個追蹤號（Tracking Number）在帳單上出現兩三次，是很正常的事。因為每一列都屬於一個「層別」。","The same tracking number appearing two or three times on an invoice is normal, because every line belongs to a layer."],["t",[["層別","Layer"],["代表什麼","What it is"]],[["SHP",["寄出那一趟","The outbound movement"]],["RTN",["退回那一趟","The return movement"]],["ADJ",["事後更正","A correction made afterwards"]]]],["p","ADJ 不是新的包裹，是對「已經收過錢的那個追蹤號」補收或退還。它可能出現在下一期，甚至隔兩期的帳單上。","An ADJ is not a new parcel. It adds to or refunds a tracking number already billed, and it can land one or even two invoice periods later."],["a","所以算一票真正的成本，要把同一個追蹤號的三層全部加起來。只看 SHP 那一列，會低估。","So the true cost of a shipment is all three layers added together. Reading only the SHP line understates it."],["h","事後更正：帳單上最常見的意外","Corrections: the most common invoice surprise"],["p","有兩筆錢完全不會出現在報價裡，卻幾乎每個月都出現在帳單上。","Two charges never appear in a quote and turn up on almost every invoice."],["p","第一筆是 Shipping Charge Correction（運費更正）。UPS 的分揀場有自動量測設備，包裹經過時會重新秤重、重新量尺寸。如果跟你申報的不一樣，就補收差額，另外再加一筆稽核費。","The first is a shipping charge correction. UPS hubs have automated measuring equipment that re-weighs and re-measures every parcel on the way through. If it differs from what you declared, they bill the difference and add an audit fee on top."],["p","對策在出貨端，不在對帳端：秤要準、尺寸要量對。真的要爭議，需要磅單和量測照片，而且有申請期限，拖越久越難翻。","The fix is on the dock, not at the desk: weigh properly and measure properly. Disputing one needs the scale ticket and photographs, and there is a filing window -- the longer you wait, the harder it gets."],["p","第二筆是 Address Correction（地址更正）。地址不完整、門牌號碼錯、公寓沒寫幾樓、住商寫反，UPS 幫你查出正確地址就收一筆。改兩次收兩筆。","The second is an address correction. An incomplete address, a wrong house number, a missing apartment number, residential and commercial the wrong way round -- UPS works out the right one and bills for it. Two corrections, two charges."],["a","這兩筆都是「資料錯誤」造成的，也就是說，都可以靠內部流程壓下來。它們是整張帳單上最容易改善的部分。","Both exist purely because of bad data, which means both can be reduced by internal process. They are the most improvable lines on the whole invoice."],["h","旺季附加費（Demand Surcharge）","Peak surcharges (demand surcharges)"],["p","UPS 把旺季加價叫 Demand Surcharge，帳單上就印這個字。每年大約從九月底或十月底開始，到隔年一月中結束，確切日期每年公告一次。","UPS calls its peak charges demand surcharges, and that is the word printed on the invoice. They run from late September or late October to mid-January, with the exact dates announced each year."],["p","期間會切成三段，中間那一段最貴。以 2025-26 為例：第一段十月底到十一月中旬，第二段十一月下旬到十二月下旬（黑五到聖誕，最重的一段），第三段十二月底到一月中，價格再降回來。","The period is cut into three, and the middle one is dearest. In 2025-26 the first ran from late October to mid-November, the second from late November to late December -- Black Friday through Christmas, the heaviest window -- and the third from late December to mid-January, stepping back down."],["h","Demand Surcharge 分成四組","The four families of demand surcharge"],["t",[["組別","Family"],["針對什麼","Applies to"],["2025-26 每件金額","2025-26 per package"]],[[["包裝特性","Package characteristics"],"Demand — Additional Handling","$8.25 - $10.80"],["","Demand — Large Package","$90.50 - $107.00"],["","Demand — Over Maximum Limits","$485 - $540"],[["服務別","Service level"],["Air、Ground Residential、Ground Saver","Air, Ground Residential, Ground Saver"],"$0.40 - $2.05"],[["大量出貨客戶","High-volume shippers"],["每週超過 2 萬件的帳號，改用另一張表","Accounts over 20,000 packages a week move to a separate table"],["依當週量而定","Varies with that week's volume"]],[["國際進出口","International"],["2024 年 9 月起大致歸零","Largely set to zero since September 2024"],"$0.00"]]],["a","金額是 2025-26 那一輪的量級，給你一個概念用的。2026-27 的公告通常在七、八月出來，實際數字請查當期公告。","Those amounts are the scale of the 2025-26 round, for a sense of magnitude only. The 2026-27 schedule is normally published in July or August; use the notice in force for actual figures."],["h","Demand Surcharge 是加上去的，而且會疊","Demand surcharges are added, and they stack"],["p","UPS 的條款寫得很清楚：Demand Surcharge apply in addition to all other applicable charges。一件包裹符合多個條件時，多筆會同時收。","The UPS terms are explicit that demand surcharges apply in addition to all other applicable charges. Where a package meets more than one criterion, more than one is charged."],["f","例：Zone 2 商業的大型包裹，2025 年 11 月下旬到 12 月下旬\n$219.50（LPS）＋ $107.00（Demand — Large Package）＝ $326.50","Example: a Zone 2 commercial large package between late November and late December 2025\n$219.50 (large package surcharge) + $107.00 (demand) = $326.50"],["a","而且這 $326.50 只是尺寸相關的部分，住宅、燃油、最低計費重量都還沒加。旺季一件超大件的總成本很容易失控，這就是為什麼旺季前要先把大件 SKU 的走法決定好。","And that $326.50 is only the size-related part -- residential, fuel and the weight floor are all still to come. The total on one oversized parcel at peak runs away quickly, which is why the routing for bulky SKUs should be decided before the season starts."],["h","大量出貨客戶的算法不一樣","High-volume accounts are calculated differently"],["p","2024 年 10 月之後，任何一週的件數超過兩萬的帳號，會改用 Higher Volume Shipper 那張表。它不是固定金額，而是每週比對你當週的量和基準期的平均量，算出一個百分比，再決定那一週每件收多少。","An account that ships more than 20,000 packages in any week after October 2024 moves onto the higher volume shipper table. It is not a flat amount: each week your volume is compared against a baseline average as a percentage, and that percentage sets the per-package charge for the week."],["a","所以同一個客戶、同一種包裹，這週和下週的旺季加價可能不一樣——量衝上去，單價跟著上去。而且一旦達到門檻，之後所有服務別都適用。","So the same customer with the same parcel can pay different peak amounts week to week: volume up, unit charge up. And once the threshold is met it applies across every service level from then on."],["a","十一月十二月帳單突然變貴，先查是不是 Demand 那幾行，不要急著懷疑費率表被改掉。","When November and December come in dear, look for the demand lines first rather than assuming the rate table changed."],["h","申報價值與代收貨款","Declared value and C.O.D."],["p","沒有申報價值的時候，UPS 的基本責任額只有 100 美元。東西丟了值一千塊，也只賠一百。要保到更高就要申報價值，按申報金額分級收費，有最低收費。","With no declared value, UPS's basic liability is 100 US dollars. Lose a thousand-dollar item and you get a hundred. Covering more means declaring the value, charged in bands with a minimum."],["p","C.O.D.（Cash on Delivery，代收貨款）是 UPS 幫你在送達時收錢再匯回來，一票一筆固定費用。現在很少用，但合約裡通常還留著。","C.O.D., cash on delivery, has UPS collect payment at the door and remit it, at a flat fee per shipment. Rare now, but usually still in the contract."],["h","週六與時段服務","Saturday and timed service"],["p","週六派送和週六收件是兩筆不同的費用，各收各的。平日不收，只有週六收。","Saturday delivery and Saturday pickup are two separate charges, and only on Saturdays."],["p","指定上午送達的服務（2nd Day Air A.M.、Next Day Air）本來就比較貴，那是「費率高」，不是「多收一筆附加費」。這兩件事不要記混。","Morning-commitment services such as 2nd Day Air A.M. and Next Day Air simply rate higher. That is a dearer rate, not an extra surcharge. Do not file them together."],["h","退貨與二次運送","Returns and second movements"],["p","RTN 那一層是包裹回頭的運費。被拒收、查無此人、超過留置天數沒人領，都會退回，回程照樣算一趟運費。","The RTN layer is the freight on the way back. Refused, undeliverable, or held past the limit -- the return leg is charged like any other movement."],["p","Return Service（退貨標籤、Call Tag）是客戶主動開的。帳單上會看到標籤費，加上回程運費，兩筆。","Return Service -- a return label or a call tag -- is raised by the customer. The invoice shows a label fee plus the return freight, two charges."],["a","改地址、改留置點這種二次派送，那一段要用它自己的 Zone 算，不是沿用原本那一趟的 Zone。這一點很多人會直接沿用，然後怎麼算都差一點。","A second movement such as a delivery change is rated on its own zone, not the zone of the original leg. People reuse the original zone and then wonder why the numbers are always slightly out."],["h","誰付錢：付款方式與帳號","Who pays: billing terms and account numbers"],["p","運費可以寄件人付、收件人付、或第三方付。收件人付和第三方付各有一筆手續費，比寄件人付貴。","Freight can be billed to the shipper, the receiver or a third party. Receiver and third-party billing each carry a fee that shipper billing does not."],["p","帳號填錯或漏填，UPS 會直接改由寄件人付款，並加收一筆處理費。這一筆純粹是打錯字造成的。","A missing or invalid account number gets rebilled to the shipper with a handling fee on top. That charge exists purely because someone mistyped."],["h","哪些附加費要吃燃油","Which surcharges take fuel"],["p","燃油不是所有東西都吃。原則是：跟「運送這件事」有關的吃，純行政性質的不吃。","Fuel does not apply to everything. The principle: charges connected to moving the parcel take it, purely administrative ones do not."],["t",[["項目","Charge"],["吃燃油嗎","Takes fuel?"]],[[["基本運費","Base transportation"],["要","Yes"]],[["AHS / LPS","AHS / LPS"],["要","Yes"]],[["住宅附加費 / DAS","Residential / DAS"],["要","Yes"]],[["地址更正","Address correction"],["不要","No"]],[["運費更正稽核費","Shipping charge correction audit fee"],["不要","No"]],[["帳號錯誤處理費","Invalid account handling fee"],["不要","No"]]]],["a","這份清單每年會動，不要憑印象。數字對不上的時候，回頭查當期公告的燃油適用範圍。","This list moves from year to year, so do not go from memory. When the arithmetic will not close, go back to the fuel schedule in force for that period."],["h","每年調價","The annual rate increase"],["p","UPS 每年年底公告隔年的調幅，近幾年多在 5% 到 7% 之間。但那是「平均」，不是每一格都調同一個數。","UPS announces next year's increase at the end of each year, lately five to seven per cent. That is an average, not a number applied to every cell."],["p","而且附加費是分開調的，常常調得比運費更兇。只看新聞標題那個百分比，一定會低估明年的成本。","Surcharges are revised separately and often rise faster. Reading only the headline percentage always understates next year."],["a","最關鍵的一句：客戶合約談的是「折扣」，不是「價格」。公布費率漲了、折扣沒動，客戶的帳單照樣漲。這句話每年都要跟客戶講一次。","The line that matters: a contract negotiates a DISCOUNT, not a price. When the published rate rises and the discount does not, the customer's invoice rises with it. Say this to the customer once a year."],["h","完整走一遍","One parcel, start to finish"],["p","用工具的預設案例走一次：10 磅，20 × 15 × 10 英吋，寄到商業地址，Zone 8，燃油 18%。","Walk the tool's default case: 10 lb, 20 x 15 x 10 in, to a business address, zone 8, fuel at 18%."],["t",["",["做什麼","What you do"],["得到","Result"]],[["1",["查 Zone","Look up the zone"],"8"],["2",["三邊由大到小排","Sort the sides"],"20 / 15 / 10 in"],["3",["算長度加周長 20 + 2×(15+10)","Length + girth: 20 + 2 x (15 + 10)"],"70 in"],["4",["對照 AHS/LPS 門檻，沒有一項超過","Against the AHS/LPS thresholds -- nothing over"],["無附加費","no surcharge"]],["5",["材積重 3,000 ÷ 139 = 21.58，進位","DIM: 3,000 / 139 = 21.58, round up"],"22 lb"],["6",["22 lb 對上 Zone 8 查費率表","22 lb against zone 8 in the table"],"$44.93"],["7",["燃油 (44.93 + 0) × 18%","Fuel: (44.93 + 0) x 18%"],"$8.09"]]],["f","$44.93 ＋ $0.00 ＋ $8.09 ＝ $53.02　　一個 10 磅的箱子，最後照 22 磅收。","$44.93 + $0.00 + $8.09 = $53.02   A 10 lb box, billed on 22 lb."],["p","自己動手改改看：把長邊從 20 改成 50，看它怎麼跳到 AHS；改成 100，看它怎麼變成 LPS 而且重量被拉到 90 磅。改完按重新計算，工具會把每一步攤開給你看。","Now change things. Push the long side from 20 to 50 and watch AHS appear; push it to 100 and watch LPS take over and the weight get floored at 90 lb. Press calculate again and the tool lays every step out."],["h","一票對不上的時候，照這個順序查","When a shipment will not reconcile, work down this list"],["p","八成的問題停在前三步。不要一開始就懷疑費率表。","Four out of five stop inside the first three steps. Do not start by blaming the rate table."],["t",["",["先確認","Check"],["最常見的錯","Most common failure"]],[["1",["服務種類","Service"],["空運當成 Ground 查表","An air parcel rated against the Ground table"]],["2",["層別 SHP / RTN / ADJ","Layer"],["把 ADJ 當成新的一票","An ADJ counted as a separate shipment"]],["3",["Zone","Zone"],["用錯寄件地的 Zone Chart","The wrong origin's zone chart"]],["4",["計費重量","Billable weight"],["忘了材積重，或忘了最低計費重量","DIM weight or the minimum billable weight forgotten"]],["5",["地址類型","Address type"],["UPS 判住宅，你以為是商業","UPS said residential, you assumed commercial"]],["6",["附加費","Surcharges"],["AHS 疊在 LPS 上面","AHS stacked on top of LPS"]],["7",["DAS","DAS"],["以為 Zone 小就不會有 DAS","Assuming a low zone rules DAS out"]],["8",["燃油","Fuel"],["用錯週別、用帳單日、3 Day Select 抓成陸運表","Wrong week, invoice date used, or 3 Day Select read off the ground table"]],["9",["費率表","Rate table"],["用公布費率而不是客戶的表","Published rates instead of the customer's own"]]]],["h","名詞速查","Quick glossary"],["t",[["名詞","Term"],["意思","Meaning"]],[["Zone",["距離代號，Ground 用 2-8","Distance code; Ground uses 2-8"]],["DIM Weight",["材積重量，長寬高相乘除以 139","Dimensional weight: L x W x H / 139"]],["L + Girth",["長度加周長，抓細長件用的","Length plus girth; what catches long thin parcels"]],["AHS",["額外處理費，小麻煩","Additional handling; the mild grade of awkward"]],["LPS",["大型包裹附加費，大麻煩","Large package surcharge; the severe grade"]],["DAS",["偏遠地區附加費，看收件 ZIP 清單","Delivery area surcharge; driven by a destination ZIP list"]],["SHP / RTN / ADJ",["寄出 / 退回 / 事後更正","Outbound / return / adjustment"]],["GSR",["準點保證退費，空運才有","Guaranteed service refund; air only"]],["C.O.D.",["代收貨款","Cash on delivery"]],[["Over Max","Over Max"],["超過包裹上限的罰款","The penalty for exceeding the parcel limits"]]]]],"GUIDE_HEAD":{"zh":["UPS Ground 計費筆記","一個包裹的運費組成與計算流程。搭配計費工具使用。"],"en":["UPS Ground Billing - Working Notes","How the charges on one parcel are built up and calculated. Use alongside the tool."],"es":["Facturación de UPS Ground - Apuntes de trabajo","Cómo se arman y se calculan los cargos de un paquete. Se usa junto con la herramienta."]},"GUIDE_FOOT":{"zh":"工具內是示範費率，教學用，不是 UPS 公布費率。正式作業核對當期 UPS 費率與客戶合約。","en":"The tool ships demonstration rates for training, not published UPS rates. For live work, check against current UPS rates and the customer contract s yet","Todavía no acabamos las de la semana pasada"]],["boss",["今天先清一半出來","Clear half of it today","Saquen la mitad hoy"]],["right",["馬上處理","On it","Ahora mismo"]]]],"MORNING_TOPIC":[["boss",["今天三張進倉、兩張出貨","Three inbound and two outbound today","Hoy tres ingresos y dos salidas"]],["left",["先收哪一張？","Which one first?","¿Cuál recibimos primero?"]],["boss",["先收要上架的，出貨的板午休後再打","Putaway first. We'll build the outbound pallets after lunch","Primero el que se acomoda. Las tarimas las armamos después de comer"]],["right",["好，我去開線","Got it, I'll start the line","Va, yo arranco la línea"]]],"CALL_LINE":["boss",["大家過來一下","Everyone come over for a minute","Acérquense tantito"]],"MEET_LINE":130,"MEET_TAIL":60,"SCOLD_LINE":150};
