const FLAGS = {autoahs:true,autolps:true,usemin:true,residential:true,pobox:false,peak:false,
               signature:false,ahspack:false,das:"none",omax:true,carrier:"ups"};
const num = k => { const n=parseFloat(V[k]); return isNaN(n)?0:n; };

function lookupBase(weight, zone){
  const z=String(zone).trim(), T=D.RATES;
  const rowFor=w=>T[String(w)]||T[String(w)+".0"]||T[String(w.toFixed?w.toFixed(1):w)];
  const breaks=Object.keys(T).map(Number).filter(w=>{const r=rowFor(w);return r&&r[z]!==undefined;}).sort((a,b)=>a-b);
  for(const w of breaks) if(weight<=w) return [rowFor(w)[z], w];
  return [null,null];
}
function calc(){
  const out={warn:[],lines:[],steps:[]};
  let w=num("weight"), l=num("length"), wd=num("width"), h=num("height");
  const div=num("divisor");
  if(div===0){ out.error="DIM Divisor cannot be 0"; return out; }
  const dims=[l,wd,h].sort((a,b)=>b-a);
  const [longest,second,third]=dims;
  const lg=longest+2*(second+third), cubic=l*wd*h, dim=cubic/div;
  const zone=(V.zone||"5").trim(), zoneN=parseFloat(zone)||0;
  const cubeMin=num("dimcube"), zoneMin=num("dimzone");
  let dimSkip="";
  if(cubeMin<0) dimSkip="service";
  else if(cubeMin>0 && cubic<=cubeMin) dimSkip="cube";
  else if(zoneMin>0 && zoneN<zoneMin) dimSkip="zone";
  const dimUsed = dimSkip?0:dim;
  const standard=Math.ceil(Math.max(w,dimUsed));
  // AHS / LPS — all thresholds are STRICTLY greater than
  const aw=[],az=[],lp=[];
  if(FLAGS.autoahs){
    if(w>num("ahsw")) aw.push([w,num("ahsw")]);
    if(longest>num("ahsl")) az.push(["longest",longest,num("ahsl")]);
    if(second>num("ahss")) az.push(["second",second,num("ahss")]);
    if(lg>num("ahsg")) az.push(["lg",lg,num("ahsg")]);
    if(num("ahscu")>0 && cubic>num("ahscu")) az.push(["cubic",cubic,num("ahscu")]);
  }
  if(FLAGS.autolps){
    if(w>num("lpsw")) lp.push(["weight",w,num("lpsw")]);
    if(longest>num("lpsl")) lp.push(["longest",longest,num("lpsl")]);
    if(lg>num("lpsg")) lp.push(["lg",lg,num("lpsg")]);
    if(num("lpscu")>0 && cubic>num("lpscu")) lp.push(["cubic",cubic,num("lpscu")]);
  }
  // Over Maximum Limits
  const over=[]; let overW=false;
  if(num("maxw")>0 && w>num("maxw")){ over.push(["actual weight",w,num("maxw"),"lb"]); overW=true; }
  if(num("maxl")>0 && longest>num("maxl")) over.push(["longest side",longest,num("maxl"),"in"]);
  if(num("maxlg")>0 && lg>num("maxlg")) over.push(["length + girth",lg,num("maxlg"),"in"]);
  const omax = over.length>0 && !overW && FLAGS.omax && FLAGS.carrier==="ups" && num("omaxfee")>0;
  if(over.length && !omax){
    out.refused=true;
    out.over=over;
    return out;
  }
  const isLPS=lp.length>0, isAHS=!isLPS && (aw.length>0||az.length>0||FLAGS.ahspack);
  // minimum billable weight floor
  let floor=0, floorWhy="";
  if(FLAGS.usemin){
    if(isLPS){ floor=num("lpsmin"); floorWhy="LPS"; }
    else if(isAHS){ floor=num("ahsmin"); floorWhy="AHS"; }
  }
  if(num("balloonlg")>0 && lg>num("balloonlg") && num("balloonmin")>floor){
    floor=num("balloonmin"); floorWhy="balloon";
  }
  const final=Math.max(standard,floor);
  const [base,brk]=lookupBase(final,zone);
  if(base===null){
    // 費率表最高只到 150 lb。計費重量被材積或最低重量推過表頂時，沒有
    // 基本運費可以查——照桌面版的規矩，這種情況要說「查不到」，不能用
    // 外插硬湊一個數字出來。
    const T=D.RATES, top=Math.max(...Object.keys(T).map(Number));
    if(final>top) out.error=(lang==="zh"
        ? `計費重量 ${final} lb 超過費率表上限 ${top} lb，查不到基本運費。`
          + `這一件要改走貨運（LTL），或載入涵蓋此重量的費率表。`
        : `Billable weight ${final} lb is above the top of the rate table (${top} lb), `
          + `so there is no base rate to look up. This one moves as freight (LTL), `
          + `or load a rate table that covers it.`);
    else out.error=(lang==="zh"?`區域 ${zone} 在費率表裡沒有對應欄位。`
                               :`Zone ${zone} is not a column in the rate table.`);
    return out; }
  // surcharges
  const acc=[];
  const add=(k,label,amt)=>{ if(amt>0) acc.push([k,label,amt]); };
  /* USPS 這幾筆在規則表裡是 0，add() 遇到 0 就不會列。留著這幾行是為了
     讓三家走同一條計算路徑——差別放在資料裡，不要放在 if 裡面。 */
  if(FLAGS.residential) add("residential","Residential Surcharge",num("ressur"));
  if(FLAGS.das==="das")  add("das","Delivery Area Surcharge (DAS)",FLAGS.residential?num("dasres"):num("dascom"));
  if(FLAGS.das==="edas") add("edas","Extended DAS",FLAGS.residential?num("edasres"):num("edascom"));
  if(FLAGS.das==="ras")  add("ras","Remote Area Surcharge (RAS)",FLAGS.residential?num("rasres"):num("rascom"));
  if(FLAGS.signature) add("signature","Signature Fee",num("sigfee"));
  if(isLPS) add("lps","Large Package Surcharge (LPS)",
                FLAGS.residential?num("f_lps_r")||65:num("f_lps_c")||55);
  if(isAHS){
    if(aw.length) add("ahs_weight","Additional Handling - Weight",num("f_ahs_w")||30);
    if(az.length) add("ahs_size","Additional Handling - Size",num("f_ahs_s")||27);
    if(FLAGS.ahspack) add("ahs_pack","Additional Handling - Packaging",num("f_ahs_p")||18);
  }
  if(omax) add("omax","Over Maximum Limits",num("omaxfee"));
  if(FLAGS.peak){
    if(FLAGS.residential) add("pk_residential","Demand - Residential",num("pkres"));
    if(isAHS) add("pk_ahs","Demand - Additional Handling",num("pkahs"));
    if(isLPS) add("pk_lps","Demand - Large Package",num("pklps"));
    if(omax)  add("pk_omax","Demand - Over Maximum",num("pkomax"));
  }
  const accTotal=acc.reduce((s,a)=>s+a[2],0);
  const fuelPct=num("fuel");
  const fuel=(base+accTotal)*fuelPct/100;
  const total=base+accTotal+fuel;
  Object.assign(out,{w,l,wd,h,longest,second,third,lg,cubic,dim,dimUsed,dimSkip,
    standard,floor,floorWhy,final,zone,base,brk,acc,accTotal,fuelPct,fuel,total,
    isAHS,isLPS,aw,az,lp,omax});
  return out;
}
function carrierSeg(){

  ).join("") + `</div>`;

/* CJK glyphs are two columns wide in the monospace result panel, so padEnd()
   on its own leaves the money column ragged. Measure in columns instead. */
const colw = s => Array.from(String(s)).reduce((n,c)=>n+(/[\u1100-\u115F\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFF60\uFFE0-\uFFE6]/.test(c)?2:1),0);
const padR = (s,n)=> String(s)+" ".repeat(Math.max(1,n-colw(s)));
const padL = (s,n)=> " ".repeat(Math.max(1,n-colw(s)))+String(s);
/* label column is 36 wide, the amount is right-aligned in the next 12, so the
   decimal points line up whatever the label\u2019s language or length */
const money = (lab,v)=>
  "  "+String(lab)+" ".repeat(Math.max(1,36-colw(lab)))+padL(fmtMoney(v),12)+"\n";
function fmtMoney(v){ return "$"+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function renderResult(){
  const d=calc();
  if(d.error) return `<div class="warn">${esc(d.error)}</div>`;
  if(d.refused){
    let s=`<div class="warn"><b>Over Maximum Limits — cannot be rated as a parcel.</b>\n`;

       +"  \u00b7  "+g_("燃油","fuel")+" "+num("fuel")+"%\n\n";
  o+=`${g_("步驟 1：三邊排序","STEP 1: sort the three sides")}\n`;
  o+=`  ${g_("最長邊","longest")}  ${d.longest.toFixed(1)} in\n`;
  o+=`  ${g_("第二長邊","second")}   ${d.second.toFixed(1)} in\n`;
  o+=`  ${g_("第三長邊","third")}    ${d.third.toFixed(1)} in\n`;
  o+=`  ${g_("長度加周長","length + girth")} = ${d.longest.toFixed(1)} + 2 x (${d.second.toFixed(1)} + ${d.third.toFixed(1)}) = ${d.lg.toFixed(1)} in\n\n`;
  o+=`${g_("步驟 2：材積重","STEP 2: dimensional weight")}\n`;
  o+=`  ${g_("材積","cube")} = ${d.cubic.toFixed(0)} in3\n`;
  o+=`  ${d.cubic.toFixed(0)} / ${num("divisor")} = ${d.dim.toFixed(2)} lb\n`;
  if(d.dimSkip) o+=`  ▸ ${g_("不適用材積重","DIM does not apply")} (${d.dimSkip})\n`;
  o+=`\n${g_("步驟 3：實重與材積重取大","STEP 3: actual vs DIM, take the larger")}\n`;
  o+=`  ${g_("實重","actual")} ${d.w} lb  /  ${g_("材積重","DIM")} ${d.dimUsed.toFixed(2)} lb  ->  ${d.standard} lb\n`;
  o+=`\n${g_("步驟 4：附加費判定","STEP 4: surcharge triggers")}\n`;
  if(d.isLPS){ o+=`  LPS: ${g_("成立","yes")}\n`; d.lp.forEach(([k,v,t])=>o+=`    ▸ ${k} ${(+v).toFixed(1)} > ${t}\n`); o+=`  ▸ ${g_("LPS 吸收 AHS，不重複收","LPS absorbs AHS - not both")}\n`; }
  else if(d.isAHS){ o+=`  AHS: ${g_("成立","yes")}\n`;
    d.aw.forEach(([v,t])=>o+=`    ▸ weight ${(+v).toFixed(1)} > ${t}\n`);
    d.az.forEach(([k,v,t])=>o+=`    ▸ ${k} ${(+v).toFixed(1)} > ${t}\n`); }
  else o+=`  ${g_("無特殊附加費","no special surcharge")}\n`;
  if(d.floor>0) o+=`\n${g_("步驟 5：最低計費重量","STEP 5: minimum billable weight")}\n  ${d.floorWhy} -> ${g_("至少","at least")} ${d.floor} lb\n`;
  o+=`\n${g_("步驟 6：最終計費重量","STEP 6: final billable weight")}\n  ${d.final} lb`;
  if(d.floor>d.standard) o+=`  (${g_("被最低重量拉上來","raised by the floor")})`;
  o+=`\n\n${g_("步驟 7：計價","STEP 7: pricing")}\n`;
  o+=`  ${g_("區域","zone")} ${d.zone}  ${g_("重量級距","weight break")} ${d.brk} lb\n`;
  o+=money(g_("基本運費","Base transportation"), d.base);
  d.acc.forEach(([k,lab,amt])=>{ o+=money(lab,amt); });
  if(d.accTotal>0) o+=money(g_("附加費小計","Surcharges"), d.accTotal);
  o+=money(g_("燃油附加費","Fuel")+" "+d.fuelPct+"%", d.fuel);
  o+=`  ${"-".repeat(44)}\n`;
  o+=money(g_("總計","TOTAL"), d.total);
  return `<pre class="out">${esc(o)}</pre>
  <div class="small">${esc(g_("內建費率為示範用數字，非任何運輸商公告價。","Built-in rates are illustrative, not any carrier's published price."))}</div>`;
}

   後面幾個分頁的動畫。每一格是一個獨立的小場景，和第一分頁共用同一組
   繪圖原語（R/O/L/P/TXT_/box3d…），畫在自己的 canvas 上。

/* ---------------------------------------------------------------
   畫布解析度：backing store 原本固定 900x560，在 3 倍 DPR 的手機上被
   放大到 1170 實體像素才顯示，等於先縮小再放大——線條全部糊掉，放大
   模式更明顯（900 拉到 2500 以上）。這裡把 backing store 對齊實際顯示
   尺寸乘上 DPR，再用 setTransform 把座標系縮回 900x560，所有繪圖程式
   一行都不用改。
   --------------------------------------------------------------- */
function fitHiDPI(cv, W, H){
  const dpr = Math.min(3, (typeof window!=="undefined" && window.devicePixelRatio) || 1);
  const r = cv.getBoundingClientRect();
  /* 轉 90 度之後 getBoundingClientRect 回的是轉過的外框，長寬會對調，
     拿它去配背板尺寸會整個糊掉。轉的時候用我們自己算的寬度。 */
  const cssW = cv._forceCss || r.width || W;
  const px = Math.max(W, Math.round(cssW * dpr));
  const py = Math.round(px * H / W);
  if(cv.width !== px || cv.height !== py){ cv.width = px; cv.height = py; }
  const ctx = cv.getContext("2d");
  const k = px / W;
  ctx.setTransform(k,0,0,k,0,0);          /* 指定後才畫，之後 save/restore 都相對它 */
  cv._k = k; cv._cssW = cssW;
  return ctx;
}
/* 顯示寬度變了（轉向、進出放大）就重新配一次，不然轉向後又是糊的 */
function refitIfNeeded(cv, W, H){
  if(!cv || !cv.isConnected) return null;
  const w = cv._forceCss || cv.getBoundingClientRect().width;
  if(Math.abs(w - (cv._cssW||0)) < 1) return null;
  return fitHiDPI(cv, W, H);
}

function subCanvas(id, w, h, drawFn){

  const c=document.getElementById(id); if(!c) return;
  const w=+c.dataset.w, h=+c.dataset.h;
  SUB[id]={c:c, ctx:fitHiDPI(c,w,h), w:w, h:h, t:0, draw:drawFn};

function runSubs(dt){

  for(const id in SUB){

}

function plazaCrowd(t,w,base,h,near){
  /* 同一排等速、等距、同方向，排內永遠不會互相重疊；交錯是靠排與排之間。

  const k=nightK()*0.6;

  rows.forEach(([dy,sc,sp,dir,per],ri)=>{

      /* 各自的步速：老人家走得慢，年輕人快一點。同速一起飄過去像貼圖捲動。 */
      const drift=(t*sp*W.sp+i*gap)%span;
      const px=dir>0?drift-100:(w+100-drift);
      if(px<-40||px>w+40) continue;
      const ph=t*0.24*W.sp+i*1.7;
      const wxk=wxNow().kind, wet=(wxk==="rain"||wxk==="storm"), cold=(wxk==="snow");

      const gear = wet ? (W.rain||"none") : (cold ? (W.cold||"coat") : "none");
      let coat = W.coat;
      if(gear==="poncho") coat="#F3C05B";            /* 黃色雨衣，遠遠就看得出來 */
      if(cold && W.coat!=="rainbow") coat=mix(W.coat,-0.10);

      if(gear==="umb") opt.armLift=17;                /* 舉傘的那隻手抬起來 */
      if(cold) opt.bodyW=(opt.bodyW||1)*1.08;         /* 冬天衣服厚一點 */
      person(px,y,ph, dusk(coat==="rainbow"?"#5A6675":coat,k), opt);
      if(coat==="rainbow"){
        g.save(); g.globalAlpha=1-k*0.55; rainbowCoat(px,y,sc); g.restore();
        /* 蓋掉軀幹之後手臂還在，不用重畫；領口補一條深邊才不會像色塊 */
      }

        const S2=v=>v*sc, hy2=y-S2(50);
        R(px-S2(13),hy2-S2(15),px+S2(13),hy2-S2(2),dusk("#F3C05B",k),dusk("#C99A2E",k),1);
        P([px-S2(17),y-S2(16),px+S2(17),y-S2(16),px+S2(14),y-S2(4),px-S2(14),y-S2(4)],
          dusk("#F3C05B",k),dusk("#C99A2E",k),1);
      }
      if(gear==="umb") umbrella(px,y,sc,dir,W.umbCol||"#C24B3A",k);
      if(cold){                                       /* 圍巾 */
        const S2=v=>v*sc, hy2=y-S2(50);

        R(px+S2(5)*dir,hy2+S2(13),px+S2(11)*dir,hy2+S2(26),dusk(W.scarf||"#C24B3A",k));
      }

/* 天況畫在天空與地面之間那一層：雨雪要蓋在房子和車前面（不然像下在
   背景的貼圖後面），但要在人和動物後面——雨絲蓋在臉上會看不清楚在做什麼。 */
function wxOverlay(x0,y0,x1,y1,t,gy){
  const W=wxNow(), k=W.kind, night=nightK()>=1;
  if(k==="clear") return;
  /* 天氣只畫到路面線為止。整片罩下來的話，鋪面會跟著灰壓、霧帶和閃電
     一起明暗跳動——看起來就是地板在動。地板不該參與天氣。 */
  if(gy!==undefined) y1=gy;
  const w=x1-x0, h=y1-y0;
  if(k==="cloud"||k==="drizzle"||k==="storm"||k==="rain"||k==="snow"){
    /* 陰天：整片壓一層灰藍，雲越重壓越多。毛毛雨也要壓——只有幾根細絲、
       天空還是大晴天的話，看起來不是在下雨，是螢幕有雜點。 */
    const a = k==="cloud"?0.09 : k==="drizzle"?0.08 : k==="storm"?0.20 : 0.12;
    R(x0,y0,x1,y1,"rgba(96,112,128,"+a+")");
  }
  if(k==="fog"){
    for(let i=0;i<4;i++){
      const fy=y0+h*(0.30+i*0.16)+Math.sin(t*0.006+i)*3;
      R(x0,fy,x1,fy+h*0.14,"rgba(214,222,228,"+(0.16-i*0.02)+")");
    }
    R(x0,y0,x1,y1,"rgba(214,222,228,0.14)");
  }
  if(k==="drizzle"||k==="rain"||k==="storm"){
    /* 三種雨勢差在密度、長度、速度和斜度。毛毛雨幾乎是直的、又細又慢；
       大雨明顯斜、又長又快；雷雨最密最斜。全部畫成同一種，分級就沒意義。
       雨要有遠近：遠的細、淡、短、慢，近的粗、亮、長、快。 */
    const gl = (gy===undefined?y1:gy);
    const SPEC = {
      drizzle:{layers:[[40,0.34,5,0.5],[26,0.50,7,0.8]], wind:1.0},
      rain:   {layers:[[34,0.50,7,0.8],[24,0.75,11,1.2],[13,1.05,16,1.7]], wind:3.0},
      storm:  {layers:[[46,0.55,9,0.9],[34,0.85,14,1.5],[20,1.20,20,2.1]], wind:5.5}
    }[k];
    SPEC.layers.forEach(([cnt,alpha,len,spd],li)=>{
      const col = night ? "rgba(186,208,228," : "rgba(224,238,248,";
      for(let i=0;i<cnt;i++){
        const seed=i*(97+li*53);
        const sx=x0+((seed*1.7 + t*spd*SPEC.wind) % (w+120)) - 60;
        const sy=y0+((seed*2.3 + t*spd*11) % (h+40)) - 20;
        if(sy>gl) continue;                        /* 地面以下不畫，雨不會下到地板裡 */
        L([sx,sy,sx-len*0.30*(SPEC.wind/3),sy+len], col+alpha.toFixed(2)+")",
          0.7+li*0.45,"round");
      }
    });
    /* 地上什麼都不畫。原本有水光和漣漪，但地板一動就整片在晃，
       看久了很煩——雨看得到就夠了，不需要地板跟著演。 */
  }
  if(k==="snow"){
    for(let i=0;i<54;i++){
      const sx=x0+((i*151.1+t*1.1+Math.sin(t*0.03+i)*14)%w);
      const sy=y0+((i*173.9+t*1.9)%h);
      O(sx-1.8,sy-1.8,sx+1.8,sy+1.8,"rgba(246,250,255,.88)");
    }
  }
  if(k==="storm"){
    /* 閃電：一道有分叉的電光從雲裡劈下來，整格跟著亮兩下（真的閃電就是
       這種兩段式）。只有白光沒有電光，那是曝光過度不是打雷。 */
    const PER=420, cyc=(t*0.6)%PER;
    const flash = (cyc<4) ? 0.42 : (cyc>8&&cyc<12 ? 0.30 : 0);
    if(cyc<14){
      /* 這一輪的落點固定：用第幾輪當種子，不然電光會每幀重抽變成閃爍雜訊 */
      const nth=Math.floor((t*0.6)/PER), hv=(nth*2654435761)>>>0;
      const bx=x0+w*(0.18+((hv%1000)/1000)*0.64);
      const seg=[[bx,y0]];
      let cx2=bx, cy2=y0;
      for(let i=1;i<=5;i++){
        cy2 = y0 + (h*0.62)*(i/5);
        cx2 += (((hv>>>(i*3))%21)-10) * (w/240);
        seg.push([cx2,cy2]);
      }
      const flat=[]; seg.forEach(pt=>{ flat.push(pt[0],pt[1]); });
      if(flash>0){
        L(flat,"rgba(255,255,255,.95)",3.2,"round");
        L(flat,"rgba(200,224,255,.55)",7,"round");
        /* 一道分叉，從中段岔出去 */
        const m=seg[3];
        L([m[0],m[1], m[0]+w*0.05, m[1]+h*0.16, m[0]-w*0.01, m[1]+h*0.28],
          "rgba(255,255,255,.75)",2,"round");
      }
    }
    if(flash>0) R(x0,y0,x1,y1,"rgba(255,255,255,"+flash+")");
    /* 雷聲晚於閃電：光先到、聲後到，這是每個人都知道的常識，
       同時發出來反而假。 */
    if(Math.floor(cyc)===26 && Math.floor((t*0.6)%1)===0) sfxThunder();
  }
}

/* =====================================================================
   各章專屬動畫。都畫在 420x150 的畫布上，座標相對 w/h，不吃 VP。
   取材自桌面版 v65 的中轉、RMA、倉租與打板段落。
   ===================================================================== */
function chGround(w,h,sky,grass){
  const G=Math.round(h*0.70);
  R(0,0,w,h,sky||"#BFD4E2");
  studField(0,0,w,G-16,22,"#FFFFFF",0.10);
  for(let i=0;i<Math.ceil(w/88)+1;i++)
    brk(-8+i*88,G-16,80+i*88,G,i%2?(grass||"#5A7F58"):mix(grass||"#5A7F58",-0.07),4);
  for(let i=0;i<Math.ceil(w/100)+1;i++)
    brk(-10+i*100,G,90+i*100,h,i%2?"#B3A895":"#A79C8A",4);
  return G;
}
function chBuilding(x,base,wid,col,tag){
  const t=Math.round(wid*0.62);
  brk(x,base-t,x+wid,base,col,4,mix(col,-0.28));
  R(x+8,base-t+9,x+wid-8,base-t+19,"#C9D8E0");
  R(x+wid/2-9,base-16,x+wid/2+9,base,mix(col,-0.30));
  if(tag) TXT_(x+wid/2,base-t-7,tag,"#2E3A2E",8,true);
}
function sceneCarrier(t,w,h){
  const HOR=96, ROAD=128;
  const TH=CARRIER_THEME[FLAGS.carrier]||CARRIER_THEME.ups;
  roadStrip(w,h,HOR,ROAD,["#5A7F58","#3C5A41"]);
  const NK=nightK();
  for(let i=0;i<7;i++){ const x=(i*150 - (t*0.6)%150);
    P([x,HOR,x+22,HOR-26,x+44,HOR],dusk("#3C5A41",NK)); }
  for(let x=-((t*2.2)%80);x<w;x+=80) R(x,h-30,x+38,h-26,dusk("#E6DCC8",NK));
  // house
  const hx=w*0.80;
  legoHouse(hx,ROAD);
  // van drives in, parks, driver walks a parcel to the door
  const cyc=(t*0.6)%520;
  let vx, phase;
  if(cyc<160){ vx=-240+(w*0.42+240)*(cyc/160); phase="drive"; }
  else if(cyc<420){ vx=w*0.42; phase="stop"; }
  else { vx=w*0.42+(w+260-w*0.42)*((cyc-420)/100); phase="drive"; }
  /* 包裹一放在門口就留在門口。舊版用 walk 這個來回值判斷手上有沒有貨，
     回程 walk 又降回 1 以下，等於司機把件再抱回車上。 */
  const dropped = cyc>=160+260*0.45;
  if(phase==="stop"){
    const u=(cyc-160)/260;
    const walk = u<0.45 ? u/0.45 : (u<0.6 ? 1 : 1-(u-0.6)/0.4);
    const dx = vx+210 + (hx-40-(vx+210))*Math.max(0,Math.min(1,walk));
    person(dx,ROAD+2,t*0.3,TH.uni,{sc:0.62,face:u<0.45?1:-1,skin:SKIN[1],
      cap:mix(TH.uni,-0.30), hold: dropped?null:[dx+12,ROAD-20]});
    if(!dropped) brk(dx+4,ROAD-30,dx+24,ROAD-14,C.kraft,1,C.wood2);
  }
  if(dropped) brk(hx-24,ROAD-14,hx-4,ROAD-2,C.kraft,1,C.wood2);
  /* 你的角色在門口等收件；司機走過來時面向他，件放下就低頭看貨。 */
  worker(hx+36, ROAD+2, phase==="stop"?t*0.16:0,
    avOpts({sc:0.60, face:-1, crouch:dropped?0.22:0}));
  // the van itself
  legoVan(vx,ROAD);
}
/* ---- tab5 尾程：住宅或商業、簽收或放門口 ---- */
function sceneDelivery(t,w,h){
  const HOR=96, ROAD=128;
  const TH=CARRIER_THEME[FLAGS.carrier]||CARRIER_THEME.ups;
  roadStrip(w,h,HOR,ROAD,["#5A7F58","#3C5A41"]);
  /* 路面虛線固定不動。原本寫成 -((t*2.2)%80) 每幀往左捲 2.2px，本意是
     表現車在跑，但這一格的鏡頭和車都是靜止的——只有地上的線在跑，
     看起來就是整片地板在滑動。 */
  for(let x=0;x<w;x+=80) R(x,h-30,x+38,h-26,dusk("#E6DCC8",nightK()));
  const res = FLAGS.residential;
  const po  = FLAGS.carrier==="usps" && FLAGS.pobox;   /* 郵政信箱 */
  const hx=w*0.78;
  if(po){
    strayCat(t,w,ROAD,false);
    /* 開著的那一格與招領單，跟下面的投遞週期同步 */
    /* 開著的那一格挑左下角那一列，剛好在郵差站的位置旁邊 */
    const c0=(t*0.6)%560;
    legoPOWall(hx,ROAD, (c0>=150&&c0<470)?15:-1, c0>=262, c0>=262);
  } else if(res){
    strayCat(t,w,ROAD,false);     /* 貓比房子遠：先畫貓，房子才擋得住牠 */
    legoHouse(hx,ROAD);
  } else {
    /* 商業：整條街是百貨。廣場鋪面先鋪，遠的那一排人流走在樓前面，
       樓再壓上去，最後才是收貨門——貨走側門，正門只有人。 */
    /* 廣場鋪滿整條路面。原本從 w*0.30 才開始鋪，左邊留著住宅版的磚面，
       中間一條硬邊把畫面切成兩種地板，看起來是破圖不是設計。 */
    legoPlaza(-20,w+20,ROAD+2,h);
    legoMall(w*0.545,ROAD-2);
    legoBay(hx-4,ROAD-2);
    /* 遠的那一排走在廣場上（base+6），比百貨的底線（base-2）近，所以要畫
       在樓之後。畫在樓之前，樓一壓上來就把人的頭和上半身吃掉，只剩兩截
       小腿露在騎樓外面。 */
    plazaCrowd(t,w,ROAD,h,false);
    strayCat(t,w,ROAD,true);      /* 廣場上的貓比那一排人還近，再往後畫 */
  }
  strays(t,w,h,ROAD,!res);        /* 畫在車之前：車開過來要擋得住那隻貓 */
  const cyc=(t*0.6)%560;
  const vx = cyc<150 ? -240+(w*0.40+240)*(cyc/150)
           : cyc<430 ? w*0.40
           : w*0.40+(w+260-w*0.40)*((cyc-430)/130);
  const dropped2 = cyc>=150+280*0.40;
  /* ---- 收件端：整輪都是你的角色，不是簽收那兩秒才冒出來的臨時演員 ----
     原本那位只在 u 0.45~0.62 之間畫，換算成整輪是 cyc 276~324；也就是
     一輪十五秒裡，門口有十秒是空的。這裡改成從頭到尾都站在那裡。 */
  const HOME = hx+(res?34:54), PCL = hx-8;   /* 商業要讓開門鈴與收貨時段牌 */
  /* 郵政信箱沒有人在門口等：件是郵差投進信箱，收件人晚點自己來領。
     擺一個角色站在信箱牆前面整輪不動，等於他在郵局大廳站了一整天。 */
  let wx=HOME, wcr=0, whold=null;
  if(cyc>=470){
    /* 等車身讓開再走過去把件收進門（cyc 483 車尾才過得了門口那一格），
       原本那件是留到 cyc 歸零才憑空消失。 */
    const go   = Math.min(1,(cyc-470)/40);
    const back = cyc>=528 ? Math.min(1,(cyc-528)/30) : 0;
    wx  = HOME + (PCL-HOME)*(go-back);
    wcr = (cyc>=510&&cyc<528) ? 0.24 : 0;
  }
  const picked = !po && cyc>=524;
  if(picked) whold=[wx+10,ROAD-20];
  const meeting = cyc>=232 && cyc<400;      /* 司機走到門口的那一段 */
  if(!po){
    worker(wx, ROAD+2, meeting?t*0.16:0,
           avOpts({sc:0.62, face:-1, crouch:wcr, hold:whold}));
    if(picked) brk(wx+2,ROAD-30,wx+22,ROAD-14,C.kraft,1,C.wood2);
  }
  if(cyc>=150&&cyc<430){
    const u=(cyc-150)/280;
    const walk = u<0.4? u/0.4 : (u<0.62?1:1-(u-0.62)/0.38);
    const dx=vx+210+(hx-40-(vx+210))*Math.max(0,Math.min(1,walk));
    person(dx,ROAD+2,t*0.3,TH.uni,{sc:0.62,face:u<0.40?1:-1,skin:SKIN[1],
      cap:mix(TH.uni,-0.30), hold: dropped2?null:[dx+12,ROAD-20]});
    if(!dropped2) brk(dx+4,ROAD-30,dx+24,ROAD-14,C.kraft,1,C.wood2);
    /* 住宅要簽收，商業放收貨口。簽收那張紙掛在角色身上，不是掛在空氣裡。 */
    if(FLAGS.signature && u>0.45 && u<0.62){
      R(HOME-26,ROAD-30,HOME-8,ROAD-18,"#F6F3E8","#B9AC93",1);
      TXT_(HOME-17,ROAD-24,"✓","#2E7D55",9,true);
    }
  }
  /* 可點的熱區。每一幀重建，所以視窗縮放、切住宅商業之後座標都還對得上。
     不畫任何提示框：畫面上該點的東西本來就長得像可以點的東西。 */
  DLV_HOT.length=0;
  /* USPS 那一頁切的是一般地址／PO Box，不是住宅／商業——那一家兩種地址
     同一個價，切了什麼也不會變。判斷要看運輸商，不是看現在是不是信箱那一版。 */
  DLV_HOT.push([hx-70,ROAD-96,hx+70,ROAD+4,
                FLAGS.carrier==="usps"?"po":"addr"]);          /* 房子／信箱牆 */
  DLV_HOT.push([vx,ROAD-70,vx+200,ROAD+6,"van"]);              /* 貨車 */
  if(!po) DLV_HOT.push([wx-22,ROAD-44,wx+22,ROAD+6,"who"]);    /* 門口那位 */
  /* 天況蓋在建物與車之後、人與動物之前 */
  wxOverlay(0,0,w,h,t,ROAD+2);
  /* 角落的氣溫牌：跟時鐘同一個城市。live 是抓到的，沒抓到就標一個點，
     不要假裝那是實測值。 */
  {
    /* 一行放不下城市又放溫度，兩個會疊在一起。城市名頂欄已經有了，
       這裡只留溫度和天況；抓不到即時資料就在後面標一個點。 */
    const W2=wxNow(), lab=triv(WX_NAME[W2.kind]||WX_NAME.clear);
    const txt=wxTempStr()+"  "+lab+(WX.live?"":"  \u00B7");
    g.font="11px "+CUTE_FONT;
    const tw=Math.max(72, g.measureText(txt).width+22);
    R(w-tw-8,8,w-8,30,"rgba(16,24,32,.58)");
    TXT_(w-8-tw/2,19,txt,"#F5EFE4",11,true);
  }
  /* 一般地址的件放在門口；信箱那一版沒有門口，件是投進信箱裡的，
     所以地上不留東西——留在地上就變成「郵差把包裹丟在郵局大廳」。 */
  if(dropped2 && !picked && !po) brk(hx-24,ROAD-14,hx-4,ROAD-2,C.kraft,1,C.wood2);
  legoVan(vx,ROAD);
  if(!res) plazaCrowd(t,w,ROAD,h,true);   /* 近的那一排走在車前面，才有前後 */
  /* 頂端那條說明橫幅拿掉了。畫面下方的切換鍵已經寫著現在是哪一種地址，
     場景本身也看得出來（房子還是店面、有沒有信箱），再壓一條黑底白字
     橫跨整個天空，只是把畫面切成兩半。 */
}

/* =====================================================================
   封面 hero：同一組 Lego 原語畫的倉庫定裝場。會動，但不接受操作——
   封面的唯一互動是語言鍵與 START。座標全部相對 w/h，不吃 VP。
   ===================================================================== */
/* 方形的 App 圖示：跟封面同一套畫法，但構圖重排成正方形，而且只留大形狀
   ——圖示在手機上只有 60px 左右，細節放進去只會糊成一團。 */
function sceneIcon(t,w,h){
  const FLOOR=h*0.78;
  const gd=g.createLinearGradient(0,0,0,FLOOR);
  gd.addColorStop(0,"#FDF3E3"); gd.addColorStop(1,"#F6DCC0");
  g.fillStyle=gd; g.fillRect(0,0,w,FLOOR);
  studField(0,0,w,FLOOR,w*0.13,"#FFFFFF",0.20);
  O(w*0.72,h*0.06,w*0.97,h*0.31,"#FFD98A");            /* 太陽 */
  O(w*0.76,h*0.10,w*0.93,h*0.27,"#FFE9B4");
  [[0.20,0.16,0.13],[0.44,0.10,0.09]].forEach(([fx,fy,fr])=>{
    O(w*(fx-fr*1.5),h*(fy-fr*0.6),w*(fx+fr*1.5),h*(fy+fr*0.6),"rgba(255,255,255,.8)");
    O(w*(fx-fr*0.9),h*(fy-fr*0.95),w*(fx+fr*0.5),h*(fy+fr*0.45),"rgba(255,255,255,.8)"); });
  /* 地板 */
  const CH=(h-FLOOR)/2, F1="#E4C9A6", F2="#DCBE97";
  for(let i=0;i<6;i++) brk(-w*0.05+i*w*0.2, FLOOR,      w*0.14+i*w*0.2, FLOOR+CH, i%2?F1:F2,3);
  for(let i=0;i<7;i++) brk(-w*0.15+i*w*0.2, FLOOR+CH,   w*0.04+i*w*0.2, h,        i%2?F2:F1,3);
  /* 主角：貓在左、狗在右，臉朝彼此 */
  const s=w/512;
  const BIG_DOG=Object.assign({},DOG_BREEDS.corgi,{sz:DOG_BREEDS.corgi.sz*7.0*s});
  const BIG_CAT=Object.assign({},CAT_BREEDS.ragdoll,{sz:CAT_BREEDS.ragdoll.sz*9.6*s});
  catDraw(w*0.30, h*0.84, t, 1, false, 0, BIG_CAT);
  dog(w*0.71, h*0.84, t, -1, false, BIG_DOG);
  heart(w*0.50, h*0.30, 0);
}
function sceneCover(t,w,h){
  /* 封面改成從外面看的廠區：天空、樹、廠房、月台門、拖車、貨櫃、堆高機。
     前一版畫的是廠房「內部」，跟分頁裡那些場景是同一個視角，封面等於預告片
     卻放了正片的畫面。從外面看才交代得出「這是一個物流中心」。

     配色刻意壓住：天空用帶灰的藍，不用飽和的水藍。整張的重量要落在建築和
     車上，天空只是底——上一版就是因為底太亮，東西全部浮起來。

     實務上該有的東西一件不少：月台門有編號、車尾對著門倒車進來、
     月台前有橡膠防撞墊、地面有導引線和輪擋、場上有燈桿和圍籬。 */
  const GND = h-104;                       /* 地平線 */
  const SKY1="#93B0C6", SKY2="#C2D3DC";    /* 帶灰的天空藍 */
  const WALL="#CFC4B0", WALL2="#BCB098", TRIM="#8E8272";
  const DOOR="#8FA0AC", DOOR2="#6E7E8A";
  const TREE="#6E8A5E", TREE2="#5A7550", TRUNK="#7A5B3C";
  const YARD="#9AA3A8", YARD2="#8B959B";
  const TRL="#E4E7EA", TRL2="#C3C9CE";

  /* ── 天空 ── */
  const gd=g.createLinearGradient(0,0,0,GND);
  gd.addColorStop(0,SKY1); gd.addColorStop(1,SKY2);
  g.fillStyle=gd; g.fillRect(0,0,w,GND);
  /* 雲：三團圓的疊在一起，慢慢飄 */
  [[110,52,30],[300,36,22],[560,60,34],[430,84,18]].forEach(([cx,cy,r],i)=>{
    const dx=((t*0.10+i*160)%(w+220))-110;
    const x=cx*0+dx, b=Math.sin(t*0.02+i)*2;
    O(x-r*1.6,cy-r*0.56+b,x+r*1.6,cy+r*0.56+b,"rgba(255,255,255,.80)");
    O(x-r*0.95,cy-r*0.92+b,x+r*0.45,cy+r*0.40+b,"rgba(255,255,255,.80)");
    O(x+r*0.30,cy-r*0.70+b,x+r*1.30,cy+r*0.42+b,"rgba(255,255,255,.72)");
  });
  O(w-104,26,w-52,78,"rgba(255,246,214,.85)");            /* 太陽，收斂一點 */

  /* ── 天上的鳥。三隻，各自速度不同，飛出畫面就從另一邊繞回來 ── */
  [[0.18,58,0.22],[0.52,44,0.15],[0.78,72,0.28]].forEach(([u,by,sp],i)=>{
    const x=((t*sp+u*w+i*90)%(w+90))-45, y=by+Math.sin(t*0.05+i*2)*5, k=3.2-i*0.5;
    const flap=Math.sin(t*0.22+i)*0.5+0.5;
    L([x-k*2,y+k*flap, x,y-k*0.5, x+k*2,y+k*flap],"rgba(60,72,80,.55)",1.5,"round");
  });

  /* ── 遠處的樹線 ── */
  for(let x=-20;x<w+40;x+=46){
    const hh=20+((x*7)%3)*6;
    O(x-26,GND-52-hh,x+26,GND-6,"rgba(96,122,84,.45)"); }

  /* ── 廠房本體 ── */
  const BX=28, BW=w-176, BY=GND-176;                       /* 左上角與寬度 */
  R(BX,BY+18,BX+BW,GND,WALL,TRIM,1.5);                     /* 牆 */
  R(BX,BY+18,BX+BW,BY+40,WALL2);                           /* 牆頂的一道 */
  /* 屋頂。原本是一片素色三角形，看起來像紙板剪的。金屬浪板屋頂實際上有
     這幾件事：出簷、封簷板、屋脊蓋、板與板之間的接縫、迎光坡比背光坡亮，
     還有出簷投在牆上的一道影子。六樣都補上，屋頂才有厚度。 */
  {
    const RX0=BX-16, RX1=BX+BW+16, RY=BY-16, REV=BY+18;   /* 出簷加大到 16 */
    const RC="#A79B87";
    P([RX0,REV, BX+BW*0.5,RY, RX1,REV], RC, mix(RC,-0.16), 1.2);
    /* 兩坡各自的浪板接縫：從屋脊往下拉，不是水平線 */
    for(let u=0.10;u<1;u+=0.10){
      const mx=BX+BW*0.5;
      L([mx,RY, mx-(mx-RX0)*u, RY+(REV-RY)*u],"rgba(0,0,0,.07)",1.1);
      L([mx,RY, mx+(RX1-mx)*u, RY+(REV-RY)*u],"rgba(255,255,255,.11)",1.1);
    }
    P([BX+BW*0.5,RY, RX1,REV, BX+BW*0.5,REV],"rgba(255,255,255,.08)");  /* 迎光坡 */
    /* 屋脊蓋 */
    P([BX+BW*0.5-26,RY+7, BX+BW*0.5,RY-5, BX+BW*0.5+26,RY+7, BX+BW*0.5,RY+3],
      mix(RC,0.14), mix(RC,-0.20), 1.1);
    /* 封簷板＋出簷落在牆上的影子 */
    R(RX0,REV,RX1,REV+7,mix(RC,-0.08),mix(RC,-0.28),1.1);
    R(BX,REV+7,BX+BW,REV+11,"rgba(0,0,0,.14)");
    /* 屋脊上停一隻鴿子，偶爾動一下頭 */
    {
      const px=BX+BW*0.5+64, py=RY+((BX+BW*0.5+64)-(BX+BW*0.5))/((BX+BW+16)-(BX+BW*0.5))*(REV-RY);
      const hd=Math.sin(t*0.04)>0.86?1:0;
      O(px-5,py-9,px+4,py-2,"#6E7A84");
      O(px+2-hd,py-13,px+8-hd,py-8,"#5E6A74");
      L([px+7-hd,py-11,px+10-hd,py-10],"#C08A3E",1.4,"round");
      L([px-2,py-2,px-2,py+1],"#8A6A4A",1.2); L([px+1,py-2,px+1,py+1],"#8A6A4A",1.2);
    }
    /* 山牆通風百葉 */
    {
      const vx=BX+BW*0.5, vy=RY+16;
      P([vx-20,vy+9, vx,vy-11, vx+20,vy+9],"#8FA0AC","#6E7E8A",1);

/* 預設開聲音。瀏覽器不准在使用者按下第一顆鍵之前開 AudioContext，
   所以封面的 START 就是那一下手勢，按下去才真的建 context。 */
const SFX={on:true,ctx:null,master:null,hum:null};
function sfxInit(){
  if(SFX.ctx) return true;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  SFX.ctx=new AC(); SFX.master=SFX.ctx.createGain();
  SFX.master.gain.value=0.30; SFX.master.connect(SFX.ctx.destination); return true;
}
function tone(f0,f1,dur,type,vol,delay){
  if(!SFX.on||!SFX.ctx) return; const t0=SFX.ctx.currentTime+(delay||0);
  const o=SFX.ctx.createOscillator(), gn=SFX.ctx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  gn.gain.setValueAtTime(0.0001,t0);
  gn.gain.exponentialRampToValueAtTime(vol||0.4,t0+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); gn.connect(SFX.master); o.start(t0); o.stop(t0+dur+0.05);
}
function noise(dur,vol,freq,delay,type){
  if(!SFX.on||!SFX.ctx) return; const t0=SFX.ctx.currentTime+(delay||0);
  const n=Math.max(1,Math.floor(SFX.ctx.sampleRate*dur));
  const b=SFX.ctx.createBuffer(1,n,SFX.ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=SFX.ctx.createBufferSource(); s.buffer=b;
  const f=SFX.ctx.createBiquadFilter(); f.type=type||"lowpass"; f.frequency.value=freq||260;
  const gn=SFX.ctx.createGain(); gn.gain.value=vol||0.5;
  s.connect(f); f.connect(gn); gn.connect(SFX.master); s.start(t0);
}

  if(!SFX.ctx) return;

  try{ ZBOOK=JSON.parse(store("zbook")||"{}"); }catch(e){ ZBOOK={}; }
}
function lanesSave(){ store("lanes",JSON.stringify(LANES)); store("zbook",JSON.stringify(ZBOOK)); }
function dl(name,mime,content){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function readFileInto(inputEl, fn){
  const f=inputEl.files&&inputEl.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ fn(String(r.result)); }catch(e){ alert("\u26A0 "+(e.message||e)); } inputEl.value=""; };
  r.onerror=()=>alert("\u26A0 could not read "+f.name);
  r.readAsText(f);
}
function parseLanesCSV(text){
  const lines=String(text).replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  let n=0;
  lines.forEach((l,i)=>{
    const c=l.split(",").map(s=>s.replace(/^"|"$/g,"").trim());
    if(i===0 && /origin/i.test(c[0]||"")) return;
    if(c.length<3 || !c[0] || !c[1] || !c[2]) return;
    if(!/^[0-9]+$/.test(c[2])) throw new Error("Row "+(i+1)+": zone must be a number, got "+c[2]);
    LANES[c[0]+">"+c[1]]={zone:c[2], das:(c[3]||"").toLowerCase()}; n++;
  });
  if(!n) throw new Error("No lanes found. Columns: origin_zip, dest_zip, zone, das_tier.");
  lanesSave(); return n;
}
function lanesToCSV(){
  let s="origin_zip,dest_zip,zone,das_tier\n";
  const ks=Object.keys(LANES);
  if(!ks.length) return s+"23320,90210,8,das\n23320,10001,7,\n";
  ks.forEach(k=>{ const [o,d]=k.split(">"), v=LANES[k]; s+=o+","+d+","+v.zone+","+(v.das||"")+"\n"; });
  return s;
}
function parseZoneChart(text, origin3){
  if(!/^[0-9]{3}$/.test(origin3||""))
    throw new Error(lang==="zh"
      ? "\u5148\u628a\u8d77\u904b ZIP \u586b\u597d\uff08\u81f3\u5c11\u524d\u4e09\u78bc\uff09\u518d\u532f\u5165\u3002"
      : "Fill in the origin ZIP (at least three digits) before importing.");
  const rows=[];
  String(text).split(/\r?\n/).forEach(l=>{
    const m=l.match(/^\s*"?(\d{3})(?:\s*-+\s*(\d{3}))?"?\s*,\s*"?(\d{1,3})"?/);
    if(m) rows.push([+m[1], +(m[2]||m[1]), m[3]]);
  });
  if(!rows.length) throw new Error("No zone rows found. Expected lines like 004-005,6,\u2026");
  ZBOOK[origin3]=rows; lanesSave(); return rows.length;
}
function zoneFor(zf,zt){
  zf=String(zf||"").trim(); zt=String(zt||"").trim();
  if(!zf||!zt) return null;
  const lane=LANES[zf+">"+zt]; if(lane) return lane;
  const o3=zf.slice(0,3), d3=parseInt(zt.slice(0,3),10), book=ZBOOK[o3];
  if(book && !isNaN(d3)) for(const [lo,hi,z] of book) if(d3>=lo && d3<=hi) return {zone:z, das:""};
  return null;
}
function zoneAutofill(){
  const zf=document.getElementById("zipFrom"), zt=document.getElementById("zipTo"),
        out=document.getElementById("zoneHit");
  if(!zf||!zt) return;
  const hit=zoneFor(zf.value,zt.value);
  if(hit){
    V.zone=String(hit.zone);
    const zi=document.getElementById("v_zone"); if(zi) zi.value=V.zone;
    if(["das","edas","ras"].indexOf(hit.das)>=0){
      FLAGS.das=hit.das;
      const seg=document.getElementById("segDas");
      if(seg) seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===FLAGS.das));
    }
    if(out) out.textContent="Zone "+hit.zone+(hit.das?"  \u00b7  "+hit.das.toUpperCase():"");
  } else if(out) out.textContent=(zf.value&&zt.value)?"\u2014":"";
}

function guideBody(rowsIn){
  const li=lang==="zh"?1:2;
  let o="";
  (rowsIn||D[guideSet().g]).forEach(row=>{
    const k=row[0];
    if(k==="h"){
      const t=String(row[li]||"")+" "+String(row[2]||"");   /* 中英一起比對關鍵字 */
      o+='<h3 class="gh"><svg viewBox="0 0 48 48" aria-hidden="true">'
        + guideArt(t) + '</svg><span>'+esc(row[li])+'</span></h3>';
    }
    else if(k==="p") o+="<p>"+esc(row[li])+"</p>";

    else if(k==="a") o+='<div class="as">'+esc(row[li])+"</div>";

      o+="</table>";

  });

}

const BZ_C=3, BZ_R=3, BZ_W=150, BZ_H=96, BZ_GX=42, BZ_GY=18;
const BZ_X0=(GW-BZ_C*BZ_W-(BZ_C-1)*BZ_GX)/2, BZ_Y0=76;
function bzCell(i){ const c=i%BZ_C, r=(i/BZ_C)|0;
  return [BZ_X0+c*(BZ_W+BZ_GX), BZ_Y0+r*(BZ_H+BZ_GY)]; }

/* 遊戲共用的倉庫背景。六款原本各自一塊純色底，看起來像六個空房間。
   屋架、吊燈、高窗、貨架都在這裡畫一次，每一款自己的東西再疊上去。
   BY 是「背景的底線」，各款自己指定，才不會蓋到玩法元素。 */
function gameHall(BY,dim,rack){
  const D=c=>dim?mix(c,-dim):c;   /* 退後靠壓暗，不靠透明——透明會讓每一塊都疊出鬼影 */
    /* ---- 背景：一整片倉庫，不是一塊空牆 ---- */
  R(0,GHUD,GW,GHUD+16,D("#16222A"));                       /* 天花板暗帶 */
  for(let x=-30;x<GW+80;x+=132){                        /* 屋架 */
    P([x,GHUD+16,x+132,GHUD+16,x+104,GHUD+44,x+28,GHUD+44],D("#26363F"),D("#33505E"),1);
    L([x+28,GHUD+44,x+104,GHUD+44],D("#33505E"),2);
    L([x+14,GHUD+16,x+66,GHUD+44],D("#2E4653"),2);
    L([x+118,GHUD+16,x+66,GHUD+44],D("#2E4653"),2); }
  [0.16,0.42,0.68,0.92].forEach(u=>{                    /* 吊燈 */
    const lx=GW*u; L([lx,GHUD+16,lx,GHUD+52],D("#33505E"),2);
    O(lx-18,GHUD+52,lx+18,GHUD+66,D("#E8B93C"));
    O(lx-8,GHUD+55,lx+8,GHUD+63,D("#FFF0C8"));
    O(lx-46,GHUD+60,lx+46,GHUD+96,"rgba(232,185,60,.055)"); });
  /* 後牆高窗 */
  [0.08,0.30,0.52,0.74].forEach(u=>{
    const wx=GW*u; R(wx,BY-176,wx+96,BY-134,D("#16222A"),D("#33505E"),2);
    R(wx+4,BY-172,wx+46,BY-138,D("#274A5E")); R(wx+50,BY-172,wx+92,BY-138,D("#274A5E"));
    O(wx+10,BY-166,wx+40,BY-152,"rgba(255,255,255,.10)"); });
  /* 後牆貨架。玩法元素本身就滿版的那幾款不畫——畫了只是把字埋掉。 */
  if(rack!==false) for(let bay=0;bay<4;bay++){
    const bx=26+bay*198;
    brk(bx-6,BY-126,bx+2,BY-50,D("#7C5236"),0);
    brk(bx+150,BY-126,bx+158,BY-50,D("#7C5236"),0);
    [BY-92,BY-56].forEach(yy=>{
      brk(bx,yy-4,bx+152,yy+2,D(C.orange2),3);
      for(let c=0;c<2;c++){ const sx=bx+10+c*72;
        brk(sx,yy-30,sx+62,yy-4,[D(C.kraft2),D(C.kraft),D(C.kraft3)][(bay+c)%3],2,D(C.wood2));
        R(sx+8,yy-24,sx+26,yy-16,D(C.cream)); } });
    TXT_(bx+76,BY-38,"A"+(bay+1),C.muted,11,true); }
}

/* ================================================= 網球 ===== */
/* 側面視角，兩個人左右對打——網球不是乒乓球，不是從上往下看一張桌子。

tennis:{

  tip:["側面看的球場，你在左邊、對手在右邊。手指左右移動去接球，站到球下面就會揮拍。球不能落地：碰到地面、撞到網、或打到場邊的貓狗，那一半場就掉一條命。",
       "A side-on court: you on the left, your opponent on the right. Drag to get under the ball and your player swings by himself. The ball must stay up -- touch the ground, the net, or the cat and dog at the baselines, and that side loses a life.",
       "Cancha de perfil: tú a la izquierda y el rival a la derecha. Arrastra para colocarte debajo de la pelota y tu jugador tira solo. La pelota no puede caer: si toca el suelo, la red, o al perro o al gato del fondo, ese lado pierde una vida."],
  lives:3,
  CL:46, CR:GW-46, GY:GH-58,            /* 場地左右緣與地面 */
  NX:GW/2, NH:36, NW:26,                /* 網高照人的比例：0.9m 對 1.7m */
  G:0.15, REACH:42, PSP:3.4, AI:2.5,
  PAD:"#E8B93C", OPP:"#8FB6DE", BALLC:"#D8E85A",
  /* 室外的條件：倉庫時區是白天，而且天氣不是雨雪霧雷。
     天氣抓不到（沒網路、CORS 擋掉）就當晴天。 */
  outdoor(){
    const h = tzParts().h;
    const day = h>=7 && h<18;
    const bad = {rain:1, drizzle:1, snow:1, storm:1, fog:1};
    return day && !bad[WX.kind];
  },
  init(){
    GS.out = this.outdoor();
    GS.px = this.CL+150; GS.ox = this.CR-150;
    GS.mine=0; GS.theirs=0; GS.rally=0; GS.best=0;
    GS.psw=0; GS.osw=0; GS.dust=0;      /* 揮拍動作剩幾幀 */
    this.serve(-1);
  },
  /* dir -1：往左（發給玩家）；+1：往右 */
  serve(dir){
    GS.bx = dir<0 ? GS.ox : GS.px;
    GS.by = this.GY-96;
    GS.bvx = dir * (3.0+Math.random()*0.5);
    GS.bvy = -3.4;
    GS.last = dir<0 ? 1 : -1;           /* 誰打的 */
  },
  tap(x,y){ GS.px = x; },
  move(x){ GS.px = x; },
  point(who){                           /* who=+1 我得分，-1 對手得分 */
    if(who>0){ GS.mine++; GS.score += 60; } else { GS.theirs++; gmiss(); }
    GS.rally = 0; this.serve(who>0 ? 1 : -1);
  },
  swing(side){                          /* side -1 我方 +1 對手 */
    const me = side<0;
    const px = me ? GS.px : GS.ox;
    const off = (GS.bx - px) / this.REACH;          /* 打到拍面哪裡 */
    GS.bvx = (me ? 1 : -1) * (3.4 + Math.abs(off)*0.7 + GS.rally*0.05);
    GS.bvy = -(4.0 + Math.random()*0.6);
    GS.last = side;
    if(me){ GS.psw = 10; GS.rally++; GS.best=Math.max(GS.best,GS.rally);
            GS.score += 10 + GS.rally*2; sfxDrop(); }

  step(dt){

    /* 對手：解一次拋物線，算出球掉到揮拍高度時會在哪裡，往那裡移動。
       原本是直線外推、不算重力——沒有彈跳可以補救之後，那樣算一定漏接。 */
    let want = GS.bx + GS.bvx*10;
    {
      const target = GY-46, a=0.5*this.G, bq=GS.bvy, c=GS.by-target;
      const disc = bq*bq-4*a*c;
      if(disc>0){
        const tt = (-bq+Math.sqrt(disc))/(2*a);
        if(tt>0 && tt<160) want = GS.bx + GS.bvx*tt;
      }
    }
    want = Math.max(NX+104, Math.min(this.CR-20, want));
    const d = want - GS.ox;
    GS.ox += Math.max(-this.AI, Math.min(this.AI, d)) * dt;

    const wasLeft = GS.bx < NX;
    GS.bvy += this.G*dt;
    GS.bx += GS.bvx*dt; GS.by += GS.bvy*dt;

    /* 過網：球心越過網柱時如果還在網高以下，就是掛網 */
    if((GS.bx<NX) !== wasLeft && GS.by > GY-this.NH){
      GS.bx = NX; GS.bvx *= -0.2; GS.bvy = Math.abs(GS.bvy)*0.3;

    /* 落地就結束——不再讓它彈一下。球碰到地面，那一半場的人就輸這一分。 */
    if(GS.by > GY-8){

    }

    if(GS.bx > this.CR+20){ this.point(1);  return; }

    /* 揮拍：球往自己這邊飛、進了伸手範圍、而且高度在腰以下肩以上 */
    const hitable = GS.by > GY-104 && GS.by < GY-6;

derby:{

       "Drag to steer, tap to switch lanes. Reach the staging area on the left empty-handed and you pick up a pallet; reach the trailer on the right carrying one and you drop it, for points and two seconds back on the clock. Hand carts and other trucks come down the aisle at you: hit one and it costs a life, the pallet goes on the floor, and you go back for another. The run ends when the clock does.",
       "Arrastra para conducir, toca para cambiar de carril. Llega vacío a la zona de salida a la izquierda y levantas una tarima; llega cargado al remolque de la derecha y la entregas, lo que da puntos y devuelve dos segundos al reloj. Por el pasillo vienen diablitos y otros montacargas de frente: chocar cuesta una vida, la tarima se cae y hay que ir por otra. Se acaba cuando se acaba el tiempo."],
  lives:3,
  FAR(){ return GH-138; },
  NEAR(){ return GH-64; },

  init(){
    GS.fx=[];
    GS.fkX=GW/2; GS.fkT=GW/2; GS.fkL=1; GS.fkY=this.NEAR();
    GS.carry=false; GS.obs=[]; GS.spawn=54; GS.left=60*60;
    GS.drop=null; GS.hitT=0; GS.delivered=0;
  },
  move(x){ GS.fkT=Math.max(52,Math.min(GW-52,x)); },
  tap(){ GS.fkL=GS.fkL?0:1; sfxClick(); },
  spawn(){
    /* 迎面來的障礙。兩種：手推車（慢、寬）和別台叉車（快、窄）。
       同一時間兩條車道不會同時被塞死，不然是死局不是難度。 */
    const busy=GS.obs.filter(o=>o.x>GW*0.45);
    const lanes=[0,1].filter(l=>!busy.some(o=>o.lane===l));
    if(!lanes.length) return;
    const lane=lanes[(Math.random()*lanes.length)|0];
    /* 另一條車道最後面那一個還沒跑遠就先不生：兩條車道並排推過來，
       玩家只能等死，那不是難度是死局。 */
    const others=GS.obs.filter(o=>o.lane!==lane);
    let back=-1e9; others.forEach(o=>{ if(o.x>back) back=o.x; });
    if(back > GW-320) return;
    const fork=Math.random()<0.42;
    let sp=(fork?3.1:2.0)+GS.delivered*0.09;
    /* 而且不能比前面那些快——追上去就會自己排成一堵牆 */
    others.forEach(o=>{ if(o.sp<sp) sp=o.sp; });

  crash(){
    if(GS.hitT>0) return;

    for(let x=-24;x<GW+30;x+=30){

    /* 待運區與拖車 */

    TXT_(this.PICK-18,FY-56,gpick(["待運區","STAGING","SALIDA"]),C.muted,13,true);
    [0,1].forEach(i=>pallet(18+i*40, NY+6, 0.7));
    brk(this.DROP-16,FY-96,GW+10,NY+16,"#2A3C46",0,C.steel2);
    R(this.DROP+2,FY-80,GW-6,NY+4,"#16222A");
    TXT_(this.DROP+70,FY-64,gpick(["拖車","TRAILER","REMOLQUE"]),C.safety,14,true);
    /* 掉在地上的板 */
    if(GS.drop){ g.save(); g.globalAlpha=Math.max(0,1-GS.drop.t/90);
      pallet(GS.drop.x-18, GS.drop.y+8, 0.62); g.restore(); }
    /* 障礙：遠的先畫 */
    GS.obs.slice().sort((a,b)=>a.lane-b.lane).forEach(o=>{
      const y=this.laneY(o.lane);
      if(o.fork) forklift(o.x, y, false);
      else { O(o.x-20,y-4,o.x+20,y+8,mix(C.floor,-0.2));
        brk(o.x-16,y-40,o.x+16,y-6,C.kraft,2,C.wood2);
        L([o.x+14,y-40,o.x+24,y-56],C.steel2,4,"round");
        O(o.x-14,y-8,o.x-4,y+2,"#1B2228"); O(o.x+6,y-8,o.x+16,y+2,"#1B2228"); }
    });
    /* 自己：被撞到的時候閃 */
    const blink = GS.hitT>0 && (Math.floor(GS.t*0.25)%2===0);
    if(!blink){
      forklift(GS.fkX, GS.fkY, true);
      if(GS.carry) pallet(GS.fkX+6, GS.fkY-16, 0.62);
    }
    /* 時間條 */
    const u=Math.max(0,Math.min(1,GS.left/(60*60)));
    R(16,GHUD+10,GW-16,GHUD+18,"rgba(0,0,0,.35)");
    R(16,GHUD+10,16+(GW-32)*u,GHUD+18, u<0.25?"#FF7A5C":C.safety);

         gpick(["已送 ","delivered ","entregadas "])+GS.delivered,C.muted,13,true);
    /* 貓狗站在走道最裡面那條線上，不是浮在半空中。牠們只是在場邊看，

    gamePets([{x:GW*0.34,y:FY-48,k:"dog",f:1,s:1.15},

function gamePets(spots){

                         DOG_BREEDS[SEL.dogs[0]]||DOG_BREEDS.corgi);
    else catDraw(0,0,GS.t*(sp.w?1:0.4),sp.f||-1,!!sp.w,0,
                 CAT_BREEDS[SEL.cats[0]]||CAT_BREEDS.ragdoll);
    g.restore();
  });
}

const ZOOM_LBL=["\u653e\u5927\u756b\u9762","Enlarge","Ampliar"];
function zoomOn(){ return document.body.classList.contains("zoomed"); }
/* 手動全螢幕時鎖住的旋轉方向。null 表示還沒決定（下一次重配時決定）。
   離開全螢幕就清掉，下次按進去重新判斷。 */
let MANUAL_ROT = null;
function setZoom(on){
  document.body.classList.toggle("zoomed", on);

  if(b) b.textContent = on ? "\u2922" : "\u2921";

/* 放大模式下自己算畫布要多大。直向螢幕轉 90 度——場景是 900x560 的橫幅，
   直向手機的寬度早就頂滿了，不轉的話「放大」什麼也放大不了。 */
function fitZoomCanvas(){
  const cv=document.getElementById("cv"); if(!cv) return;
  if(!zoomOn()){
    cv.style.cssText=""; cv._forceCss=0; cv._rot=false;
    document.body.classList.remove("rot");
    g0=fitHiDPI(cv,SCENE_W,SCENE_H); if(tab===0) g=g0;
    return;
  }
  /* 底下那排動作鍵一律留位置，直向橫向都一樣：鍵蓋在場景上面會擋住月台
     那一排和下面的統計，而且按鍵時手指壓在畫面上。寧可場景小一點。 */
  const vw=window.innerWidth, vh0=window.innerHeight;
  const sa = (function(){ const d=document.createElement("div");
    d.style.cssText="position:fixed;bottom:0;height:env(safe-area-inset-bottom);visibility:hidden";
    document.body.appendChild(d); const v=d.getBoundingClientRect().height; d.remove(); return v; })();
  const BAR = 54 + sa;
  /* 要不要轉 90 度：一律看實體方向，直向才轉。
     這件事本身是對的——轉 90 度是為了在直向手機上把場景放大，
     螢幕已經是橫的就不需要轉。鎖住方向反而會讓橫向算出很小的尺寸。

     使用者說的「又亂轉」不是這裡的問題，是轉向的當下畫面翻了一下。
     那是必然的（直向躺著看 → 橫向正著看），但過程要平順，
     所以下面加了轉場的抑制：轉向期間先不重繪，等尺寸穩定再一次到位。 */
  const rot = vh0 > vw;
  document.body.classList.toggle("rot", rot);
  /* 可用區用滿整個視窗，不扣鍵列。
     扣掉的話畫面會整個縮小一圈（回報：橫向要跟全螢幕一樣大小）。
     鍵列的遮擋改用別的方式解決——見下面把場景往上推的那一段。 */
  const availW = vw, availH = vh0;
  /* 整張都要看得到，不切。試過 cover（長邊填滿、短邊切掉）比較大，
     但切掉畫面比小更討厭——直向手機靠轉 90 度已經拿回大部分尺寸了。 */
  /* 縮放比。
     沒轉的橫向要讓貓狗那條走道（PET_Y=478，離場景底部只有 82 個單位）
     露在鍵列上方。畫布置頂之後，那條在螢幕上的位置是 PET_Y*k，
     必須 ≤ vh0-BAR，也就是 k ≤ (vh0-BAR)/PET_Y。
     視窗夠高的時候這個上限根本不會生效（滿版照舊）；視窗矮的時候
     它會把畫布縮一點點，換到貓狗看得見——比整條被蓋掉好。 */
  let k = rot ? Math.min(availH/SCENE_W, availW/SCENE_H)
              : Math.min(availW/SCENE_W, availH/SCENE_H);
  if(!rot){
    const kPet = (vh0 - BAR - 6) / PET_Y;      /* 6px 餘裕，不要剛好貼齊 */
    if(kPet > 0) k = Math.min(k, kPet);
  }
  const w=Math.round(SCENE_W*k), h=Math.round(SCENE_H*k);
  cv.style.position="absolute";
  /* 用像素算中心，不要用 50%：轉的時候鍵列吃掉左邊 54px，
     螢幕中線已經不是可用區的中線了。 */
  /* 轉向時的水平中心。原本寫 BAR+availW/2：BAR 是鍵列的厚度（54+安全區），
     availW 已經是整個螢幕寬，兩個加起來等於把中心往右推了一整條鍵列的寬度，
     場景右邊 88px 就掉出畫面外（回報：放大也不對）。
     鍵列現在是半透明疊在左緣、沒有從可用區扣掉，所以中心就是 availW/2。 */
  cv.style.left=Math.round(rot ? availW/2 : vw/2)+"px";
  /* 垂直位置：畫布本來是置中的，底下剩的空白剛好被鍵列蓋掉，
     場景最下面那一條（貓狗的走道在 PET_Y=478）就看不到了。
     縮小畫布可以避開，但整張會小一圈——不縮，改成把畫布往上推，
     讓上下的餘白不對稱：上面不留、下面留給鍵列。
     餘白不夠鍵列高的時候就盡量推，推到頂為止。 */
  /* 沒轉的橫向直接置頂：上面的縮放已經保證底部留得下鍵列，
     再置中的話等於把畫面往下推，反而又壓到。 */
  const topPx = rot ? vh0/2 : h/2;
  cv.style.top =Math.round(topPx)+"px";
  cv.style.width=w+"px"; cv.style.height=h+"px";
  cv.style.transformOrigin="50% 50%";
  cv.style.transform="translate(-50%,-50%)"+(rot?" rotate(90deg)":"");
  cv._forceCss=w; cv._rot=rot;
  g0=fitHiDPI(cv,SCENE_W,SCENE_H); if(tab===0) g=g0;
}
/* 右緣那個「››」。不寫字，只有箭頭：三種語言共用，也不佔一顆鍵的寬度。
   捲到底就淡出——一直亮著等於在騙人說後面還有。點它會往右推一段。 */

   使用者自己去按放大鍵是多一步。轉回直向就退出，回到原本的版面。

   那不該整頁變成全螢幕。用 max-height 判斷手機，跟 CSS 那邊同一個門檻。 */

   同一支手機橫向時 innerHeight 可能在 340~420 之間跳，門檻設死會時靈時不靈。
   改成看「短邊」：手機的短邊不會超過 500pt，平板和桌機一定超過。 */
/* 「是不是手機」用裝置特性判斷，不是只看尺寸。
   純看尺寸分不開：手機橫向最長 956（16 Pro Max），而桌機可以拉成任何尺寸，
   1000×420 這種就落在同一區間裡。加上「粗指標＋沒有滑鼠懸停」這個條件，
   手指操作的裝置才算數，滑鼠的裝置不管視窗拉多扁都不會誤觸發。 */

function isPhoneLandscape(){

  if(!force && LAST_FIT

/* 品種選單的縮圖。原本每一款只有一個色塊，六隻狗五隻貓十一個色塊，
   選的人根本不知道自己在選什麼。這裡直接用畫場景那同一組 dog()/catDraw()
   畫一張小圖出來當按鈕，選單上看到的就是待會兒場上會出現的那一隻。
   畫一次存起來——每次重畫選單都重畫十一隻的話，手機上會卡。 */
const PET_THUMB={};
function petThumb(kind,key){
  const ck=kind+":"+key;
  if(PET_THUMB[ck]) return PET_THUMB[ck];
  /* 縮圖：先畫在一張大畫布上，量出實際佔多大，再裁切置中。
     原本是寫死 58×42 加固定倍率，但貓狗改胖之後身體變寬、頭變大，
     整隻撞到邊界被切掉——尾巴和耳朵都不見。
     量了再裁就不用每次調參數，之後改造型也不會再壞。 */
  const W=58,H=42,SC=3;
  const PAD=6, BIG=180;                      /* 先在大畫布上畫，留足夠空間 */
  const big=document.createElement("canvas");
  big.width=BIG*SC; big.height=BIG*SC;
  const bctx=big.getContext("2d"); bctx.scale(SC,SC);
  const keep=g, keepSh=PET_SHADOW;
  g=bctx; PET_SHADOW="rgba(0,0,0,0)";        /* 按鈕底是淺色，不要那塊深影子 */
  try{
    if(kind==="dogs"){
      const B=DOG_BREEDS[key]||DOG_BREEDS.corgi;
      dog(BIG*0.5,BIG*0.62,0,1,false,Object.assign({},B,{sz:B.sz*1.9}),0,0,0);
    }else{
      const B=CAT_BREEDS[key]||CAT_BREEDS.ragdoll;
      /* 貓的基準比例比狗小（0.40 對 0.62），不補回來的話選單上貓會小一號 */
      catDraw(BIG*0.5,BIG*0.62,0,1,false,0,Object.assign({},B,{sz:B.sz*2.9}),0);
    }
  }catch(e){}
  g=keep; PET_SHADOW=keepSh;
  /* 量出實際的範圍 */
  let x0=big.width,y0=big.height,x1=0,y1=0;
  try{
    const d=bctx.getImageData(0,0,big.width,big.height).data;
    for(let y=0;y<big.height;y++) for(let x=0;x<big.width;x++)
      if(d[(y*big.width+x)*4+3]>8){
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }catch(e){}
  const c=document.createElement("canvas");
  c.width=W*SC; c.height=H*SC;
  const ctx=c.getContext("2d");
  if(x1>x0 && y1>y0){
    const sw=x1-x0+1, sh=y1-y0+1;
    /* 等比縮到框內，兩邊各留 PAD */
    const k=Math.min((W-PAD*2)*SC/sw, (H-PAD*2)*SC/sh);
    const dw=sw*k, dh=sh*k;
    ctx.imageSmoothingQuality="high";
    ctx.drawImage(big, x0,y0,sw,sh, (W*SC-dw)/2, (H*SC-dh)/2, dw,dh);
  }
  PET_THUMB[ck]=c.toDataURL("image/png");
  return PET_THUMB[ck];
}

/* 手指按在色塊上往下滑，是要捲動，不是要換人。
   單純掛 onclick 在觸控上不夠：手指移動幾十像素之後放開，瀏覽器多半還是
   會補送一個 click，於是封面上滑一下，人物就被換掉了。
   這裡自己判斷什麼算「點」——按下到放開之間位移超過 10px，或按著超過
   700 毫秒，就當成捲動或長按，不算選。鍵盤送出的 click（detail 為 0）
   沒有按下位置，直接放行，不然鍵盤操作會整組失效。 */
function bindTap(el, fn){
  /* 換掉舊的處理函式就好。addEventListener 不像 onclick 會覆蓋，同一顆鍵
     綁第二次就會有兩個監聽器，一次點擊跑兩次 selPick——單選看不出來
     （設同一個值兩次），多選就變成「選了又馬上取消」，按下去完全沒反應。
     mount() 會整份重綁、repaintPickers() 又綁一次，剛好就是兩次。 */
  el.__tapFn = fn;
  if(el.__tapBound) return;
  el.__tapBound = true;
  let sx=0, sy=0, t0=0, live=false;
  el.addEventListener("pointerdown", e=>{ sx=e.clientX; sy=e.clientY; t0=Date.now(); live=true; });
  el.addEventListener("pointermove", e=>{
    if(live && (Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10)) live=false; });
  el.addEventListener("pointercancel", ()=>{ live=false; });
  el.addEventListener("click", e=>{
    if(e.detail===0){ el.__tapFn(); return; }      /* 鍵盤 */
    const ok = live && (Date.now()-t0)<=700;
    live=false;
    if(ok) el.__tapFn();
  });
}
function bindPickers(root){
  (root||document).querySelectorAll(".pick button").forEach(b=>{
    bindTap(b, ()=>selPick(b.closest(".pick").dataset.kind, b.dataset.key)); });
  const inp=(root||document).querySelector("#selName");

function rmBinX(i){ return RM.BIN_X0+i*RM.BIN_GAP; }
function rmStep(d){
  const S=RM_S; S.t+=d;
  const go=(tx,sp)=>{ const dx=tx-S.x;
    if(Math.abs(dx)<3){ S.x=tx; return true; }
    /* 起步和煞車，不是等速撞上去 */
    const ease=Math.min(1,Math.max(0.34,Math.abs(dx)/26));
    S.x+=Math.sign(dx)*(sp||1.9)*ease*d; return false; };
  if(S.ph==="fetch"){ if(go(RM.PICK_X)){ S.ph="lift"; S.t=0; } }
  else if(S.ph==="lift"){ if(S.t>18){ S.hold=true; S.ph="carry"; S.t=0; } }
  else if(S.ph==="carry"){ if(go(RM.WORK_X)){ S.ph="scan"; S.t=0; } }
  else if(S.ph==="scan"){
    /* 第一件事是刷 RMA，不是拆箱——沒有 RMA 的包裹是無主件 */
    S.scan=Math.min(1,S.t/40);
    if(S.t>52){ S.hold=false; S.ph="open"; S.t=0; } }
  else if(S.ph==="open"){
    S.open_=Math.min(1,S.t/46);
    if(S.t>58){ S.ph="grade"; S.t=0; } }
  else if(S.ph==="grade"){
    if(S.t>44){
      S.grade = (S.forced>=0) ? S.forced
              : [0,0,1,2,3][Math.floor(Math.random()*5)];   /* 多數是良品 */
      S.forced=-1; S.ph="toss"; S.t=0; }
  } else if(S.ph==="toss"){
    /* 走過去放進桶裡，不是站在桌邊用丟的。退貨是還沒判定的商品，
       丟的那一下就可能把良品變成報廢品。 */
    S.hold=true;
    const bx=rmBinX(S.grade)-30;      /* 停在桶的左邊，不要站到桶上 */
    if(go(bx)){ if(S.t>30){ S.hold=false;
      S.piles[S.grade]=Math.min(4,S.piles[S.grade]+1); S.ph="wms"; S.t=0; } }
    else S.t=0; }
  else if(S.ph==="wms"){
    /* 判完要回寫。不回寫，平台上的可售數量還是舊的，會超賣。 */
    if(S.t>60){ rmReset(); } }
}

/* 手上那一件。worker() 的 hold 只把手擺過去，不會畫出被拿的東西；
   少了這一個，每一章的人都在搬空氣。 */
/* 手能伸多遠是有極限的。hold 給多遠就畫多遠，離身體太遠會拉出一條
   橫過半個畫面的粗線——那不是手臂。統一夾在肩寬的範圍內。 */
function chReach(x,y,tx,ty,sc){
  /* worker() 的肩膀畫在 yy-S(35)、離身體中線 S(15.2)，手臂是從那裡拉到
     hold 的位置。原本用 y-S(50) 當錨點量距離，量錯了地方，所以夾不住——
     截圖上那條橫過半個畫面的斜棒就是這樣來的。 */
  const S=v=>v*(sc||0.62);
  const sx=x+S(15.2), sy=y-S(35);
  const dx=tx-sx, dy=ty-sy, max=S(20), d=Math.hypot(dx,dy)||1;
  return d<=max ? [tx,ty] : [sx+dx*max/d, sy+dy*max/d];
}
/* 手上那一件。sc 要跟著人的縮放走——固定尺寸的箱子放在 0.58 倍的人手上，
   大到蓋住整張臉。以 0.62 為基準。 */
function chHeld(hx,hy,tone,sc){
  const k=(sc||0.62)/0.62;
  brk(hx-12*k,hy-11*k,hx+12*k,hy+7*k, tone||C.kraft, 1, C.wood2);
  R(hx-6*k,hy-6*k,hx+3*k,hy-1*k,C.cream);

  const FL=TL.FLOOR, total=TL.PER*TL.COURSES;
  /* 線上的箱子一直進來 */
  if(S.ph!=="away" && S.belt.length<5 && (S.t%26)<d) S.belt.push(TL.BELT_X0-30);
  S.belt.forEach((b,i)=>{ const lim=TL.BELT_END-i*24;
    if(b<lim) S.belt[i]=Math.min(lim,b+1.1*d); });
  /* 起步和煞車：接近目標時放慢，不是全速撞上去再瞬間停 */
  const ease=(cur,tx,sp,rng)=>{ const dx=tx-cur;
    if(Math.abs(dx)<3) return [tx,true];
    const e=Math.min(1,Math.max(0.32,Math.abs(dx)/(rng||28)));
    return [cur+Math.sign(dx)*(sp||1.9)*e*d, false]; };
  const go =tx=>{ const [v,ok]=ease(S.hand,tx,1.9,28); S.hand=v; return ok; };
  const gof=(tx,sp)=>{ const [v,ok]=ease(S.fx,tx,sp||2.2,34); S.fx=v; return ok; };

  if(S.ph==="to_belt"){
    if(go(TL.BELT_END-40) && S.belt.length){ S.ph="pick"; S.hold=0; }
  } else if(S.ph==="pick"){
    S.hold+=d; if(S.hold>16){ S.belt.shift(); S.ph="carry"; S.hold=0; }
  } else if(S.ph==="carry"){
    const [bx]=tlCarton(TL.PAL_X,S.n);
    if(go(bx-30)){ S.ph="place"; S.hold=0; }
  } else if(S.ph==="place"){
    S.hold+=d;
    if(S.hold>18){ S.n++; S.hold=0;
      S.ph=(S.n>=total)?"wrap":"to_belt"; }
  } else if(S.ph==="wrap"){
    /* 從下往上纏，最後收到板底座——膜沒下到底座，車一開整疊就位移 */
    if(go(TL.PAL_X-30)){ S.wrap=Math.min(1,S.wrap+0.007*d); S.turns+=0.06*d;
      if(S.wrap>=1){ S.ph="label"; S.hold=0; } }
  } else if(S.ph==="label"){
    S.hold+=d; S.label=Math.min(4,S.hold/22);        /* 四面都要貼 */
    if(S.label>=4){ S.ph="push"; S.hold=0; }
  } else if(S.ph==="push"){
    /* 推到待運區最後一個空位。板真的走過去，不是原地消失再出現。 */
    const dist=tlSlot(S.stock)-TL.PAL_X;
    S.clear=Math.min(dist,S.clear+1.15*d);
    if(S.clear>=dist){ S.stock=Math.min(TL.STOCK+1,S.stock+1);
                       tlBuildReset(); S.ph="fk_pick"; S.t=0; }
  } else if(S.ph==="fk_pick"){
    if(!S.stock){ S.ph="close"; S.t=0; return; }
    /* 停在最右邊那一板的左側，叉子伸進去 */
    if(gof(tlSlot(S.stock-1)-40)){ S.carry=true; S.stock--; S.ph="fk_in"; S.t=0; }
  } else if(S.ph==="fk_in"){
    if(gof(tlBerth(S.aboard)-40,2.6)){ S.ph="fk_drop"; S.t=0; }
  } else if(S.ph==="fk_drop"){
    if(S.t>26){ S.carry=false; S.aboard++; S.ph="fk_out"; S.t=0; }
  } else if(S.ph==="fk_out"){
    if(gof(TL.IDLE)){
      S.ph=(S.aboard>=TL.ABOARD||!S.stock)?"close":"fk_pick"; S.t=0; }
  } else if(S.ph==="close"){
    if(S.t>50){ S.ph="away"; S.t=0; }
  } else if(S.ph==="away"){
    S.truck+=2.4*d;
    if(S.truck>50){ S.gone=S.truck; tlReset(); }   /* 車一出門，線就復工 */
  }
  /* 鏡頭。追的是「現在動的那個東西」，不是固定切三段。 */
  const build=("to_belt pick carry place wrap label".indexOf(S.ph)>=0);
  const focus = build ? TL.PAL_X+40
              : S.ph==="push" ? TL.PAL_X+40+S.clear
              : S.ph==="close" ? TL.DOOR_X+190
              : S.ph==="away" ? TL.DOOR_X+190
              : S.fx+70;
  const want=Math.max(0,Math.min(TL.W-TL.VIEW, focus-TL.VIEW/2));
  S.cam += (want-S.cam)*Math.min(1,0.05*d);
}
/* 板上第 i 箱的位置，x0 是板面左緣 */
function tlCarton(x0,i){
  const course=Math.floor(i/TL.PER), col=i%TL.PER;
  const off=(course%2)?9:0;                          /* 交錯疊，每層轉向 */
  return [x0+8+col*TL.COL_W+off,
          TL.FLOOR-9-(TL.COURSE_H-3)-course*TL.COURSE_H];
}
/* 一整板。打好的、待運區的、車上的都用這一個畫，尺寸才會一路一致——
   合併之前兩邊各畫各的，板一上車就縮水。 */
function tlPal(x0,n,wrapU,turns,labelN){
  const FL=TL.FLOOR, W=TL.PAL_W;
  R(x0,FL-9,x0+W,FL-5,C.wood);                       /* 上板 */
  R(x0,FL-2,x0+W,FL+1,C.wood);                       /* 下板 */
  [x0+3,x0+W/2-4,x0+W-11].forEach(bx=>R(bx,FL-5,bx+8,FL-2,mix(C.wood,-0.18)));
  L([x0,FL-9,x0+W,FL-9],mix(C.wood,0.14),1);
  for(let i=0;i<n;i++){
    const [bx,by]=tlCarton(x0,i);
    brk(bx,by,bx+TL.COL_W-3,by+TL.COURSE_H-3,
        [C.kraft,C.kraft2,C.kraft3][i%3],(wrapU>0?0:1),C.wood2);
  }
  if(wrapU>0){
    const top=FL-14-(TL.COURSES-1)*TL.COURSE_H, hgt=(FL-8-top)*wrapU;
    g.save(); g.globalAlpha=0.16;
    R(x0+4,FL-8-hgt,x0+W-4,FL-8,"#CFE4EE"); g.restore();
    L([x0+4,FL-8-hgt,x0+4,FL-8],"rgba(207,228,238,.5)",1.5);
    L([x0+W-4,FL-8-hgt,x0+W-4,FL-8],"rgba(207,228,238,.5)",1.5);
    for(let i=0;i<Math.floor(turns||0);i++){
      const yy=FL-10-((i*7)%Math.max(8,hgt));
      L([x0+4,yy,x0+W-4,yy-2],"rgba(220,240,250,.55)",1);
    }
  }
  if(labelN>0){                                      /* 四面都要貼，看得到兩面 */
    R(x0+10,FL-30,x0+28,FL-16,C.cream,"#B9AC93",1);
    if(labelN>1) R(x0+W-26,FL-30,x0+W-10,FL-16,C.cream,"#B9AC93",1);
  }
}

              "El montacargas la mete, alguien dirige en la puerta"],

/* 跳到指定階段。動畫自己會跑完整輪，但看的人常常只想看某一段——

function tlJump(to){

/* ---- 當地天氣 ----------------------------------------------------------
   跟時鐘同一個來源：選哪個城市就看那個城市的天氣。資料走 Open-Meteo
   （免金鑰、免註冊），抓到就快取三十分鐘，連不上就退回一個依緯度與月份
   推出來的合理天候——這支工具本來就要能離線跑，抓不到天氣不能讓畫面空掉。
   只取兩個東西：現在幾度、天氣代碼。代碼照 WMO 那一套。 */
const TZ_GEO={
  "America/Los_Angeles":[34.05,-118.24], "America/Denver":[39.74,-104.98],
  "America/Chicago":[41.88,-87.63],      "America/New_York":[40.71,-74.01],

};
/* 六種天況就夠了：畫面上分得出來的差別只有這幾種，再細分是資料好看而已。 */
const WX_KIND=["clear","cloud","fog","drizzle","rain","snow","storm"];
const WX_NAME={
  clear:["晴","Clear","Despejado"],   cloud:["多雲","Cloudy","Nublado"],
  fog:["霧","Fog","Niebla"],
  drizzle:["毛毛雨","Drizzle","Llovizna"],
  rain:["大雨","Rain","Lluvia"],      snow:["雪","Snow","Nieve"],
  storm:["雷雨","Thunderstorm","Tormenta"]};
function wmoKind(c){
  if(c===0||c===1) return "clear";
  if(c===2||c===3) return "cloud";
  if(c>=45&&c<=48) return "fog";
  if(c>=71&&c<=77) return "snow";
  if(c>=85&&c<=86) return "snow";
  if(c>=95) return "storm";
  /* 51-57 是毛毛雨（含凍毛雨），61 以上才是正經的雨。分開才有意義：
     毛毛雨要換傘、大雨要換走法。 */
  if(c>=51&&c<=57) return "drizzle";
  if(c>=61) return "rain";
  return "cloud";
}
const WX={kind:null, temp:null, at:0, tz:null, live:false};
/* 攝氏華氏各自習慣，記在本機。台灣看攝氏、美國同仁看華氏，同一份工具兩邊都要能用。 */
let WXU = (store("wxu")==="f") ? "f" : "c";
function wxTempStr(){
  const W=wxNow();
  if(typeof W.temp!=="number") return "--";
  return (WXU==="f" ? Math.round(W.temp*9/5+32)+"\u00B0F"
                    : Math.round(W.temp)+"\u00B0C");
}
function wxGuess(){
  /* 離線退路：用緯度和月份推。北國冬天會下雪、副熱帶夏天多雲有雨，
     這樣至少不會在台北的七月下雪。 */
  const g_=TZ_GEO[TZ]||[25,121], lat=Math.abs(g_[0]);
  const m=tzDate().m, north=(TZ_GEO[TZ]||[25])[0]>=0;
  const winter = north ? (m<=2||m===12) : (m>=6&&m<=8);
  const day=(SS.frame|0);
  const pick=["clear","clear","cloud","cloud","rain"][ (Math.floor(day/3600)+m) % 5 ];
  const kind = (winter && lat>38 && pick==="rain") ? "snow" : pick;
  const base = winter ? (lat>38?2:14) : (lat>38?20:29);
  return {kind:kind, temp:base};
}
function wxNow(){
  if(WX.kind && WX.tz===TZ) return WX;
  const g2=wxGuess();
  return {kind:g2.kind, temp:g2.temp, live:false, tz:TZ};
}
function wxFetch(force){
  const geo=TZ_GEO[TZ]; if(!geo) return;
  const key="wx."+TZ;
  if(!force){
    try{ const c=JSON.parse(store(key)||"null");
      if(c && Date.now()-c.at < 30*60*1000){
        WX.kind=c.kind; WX.temp=c.temp; WX.at=c.at; WX.tz=TZ; WX.live=true; return; }
    }catch(e){}
  }
  /* 抓不到就算了：離線是常態，不是錯誤。八秒沒回應就放棄。 */
  const ctl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  if(ctl) setTimeout(()=>{ try{ctl.abort();}catch(e){} }, 8000);
  const url="https://api.open-meteo.com/v1/forecast?latitude="+geo[0]
          +"&longitude="+geo[1]+"&current=temperature_2m,weather_code";
  const want=TZ;
  fetch(url, ctl?{signal:ctl.signal}:undefined)
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      if(!j||!j.current||want!==TZ) return;
      const kind=wmoKind(+j.current.weather_code);
      const temp=Math.round(+j.current.temperature_2m);
      WX.kind=kind; WX.temp=temp; WX.at=Date.now(); WX.tz=TZ; WX.live=true;
      try{ store("wx."+want, JSON.stringify({kind:kind,temp:temp,at:WX.at})); }catch(e){}
    })
    .catch(()=>{});
}
function tzOptions(){
  /* 手機自己的時區一定列在最上面，就算不在清單裡也要有，
     不然使用者第一次打開會看到一個跟他手機不一樣的時間。 */
  const dev=deviceTZ();
  const list=TZ_LIST.slice();
  if(!list.includes(dev)) list.unshift(dev);
  if(!list.includes(TZ)) list.unshift(TZ);
  const nm=z=>{ const v=TZ_NAME[z];
    return v ? (lang==="zh"?v[0]:lang==="es"?v[2]:v[1]) : tzCity(z); };
  return list.map(z=>`<option value="${esc(z)}"${z===TZ?" selected":""}>`
    + esc(nm(z)) + `</option>`).join("");
}

}

nd Advantage，不再是獨立產品，現在它其實是「1 磅以下的價格級距」——級距是 4 oz、8 oz、12 oz、15.999 oz，往上取。舊 SOP 和平台選單上還看得到這個名字，看到就當作 Ground Advantage 處理。\n不要跟 First-Class Mail 搞混：那是信件和扁平件，不是包裹。","The ceiling is 15.999 oz -- just under a pound -- and lower still at 13 oz over the retail counter. Above that it is no longer this price; it becomes Ground Advantage by the pound.\nIt was folded into Ground Advantage in July 2023 and is really a sub-pound price tier now, stepping at 4 oz, 8 oz, 12 oz and 15.999 oz, rounded up. The name survives in older SOPs and platform dropdowns; treat it as Ground Advantage when you see it.\nDo not confuse it with First-Class Mail, which is letters and flats rather than parcels.","El tope son 15.999 oz, poco menos de una libra, y baja a 13 oz en el mostrador de menudeo. Arriba de eso ya no es este precio: pasa a Ground Advantage cobrado por libra.\nEn julio de 2023 se integró a Ground Advantage, así que hoy en realidad es un escalón de precio por debajo de la libra, con cortes en 4 oz, 8 oz, 12 oz y 15.999 oz, redondeando hacia arriba. El nombre sobrevive en SOP viejos y en los menús de las plataformas; cuando lo veas, trátalo como Ground Advantage.\nNo lo confundas con First-Class Mail, que son cartas y piezas planas, no paquetes."]],["Priority Mail",["比較快，1-3 個工作天，但尺寸上限降到 108 in——同一個箱子 Ground Advantage 收得下，Priority 可能就不行。","Faster at 1-3 business days, but the ceiling drops to 108 in. The same box that Ground Advantage accepts may be too big for Priority.","Más rápido, de uno a tres días hábiles, pero el tope baja a 108 in. La misma caja que Ground Advantage acepta puede ser demasiado grande para Priority."]],["Media Mail",["只能寄書籍、教材這類合格品項，寄別的東西被抓到要補郵資。它不分 Zone，只看重量，也不算材積重——所以上面的材積規則整組不適用。","Books and other qualifying media only; ship anything else and the shortfall gets collected. It is not zoned, prices on weight alone, and takes no dimensional weight -- so the DIM rules above do not apply at all.","Solo libros y otros materiales que califiquen; manda cualquier otra cosa y te cobran la diferencia. No va por zonas, cobra únicamente por peso y no toma peso volumétrico, así que las reglas de volumétrico de arriba no aplican en absoluto."]]],"dim":["以 20×15×10 吋、體積 3,000 in³、實重 10 磅之包裹為例：\n　　寄至 Zone 7　　　體積與 Zone 均達標 → 適用材積重 → 計費 22 磅\n　　寄至 Zone 3　　　Zone 未達 5 → 不適用 → 計費 10 磅\n　　體積 480 in³　　 未逾 1,728 → 不適用 → 依實重計費\n同一包裹因寄送距離不同，分別以 10 磅與 22 磅計價，差異顯著。","Take a parcel of 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb:\n    to zone 7      both conditions met -> DIM applies -> billed 22 lb\n    to zone 3      below zone 5 -> does not apply -> billed 10 lb\n    at 480 in3     under 1,728 -> does not apply -> billed on actual weight\nThe same parcel is rated at 10 lb or at 22 lb depending only on how far it travels.","Toma un paquete de 20 x 15 x 10 in, 3,000 in3, peso real 10 lb:\n    a la zona 7     se cumplen las dos -> aplica volumétrico -> se cobran 22 lb\n    a la zona 3     por debajo de la zona 5 -> no aplica -> se cobran 10 lb\n    con 480 in3     por debajo de 1,728 -> no aplica -> se cobra el peso real\nEl mismo paquete se cobra a 10 lb o a 22 lb dependiendo solo de qué tan lejos va."]}};

const CALCV={l:20,w:15,h:10,wt:10,u:"imp"};   /* 預設一律英制 */
const U_IN=2.54, U_LB=0.45359237;
function unitLab(){ return CALCV.u==="met" ? ["cm","kg"] : ["in","lb"]; }
/* 填進去的值換成英制。除數是英制的，換包裹比換除數安全。 */
function toImp(){
  const k = CALCV.u==="met" ? 1/U_IN : 1, kw = CALCV.u==="met" ? 1/U_LB : 1;
  return {l:(+CALCV.l||0)*k, w:(+CALCV.w||0)*k, h:(+CALCV.h||0)*k, wt:(+CALCV.wt||0)*kw};
}
/* 切換單位時把同一個箱子換過去，不是把數字原地留著改標籤——
   20 in 的箱子按下公制應該變成 50.8 cm，不是變成 20 cm 的另一個箱子。 */
function setUnits(u){
  if(u===CALCV.u) return;
  const dk = u==="met" ? U_IN : 1/U_IN, wk = u==="met" ? U_LB : 1/U_LB;
  const r1 = v => Math.round((+v||0)*10)/10;
  CALCV.l=r1(CALCV.l*dk); CALCV.w=r1(CALCV.w*dk); CALCV.h=r1(CALCV.h*dk);
  CALCV.wt=r1(CALCV.wt*wk);
  CALCV.u=u; sfxClick(); mount();
}
function calcOut(k){
  const R_=(D.CARRIER_RULES||{})[k]||{};
  const div=+(R_.divisor||139), maxW=+(R_.maxw||150), maxL=+(R_.maxl||108), maxLG=+(R_.maxlg||165);
  const I_=toImp();
  const sides=[I_.l,I_.w,I_.h].map(v=>Math.max(0,v)).sort((a,b)=>b-a);
  const cube=sides[0]*sides[1]*sides[2];
  const lg=sides[0]+2*(sides[1]+sides[2]);
  const wt=Math.max(0,I_.wt);
  /* USPS 兩個條件都成立才算材積重；UPS/FedEx 無條件 */
  const needCube=+(R_.dimcube||0), needZone=+(R_.dimzone||0);
  const dimOn = needCube===0 ? true : (cube>needCube);
  const dimW = dimOn ? cube/div : 0;
  const bill = Math.ceil(Math.max(wt,dimW));
  const over = wt>maxW || sides[0]>maxL || lg>maxLG;
  let hits=[];
  if(k==="usps"){
    if(sides[0]>22) hits.push("Nonstandard · >22 in");
    if(sides[0]>30) hits.push("Nonstandard · >30 in");
    if(cube>3456)   hits.push("Nonstandard · >3,456 in³");
    if(lg>84)       hits.push("Balloon pricing · ≥20 lb");
  } else {
    const lps = wt>110 || sides[0]>96 || lg>130;
    if(lps) hits.push("LPS");
    else if(wt>50||sides[0]>48||sides[1]>30||lg>105) hits.push("AHS");
  }
  return {sides:sides,cube:cube,lg:lg,dimW:dimW,dimOn:dimOn,bill:bill,wt:wt,
          byDim:dimOn&&dimW>wt,over:over,hits:hits,div:div,needZone:needZone};
}

    if(s.mode==="quiz"||s.mode==="card"||s.mode==="slide") QZ.mode=s.mode;
  }catch(e){}
}
function qzSave(){
  store("qz", JSON.stringify({n:QZ.n, ok:QZ.ok, streak:QZ.streak, best:QZ.best,
                              miss:QZ.miss, lvl:QZ.lvl, mode:QZ.mode}));
}
/* 借用全域狀態算一題，算完原封不動還回去。calc() 和 renderResult() 都是
   讀 V／FLAGS 的，與其把它們改成收參數（會動到已經在用的計算頁），
   不如在這裡借還——借還發生在同一個同步區塊裡，中間不會有人插隊。 */
function qzWith(p, fn){
  const sv=Object.assign({},V), sf=Object.assign({},FLAGS);
  Object.assign(V,{weight:p.w, length:p.l, width:p.wd, height:p.h, zone:String(p.zone)});
  Object.assign(FLAGS,{residential:!!p.res, das:"none", signature:false,
                       ahspack:false, peak:false});
  let r;
  try{ r=fn(); }
  finally{
    Object.keys(V).forEach(k=>delete V[k]); Object.assign(V,sv);
    Object.assign(FLAGS,sf);
  }
  return r;
}
const qzEval = p => qzWith(p, calc);
const qzWork = p => qzWith(p, renderResult);
const qzR = (a,b,s)=>{ s=s||1; return Math.round((a+Math.random()*(b-a))/s)*s; };
const qzPickOne = a => a[Math.floor(Math.random()*a.length)];
function qzShuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* 門檻一律從 V 讀，不寫死。改了規則設置那一頁，題目跟著改。 */
function qzLimits(){
  return {ahsw:num("ahsw"), ahsl:num("ahsl"), ahss:num("ahss"), ahsg:num("ahsg"),
          lpsw:num("lpsw"), lpsl:num("lpsl"), lpsg:num("lpsg"),
          maxw:num("maxw"), maxl:num("maxl"), div:num("divisor")||139};
}
/* 五種胚型。進階把數字壓到門檻上下一磅／一吋之內——差 0.1 磅兩百多美金
   那句話，用讀的沒感覺，被扣一次分才會記住。 */
function qzGen(lvl){
  const T=qzLimits(), sharp=(lvl===2);
  const e=()=> sharp ? qzR(1,10,1)/10 : qzR(15,60,1)/10;   /* 超過門檻多少 */
  const shape=qzPickOne(["plain","dim","dim","ahsw","ahss","ahss","lps"]);
  let l,wd,h,w;
  if(shape==="plain"){
    l=qzR(9,18); wd=qzR(7,15); h=qzR(5,12); w=qzR(2,26);
  }else if(shape==="dim"){                      /* 大而輕：材積重要贏過實重 */
    l=qzR(20,26); wd=qzR(15,19); h=qzR(11,15); w=qzR(3,9);
  }else if(shape==="ahsw"){                     /* 只中重量 */
    l=qzR(12,20); wd=qzR(10,16); h=qzR(8,13); w=Math.round((T.ahsw+e())*10)/10;
  }else if(shape==="ahss"){                     /* 只中尺寸 */
    l=Math.round((T.ahsl+e())*10)/10; wd=qzR(8,14); h=qzR(6,11); w=qzR(6,28);
  }else{                                        /* LPS：壓在上限以內，不然變成超限件 */
    l=Math.round((T.lpsl+e())*10)/10; wd=qzR(9,15); h=qzR(7,12); w=qzR(20,60);
  }
  return {w:w, l:l, wd:wd, h:h, zone:String(qzR(2,8)), res:Math.random()<0.6, shape:shape};
}
/* 生出來的件必須算得出價：超過費率表頂端（150 lb）或超過包裹上限的，
   引擎會回 error／refused，那種件不能拿來當題目，重抽。 */
function qzDraw(lvl){
  for(let i=0;i<80;i++){
    const p=qzGen(lvl), d=qzEval(p);
    if(d.error||d.refused) continue;
    if(d.aw.length && d.az.length) continue;   /* 兩類同時中，單選題會有兩個對的 */
    return {p:p, d:d};
  }
  const p={w:10, l:20, wd:15, h:10, zone:"5", res:true, shape:"dim"};
  return {p:p, d:qzEval(p)};
}
function qzNew(){
  /* USPS 沒有 AHS 也沒有 LPS，判定那一型對它問不出東西，一律換成觀念題。 */
  const hasSur = FLAGS.autoahs || FLAGS.autolps;
  let kind = QZ.kind==="mix"
    ? (hasSur ? qzPickOne(["sur","sur","idea","idea","idea"]) : "idea")
    : QZ.kind;
  if(kind==="sur" && !hasSur) kind="idea";
  QZ.pick=null; QZ.work=false;
  if(kind==="idea"){
    const b=qzPickOne(QZ_BANK);
    QZ.q={kind:"idea", tag:b.t, stem:triv(b.q), why:triv(b.w),
          opts:qzShuffle(b.o.map((o,i)=>({t:triv(o), ok:i===b.k})))};
    return;
  }
  const {p,d}=qzDraw(QZ.lvl);
  const key = d.isLPS ? "s_lps" : (d.aw.length ? "s_ahsw" : (d.az.length ? "s_ahss" : "s_none"));
  const all=["s_none","s_ahsw","s_ahss","s_lps"];
  let why;
  if(d.isLPS) why=d.lp.map(([k,v,t])=>k+" "+(+v).toFixed(1)+" > "+t).join("　·　");
  else if(d.aw.length) why=d.aw.map(([v,t])=>"weight "+(+v).toFixed(1)+" > "+t).join("　·　");
  else if(d.az.length) why=d.az.map(([k,v,t])=>k+" "+(+v).toFixed(1)+" > "+t).join("　·　");
  else why=triv(["三個門檻都沒過。","None of the thresholds is exceeded.","No se rebasa ningún umbral."]);
  QZ.q={kind:"sur", tag:"sur", p:p, d:d, stem:triv(QZ_TXT.q_sur), why:why,
        opts:qzShuffle(all.map(k=>({t:triv(QZ_TXT[k]), ok:k===key})))};
}
function qzAnswer(i){
  if(QZ.pick!==null) return;
  QZ.pick=i;
  const good=!!(QZ.q.opts[i] && QZ.q.opts[i].ok);
  QZ.n++;
  if(good){ QZ.ok++; QZ.streak++; if(QZ.streak>QZ.best) QZ.best=QZ.streak; }
  else { QZ.streak=0; const t=QZ.q.tag; QZ.miss[t]=(QZ.miss[t]||0)+1; QZ.work=true; }
  qzSave();
  if(typeof sfxCalc==="function" && good) sfxCalc(); else if(typeof sfxClick==="function") sfxClick();
  qzRepaint();
}
function qzParcelRows(p,d){
  const T=QZ_TXT, n=v=>Math.round(v).toLocaleString("en-US");

    [triv(T.carrier), CARRIER_NAME[FLAGS.carrier]],

    [triv(T.addr), triv(p.res?T.res:T.com)],
    [triv(T.size), p.l+" × "+p.wd+" × "+p.h+" in"],
    [triv(T.wt), p.w+" lb"],
    [triv(["長度加周長","length + girth","largo + contorno"]), n(d.lg)+" in"],
    [triv(["材積","cube","volumen"]), n(d.cubic)+" in³"]

/* =====================================================================
   閃卡：跟出題共用同一組觀念題，不另外建一份題庫。
   記住了就從這一輪抽掉，再看一次就排到最後面。一輪結束才洗牌重來。

/* =====================================================================
   門檻滑桿：同一件包裹，邊拉邊看每一條門檻離多遠。跨過去的那一刻
   把前後總額並排寫出來——「差 0.1 磅兩百多美金」用讀的沒感覺。
   計算走的還是 calc()，跟出題和計算器是同一套。
   ===================================================================== */
const SL = {l:20, wd:15, h:10, w:10, zone:"5", res:true, key:null, total:null, jump:null};
function slKey(d){
  if(d.refused) return "v_over";
  if(d.error) return "err";
  if(d.isLPS) return "v_lps";
  if(d.aw.length && d.az.length) return "v_ahsb";
  if(d.aw.length) return "v_ahsw";
  if(d.az.length) return "v_ahss";
  return "v_none";
}
/* 每一條門檻：目前值、門檻、有沒有跨過。門檻是 0 的（那一家沒有這一條）
   直接不列，不要畫一條永遠不會亮的柱子。 */
function slRows(d){
  const T=QZ_TXT, L=[];
  const A=(lab,cur,th,u)=>{ if(th>0) L.push([lab,cur,th,u]); };
  if(FLAGS.autoahs){
    A(["AHS 重量","AHS weight","AHS peso"], d.w, num("ahsw"), "lb");
    A(["AHS 最長邊","AHS longest side","AHS lado más largo"], d.longest, num("ahsl"), "in");
    A(["AHS 第二長邊","AHS second side","AHS segundo lado"], d.second, num("ahss"), "in");
    A(["AHS 長度加周長","AHS length + girth","AHS largo + contorno"], d.lg, num("ahsg"), "in");
  }
  if(FLAGS.autolps){
    A(["LPS 重量","LPS weight","LPS peso"], d.w, num("lpsw"), "lb");
    A(["LPS 最長邊","LPS longest side","LPS lado más largo"], d.longest, num("lpsl"), "in");
    A(["LPS 長度加周長","LPS length + girth","LPS largo + contorno"], d.lg, num("lpsg"), "in");
  }
  A(["Balloon 長度加周長","Balloon length + girth","Balloon largo + contorno"], d.lg, num("balloonlg"), "in");
  A(["上限 重量","Limit weight","Límite peso"], d.w, num("maxw"), "lb");
  A(["上限 最長邊","Limit longest side","Límite lado más largo"], d.longest, num("maxl"), "in");
  A(["上限 長度加周長","Limit length + girth","Límite largo + contorno"], d.lg, num("maxlg"), "in");
  return L.map(([lab,cur,th,u])=>{
    const hit=cur>th, pct=Math.max(2,Math.min(100, th?cur*100/th:0));
    const gap=Math.abs(cur-th).toFixed(1);
    const tail=hit ? triv(QZ_TXT.sl_over)+" "+gap+" "+u
                   : triv(QZ_TXT.sl_under)+" "+gap+" "+u;
    return `<div class="slb${hit?" hit":""}"><div class="lab"><span>${esc(triv(lab))}</span>`
         + `<b>${cur.toFixed(1)} / ${th} ${esc(u)}　${esc(tail)}</b></div>`
         + `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></div>`;
  }).join("");
}
function slOut(){
  const T=QZ_TXT;
  const p={w:SL.w, l:SL.l, wd:SL.wd, h:SL.h, zone:SL.zone, res:SL.res};
  const d=qzEval(p);
  if(d.error) return `<div class="warn">${esc(d.error)}</div>`;
  const k=slKey(d), total=(typeof d.total==="number")?d.total:null;
  if(SL.key!==null && k!==SL.key) SL.jump={from:SL.total, to:total, k:k};
  SL.key=k; SL.total=total;
  let h="";
  if(SL.jump){
    const j=SL.jump, a=(j.from===null)?triv(T.sl_refuse):fmtMoney(j.from);
    const b=(j.to===null)?triv(T.sl_refuse):fmtMoney(j.to);
    h+=`<div class="flow"><b>${esc(triv(T.sl_jump))}</b>　${esc(triv(T[j.k]||T.v_none))}`
     + `　${esc(a)} → ${esc(b)}</div>`;
  }
  if(d.refused){
    h+=`<div class="warn">${esc(triv(T.sl_refuse))}</div>`;
    h+=slRows(slGeom(p));
    return h;
  }
  const n=v=>Math.round(v).toLocaleString("en-US");
  h+=rows([
    [triv(T.sl_sorted), d.longest+" / "+d.second+" / "+d.third+" in"],
    [triv(T.sl_lg), n(d.lg)+" in"],
    [triv(T.sl_cube), n(d.cubic)+" in³"],
    [triv(T.sl_dim), d.dimUsed?d.dim.toFixed(1)+" lb":"—"],
    [triv(T.sl_bill), d.final+" lb"],
    [triv(T.sl_verdict), triv(T[k]||T.v_none)],
    [triv(T.sl_total), fmtMoney(d.total)]
  ]);
  if(d.floor>d.standard) h+=note(triv(T.sl_floor));
  h+=`<div class="small">${esc(triv(T.sl_bars))}</div>`+slRows(d);
  return h;
}
/* refused 的時候 calc() 提早 return，沒有 lg／cubic 可以用，這裡自己補一份，
   柱子才不會整排消失。 */
function slGeom(p){
  const s=[p.l,p.wd,p.h].sort((a,b)=>b-a);
  return {longest:s[0], second:s[1], third:s[2], lg:s[0]+2*(s[1]+s[2]),
          cubic:p.l*p.wd*p.h, w:p.w};
}
function slRange(k, lab, min, max, step, unit){

}

  h+=card(triv(T.score), sc);

/* =====================================================================
   練習分頁：一題、四個選項、一顆鍵。就這樣。

   只是不再從這裡進去。
   ===================================================================== */
const PS={}; /* 這一頁自己不存狀態，題目和分數還是留在各自的模組裡 */
function psAt(){ return SKIN_KEY==="barney" ? BN : QZ; }

function psNext(){
  if(SKIN_KEY==="barney"){ BN.kind="mix"; bnNew(); }
  else {

    /* 難度鈕收掉了，改成每題隨機——邊界那種件本來就該不定時出現，

function psPick(i){
  if(SKIN_KEY==="barney"){
    if(BN.pick!==null && BN.pick!==undefined) return;
    BN.pick=i; bnScore(!!BN.q.opts[i].ok, BN.q.tag); sfxClick(); prRepaint();
  } else {
    qzAnswer(i);      /* 這一支自己會記分、存檔、重畫 */
  }
}
function prInner(){
  const T=QZ_TXT, q=psQ(), barney=(SKIN_KEY==="barney");
  const picked = barney ? BN.pick : QZ.pick;
  const done = picked!==null && picked!==undefined;
  if(!q) return card(triv(T.title),
    `<div class="pick"><button data-ps="next">${esc(triv(T.start))}</button></div>`);
  let b=`<div class="note" style="font-size:13.5px;color:#3B2A1B">${esc(q.stem)}</div>`;
  if(!barney && q.p) b+=qzParcelRows(q.p,q.d);          /* 題目本身的資料，不是控制項 */
  if(barney && q.body) b+=`<div class="flow">${esc(q.body)}</div>`;
  b+=`<div class="pick multi">`+q.opts.map((o,i)=>{
    let cl="";
    if(done && o.ok) cl="on"; else if(done && i===picked) cl="bad";
    return `<button data-ps="ans" data-i="${i}" class="${cl}"${done?" disabled":""}>${esc(o.t)}</button>`;
  }).join("")+`</div>`;
  if(done){
    /* 對錯不另外寫一條橫幅：正解那一顆本來就會標深色打勾，選錯的那一顆會轉紅，
       再加一句「答對」等於把同一件事講兩次，配對題沒有說明時還會變成一條空的。 */
    if(q.why) b+=note(q.why);
    b+=`<div class="pick"><button data-ps="next">${esc(triv(T.next))}</button></div>`;
  }
  return card(triv(T.title), b);
}
function tabQuiz(){ return `<div id="prWrap">`+prInner()+`</div>`; }
function prRepaint(){
  const w=document.getElementById("prWrap"); if(!w) return;
  w.innerHTML=prInner(); qzBind();
}
/* mount() 每次重畫都會叫這一支；不在這一頁的時候自己 return。 */
function qzBind(){
  const w=document.getElementById("prWrap"); if(!w) return;
  w.querySelectorAll("[data-ps]").forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.ps==="next"){ psNext(); sfxClick(); prRepaint();
        const pg=document.getElementById("page"); if(pg) pg.scrollTop=0; }
      else psPick(+b.dataset.i);
    };
  });
}

   檔案裡沒有刪，要把閃卡或滑桿放回來只要改 prInner()。 */

function qzBindOwn(){
  const w=document.getElementById("qzWrap"); if(!w) return;
  /* 滑桿走 input 事件，而且只換 #slOut 那一塊——整頁重畫會把手指底下的
     那根桿子換掉，拖到一半就斷了。 */
  w.querySelectorAll("input[data-sl]").forEach(inp=>{
    inp.oninput=()=>{
      const k=inp.dataset.sl;
      SL[k]=parseFloat(inp.value)||0;
      const lb=inp.parentNode.querySelector("label b");
      if(lb) lb.textContent=SL[k]+" "+(k==="w"?"lb":"in");
      slPaint();
    };
  });
  w.querySelectorAll("[data-qz]").forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.qz;
      if(a==="mode"){ QZ.mode=b.dataset.v; qzSave(); sfxClick(); qzRepaint(); }
      else if(a==="lvl"){ QZ.lvl=+b.dataset.v; QZ.q=null; qzSave(); sfxClick(); qzRepaint(); }
      else if(a==="kind"){ QZ.kind=b.dataset.v; QZ.q=null; sfxClick(); qzRepaint(); }
      else if(a==="next"){ qzNew(); sfxClick(); qzRepaint();
        const pg=document.getElementById("page"); if(pg) pg.scrollTop=0; }
      else if(a==="ans"){ qzAnswer(+b.dataset.i); }
      else if(a==="work"){ QZ.work=!QZ.work; sfxClick(); qzRepaint(); }
      else if(a==="flip"){ FC.flip=!FC.flip; sfxClick(); qzRepaint(); }
      else if(a==="fckeep"){
        if(FC.deck && FC.deck.length){ FC.deck.splice(FC.i,1); if(FC.i>=FC.deck.length) FC.i=0; }
        FC.flip=false; sfxCalc(); qzRepaint();
      }
      else if(a==="fcagain"){
        if(FC.deck && FC.deck.length>1){ FC.deck.push(FC.deck.splice(FC.i,1)[0]); if(FC.i>=FC.deck.length) FC.i=0; }
        FC.flip=false; sfxClick(); qzRepaint();
      }
      else if(a==="fcshuffle"){ fcShuffle(); sfxClick(); qzRepaint(); }
      else if(a==="slzone"){ SL.zone=b.dataset.v; sfxClick(); qzRepaint(); }
      else if(a==="slres"){ SL.res=b.dataset.v==="1"; sfxClick(); qzRepaint(); }
      else if(a==="slreset"){
        Object.assign(SL,{l:20,wd:15,h:10,w:10,zone:"5",res:true,key:null,total:null,jump:null});
        sfxClick(); qzRepaint();
      }
      else if(a==="sltocalc"){
        CALCV.u="imp"; CALCV.l=SL.l; CALCV.w=SL.wd; CALCV.h=SL.h; CALCV.wt=SL.w;
        sfxClick(); goTab(2);
      }
      else if(a==="tocalc"){
        const p=QZ.q&&QZ.q.p; if(!p) return;
        CALCV.u="imp"; CALCV.l=p.l; CALCV.w=p.wd; CALCV.h=p.h; CALCV.wt=p.w;
        sfxClick(); goTab(2);
      }
      else if(a==="reset"){
        QZ.n=0; QZ.ok=0; QZ.streak=0; QZ.best=0; QZ.miss={};
        qzSave(); sfxClick(); qzRepaint();
      }
    };
  });
}

/* =====================================================================
   按鍵回饋：按下去彈一下，順便噴幾個小圖示。
   符號和顏色跟著主題走——Poppy 是愛心，Marigold 是花，Barnaby 只有火花，
   因為那一套是拿來投影帶班的，滿畫面愛心會蓋掉正在講的東西。
   全部走事件代理，所以之後新增的按鍵不用另外接。
   ===================================================================== */
const SKIN_FX={
  goldie:{glyphs:["\u273f","\u2726","\u2661"], colors:["#F6C95B","#C88678","#E9CFC4"], n:3},
  barney:{glyphs:["\u2726","\u00b7"],           colors:["#E8B93C","#7C5236"],           n:2},
  poppy: {glyphs:["\u2661","\u2665","\u2726","\u273f"], colors:["#F28FB3","#C99BE8","#71C9CE","#F7C873"], n:4},
  doodle:{glyphs:["\u2726","\u2727","\u273f"],  colors:["#C9A24A","#8A5C3C","#A98CC9"], n:3}
};
(function(){
  let last=0;
  function burst(x,y){
    const cfg=SKIN_FX[typeof SKIN_KEY!=="undefined"?SKIN_KEY:"goldie"]||SKIN_FX.goldie;
    for(let i=0;i<cfg.n;i++){
      const el=document.createElement("span");
      el.className="fx-pop";
      el.textContent=cfg.glyphs[Math.floor(Math.random()*cfg.glyphs.length)];
      el.style.setProperty("--x",x+"px");
      el.style.setProperty("--y",y+"px");
      el.style.setProperty("--dx",((Math.random()-.5)*60)+"px");
      el.style.setProperty("--dy",(-26-Math.random()*46)+"px");
      el.style.setProperty("--rot",((Math.random()-.5)*30)+"deg");
      el.style.setProperty("--size",(13+Math.random()*9)+"px");
      el.style.setProperty("--color",cfg.colors[Math.floor(Math.random()*cfg.colors.length)]);
      document.body.appendChild(el);
      requestAnimationFrame(()=>el.classList.add("show"));
      setTimeout(()=>el.remove(),900);
    }
  }
  document.addEventListener("click",e=>{
    const b=e.target && e.target.closest ? e.target.closest("button") : null;
    if(!b) return;
    /* 連點的時候不要疊，不然畫面上會有一整片沒散掉的圖示 */
    const now=Date.now(); if(now-last<120) return; last=now;
    b.classList.remove("tap-bounce"); void b.offsetWidth; b.classList.add("tap-bounce");
    setTimeout(()=>b.classList.remove("tap-bounce"),520);
    const r=b.getBoundingClientRect();
    burst(e.clientX||r.left+r.width/2, e.clientY||r.top+r.height/2);
  },true);
})();
