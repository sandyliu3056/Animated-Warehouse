const BN = {kind:"mix", q:null, pick:null, n:0, ok:0, streak:0, best:0, miss:{},
            card:null, cardBack:false, dayQ:null, dayPick:null, dayKey:"", big:false};
function bnToday(){ const d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
/* 每日一題要「全班同一天看到同一題」，所以不能用亂數，要用日期當種子。 */
function bnSeed(s){ let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return Math.abs(h); }
function bnLoad(){
  try{ const s=JSON.parse(store("qzb")||"{}");
    ["n","ok","streak","best"].forEach(k=>{ if(typeof s[k]==="number") BN[k]=s[k]; });
    if(s.miss && typeof s.miss==="object") BN.miss=s.miss;
    if(typeof s.kind==="string") BN.kind=s.kind;
    if(s.dayKey===bnToday() && typeof s.dayPick==="number") BN.dayPick=s.dayPick;
    BN.big=!!s.big;
  }catch(e){}
  BN.dayKey=bnToday();
}
function bnSave(){
  store("qzb", JSON.stringify({n:BN.n, ok:BN.ok, streak:BN.streak, best:BN.best,
    miss:BN.miss, kind:BN.kind, dayKey:BN.dayKey, dayPick:BN.dayPick, big:BN.big}));
}
function bnApplyBig(){
  if(document.body) document.body.classList.toggle("big", !!BN.big);
}
const bnPickOne = a => a[Math.floor(Math.random()*a.length)];
function bnShuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* WAREHOUSE_FEES 是 [中文名, 英文名, 中文說明, 英文說明]，西文放在 ES_FEES
   裡用英文名當鍵。這裡把三語攤成同一個形狀，後面就不用再分語言。 */
function bnFee(f){
  const es=(D.ES_FEES||{})[f[1]];
  return lang==="zh" ? {n:f[0], d:f[2]}
       : lang==="es" && es ? {n:es[0], d:es[1]}
       : {n:f[1], d:f[3]};
}
const bnList = k => (D[k] && (D[k][lang]||D[k].en||D[k].zh)) || [];
/* 名詞配對：說明在上、四個名稱在下。誘答一律從同一張表抽——
   從別張表抽的話光看類別就選得出來，考不到東西。 */
function bnMatch(items, stem, tag){
  const pool=bnShuffle(items.slice()).slice(0,4);
  if(pool.length<4) return null;
  const right=pool[0];
  /* 說明就是題幹裡那一段，答完不要再貼一次——畫面上會出現兩段一模一樣的字。 */
  return {kind:tag, tag:tag, stem:stem, body:right.d,
          opts:bnShuffle(pool.map((x,i)=>({t:x.n, ok:i===0})))};
}
function bnBuild(kind){
  if(kind==="fee"){
    const items=(D.WAREHOUSE_FEES||[]).map(bnFee);
    return bnMatch(items, triv(BN_TXT.q_fee), "fee");
  }
  if(kind==="job"){
    /* 只放 JOBS。原本這裡把 PREP 一起倒進來，於是「這是誰的工作？」的正解
       會跑出 Walmart WFS——那是通路不是職務，題目本身就不成立。 */
    const items=bnList("JOBS").map(a=>({n:a[0], d:a[1]}));
    return bnMatch(items, triv(BN_TXT.q_job), "job");
  }
  if(kind==="prep"){
    const items=bnList("PREP").map(a=>({n:a[0], d:a[1]}));
    return bnMatch(items, triv(BN_TXT.q_prep), "prep");
  }
  const b=bnPickOne(BN_OPS);
  return {kind:"rule", tag:"rule", stem:triv(b.q), why:triv(b.w),
          opts:bnShuffle(b.o.map((o,i)=>({t:triv(o), ok:i===b.k})))};
}
function bnNew(){
  const kind = BN.kind==="mix" ? bnPickOne(["rule","rule","rule","rule","fee","fee","job","prep"]) : BN.kind;
  BN.pick=null;
  BN.q = bnBuild(kind) || bnBuild("rule");
}
/* 每日一題：同一天同一題，換一天才會換。 */
function bnDaily(){
  if(BN.dayQ && BN.dayKey===bnToday()) return BN.dayQ;
  BN.dayKey=bnToday();
  const b=BN_OPS[bnSeed(BN.dayKey)%BN_OPS.length];
  const opts=b.o.map((o,i)=>({t:triv(o), ok:i===b.k}));
  /* 選項順序也要照日期固定，不然重新整理一次答案就換位置了。 */
  const s=bnSeed(BN.dayKey+"o");
  for(let i=opts.length-1;i>0;i--){ const j=(s>>(i*3))%(i+1); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  BN.dayQ={kind:"rule", tag:"rule", stem:triv(b.q), why:triv(b.w), opts:opts};
  return BN.dayQ;
}
function bnScore(good, tag){
  BN.n++;
  if(good){ BN.ok++; BN.streak++; if(BN.streak>BN.best) BN.best=BN.streak; }
  else { BN.streak=0; BN.miss[tag]=(BN.miss[tag]||0)+1; }
  bnSave();
  if(good && typeof sfxCalc==="function") sfxCalc(); else if(typeof sfxClick==="function") sfxClick();
}
/* 閃卡：把手冊裡幾張長篇的內容攤成一問一答。這幾組原本只有中英，
   西文缺的落回英文——她那份資料本來就是這樣退的。 */
function bnCardPool(){
  const out=[];
  (D.WAREHOUSE_FEES||[]).forEach(f=>{ const x=bnFee(f); out.push([x.n, x.d]); });
  ["JOBS","PREP","RMA","TRUCKLOAD","TRUCKLOAD_SHIP","TRUCKLOAD_LIMITS","FBA_MODES"]
    .forEach(k=>bnList(k).forEach(a=>out.push([a[0], a[1]])));
  return out;
}
function bnCardNew(){
  const p=bnCardPool();
  BN.card=p.length?bnPickOne(p):null;
  BN.cardBack=false;
}
function bnOptRow(q, picked, dataAttr){
  const done=picked!==null&&picked!==undefined;
  return `<div class="pick multi">`+q.opts.map((o,i)=>{
    let cl="";
    if(done && o.ok) cl="on"; else if(done && i===picked) cl="bad";
    return `<button data-bn="${dataAttr}" data-i="${i}" class="${cl}"${done?" disabled":""}>${esc(o.t)}</button>`;
  }).join("")+`</div>`;
}
function bnVerdict(q, picked){
  const good=q.opts[picked].ok, ansI=q.opts.findIndex(o=>o.ok);
  return `<div class="${good?"flow":"warn"}"><b>${esc(triv(good?BN_TXT.right:BN_TXT.wrong))}</b>`
       + (good?"":"　"+esc(triv(BN_TXT.answer))+"："+esc(q.opts[ansI].t))+`</div>`
       + (q.why?note(q.why):"");
}
function bnInner(){
  const T=BN_TXT;
  let h="";
  /* ---- 每日一題 ---- */
  const dq=bnDaily();
  let dh=`<div class="note" style="color:#3B2A1B">${esc(dq.stem)}</div>`
       + bnOptRow(dq, BN.dayPick, "day");
  if(BN.dayPick!==null && BN.dayPick!==undefined)
    dh += bnVerdict(dq, BN.dayPick) + `<div class="small">${esc(triv(T.dailydone))}</div>`;
  h+=card(triv(T.daily)+"　·　"+BN.dayKey, dh);
  /* ---- 練習 ---- */
  let s=`<div class="upick"><span>${esc(triv(T.kind))}</span>`
   + [["mix",T.k_mix],["rule",T.k_rule],["fee",T.k_fee],["job",T.k_job]].map(([v,lab])=>
       `<button data-bn="kind" data-v="${v}" class="${BN.kind===v?"on":""}">${esc(triv(lab))}</button>`).join("")
   + `</div>`;
  let b=s;
  if(!BN.q){
    b+=`<div class="pick"><button data-bn="next">${esc(triv(T.start))}</button></div>`;
  }else{
    const q=BN.q;
    b+=`<div class="note" style="color:#3B2A1B">${esc(q.stem)}</div>`;
    if(q.body) b+=`<div class="flow">${esc(q.body)}</div>`;
    b+=bnOptRow(q, BN.pick, "ans");
    if(BN.pick!==null){
      b+=bnVerdict(q, BN.pick);
      b+=`<div class="pick"><button data-bn="next">${esc(triv(T.next))}</button></div>`;
    }
  }
  h+=card(triv(T.title), b);
  /* ---- 名詞閃卡 ---- */
  let c=note(triv(T.cardsnote));
  if(!BN.card) bnCardNew();
  if(BN.card){
    c+=`<div class="qzflip" data-bn="flip">`
     + `<span class="fk">${esc(BN.cardBack?BN.card[0]:"?")}</span>`
     + `<span class="fv">${esc(BN.cardBack?BN.card[1]:BN.card[0])}</span></div>`;
    c+=`<div class="pick"><button data-bn="flip">${esc(triv(T.flip))}</button>`
     + `<button data-bn="card">${esc(triv(T.nextcard))}</button></div>`;
  }
  h+=card(triv(T.cards), c);
  /* ---- 成績 ---- */
  const pct=BN.n?Math.round(BN.ok*100/BN.n):0;
  let sc=rows([[triv(T.done),String(BN.n)],[triv(T.hit),BN.ok+"　("+pct+"%)"],
               [triv(T.streak),String(BN.streak)],[triv(T.best),String(BN.best)]]);
  const mk=Object.keys(BN.miss).sort((a,b)=>BN.miss[b]-BN.miss[a]);
  sc+=`<div class="small">${esc(triv(T.miss))}</div>`;
  sc+= mk.length ? `<div class="flow">`+esc(mk.map(k=>triv(BN_TXT["tag_"+k]||[k,k,k])+" × "+BN.miss[k]).join("　·　"))+`</div>`
                 : note(triv(T.nomiss));
  sc+=`<div class="pick"><button data-bn="reset">${esc(triv(T.reset))}</button></div>`;
  h+=card(triv(T.score), sc);
  /* ---- 投影模式 ---- */
  h+=card(triv(T.big),
      note(triv(T.bignote))
    + `<div class="upick">`
    + [[1,T.on],[0,T.off]].map(([v,lab])=>
        `<button data-bn="big" data-v="${v}" class="${(BN.big?1:0)===v?"on":""}">${esc(triv(lab))}</button>`).join("")
    + `</div>`);
  return h;
}

/* 借用全域狀態算一件，算完原封還回去。calc() 是讀 V／FLAGS 的，
   與其把它改成收參數（會動到已經在用的計算頁），不如在這裡借還。 */
function feelWith(p, fn){
  const sv=Object.assign({},V), sf=Object.assign({},FLAGS);
  Object.assign(V,{weight:p.w, length:p.l, width:p.wd, height:p.h, zone:String(p.zone||"5")});
  Object.assign(FLAGS,{residential:true, das:"none", signature:false, ahspack:false, peak:false});
  let r; try{ r=fn(); } finally{
    Object.keys(V).forEach(k=>delete V[k]); Object.assign(V,sv); Object.assign(FLAGS,sf);
  }
  return r;
}
const feelCalc = p => feelWith(p, calc);
function feelBar(d){
  const T=FEEL_TXT, tot=d.total||1;
  const seg=[[triv(T.base),d.base,"var(--md)"],
             [triv(T.acc),d.accTotal,"var(--ac)"],
             [triv(T.fuel),d.fuel,"var(--lt)"]];
  let h=`<div class="feelbar">`+seg.map(([lab,v,c])=>
      v>0?`<i style="flex:${(v/tot).toFixed(4)};background:${c}"></i>`:"").join("")+`</div>`;
  h+=`<div class="feelkey">`+seg.map(([lab,v,c])=>
      `<span><b style="background:${c}"></b>${esc(lab)} ${esc(fmtMoney(v))}</span>`).join("")+`</div>`;
  return h;
}
function feelBlock(k){
  const T=FEEL_TXT;
  const L=Math.max(6, Math.min(num("maxl")||108, FEEL.len));
  const p={w:12, l:L, wd:14, h:10, zone:"5"};
  const d=feelCalc(p);
  const hit = d.error||d.refused ? "—"
            : d.isLPS ? "LPS" : (d.isAHS ? "AHS" : triv(T.none));
  const bad = d.error||d.refused || d.isLPS || d.isAHS;
  let h=`<h3 class="sub">${esc(triv(T.title))}</h3>`+note(triv(T.lead));
  h+=`<div id="feelBox">`;
  h+=`<div class="feelnum ${bad?"hot":""}">`
   + `<span>${esc(triv(T.longest))} <b>${L.toFixed(0)} in</b></span>`
   + `<span>${esc(triv(T.bill))} <b>${d.final?d.final+" lb":"—"}</b></span>`
   + `<span>${esc(triv(T.hit))} <b>${esc(hit)}</b></span>`
   + `<span>${esc(triv(T.total))} <b>${d.total?esc(fmtMoney(d.total)):"—"}</b></span></div>`;
  h+=`<input id="feelLen" class="feelrange" type="range" min="6" max="${Math.round(num("maxl")||108)}"`
   + ` step="1" value="${Math.round(L)}">`;
  if(!d.error && !d.refused){
    h+=`<h3 class="sub">${esc(triv(T.stackt))}</h3>`+feelBar(d)+note(triv(T.stackn));
  }
  h+=`</div>`;
  /* 三箱對照：同一件 5 磅的東西，箱子換大一號 */
  const boxes=[[triv(T.small),12,10,8],[triv(T.mid),18,14,12],[triv(T.big),24,20,16]];
  h+=`<h3 class="sub">${esc(triv(T.boxt))}</h3>`;
  h+=rows(boxes.map(([lab,l,w2,hh])=>{
    const dd=feelCalc({w:5,l:l,wd:w2,h:hh,zone:"5"});
    return [lab+"　"+l+"×"+w2+"×"+hh+" in",
            (dd.final?dd.final+" lb":"—")+"　·　"+(dd.total?fmtMoney(dd.total):"—")];
  }));
  h+=note(triv(T.boxn));
  return h;
}
function feelBind(){

function feelRepaint(){
  const box=document.getElementById("feelBox"); if(!box) return;
  const T=FEEL_TXT;
  const L=Math.max(6, Math.min(num("maxl")||108, FEEL.len));
  const d=feelCalc({w:12,l:L,wd:14,h:10,zone:"5"});
  const hit = d.error||d.refused ? "—" : d.isLPS ? "LPS" : (d.isAHS ? "AHS" : triv(T.none));
  const bad = d.error||d.refused || d.isLPS || d.isAHS;
  const n=box.querySelector(".feelnum");

    n.innerHTML=`<span>${esc(triv(T.longest))} <b>${L.toFixed(0)} in</b></span>`
      + `<span>${esc(triv(T.bill))} <b>${d.final?d.final+" lb":"—"}</b></span>`
      + `<span>${esc(triv(T.hit))} <b>${esc(hit)}</b></span>`
      + `<span>${esc(triv(T.total))} <b>${d.total?esc(fmtMoney(d.total)):"—"}</b></span>`;
  }

  if(bar && key && !d.error && !d.refused){

/* mount() 每次重畫都會叫一次；兩個容器都找不到就自己 return。 */
function bnBind(){

      const a=b.dataset.bn;

      else if(a==="next"){ bnNew(); sfxClick(); bnRepaint(); }
      else if(a==="ans"){
        if(BN.pick!==null) return;
        BN.pick=+b.dataset.i;
        bnScore(!!BN.q.opts[BN.pick].ok, BN.q.tag);
        bnRepaint();

        BN.dayPick=+b.dataset.i;
        bnScore(!!bnDaily().opts[BN.dayPick].ok, "rule");
        bnRepaint();

      else if(a==="flip"){ BN.cardBack=!BN.cardBack; sfxClick(); bnRepaint(); }
      else if(a==="card"){ bnCardNew(); sfxClick(); bnRepaint(); }
      else if(a==="big"){ BN.big=b.dataset.v==="1"; bnApplyBig(); bnSave(); sfxClick(); bnRepaint(); }
      else if(a==="reset"){
        BN.n=0; BN.ok=0; BN.streak=0; BN.best=0; BN.miss={};

      }

const TOUR = { on:false, i:-1, timer:0 };

function tourEls(){
  let m=document.getElementById("tourMask");
  if(m) return m;
  m=document.createElement("div"); m.id="tourMask";
  m.innerHTML='<div id="tourHole"></div>'
    + '<div id="tourBub"><div id="tourTxt"></div>'
    + '<div id="tourFoot"><span id="tourDot"></span>'
    + '<button id="tourSkip"></button></div>'
    + '<div id="tourBar"><i></i></div></div>';
  document.body.appendChild(m);
  /* 點畫面就跳下一步；「跳過」直接結束。兩個都要 stopPropagation，
     不然按跳過會同時被當成「點畫面」再前進一步。 */
  m.addEventListener("click", e=>{
    if(e.target && e.target.id==="tourSkip"){ e.stopPropagation(); tourEnd(); return; }
    tourNext();
  });
  return m;
}
function tourEnd(){
  TOUR.on=false; clearTimeout(TOUR.timer);
  const m=document.getElementById("tourMask"); if(m) m.remove();
  try{ store(TOUR_KEY,"1"); }catch(e){}
}
function tourNext(){
  if(!TOUR.on) return;
  clearTimeout(TOUR.timer);
  TOUR.i++;
  if(TOUR.i>=TOUR_STEP.length){ tourEnd(); return; }
  tourShow();
}
/* 導覽自己會切分頁，切完要等版面重畫完才量位置。
   量早了會挖在舊版面的座標上——那是這一段唯一會出錯的地方。 */
function tourShow(){
  const s=TOUR_STEP[TOUR.i];
  let wait=60;
  if(s.tab!==undefined && s.tab!==tab){ goTab(s.tab); wait=320; }
  if(s.lv!==undefined && s.lv!==lv){ lv=s.lv; mount(); wait=320; }
  if(s.act){                                  /* 順手按下「開始上工」，畫面才有東西看 */
    const b=document.querySelector("#acts button");
    if(b && !SS.run) b.click();
  }
  setTimeout(()=>{
    if(!TOUR.on) return;
    const m=tourEls(), el=document.querySelector(s.sel);
    if(!el){ tourNext(); return; }             /* 找不到就跳過，不要卡住 */
    try{ el.scrollIntoView({block:"center",inline:"nearest"}); }catch(e){}
    const r=el.getBoundingClientRect();          /* 捲完再量，不然挖在視窗外 */
    if(r.width<4 || r.height<4){ tourNext(); return; }
    const PAD=6, vw=innerWidth, vh=innerHeight;
    const x=Math.max(2,r.left-PAD), y=Math.max(2,r.top-PAD);
    const w=Math.min(vw-x-2,r.width+PAD*2), h=Math.min(vh-y-2,r.height+PAD*2);
    const hole=m.querySelector("#tourHole");
    hole.style.cssText="left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+h+"px";
    m.querySelector("#tourTxt").textContent=triv(s.t);
    m.querySelector("#tourDot").textContent=(TOUR.i+1)+" / "+TOUR_STEP.length;
    m.querySelector("#tourSkip").textContent=
      triv(["跳過","Skip","Saltar"]);
    /* 泡泡放在挖空區下面；下面放不下就放上面 */
    const bub=m.querySelector("#tourBub");
    bub.style.cssText="";
    const bh=bub.offsetHeight||120;
    const below=(y+h+12+bh)<vh-8;
    bub.style.top = below ? (y+h+12)+"px" : Math.max(8,y-bh-12)+"px";
    const bar=m.querySelector("#tourBar > i");
    bar.style.transition="none"; bar.style.width="0%";
    requestAnimationFrame(()=>{ bar.style.transition="width "+s.ms+"ms linear";
                                bar.style.width="100%"; });
    TOUR.timer=setTimeout(tourNext, s.ms);
  }, wait);
}
function tourStart(force){
  if(TOUR.on) return;
  if(!force){ try{ if(store(TOUR_KEY)) return; }catch(e){ return; } }
  TOUR.on=true; TOUR.i=-1; tourEls(); tourNext();
}

/* =====================================================================
   開發者面板
   ---------------------------------------------------------------------
   先講清楚這東西是什麼、不是什麼：

   一、這是一道門，不是身分驗證。整支工具是單一 HTML，通關碼就寫在下面
       這一行原始碼裡，任何會按 F12 或用記事本開檔的人都看得到。它擋的
       是同仁誤觸，不是有心的人。真的要擋，得把驗證放到伺服器上。

   二、這支工具沒有後端。同仁各自跑自己那一份，誰開過、開多久，只會留在
       他自己那台機器的 localStorage。這一頁看到的是「這台裝置」的紀錄，
       不是全體同仁的即時狀態——要跨機器彙總，得另外接一個收資料的端點，
       或是請同仁按「匯出」把 JSON 傳回來。

   進場方式：網址加 #dev，或連續點五下頁尾那一行版權字（三秒內）。
   ===================================================================== */

const DEV_CODE = "sandy-dev";        /* 明碼。理由見上面第一點。 */
let DEV_SESS = null;

function devLog(){
  try{ return JSON.parse(store("devlog") || "[]"); }catch(e){ return []; }
}
function devLogSave(a){
  try{ store("devlog", JSON.stringify(a.slice(-300))); }catch(e){}
}
function devWho(){ return store("devwho") || ""; }
function devSessionStart(){
  const a = devLog();
  a.push({ at: Date.now(), who: devWho(), ver: APP_VER,
           lang: lang, tz: TZ, dur: 0 });
  devLogSave(a);
  DEV_SESS = a.length - 1;
  devTouch();
}
function devTouch(){
  if(DEV_SESS === null) return;
  const a = devLog();
  const r = a[DEV_SESS];
  if(!r) return;
  r.dur  = Math.round((Date.now() - r.at) / 1000);
  r.who  = devWho();
  r.lang = lang; r.tz = TZ;
  devLogSave(a);
}
/* 同仁匯出的 JSON 收進來，跟這台的紀錄併成一張表。
   沒有後端，這是「現在就能用」的那條路：同仁按匯出、把檔案傳回來、
   你在這裡匯入。收進來的存在另一個 key，不會混進這台自己的紀錄。 */
function devPool(){
  try{ return JSON.parse(store("devpool") || "[]"); }catch(e){ return []; }
}
function devPoolSave(a){
  try{ store("devpool", JSON.stringify(a.slice(-3000))); }catch(e){}
}
function devAll(){
  const seen={}, out=[];
  const key=r=>r.at+"|"+(r.who||"")+"|"+(r.src||"");
  devLog().map(r=>Object.assign({},r,{src:"本機"}))
    .concat(devPool())
    .forEach(r=>{ const k=key(r); if(seen[k]) return; seen[k]=1; out.push(r); });
  return out.sort((a,b)=>b.at-a.at);
}
function devImport(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length) return;
  let done=0, added=0, bad=0;
  files.forEach(f=>{
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const rows=JSON.parse(fr.result);
        if(!Array.isArray(rows)) throw new Error("not an array");
        const src=f.name.replace(/^usage-|\.json$/g,"") || f.name;
        const pool=devPool(), seen={};
        pool.forEach(r=>{ seen[r.at+"|"+(r.who||"")+"|"+(r.src||"")]=1; });
        rows.forEach(r=>{
          if(!r || typeof r.at!=="number") return;
          const rec={at:r.at, who:r.who||"", ver:r.ver||"", lang:r.lang||"",
                     tz:r.tz||"", dur:+r.dur||0, src:src};
          const k=rec.at+"|"+rec.who+"|"+rec.src;
          if(seen[k]) return;
          seen[k]=1; pool.push(rec); added++;
        });
        devPoolSave(pool);
      }catch(e){ bad++; }
      if(++done===files.length){
        devPanelOpen();
        alert("匯入完成：新增 "+added+" 筆"+(bad?("，"+bad+" 個檔讀不出來"):""));
      }
    };
    fr.onerror=()=>{ bad++; if(++done===files.length) devPanelOpen(); };
    fr.readAsText(f);
  });
}
function devFmt(ms){
  const d = new Date(ms);
  const p = v => String(v).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function devDur(sec){
  if(sec < 60) return sec + " 秒";
  if(sec < 3600) return Math.floor(sec/60) + " 分";
  return Math.floor(sec/3600) + " 時 " + Math.floor((sec%3600)/60) + " 分";
}
/* 版面診斷：iOS 獨立視窗（加到主畫面）的視埠算法在桌機模擬不出來，
   直接把數字量在使用者的機器上，比再猜一次快。 */
function devEnvText(){
  const cs=getComputedStyle(document.documentElement);
  const inset=k=>{
    const d=document.createElement("div");
    d.style.cssText="position:fixed;top:0;left:0;height:env(safe-area-inset-"+k+");visibility:hidden";
    document.body.appendChild(d);
    const v=Math.round(d.getBoundingClientRect().height);
    d.remove(); return v;
  };
  const vv=window.visualViewport;
  const cr=document.getElementById("credit");
  const rb=cr?cr.getBoundingClientRect():null;
  const L=[
    ["獨立視窗", (window.navigator.standalone===true) ? "是" :
                (matchMedia("(display-mode: standalone)").matches ? "是（manifest）" : "否")],
    ["螢幕 screen", screen.width+" x "+screen.height],
    ["視窗 inner", window.innerWidth+" x "+window.innerHeight],
    ["visualViewport", vv ? Math.round(vv.width)+" x "+Math.round(vv.height)
                            +"  offsetTop "+Math.round(vv.offsetTop)
                            +"  scale "+(Math.round(vv.scale*100)/100) : "（無）"],
    ["文件 documentEl", document.documentElement.clientWidth+" x "+document.documentElement.clientHeight],
    ["body 實際高", Math.round(document.body.getBoundingClientRect().height)],
    ["安全區 上/下", inset("top")+" / "+inset("bottom")],
    ["安全區 左/右", inset("left")+" / "+inset("right")],
    ["頁尾底邊", rb?Math.round(rb.bottom):"—"],
    ["底下留白", rb?Math.round(window.innerHeight-rb.bottom):"—"],
    ["dpr", window.devicePixelRatio],
    ["支援 dvh", (CSS && CSS.supports && CSS.supports("height","100dvh")) ? "是" : "否"],
  ];
  return L.map(a=>a[0].padEnd(15,"\u3000".length?" ":" ")+"  "+a[1]).join("\n");
}

function devPanelOpen(){

       （回報：開發者面板標題被切掉）。這裡自己補一次四邊的安全區。 */
    box.style.cssText = "position:fixed;inset:0;z-index:99;background:#0B1018;" +
      "color:#F5EFE4;overflow:auto;font-family:inherit;" +
      "padding:calc(18px + env(safe-area-inset-top)) " +
              "calc(18px + env(safe-area-inset-right)) " +
              "calc(18px + env(safe-area-inset-bottom)) " +
              "calc(18px + env(safe-area-inset-left))";
    document.body.appendChild(box);
  }
  box.innerHTML = devPanelHTML();
  box.style.display = "block";
  const on = (id, fn) => { const e = document.getElementById(id); if(e) e.onclick = fn; };
  on("devClose", devPanelClose);

    const e = document.getElementById("devWho");

    devTouch(); devPanelOpen();

/* =====================================================================
   手繪畫風覆寫（v191 hand）
   整支 app 的圖形都走 R / O / L / P / brk 這幾個 primitive，所以畫風換一次
   就好，3,800 多組寫死的座標一個都不用動。這一段放在最後面，函式宣告後
   蓋前，原本的實作保留成 *_lego，hdOn() 回傳 false 就整個切回積木版。
   規則三條：
     1) 外框不用白線，一律從自己的填色壓深 45%（她指定的）。
     2) 抖動的種子綁「量化後的座標與尺寸」，同一個形狀每一幀抖一樣；
        會移動的東西每移 3px 才換一次，就是手繪動畫該有的呼吸感，
        不會整張畫面沙沙作響。
     3) 大面積（天空、地板、牆）不描邊也不抖，否則背景會出現一圈黑框。
   ===================================================================== */
/* 這裡不能用 const。函式宣告會提升，封面在腳本跑到這一行之前就已經呼叫 R()，
   那時候 const 還在 TDZ，直接 ReferenceError。改成提升安全的函式＋字面值。
   想切回積木版：把 hdOn 的 return 改成 false。 */
function hdOn(){ return true; }
/* 抖動幅度跟著尺寸走。固定值的話小零件（五官、鈕釦）被抖到糊掉，
   大面積又抖不夠看不出手感。 */
function hdAmp(size){
  if(size==null) return 1.0;
  if(size < 14) return 0.30;
  if(size < 34) return 0.70;
  if(size < 90) return 1.15;
  return 1.55;
}
function hdEdgeK(){ return -0.45; }   /* 外框＝填色壓深幾成 */

function R_lego(x0,y0,x1,y1,f,o,w){if(f){g.fillStyle=f;g.fillRect(x0,y0,x1-x0,y1-y0);}if(o){g.strokeStyle=o;g.lineWidth=w||1;g.strokeRect(x0+.5,y0+.5,x1-x0-1,y1-y0-1);}}
function O_lego(x0,y0,x1,y1,f,o,w){g.beginPath();g.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,6.2832);if(f){g.fillStyle=f;g.fill();}if(o){g.strokeStyle=o;g.lineWidth=w||1;g.stroke();}}
function L_lego(p,c,w,cap){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.strokeStyle=c;g.lineWidth=w||1;g.lineCap=cap||"butt";g.stroke();g.lineCap="butt";}
function P_lego(p,f,o,w){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();if(f){g.fillStyle=f;g.fill();}if(o){g.strokeStyle=o;g.lineWidth=w||1;g.stroke();}}

/* 雜訊：純函式，同樣的輸入永遠同一個值，不用配置陣列 */
function hdN(a,b,c,d){ const v=Math.sin(a*12.9898+b*78.233+c*37.719+d*11.137)*43758.5453; return v-Math.floor(v)-0.5; }
function hdSeed(x,y,w,h){ return [Math.round(x/3),Math.round(y/3),Math.round(w),Math.round(h)]; }
/* 描邊色：有填色就從填色壓深，沒有才用呼叫端給的。漸層物件不是字串，跳過。 */
/* 外框。原本只要填色是 # 開頭就一律描一條壓深 45% 的邊，
   結果陰影、高光、半透明疊層全部被描邊——地上那些黑圈就是這樣來的。
   規則：呼叫端指定 o 就照它畫；沒指定的話只有實心主體才自動生邊，
   非常暗或非常亮的填色一律視為陰影／高光，不描。 */
function hdEdge(f,o){
  if(o) return o;
  if(typeof f!=="string" || f.charCodeAt(0)!==35) return null;
  const h=f.length>=7 ? f : "#"+f[1]+f[1]+f[2]+f[2]+f[3]+f[3];
  const r=parseInt(h.substr(1,2),16), g2=parseInt(h.substr(3,2),16), b=parseInt(h.substr(5,2),16);
  const lum=(r*0.299+g2*0.587+b*0.114)/255;
  if(lum<0.22 || lum>0.93) return null;
  return mix(f,hdEdgeK());
}
function hdBig(w,h){ return Math.abs(w)>260 || Math.abs(h)>200; }
function hdStroke(f,o,w,scale){
  const e=hdEdge(f,o); if(!e) return;
  g.strokeStyle=e; g.lineWidth=w||Math.max(1.4,Math.min(3.2,scale*0.12));
  g.lineJoin="round"; g.lineCap="round"; g.stroke();
}

function R(x0,y0,x1,y1,f,o,w){
  if(!hdOn()) return R_lego(x0,y0,x1,y1,f,o,w);
  const W=x1-x0, H=y1-y0, aw=Math.abs(W), ah=Math.abs(H);
  if(aw<5 || ah<5 || hdBig(W,H)){          /* 小件與大面積照舊，快又不搶戲 */
    if(f){ g.fillStyle=f; g.fillRect(x0,y0,W,H); }
    if(!hdBig(W,H)){ const e=hdEdge(f,o); if(e){ g.strokeStyle=e; g.lineWidth=w||1; g.strokeRect(x0+.5,y0+.5,W-1,H-1); } }
    return;
  }
  /* 圓角＋抖動。切角直接連會像被削掉一塊，所以四角走二次曲線，
     控制點就是原本那個直角的頂點。 */
  const s=hdSeed(x0,y0,W,H), a=Math.min(hdAmp(Math.min(aw,ah)),Math.min(aw,ah)*0.10);
  const r=Math.min(Math.min(aw,ah)*0.22,9);
  const J=(px,py,i)=>[px+hdN(s[0]+i,s[1],s[2],s[3])*2*a, py+hdN(s[1]+i,s[0],s[3],s[2])*2*a];
  const p0=J(x0+r,y0,0), p1=J(x1-r,y0,1), p2=J(x1,y0+r,2), p3=J(x1,y1-r,3),
        p4=J(x1-r,y1,4), p5=J(x0+r,y1,5), p6=J(x0,y1-r,6), p7=J(x0,y0+r,7);
  g.beginPath();
  g.moveTo(p0[0],p0[1]); g.lineTo(p1[0],p1[1]);
  g.quadraticCurveTo(x1,y0,p2[0],p2[1]); g.lineTo(p3[0],p3[1]);
  g.quadraticCurveTo(x1,y1,p4[0],p4[1]); g.lineTo(p5[0],p5[1]);
  g.quadraticCurveTo(x0,y1,p6[0],p6[1]); g.lineTo(p7[0],p7[1]);
  g.quadraticCurveTo(x0,y0,p0[0],p0[1]);
  g.closePath();
  if(f){ g.fillStyle=f; g.fill(); }
  hdStroke(f,o,w,Math.min(aw,ah));
}

function O(x0,y0,x1,y1,f,o,w){
  if(!hdOn()) return O_lego(x0,y0,x1,y1,f,o,w);
  const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2;
  if(rx<2.5 || ry<2.5 || hdBig(rx*2,ry*2)){
    g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,6.2832);
    if(f){ g.fillStyle=f; g.fill(); }
    if(!hdBig(rx*2,ry*2)){ const e=hdEdge(f,o); if(e){ g.strokeStyle=e; g.lineWidth=w||1; g.stroke(); } }
    return;
  }
  const s=hdSeed(x0,y0,rx*2,ry*2), a=Math.min(hdAmp(Math.min(rx,ry)*2),Math.min(rx,ry)*0.12), N=16;
  g.beginPath();
  for(let i=0;i<=N;i++){
    const th=i/N*6.2832, k=1+hdN(s[0]+i,s[1],s[2],s[3])*2*a/Math.max(rx,ry);
    const px=cx+rx*k*Math.cos(th), py=cy+ry*k*Math.sin(th);
    i?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.closePath();
  if(f){ g.fillStyle=f; g.fill(); }
  hdStroke(f,o,w,Math.min(rx,ry)*2);
}

function L(p,c,w,cap){
  if(!hdOn() || p.length<4) return L_lego(p,c,w,cap);
  const s=hdSeed(p[0],p[1],p[p.length-2]-p[0],p[p.length-1]-p[1]);
  const _len=Math.hypot(p[p.length-2]-p[0], p[p.length-1]-p[1]);
  const a=Math.min(hdAmp(_len)*0.8,(w||1)*0.9);
  g.beginPath();
  for(let i=0;i<p.length;i+=2){
    const px=p[i]+hdN(s[0]+i,s[1],s[2],s[3])*2*a, py=p[i+1]+hdN(s[1]+i,s[0],s[3],s[2])*2*a;
    i?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.strokeStyle=c; g.lineWidth=w||1; g.lineCap="round"; g.lineJoin="round"; g.stroke(); g.lineCap="butt";
}

function P(p,f,o,w){
  if(!hdOn() || p.length<6) return P_lego(p,f,o,w);
  let _x0=p[0],_x1=p[0],_y0=p[1],_y1=p[1];
  for(let i=0;i<p.length;i+=2){ if(p[i]<_x0)_x0=p[i]; if(p[i]>_x1)_x1=p[i];
    if(p[i+1]<_y0)_y0=p[i+1]; if(p[i+1]>_y1)_y1=p[i+1]; }
  const s=hdSeed(p[0],p[1],p[2]-p[0],p[3]-p[1]);
  const a=hdAmp(Math.min(_x1-_x0,_y1-_y0))*0.9;
  g.beginPath();
  for(let i=0;i<p.length;i+=2){
    const px=p[i]+hdN(s[0]+i,s[1],s[2],s[3])*2*a, py=p[i+1]+hdN(s[1]+i,s[0],s[3],s[2])*2*a;
    i?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.closePath();
  if(f){ g.fillStyle=f; g.fill(); }
  hdStroke(f,o,w,40);
}

/* 積木塊改成手繪塊：留上緣亮面、下緣暗面（立體感來源），拿掉圓釘與側面色帶。 */
function brk(x0,y0,x1,y1,col,studs,edge){
  if(!hdOn()){
    const w=x1-x0,h=y1-y0;
    R_lego(x0,y0,x1,y1,col,edge||null,1);
    R_lego(x0,y0,x1,y0+h*0.18,mix(col,0.12));
    R_lego(x0,y1-h*0.16,x1,y1,mix(col,-0.17));
    R_lego(x0,y0,x0+w*0.07,y1,mix(col,0.07));
    R_lego(x1-w*0.07,y0,x1,y1,mix(col,-0.12));
    if(studs>0){ const r=Math.max(1.6,Math.min((x1-x0)/(studs*2)*0.68,(y1-y0)*0.34));
      for(let i=0;i<studs;i++) stud_lego(x0+(x1-x0)*(i+0.5)/studs,y0,r,col); }
    return;
  }
  const h=y1-y0;
  R(x0,y0,x1,y1,col,edge||null,1);
  /* 亮暗帶要有最小厚度。層板那種 4px 高的塊，比例算出來的帶子會比 1px 還薄、
     甚至上下顛倒，畫出來是一條雜訊。太薄就整個不畫。 */
  if(Math.abs(h)>=14 && typeof col==="string" && col.charCodeAt(0)===35){
    const b=Math.max(3,Math.abs(h)*0.20);
    g.save(); g.globalAlpha=0.55;
    R(x0+2,y0+1.5,x1-2,y0+b,mix(col,0.14),null);
    R(x0+2,y1-b,x1-2,y1-1.5,mix(col,-0.16),null);
    g.restore();
  }
}

/* 色盤換成粉筆色：底幾乎全黑，物件低彩度。C 是 const 物件，改屬性是合法的，
   重新綁定才不行。畫面每一幀都重讀 C，所以這裡改完下一幀就生效。 */
Object.assign(C,{
  /* 背景提亮並回到偏藍的倉庫調性。doodle 原本把底色壓到 #0F0E0D 近純黑，
     整個場景暗到看不出景深，貨架和牆糊成一片。粉筆的柔和感靠低彩度就夠了，
     不需要靠壓黑。 */
  bg:"#243039", wall:"#2C3A44", wall2:"#26333C", dark:"#1A242B",
  floor:"#3A4650", floor2:"#313D46", steel:"#7E868C", steel2:"#59626A",
  rack:"#A8684A", rack2:"#4A5560", orange:"#D98A4A", orange2:"#B8733C",
  kraft:"#BF9B68", kraft2:"#A8874F", kraft3:"#D4B184",
  wood:"#7D5738", wood2:"#5E4028", cream:"#ECE5D7", muted:"#8A8578",
  glow:"#E8C13C", glow2:"#7FB8CC", mint:"#7FC6A8", safety:"#D9B452",
  vest:"#C97F43", skin:"#E2B28A", band:"#0A0908"
});
["#E2B28A","#C89A72","#8F5F3C","#EFCFA8"].forEach((v,i)=>{ SKIN[i]=v; });

function stud_lego(cx,cy,r,col){
  O_lego(cx-r,cy-r*0.62,cx+r,cy+r*0.62,mix(col,0.07));
  O_lego(cx-r,cy-r*1.02,cx+r,cy+r*0.22,mix(col,0.26));
}
function stud(cx,cy,r,col){ if(!hdOn()) return stud_lego(cx,cy,r,col); }
function studField(x0,y0,x1,y1,step,col,alpha){
  if(hdOn()) return;                     /* 地板的圓釘點陣：手繪版不需要 */
  g.save(); g.globalAlpha=alpha===undefined?0.10:alpha;
  for(let y=y0+step/2;y<y1;y+=step)
    for(let x=x0+step/2;x<x1;x+=step) O_lego(x-step*0.26,y-step*0.26,x+step*0.26,y+step*0.26,col);
  g.restore();
}


/* =====================================================================
   手繪角色（Doodle v194 造型）—— 原封不動搬自 Doodle Warehouse。
   人、貓、狗的造型、比例、錨點都照原檔，一行沒改：腳底在 y、
   頭心在 y-50*sc、o.hold 就是手要伸到的點，所以呼叫端不用動。
   原檔的線色是從它那套主題引擎（hcTheme）拿的；這邊只需要固定一組，
   所以給一個極簡替身回同樣的三個色，其餘依賴照搬。
   ===================================================================== */
function hcTheme(){ return {ink:"#3E352E", ink2:"#7A7166", bg:"#CFC2A6"}; }
function hcLumCache(){ return hcLumCache._m || (hcLumCache._m=new Map()); }
function hcLum(hex){
  const m=hcLumCache(), hit=m.get(hex);
  if(hit!==undefined) return hit;
  const n=parseInt(hex.slice(1),16);
  const l=(((n>>16)&255)*0.299+((n>>8)&255)*0.587+(n&255)*0.114)/255;
  m.set(hex,l); return l;
}
function hcEdgeFor(fill,big,w,h){
  const T=hcTheme();
  if(typeof fill!=="string" || fill.charCodeAt(0)!==35) return big?T.ink2:T.ink;
  /* 地面、路面那種又寬又扁的塊，每一塊都描一圈黑框，整片就變成格子牆
     （回報：這裡太亂）。寬度超過 90 而且很扁的，線收成跟填色很近的深色。 */
  /* 柔化只給「又寬又扁」的地面條。月台、牆板這種又寬又高的面板要照樣描黑線
     （回報：dock 四方要畫黑線），所以再加一個高度上限。 */
  if(w!=null && Math.abs(w)>90 && Math.abs(h)<Math.abs(w)*0.42 && Math.abs(h)<70)
    return mix(fill,-0.16);
  const L=hcLum(fill), inkL=hcLum(T.ink);
  if(big) return L>0.35 ? mix(fill,-0.34) : T.ink2;           /* 大面積：只給一點邊 */
  /* 線一律走主題的線色（現在是黑的）。只有在填色本身已經很暗、
     黑線會整條消失的時候，才改用比填色亮一階的邊，讓形狀不會糊成一團。
     地板、夜空那種大片深色因此自動安靜下來，不再滿版都是亮框。 */
  /* 門檻壓到 0.10：只有幾乎全黑的填色（夜空那種）才改用亮一階的邊，
     其餘一律黑線。深色地板的邊會因此變得很輕，那正是要的效果。 */
  if(L>0.10) return T.ink;
  return mix(fill,0.30);
}
function hcShadow(x0,y0,x1,y1,k){
  const dark=hcLum(hcTheme().bg)<0.5;
  const a=(k||1)*(dark?0.30:0.20);
  g.beginPath();
  g.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,6.2832);
  g.fillStyle=dark?("rgba(0,0,0,"+a.toFixed(2)+")"):("rgba(70,52,34,"+a.toFixed(2)+")");
  g.fill();
}
/* =====================================================================
   手繪角色覆寫（v194）— 照 doodle v3 的造型與比例
   v3 的人腳底在 gy、頭心在 gy-248，這支 app 的頭心在 y-50*sc，
   所以 v3 的座標乘 0.2*sc 就完全對得上，比例一比一搬過來，
   錨點（腳底、頭心、o.hold）都不動，呼叫端一行不用改。
   線是白的、粗的；填色是粉筆色；手是連指手套、鞋子是大的。
   ===================================================================== */
/* 又是提升問題：封面在腳本跑到這裡之前就呼叫 person()，用 const 會落在 TDZ，
   填色會成功、設定線色那一行才炸——畫面上就只剩一截沒有外框的手臂。
   覆寫區塊裡一律不放頂層 const，全部用函式。 */
function hcInk(){ return hcTheme().ink; }   /* 線色走主題，可在調色盤裡改 */
function hcN(a,b,c,d){ const v=Math.sin(a*12.9898+b*78.233+c*37.719+d*11.137)*43758.5453; return v-Math.floor(v)-0.5; }
function hcJit(p,seed,amp){
  return p.map((q,i)=>[q[0]+hcN(seed+i,seed*2,i,3)*2*amp, q[1]+hcN(seed*3,seed+i,i,7)*2*amp]); }
function hcPath(pts,seed,fill,lw,close){
  const p=hcJit(pts,seed,0.5);
  g.beginPath(); g.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++) g.lineTo(p[i][0],p[i][1]);
  if(close!==false) g.closePath();
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(lw){ g.strokeStyle=fill?hcEdgeFor(fill,false):hcInk();
    g.lineWidth=lw; g.lineJoin="round"; g.lineCap="round"; g.stroke(); }
}
function hcEP(cx,cy,rx,ry,n,a0,a1){ n=n||18; a0=a0||0; a1=a1==null?6.2832:a1;
  const o=[]; for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; o.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]); } return o; }
function hcEll(cx,cy,rx,ry,fill,seed,lw){ hcPath(hcEP(cx,cy,rx,ry),seed,fill,lw==null?1:lw); }

/* 小尺寸的線條不能用 hcPath 抖：它把每一個點各抖 ±1px，臉上只有十幾像素寬的
   嘴一抖就變成一排鋸齒（回報：嘴巴那是什麼）。這裡走平滑的二次曲線，
   只有兩端各帶一點點手繪的歪，中間不抖。 */
function hcCurve(pts,lw,col){
  if(!pts||pts.length<2) return;
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
    g.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);
  }
  const L=pts[pts.length-1];
  g.quadraticCurveTo(L[0],L[1],L[0],L[1]);

/* 嘴：一條下彎（笑）或上彎（板臉）的短曲線，兩端稍微翹一點 */
/* 眉毛：六款＋不畫。左右鏡射，所以只算一邊的形狀再翻過去。
   眉頭在內側、眉尾在外側，抬高／下壓由 dIn/dOut 控制。 */
/* 名牌：白底黑字的小識別證。人和寵物共用，換一處兩邊一起變。 */
function hcNameTag(cx, baseY, text){
  const fs=11, tw=Math.max(34, text.length*(typeof lang!=="undefined"&&lang==="zh"?fs:fs*0.72)+16), th=16;
  const ni=Math.max(3, tw*0.10), ty=baseY+3;
  const fill=(hcLum(hcTheme().bg)<0.5)?"#F8F4EA":mix(hcTheme().bg,0.34), ink="#241D17";
  const tag=[[cx-tw/2+ni,ty-th],[cx+tw/2-ni,ty-th],[cx+tw/2,ty-th*0.5],
             [cx+tw/2-ni,ty],[cx-tw/2+ni,ty],[cx-tw/2,ty-th*0.5]];
  hcPath(tag,905,mix(fill,-0.62),1.6,true);
  hcPath(tag.map(function(p){ return [cx+(p[0]-cx)*0.93, ty-th*0.5+(p[1]-(ty-th*0.5))*0.86]; }),
         906,fill,1.1,true);
  TXT_(cx, ty-th*0.42, text, ink, fs, true);
}
/* 戴帽子時，帽簷（hy-26）以下露出來的那一段頭髮。
   每一款的差別放在：兩鬢的長短、瀏海露不露、後腦有沒有垂下來。 */
function hcCapHair(x, hy, S, st, hair, lw){
  const brim=hy-S(24);
  function side(sd, top, bot, w1, w2){        /* 兩鬢：從帽簷往下的一片 */
    hcPath([[x+sd*S(46),brim],[x+sd*S(w1),brim+S(4)],
            [x+sd*S(w2),hy+S(bot)],[x+sd*S(30),hy+S(top)]], 860+sd, hair, lw);
  }
  function fringe(a,b2,c){                    /* 瀏海：帽簷底下露出的一條 */
    hcPath([[x-S(40),brim],[x+S(40),brim],
            [x+S(a),brim+S(9)],[x+S(b2),brim+S(c)],[x-S(a),brim+S(9)]], 866, hair, lw);
  }
  switch(st){
    case "buzz":                              /* 平頭：兩鬢剃得很短，只留一點點 */
      side(-1,-16,-12,50,44); side(1,-16,-12,50,44); break;
    case "short":                             /* 短髮：兩鬢到耳中，瀏海平的 */
      side(-1,-6,0,52,46); side(1,-6,0,52,46); fringe(24,0,6); break;
    case "sidepart":                          /* 旁分：一邊長一邊短，瀏海斜的 */
      side(-1,4,10,54,48); side(1,-10,-4,50,44);
      hcPath([[x-S(40),brim],[x+S(34),brim],[x+S(10),brim+S(12)],[x-S(38),brim+S(7)]],867,hair,lw); break;
    case "middle":                            /* 中分：正中間留一個缺口 */
      side(-1,0,6,53,47); side(1,0,6,53,47);
      hcPath([[x-S(40),brim],[x-S(6),brim],[x-S(12),brim+S(11)],[x-S(38),brim+S(7)]],868,hair,lw);
      hcPath([[x+S(6),brim],[x+S(40),brim],[x+S(38),brim+S(7)],[x+S(12),brim+S(11)]],869,hair,lw); break;
    case "curly":                             /* 捲髮：兩側各三球捲翹出來 */
      [-1,1].forEach(function(sd){ [0,1,2].forEach(function(i){
        hcEll(x+sd*S(46-i*3), hy+S(-14+i*13), S(11), S(10), hair, 870+sd*3+i, lw); }); }); break;
    case "bun":                               /* 包頭：帽子後面露出一顆髻 */
      side(-1,-8,-2,50,45); side(1,-8,-2,50,45);
      hcEll(x+S(44), hy-S(40), S(15), S(14), hair, 876, lw); break;
    default:                                  /* 中長、長髮、鮑伯：本來就有後髮，不重複畫 */
      break;
  }
}
function hcBrow(cx,hy,S,style,lw){
  if(style==="none") return;
  const P={
    flat:  {len:7,  dIn:-5,  dOut:-6,  arc:0,    w:1.0},
    arch:  {len:7.5,dIn:-4,  dOut:-5,  arc:-3.5, w:1.0},
    raised:{len:7,  dIn:-3,  dOut:-9,  arc:-1.5, w:1.0},
    thick: {len:7.5,dIn:-5,  dOut:-6.5,arc:-1,   w:2.1},
    thin:  {len:6.5,dIn:-5,  dOut:-6,  arc:-1,   w:0.62},
    angled:{len:7,  dIn:-8,  dOut:-3,  arc:0,    w:1.2}
  }[style] || {len:7,dIn:-5,dOut:-6,arc:0,w:1.0};
  [-1,1].forEach(function(sd){
    const inX = cx + sd*S(24-P.len), outX = cx + sd*S(24+P.len);
    const midX= cx + sd*S(24), midY = hy + S((P.dIn+P.dOut)/2 + P.arc);
    hcCurve([[inX, hy+S(P.dIn)], [midX, midY], [outX, hy+S(P.dOut)]],
            Math.max(0.8, lw*P.w));
  });
}
function hcMouth(x,y,w,h,lw,up){
  const s=up?-1:1;
  hcCurve([[x-w, y-s*h*0.25],[x-w*0.42, y+s*h],[x+w*0.42, y+s*h],[x+w, y-s*h*0.25]], lw);
}
function hcArc(cx,cy,rx,ry,a0,a1,lw){ hcPath(hcEP(cx,cy,rx,ry,12,a0,a1),7,null,lw||1,false); }
function hcLine(pts,seed,lw){ hcPath(pts,seed,null,lw||1,false); }
function hcBez(p0,p1,p2,n){ n=n||12; const o=[];
  for(let i=0;i<=n;i++){ const t=i/n,u=1-t;
    o.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0], u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]); } return o; }
function hcTaper(curve,w0,w1,fill,seed,lw){
  const L=[],R2=[];
  for(let i=0;i<curve.length;i++){
    const t=i/(curve.length-1), w=(w0+(w1-w0)*t)/2;
    const a=curve[Math.max(i-1,0)], b=curve[Math.min(i+1,curve.length-1)];
    const dx=b[0]-a[0], dy=b[1]-a[1], m=Math.hypot(dx,dy)||1;
    L.push([curve[i][0]-dy/m*w, curve[i][1]+dx/m*w]);
    R2.unshift([curve[i][0]+dy/m*w, curve[i][1]-dx/m*w]);
  }
  hcPath(L.concat(R2),seed,fill,lw==null?1:lw);
}
function hcDot(cx,cy,r,col){ g.beginPath(); g.arc(cx,cy,Math.max(0.8,r),0,6.2832); g.fillStyle=col||"#2A2622"; g.fill(); }

/* ── 人：v3 的造型，座標乘 0.2*sc ── */
function person(x,y,ph,coat,o){
  /* 抖動修正（回報：上班的人在抖動）：呼叫端給的 x/y 常常帶小數，而且
     每一幀都在微幅變化——手繪輪廓的抗鋸齒整個重算，3 倍屏上看起來
     全身在沸騰。錨點量化到整數場景像素：站著的人每一幀畫出來位元
     完全相同；走動的人變成 1px 階梯，換算到手機上比 1 個 CSS 像素
     還細，肉眼仍是平滑的。 */
  x=Math.round(x); y=Math.round(y);
  o=o||{}; const sc=o.sc||1, K=0.2*sc, S=v=>v*K;
  const cr=o.crouch||0, fa=o.face||0, yy=y+S(65)*cr;        /* v3 尺度的下沉量 */
  const sw=Math.sin(ph||0)*S(16);
  const skin=o.skin||C.skin, hair=o.hair||"#4A3526", OF=o.outfit||"vest";
  const hem=(OF==="coverall")?mix(coat,-0.12):"#3F4A54";
  const shoe=C.safety||"#D9B452";
  const lw=Math.max(0.9,1.05*sc), lw2=Math.max(0.8,0.85*sc);
  const hy=yy-S(248)+(o.headDy||0);
  hcShadow(x-S(70),y+S(6)-S(18),x+S(70),y+S(6)+S(18));       /* 影子：只填色不描邊 */

  /* 手：v3 是皮膚色錐形＋連指手套 */
  const drop=S(o.armLift||0);
  function arm(sd,tip){
    const sx=x+sd*S(40)*(0.62+0.38*(o.bodyW||1))*((o.shoulder||9.5)/9.5), sy=yy-S(188);
    /* 手要垂在身體外側、比下襬再低一點。原本停在 yy-106（下襬上方）
       又往內收，兩隻手就在肚子前面接成一圈。 */
    /* 手垂直放下（她要求）：原本手掌落在 ±92，肩膀在 ±40，兩隻手往外撇成
       八字。改成落在 ±54，跟肩膀幾乎同一條垂線，只比軀幹再外面一點點。 */
    const end=tip||[x+sd*S(46)*(0.62+0.38*(o.bodyW||1)), yy-S(78)-drop];
    const slv=(OF==="longsleeve"||OF==="coverall"||OF==="jacket"||OF==="hoodie")?mix(coat,-0.12):skin;
    /* 手肘往外再往內收一點，手臂就不是一根直管子 */
    /* 控制點也收進來，手臂才不會外弓成括號 */
    const bez=hcBez([sx,sy],[x+sd*S(48)*(0.62+0.38*(o.bodyW||1)),yy-S(140)-drop*0.5],end);
    hcTaper(bez,S(17),S(11),slv,30+sd,lw2*1.15);
    /* 短袖：手臂原本從肩膀就是皮膚，背心像直接貼在裸手上（回報：人太醜）。
       上臂補一截袖管——T恤、polo、圍裙用衣服色；背心、吊帶褲底下當作
       有一件淺一階的內衣。連帽衫改成長袖，本來就該是長袖。 */
    if(slv===skin) hcTaper(bez.slice(0,5),S(19),S(15),
      (OF==="vest"||OF==="dungaree")?mix(coat,0.30):coat, 36+sd,lw2);
    hcEll(end[0],end[1]+S(9),S(12),S(13),skin,31+sd,lw2);
    if((o.sc||1)>=0.8){
      hcEll(end[0]-sd*S(9),end[1]+S(4),S(5),S(6),skin,33+sd,lw2);      /* 拇指 */
      hcLine([[end[0]-S(13),end[1]-S(4)],[end[0]+S(13),end[1]-S(4)]],35+sd,lw2); /* 袖口 */
    }
  }
  if(o.handL || o.handR){
    /* 兩隻手各自指定落點（絕對座標）。打字、對單這種手要放在特定平面上的
       姿勢，只能用絕對座標指定——用相對身體的偏移量，換一個桌高就跑掉。 */
    if(o.handR) arm(1, o.handR);
    if(o.handL) arm(-1, o.handL);

  else if(o.armLift2!==undefined){
    /* 打字：兩隻手都往面朝的方向伸到桌面上，各自小幅上下。
       typist() 傳的是 armLift 與 armLift2 兩個值，之前 person() 只認前者，
       所以兩隻手一起垂在身側——人坐在桌前，手卻不在鍵盤上。 */
    const fd=fa||-1;
    arm(fd,  [x+fd*S(88), yy-S(96)-S(o.armLift||0)]);
    arm(-fd, [x+fd*S(64), yy-S(96)-S(o.armLift2||0)]);
  }
  else if(o.hold){ const hs=o.holdSide||1;
    arm(hs,[o.hold[0],o.hold[1]]); arm(-hs); }
  else { [-1,1].forEach(sd=>{
      const wv=(o.waveSide===sd)?1:0;
      arm(sd, wv?[x+sd*S(106),yy-S(228)]:null); }); }

  /* 身體：v3 的圓罩衫 ＋ 下襬那一條 */
  /* 身形：肩寬、腰寬、整體寬窄都要進到軀幹的座標裡。
     原本這裡是寫死的 v3 數字，所以選「瘦」只有腿變細、身體照樣是那一顆。 */
  /* bodyW 是 0.64／1／1.26。直接乘上去，瘦的那一檔會瘦成一條（回報：太瘦）。
     壓縮成 0.86–1.10：剪影還是分得出胖瘦，但三檔都還像個人。 */

  hcPath([[x-TS(18),yy-S(202)],[x-TS(42),yy-S(186)],
          [x-TW(50)*nip,yy-S(150)],[x-TW(42)*nip,yy-S(120)],
          [x-TW(52),yy-S(84)],[x-TW(26),yy-S(72)],
          [x+TW(26),yy-S(72)],[x+TW(52),yy-S(84)],
          [x+TW(42)*nip,yy-S(120)],[x+TW(50)*nip,yy-S(150)],
          [x+TS(42),yy-S(186)],[x+TS(18),yy-S(202)]],3,coat,lw*1.25);
  hcEll(x+S(1),yy-S(80),TW(52),S(13),hem,44,0);

       畫在 hcOutfit 之前，反光條、拉鍊、口袋那些細節才會壓在陰影上面。 */
    hcEll(x-TW(33),yy-S(148),TW(13),S(30),mix(coat,0.22),47,0);    /* 亮面 */
    hcEll(x+TW(36),yy-S(132),TW(10),S(38),mix(coat,-0.14),48,0);   /* 暗面 */
  }

  if(sc>=0.8)

  /* 腿與大鞋子 */
  /* 褲子：腿原本直接填皮膚色，等於沒穿褲子在上班（回報：人太醜）。
     改成工作褲，顏色跟下襬同一塊布；連身服的褲管就是衣服本身延下來。 */
  const LB=0.62+0.38*(o.bodyW||1);
  [[-20,-sw],[18,sw]].forEach(([lx,s2])=>
    hcTaper([[x+S(lx)*LB,yy-S(78)],[x+S(lx*0.94)*LB+s2*0.5,yy-S(50)],[x+S(lx*0.88)*LB+s2,y-S(20)]],
            S(19)*LB,S(16)*LB,hem,8+lx,lw2*1.15));
  [[-30,-sw],[28,sw]].forEach(function(p){
    hcEll(x+S(p[0])*LB+p[1],y-S(9),S(25)*LB,S(11),shoe,9+p[0],lw2*1.15);
    if(sc>=0.8) hcLine([[x+S(p[0])*LB+p[1]-S(13),y-S(3)],[x+S(p[0])*LB+p[1]-S(8),y-S(9)]],15+p[0],Math.max(0.8,lw2*0.7));  /* 後跟一刀 */
    if(sc>=0.8) hcEll(x+S(p[0])*LB+p[1],y-S(4),S(23)*LB,S(5),mix(shoe,-0.34),11+p[0],0);
    if(sc>=0.8) hcEll(x+S(p[0])*LB+p[1],y-S(12),S(10),S(3.5),mix(shoe,0.24),13+p[0],0);  /* 鞋面亮點 */
  });

  /* 脖子：頭直接坐在肩上，剪影就是一顆球疊一個桶。補一段脖子，
     再壓一道領口的陰影，人形才立得起來。 */
  hcEll(x,hy+S(44),S(17),S(22),mix(skin,-0.06),2,lw2);
  hcEll(x,hy+S(58),S(26),S(9),mix(coat,-0.22),3,0);
  /* 頭：正圓看起來像吉祥物。改成略窄略高的蛋形，下巴收一點。 */
  /* headW 是男女的臉寬（0.94／1.08）：樂高版有、手繪覆寫忘了搬，
     男女的臉一樣寬。耳朵補一對小的，畫在頭髮之前，長髮自然蓋掉。 */
  /* 線寬分層：外輪廓加粗、內部細節變細——手繪「有下筆」跟「描圖」的差別。 */
  hcEll(x,hy,S(52)*(o.headW||1),S(58),skin,1,lw*1.3);

     在場景尺寸下就是臉上多一個三角形（回報：三角形給我從臉上拿掉）。
     臉形改由頭部橢圓自己負責——它本來就已經是略高的蛋形。 */
  if(o.cap){
    /* 戴安全帽時，頭頂那一片被蓋住，所以髮型只能靠「帽簷下那一撮」講話。
       整個不畫的話，選單上選了什麼髮型在人身上完全看不出來（回報：看不到髮型）。 */
    if(st_ && st_!=="none" && st_!=="buzz" && st_!=="undercut"){
      const fr = (st_==="spike"||st_==="short") ? 10
               : (st_==="curly"||st_==="afro")  ? 16 : 13;
      hcPath([[x-S(48),hy-S(26)],[x-S(42),hy-S(26-fr)],[x,hy-S(24-fr)],
              [x+S(42),hy-S(26-fr)],[x+S(48),hy-S(26)]],851,hair,lw2);
      if(st_==="curly"||st_==="afro")
        [-1,1].forEach(function(sd){ hcEll(x+sd*S(44),hy-S(14),S(11),S(9),852+sd,hair,lw2); });
      if(st_==="long"||st_==="wave"||st_==="medium"||st_==="bob")
        [-1,1].forEach(function(sd){        /* 長髮戴帽：兩側再補一段，才看得出長度 */
          hcTaper([[x+sd*S(46),hy-S(18)],[x+sd*S(54),hy+S(10)],[x+sd*S(44),hy+S(30)]],
                  S(16),S(9),hair,854+sd,lw2); });
    }
  } else {
    hcHairFront(x,hy,S,hair,st_,lw2);
    /* 髮頂一道亮澤：素色一整片的頭髮補一條淺一階的短弧，看起來有梳理過。
       平頭、飛機頭本來就是碎的，不加。 */
    if(sc>=0.8 && st_!=="none" && st_!=="buzz" && st_!=="undercut" && st_!=="spike"){
      hcCurve([[x-S(32),hy-S(38)],[x-S(8),hy-S(50)],[x+S(16),hy-S(46)]],
              Math.max(1,lw2*1.1), mix(hair,0.34));
      /* 兩條短髮絲：一整片色塊變成「梳過的頭髮」。比內部線再細一階、
         深一階的髮色，跟著頭型的弧走。 */
      hcCurve([[x-S(22),hy-S(30)],[x-S(6),hy-S(40)]],Math.max(0.8,lw2*0.7),mix(hair,-0.18));
      hcCurve([[x+S(6),hy-S(40)],[x+S(24),hy-S(30)]],Math.max(0.8,lw2*0.7),mix(hair,-0.18));
    }
  }
  if(o.cap){
    /* 安全帽：圓頂＋一圈窄帽緣。帽緣停在眼睛上面（眼睛在 hy-10），
       而且不能寬到變成燈罩——寬帽緣加上兩側露出來的頭髮，看起來像兩個把手。 */
    /* 之前是圓頂＋整圈深色橫帶＋一條橫肋——讀起來是條紋毛帽不是工程帽
       （回報：人物要再美化）。工程帽的三個記號：中脊、帽簷、圓頂，
       照這個順序畫。帽簷寬度維持 ±58，跟舊橫帶一樣寬，不會變燈罩。 */
    hcPath(hcEP(x,hy-S(26),S(52),S(44),14,Math.PI,6.2832).concat([[x-S(52),hy-S(26)]]),831,o.cap,lw);
    hcPath([[x-S(7),hy-S(69)],[x-S(5),hy-S(34)],[x+S(5),hy-S(34)],[x+S(7),hy-S(69)]],
           833,mix(o.cap,0.12),Math.max(0.8,lw2*0.8));            /* 中脊 */
    hcEll(x,hy-S(24),S(58),S(7),o.cap,832,lw2);                    /* 帽簷 */
    hcEll(x,hy-S(24),S(44),S(3.5),mix(o.cap,-0.16),836,0);         /* 簷下陰影 */
    hcEll(x-S(22),hy-S(46),S(12),S(7),mix(o.cap,0.26),834,0);      /* 帽頂亮點 */
    /* 帽簷以下露出來的頭髮。不畫的話，戴上帽子之後短髮、旁分、中分、平頭、
       捲髮、包頭六款會長得一模一樣——我上一版改的是頭頂，剛好整段被帽子蓋住
       （回報：男生頭髮請看清楚戴帽子後）。每一款在這裡要有自己的樣子。 */
    hcCapHair(x, hy, S, o.hairStyle||"short", hair, lw2);
  }
  const ez=o.eyeSz||1, fine=(sc>=0.8);      /* 小尺寸略過細節，免得糊成一團 */
  /* 五官整組往下移：帽簷壓在 hy-26 左右，之前眼睛在 hy-6，整組擠在帽子底下，
     下半張臉是空的。往下 12 個單位，眼距也從 ±21 拉開到 ±24。 */
  if(fine) [-30,30].forEach(function(bx){    /* 腮紅先畫，眼睛壓在上面 */
    hcEll(x+S(bx)+gz,hy+S(22),S(9),S(5.5),880+bx,mix(skin,-0.15),0); });
  [-24,24].forEach(function(ex){
    hcDot(x+S(ex)+gz,hy+S(6),S(6.6*ez),"#000000");   /* 眼睛 */
    /* 眼神光拿掉（她要求）：小尺寸下那一點白反而讓眼睛看起來是空心的。 */
  });
  /* 睫毛：眼尾往外上那一撇，只有女生有——樂高版本來就有這條性別線索，
     手繪覆寫忘了搬過來，男女的臉除了髮型完全一樣。轉頭時遠端那一撇
     會掉進頭髮，只留近端。 */
  if(o.lash && fine) [-1,1].forEach(function(sd){
    if(fa && sd!==fa) return;
    hcCurve([[x+sd*S(30)+gz,hy+S(3)],[x+sd*S(37)+gz,hy-S(1)]],Math.max(0.9,lw2*0.85));
  });
  if(fine){
    /* 眉毛：走可選的 hcBrow。v260 修抖動時我的替換範圍太大，把這一行還原成
       寫死的舊版，所以選單按了畫面沒反應（回報：眉毛按了沒反應）。 */
    hcBrow(x+gz, hy, S, o.brow||"flat", lw2);
    hcDot(x+gz,hy+S(18),S(2.2),mix(skin,-0.34));                     /* 鼻 */
  }
  /* 嘴：改成一條很短、微微下彎的線。之前那個大笑臉的弧太搶戲，
     整個不畫又讓臉是空的（回報：人的嘴巴給我改）。 */
  if(fine) hcMouth(x+gz, hy+S(30), S(8), S(2.6), Math.max(0.9,lw2*0.9), o.mood==="stern");
  /* 名牌在這裡拿掉了。這一支 person() 是從 Doodle 搬過來的，它自己會畫一張
     識別證；而我這邊的 worker() 本來就在頭上掛一條名牌，兩個都畫就是上下
     各一個「Sandy」（回報：兩個，拿掉下面的）。識別證畫在 y-60、舊名牌在
     y-76，下面那個就是這一段。留 worker() 那一條，因為場景裡所有帶名字的
     角色都是走 worker()，直接呼叫 person() 而帶 tag 的地方是 0 處。 */
}



function dog(x,y,t,fa,walk,B,lift,eat,squat){
  B=B||DOG_BREEDS.corgi; fa=fa||1;
  x=Math.round(x); y=Math.round(y);   /* 抖動修正：同 person，錨點量化 */
  eat=Math.max(0,Math.min(1,eat||0)); squat=Math.max(0,Math.min(1,squat||0)); lift=lift||0;
  const K=0.23*B.sz*0.74, S=v=>v*K, bk=B.bulk||1, lg=B.leg||1;   /* 0.74：她說貓狗太大 */
  const b=B.b, cr=B.c, far=mix(b,-0.16), lw=Math.max(0.9,1.1*K*4);
  /* 走路：前後腳反相；四條腿各自差半個相位，才不是兩支棍子在平移 */
  const sw=walk?Math.sin(t*0.28):0, sw2=walk?Math.sin(t*0.28+Math.PI):0;
  const bob=walk?Math.abs(Math.sin(t*0.28))*S(4):0;
  const dz=S((1-lg)*26)+S(30)*squat - bob;      /* 短腿犬整隻坐低，不是把腿截掉 */
  const legL=S(46*lg), hipY=y-S(58)+dz, footY=y-S(6);
  hcEll(x,y+S(6),S(78*bk),S(18),PET_SHADOW||mix(C.floor,-0.17),70,0);
  /* 尾巴 */
  if(B.tail==="nub") hcEll(x-S(62*bk)*fa,y-S(76)+dz,S(13),S(14),b,71,lw);
  else if(B.tail==="pom"){
    hcTaper(hcBez([x-S(50*bk)*fa,y-S(74)+dz],[x-S(76)*fa,y-S(96)+dz],[x-S(80)*fa,y-S(116)+dz]),S(11),S(7),b,71,lw);
    hcEll(x-S(84)*fa,y-S(128)+dz,S(14),S(14),b,72,lw);
  } else hcTaper(hcBez([x-S(50*bk)*fa,y-S(76)+dz],[x-S(86)*fa,y-S(100)+dz],
                       [x-S(88)*fa,y-S(B.tail==="curl"?150:138)+dz]),
                 S(B.tail==="plume"?20:14),S(7),b,71,lw);
  /* 遠側兩腿：壓深、先畫，身體蓋住根部 */
  [[-38,sw],[34,sw2]].forEach(([o_,p])=>
    hcTaper([[x+S(o_)*fa,hipY],[x+S(o_+p*10)*fa,hipY+legL*0.55],[x+S(o_+p*18)*fa,footY]],
            S(17),S(14),far,73+o_,lw));
  hcEll(x-S(2*bk)*fa,y-S(74)+dz,S(56*bk),S(32+bk*6),b,20,lw*1.2);      /* 身體 */
  /* 兩塊面讓身體變圓：肚子淺一階、背脊壓一道深的。單色一大片是
     「畫上去的狗」，這兩塊補上去才是「站在那裡的狗」。 */
  hcEll(x-S(4*bk)*fa,y-S(58)+dz,S(36*bk),S(13),mix(b,0.16),27,0);
  hcEll(x-S(6*bk)*fa,y-S(92)+dz,S(40*bk),S(9),mix(b,-0.10),28,0);
  if(B.bib) hcEll(x+S(34*bk)*fa,y-S(64)+dz,S(18),S(26),cr,241,0);
  if(B.curly) [-30,-6,18].forEach(o_=>hcEll(x+S(o_)*fa,y-S(96)+dz,S(15),S(12),mix(b,0.10),26+o_,0));
  /* 頭與脖子 */
  const hxx=x+S(62*bk)*fa, hyy=y-S(118)+dz+S(46)*eat;
  hcTaper([[x+S(34*bk)*fa,y-S(96)+dz],[hxx-S(12)*fa,hyy+S(22)]],S(34),S(30),b,78,lw);
  if(B.ear==="flop") [[-36,-1],[30,1]].forEach(([ex,sx])=>
    hcPath([[hxx+S(ex)*fa,hyy-S(16)],[hxx+S(ex+sx*10)*fa,hyy+S(8)],
            [hxx+S(ex+sx*4)*fa,hyy+S(44)],[hxx+S(ex-sx*16)*fa,hyy+S(18)]],22+ex,mix(b,-0.12),lw));
  hcEll(hxx,hyy,S(38),S(36),b,21,lw*1.2);
  if(B.mask) hcEll(hxx,hyy-S(4),S(27),S(22),mix(b,0.42),29,0);
  /* 項圈＋吊牌：脖子那一段本來只是一根色柱。 */
  hcEll(x+S(46*bk)*fa,y-S(92)+dz+S(30)*eat,S(15),S(7),mix(b,-0.38),243,0);
  hcDot(x+S(46*bk)*fa,y-S(84)+dz+S(30)*eat,S(3.6),"#D9A441");
  if(B.ear==="point") [[-30,-1],[24,1]].forEach(([ex,sx])=>{
    hcPath([[hxx+S(ex)*fa,hyy-S(22)],[hxx+S(ex+sx*6)*fa,hyy-S(60)],[hxx+S(ex+sx*24)*fa,hyy-S(18)]],23+ex,b,lw);
    hcPath([[hxx+S(ex+sx*7)*fa,hyy-S(26)],[hxx+S(ex+sx*9)*fa,hyy-S(46)],[hxx+S(ex+sx*17)*fa,hyy-S(24)]],123+ex,mix(b,0.30),0);
  });
  if(B.ear==="bat") [[-30,-1],[24,1]].forEach(([ex,sx])=>
    hcEll(hxx+S(ex+sx*6)*fa,hyy-S(36),S(15),S(22),b,24+ex,lw));
  hcEll(hxx+S(20)*fa,hyy+S(18),S(23),S(18),cr,231,lw);                  /* 吻部 */
  hcDot(hxx-S(12)*fa,hyy-S(10),S(5)); hcDot(hxx+S(12)*fa,hyy-S(10),S(5));
  hcDot(hxx+S(28)*fa,hyy+S(9),S(6.5));                                   /* 鼻頭在吻部前緣 */
  hcArc(hxx+S(22)*fa,hyy+S(20),S(12),S(9),Math.PI*0.15,Math.PI*0.85,lw);
  /* 近側兩腿：最後畫，抬腿時只抬後面那一條 */
  [[-30,sw2],[42,sw]].forEach(([o_,p],i)=>{
    if(lift&&i===0){
      hcTaper([[x+S(o_)*fa,hipY],[x+S(o_-16)*fa,hipY+legL*0.3],[x+S(o_-30)*fa,hipY+legL*0.1]],
              S(18),S(14),B.socks?cr:b,75,lw); return; }
    hcTaper([[x+S(o_)*fa,hipY],[x+S(o_+p*12)*fa,hipY+legL*0.55],[x+S(o_+p*20)*fa,footY]],
            S(18),S(15),B.socks?cr:b,76+o_,lw);
    hcEll(x+S(o_+p*20)*fa,footY+S(4),S(13),S(7),B.socks?cr:b,77+o_,lw); });
}

function catDraw(x,y,t,fa,walk,sq,B,eat){
  B=B||CAT_BREEDS.ragdoll; fa=fa||1;
  x=Math.round(x); y=Math.round(y);   /* 抖動修正：同 person，錨點量化 */
  eat=Math.max(0,Math.min(1,eat||0)); sq=Math.max(0,Math.min(1,sq||0));
  /* 貓的基準從 0.21 降到 0.15。貓的品種係數（0.97~1.22）本來就開得比狗
     （0.82~1.16）高，基準只差 0.02 抵不過去，所以緬因貓會比柯基還大
     （回報：貓咪比狗小）。降到 0.15 之後，最大的貓也小於最小的狗。 */
  const K=0.15*B.sz*0.74, S=v=>v*K, bk=B.bulk||1;
  const b=B.b, cr=B.c, pt=B.pt||b, far=mix(b,-0.16), lw=Math.max(0.9,1.1*K*4);
  const sw=walk?Math.sin(t*0.3):0, sw2=walk?Math.sin(t*0.3+Math.PI):0;
  const bob=walk?Math.abs(Math.sin(t*0.3))*S(3):0;
  const dz=S(26)*sq - bob, hipY=y-S(48)+dz, footY=y-S(6);
  hcEll(x,y+S(6),S(64*bk),S(16),PET_SHADOW||mix(C.floor,-0.17),90,0);
  hcTaper(hcBez([x-S(40*bk)*fa,y-S(66)+dz],[x-S(84)*fa,y-S(78)+dz],
                [x-S(80)*fa,y-S(130)+dz-(walk?S(6)*sw:0)]),S(B.fluffy?20:15),S(6),pt,35,lw);
  [[-34,sw],[30,sw2]].forEach(([o_,p])=>
    hcTaper([[x+S(o_)*fa,hipY],[x+S(o_+p*9)*fa,hipY+S(22)],[x+S(o_+p*16)*fa,footY]],
            S(14),S(11),far,92+o_,lw));
  hcEll(x,y-S(62)+dz,S(46*bk),S(26+bk*5),b,93,lw*1.2);
  hcEll(x+S(4)*fa,y-S(52)+dz,S(28*bk),S(10),mix(b,0.18),306,0);   /* 胸腹淺一階 */
  if(B.stripes) [-16,0,16].forEach(o_=>
    hcArc(x+S(o_),y-S(76)+dz,S(12),S(9),Math.PI*1.12,Math.PI*1.88,Math.max(0.7,lw*0.8),B.stripes));
  if(B.patch1) hcEll(x-S(16)*fa,y-S(76)+dz,S(15),S(12),B.patch1,304,0);
  if(B.patch2) hcEll(x+S(16)*fa,y-S(58)+dz,S(14),S(11),B.patch2,305,0);
  const hxx=x+S(50*bk)*fa, hyy=y-S(96)+dz+S(38)*eat;
  hcTaper([[x+S(26*bk)*fa,y-S(78)+dz],[hxx-S(10)*fa,hyy+S(18)]],S(26),S(24),b,94,lw);
  hcEll(hxx,hyy,S(32),S(30),B.pt?mix(b,0.05):b,96,lw*1.2);
  [[-22,-1],[10,1]].forEach(([ex])=>{
    hcPath([[hxx+S(ex)*fa,hyy-S(20)],[hxx+S(ex+4)*fa,hyy-S(48)],[hxx+S(ex+22)*fa,hyy-S(24)]],97+ex,B.pt||b,lw);
    hcPath([[hxx+S(ex+6)*fa,hyy-S(24)],[hxx+S(ex+8)*fa,hyy-S(40)],[hxx+S(ex+16)*fa,hyy-S(25)]],197+ex,"#C98A90",0);
  });
  if(B.stripes){                        /* 尾巴兩圈環紋，虎斑貓的記號 */
    hcArc(x-S(76)*fa,y-S(112)+dz,S(9),S(7),Math.PI*1.1,Math.PI*1.9,Math.max(0.7,lw*0.8),B.stripes);
    hcArc(x-S(80)*fa,y-S(124)+dz,S(8),S(6),Math.PI*1.1,Math.PI*1.9,Math.max(0.7,lw*0.8),B.stripes);
  }
  const ec=B.eye||"#2A2622";
  hcDot(hxx-S(11)*fa,hyy-S(5),S(4.6),ec); hcDot(hxx+S(11)*fa,hyy-S(5),S(4.6),ec);
  hcPath([[hxx+S(2)*fa,hyy+S(5)],[hxx+S(12)*fa,hyy+S(5)],[hxx+S(7)*fa,hyy+S(12)]],99,"#C98A90",0);
  [[-1,-1],[6,1]].forEach(([sy,sd])=>
    hcLine([[hxx+S(24)*fa,hyy+S(sy)],[hxx+S(50)*fa,hyy+S(sy+sd*6)]],40+sy,Math.max(0.6,lw*0.55)));
  [[-26,sw2],[38,sw]].forEach(([o_,p])=>{
    hcTaper([[x+S(o_)*fa,hipY],[x+S(o_+p*10)*fa,hipY+S(22)],[x+S(o_+p*18)*fa,footY]],
            S(15),S(12),b,95+o_,lw);
    hcEll(x+S(o_+p*18)*fa,footY+S(4),S(11),S(6),cr,98+o_,lw); });
}

function hcHairBack(x,hy,S,hair,st,lw){        /* 畫在頭之前（會被頭蓋住的部分） */
  if(st==="bob"){
    hcEll(x,hy-S(10),S(60),S(52),hair,811,lw);
    [-1,1].forEach(sd=>hcPath([[x+sd*S(60),hy-S(16)],[x+sd*S(66),hy+S(40)],
      [x+sd*S(40),hy+S(44)],[x+sd*S(36),hy+S(4)]],812+sd,hair,lw));
  } else if(st==="long"||st==="medium"||st==="wave"){
    const ln=st==="long"?64:st==="wave"?52:34;
    [-1,1].forEach(sd=>hcTaper([[x+sd*S(44),hy-S(24)],[x+sd*S(62),hy+S(ln*0.5)],[x+sd*S(42),hy+S(ln)]],
      S(24),S(st==="wave"?18:12),hair,814+sd,lw));
    if(st==="wave") [-1,1].forEach(sd=>[0.35,0.7].forEach(f2=>
      hcEll(x+sd*S(56),hy+S(ln*f2),S(13),S(11),mix(hair,0.10),816+sd*f2*10,lw)));
  } else if(st==="bun"){ hcEll(x-S(50),hy-S(52),S(22),S(20),hair,821,lw);
  } else if(st==="ponytail"){
    hcTaper(hcBez([x-S(48),hy-S(16)],[x-S(84),hy+S(20)],[x-S(70),hy+S(76)]),S(20),S(9),hair,823,lw);
  } else if(st==="twin"){
    [-1,1].forEach(sd=>hcTaper(hcBez([x+sd*S(52),hy-S(20)],[x+sd*S(84),hy+S(14)],[x+sd*S(72),hy+S(62)]),
      S(17),S(8),hair,824+sd,lw));
  } else if(st==="afro"){
    [[-46,-26],[0,-46],[46,-26],[-52,10],[52,10]].forEach(([dx,dy],i)=>
      hcEll(x+S(dx),hy+S(dy),S(26),S(24),hair,830+i,lw));
  }
}
function hcHairFront(x,hy,S,hair,st,lw){       /* 畫在頭之後（蓋在臉上緣的部分） */
  if(st==="none") return;
  if(st==="spike"||st==="short"){
    const n=st==="spike"?5:3;                   /* 短髮只有中間三根，不是每個人都五根 */
    (st==="spike"?[[-58,-22],[-29,-46],[0,-54],[29,-46],[58,-22]]
                 :[[-26,-40],[0,-48],[26,-40]]).slice(0,n).forEach(([dx,dy])=>
      hcLine([[x+S(dx*0.6),hy-S(34)],[x+S(dx),hy-S(34)+S(dy)]],dx+7,lw));
    if(st==="short") hcPath(hcEP(x,hy-S(6),S(54),S(44),12,Math.PI,6.2832).concat([[x-S(54),hy-S(6)]]),
      840,hair,lw);
    return;
  }
  if(st==="buzz"||st==="undercut"){
    hcPath(hcEP(x,hy-S(12),S(52),S(38),12,Math.PI,6.2832).concat([[x-S(52),hy-S(12)]]),841,
      st==="undercut"?hair:mix(hair,0.10),lw);
    if(st==="undercut") hcPath(hcEP(x,hy-S(24),S(40),S(30),10,Math.PI,6.2832).concat([[x-S(40),hy-S(24)]]),
      842,mix(hair,0.16),lw);
    return;
  }
  if(st==="afro") return;                       /* 爆炸頭整圈都在後面那一層 */

  /* 男生那幾款原本共用同一頂帽子形的頭髮，差別只有一條分線或一塊陰影，
     縮到場景尺寸就完全分不出來（回報：男生頭髮幾乎都沒差）。
     改成每一款有自己的「輪廓」——瀏海的形狀、髮線的高低、兩鬢的長短，
     剪影本身就要不一樣，不能只靠內部的線條。 */
  if(st==="sidepart"){
    /* 旁分：一邊壓低、一邊翹起，髮線斜著走 */
    hcPath([[x-S(56),hy-S(4)],[x-S(52),hy-S(40)],[x-S(20),hy-S(56)],
            [x+S(30),hy-S(48)],[x+S(56),hy-S(22)],[x+S(54),hy-S(2)],
            [x+S(20),hy-S(26)],[x-S(24),hy-S(20)]],822,hair,lw);
    hcCurve([[x-S(18),hy-S(50)],[x+S(14),hy-S(34)],[x+S(46),hy-S(24)]],Math.max(1,lw*1.1),
            mix(hair,-0.34));
    return;
  }
  if(st==="middle"){
    /* 中分：正中間往兩側分開，額頭中央露出一個尖 */
    hcPath([[x-S(56),hy-S(2)],[x-S(50),hy-S(44)],[x-S(14),hy-S(56)],
            [x,hy-S(30)],
            [x+S(14),hy-S(56)],[x+S(50),hy-S(44)],[x+S(56),hy-S(2)],
            [x+S(30),hy-S(22)],[x-S(30),hy-S(22)]],822,hair,lw);
    return;
  }
  if(st==="buzzcut2"||st==="short"){
    /* 短髮：貼著頭皮，瀏海壓成一條平的，兩鬢短 */
    hcPath([[x-S(54),hy-S(10)],[x-S(50),hy-S(46)],[x-S(16),hy-S(58)],
            [x+S(16),hy-S(58)],[x+S(50),hy-S(46)],[x+S(54),hy-S(10)],
            [x+S(40),hy-S(30)],[x-S(40),hy-S(30)]],822,hair,lw);
    return;
  }
  /* 其餘（中長、長髮、鮑伯、包頭）沿用原本那頂，形狀由後面那一層負責 */
  hcPath(hcEP(x,hy-S(6),S(55),S(46),12,Math.PI,6.2832).concat([[x-S(55),hy-S(6)]]),822,hair,lw);
  if(st==="curly") [-1,1].forEach(sd=>[0,1,2].forEach(i=>
    hcEll(x+sd*S(44-i*4),hy-S(38-i*22),S(15),S(13),hair,845+sd*3+i,lw)));
}
/* ── 服裝：每一款在剪影或顏色上要有差別 ── */
function hcOutfit(x,yy,S,coat,skin,OF,lw){
  if(OF==="hoodie"||OF==="apron")
    [150,124].forEach(yv=>hcLine([[x-S(46),yy-S(yv)],[x+S(46),yy-S(yv)]],50+yv,lw));
  if(OF==="vest"){
    /* 反光條：背心的招牌就是那一條亮帶，原本只有兩條黑線，看起來像畫錯的摺痕。
       亮帶用背心色提亮、不寫死灰色，換制服色也成立；腰上再留一條細線收尾。 */
    hcPath([[x-S(47),yy-S(156)],[x+S(47),yy-S(156)],[x+S(47),yy-S(140)],[x-S(47),yy-S(140)]],
      50,mix(coat,0.46),Math.max(0.8,lw*0.8));
    hcLine([[x-S(46),yy-S(120)],[x+S(46),yy-S(120)]],51,lw);
  }
  if(OF==="coverall"){
    /* 連身工作服原本一整片素色，像個布袋。補一條拉鍊到腰、胸前一個口袋。 */
    hcLine([[x,yy-S(192)],[x,yy-S(116)]],61,lw*1.3);
    hcPath([[x-S(36),yy-S(166)],[x-S(14),yy-S(166)],[x-S(14),yy-S(144)],[x-S(36),yy-S(144)]],
      62,mix(coat,-0.14),Math.max(0.8,lw*0.9));
  }
  if(OF==="hoodie")                                  /* 頸後那一塊 */
    hcPath([[x-S(34),yy-S(196)],[x+S(34),yy-S(196)],[x+S(46),yy-S(160)],[x-S(46),yy-S(160)]],
      52,mix(coat,-0.24),lw);
  if(OF==="apron")                                   /* 圍裙：中間一片淺色＋兩條肩帶 */
    hcPath([[x-S(30),yy-S(170)],[x+S(30),yy-S(170)],[x+S(38),yy-S(84)],[x-S(38),yy-S(84)]],
      53,mix(coat,0.34),lw);
  if(OF==="tee"||OF==="coverall"){
    /* 領口一道弧：脖子跟衣服原本是兩塊色紙直接疊著，補一條領口線
       身體跟頭才接得起來。 */
    hcCurve([[x-S(16),yy-S(196)],[x,yy-S(188)],[x+S(16),yy-S(196)]],
            Math.max(0.8,lw*0.9), mix(coat,-0.22));
  }
  if(OF==="polo"){                                   /* 領子與門襟 */
    hcPath([[x-S(20),yy-S(196)],[x,yy-S(176)],[x+S(20),yy-S(196)]],54,mix(coat,0.20),lw);
    hcLine([[x,yy-S(176)],[x,yy-S(148)]],55,lw);
  }
  if(OF==="dungaree"){                               /* 吊帶褲：兩條肩帶＋前口袋 */
    [-1,1].forEach(sd=>hcLine([[x+sd*S(26),yy-S(196)],[x+sd*S(20),yy-S(120)]],56+sd,lw*1.6));
    hcPath([[x-S(24),yy-S(120)],[x+S(24),yy-S(120)],[x+S(24),yy-S(88)],[x-S(24),yy-S(88)]],
      58,mix(coat,-0.16),lw);
  }
  if(OF==="jacket"){                                 /* 外套：門襟一條到底＋翻領 */
    hcLine([[x,yy-S(190)],[x,yy-S(80)]],59,lw*1.4);
    [-1,1].forEach(sd=>hcPath([[x+sd*S(6),yy-S(194)],[x+sd*S(34),yy-S(186)],[x+sd*S(12),yy-S(156)]],
      60+sd,mix(coat,0.16),lw));
  }
}






</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  /* 註冊時帶版本號。
     瀏覽器對 sw.js 這個檔案本身也有快取——舊的 service worker 還在跑，
     手機根本不會去抓新的那支，所以 sw.js 裡的 BUILD 換了它也不知道，
     一直吃舊快取（回報：網址進去是新版，手機卻是舊的）。
     網址後面掛 APP_VER，換版就是不同的 URL，一定會重新抓。

     另外主動叫它檢查更新並在裝好後立刻接手，不用等所有分頁都關掉。 */
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js?v=" + APP_VER)
      .then(reg => {
        reg.update();
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if(!nw) return;
          nw.addEventListener("statechange", () => {
            /* 新的裝好、而且已經有舊的在控制 → 換版了，重整一次拿新檔 */
            if(nw.state === "activated" && navigator.serviceWorker.controller){
              location.reload();
            }
          });
        });
      })
      .catch(()=>{});
  });
}

/* ===== 倉庫彩蛋：主畫面雙擊角落。原檔搬來，加一道 Poppy 才作用的條件 ===== */
(()=>{
  const cv=document.getElementById("cv");
  if(!cv || cv.__warehouseEggBound) return;
  cv.__warehouseEggBound=true;
  let taps=0,tapTimer=0,code="",codeTimer=0;
  const inMain=()=>typeof tab==="number" && tab===0
                  && typeof SKIN_KEY!=="undefined" && SKIN_KEY==="poppy";
  const point=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*(900/r.width),(e.clientY-r.top)*(560/r.height)];};
  const sound=()=>{ if(typeof sfxSuccess==="function") sfxSuccess(); else if(typeof sfxClick==="function") sfxClick(); };
  function toast(title,sub){
    let el=document.getElementById("eggToast");
    if(!el){el=document.createElement("div");el.id="eggToast";document.body.appendChild(el);}
    el.innerHTML="<strong>"+title+"</strong><span>"+sub+"</span>";
    el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
    cv.classList.remove("warehouse-pulse"); void cv.offsetWidth; cv.classList.add("warehouse-pulse");
    window.setTimeout(()=>el.classList.remove("show"),2300);
    if(typeof sparkBurst==="function"){const r=cv.getBoundingClientRect();sparkBurst(r.left+r.width/2,r.top+r.height*.28);}
    sound();
    if(navigator.vibrate) try{navigator.vibrate(18)}catch(_e){}
  }
  cv.addEventListener("dblclick",e=>{
    if(!inMain()) return;
    const [x,y]=point(e);
    if(x<240 && y<180) toast("DOCK LIGHTS ONLINE","Dock 6 is ready for the next parcel.");
    else if(y>390) toast("BELT BOOST","The conveyor is taking the scenic route.");
    else toast("SECRET CHECKPOINT","You found a quiet corner of the warehouse.");
  },{passive:true});
  cv.addEventListener("click",()=>{
    if(!inMain()) return;
    taps++;
    window.clearTimeout(tapTimer);
    tapTimer=window.setTimeout(()=>{taps=0},900);
    if(taps>=5){taps=0;toast("BONUS SHIFT","Five quick checks: extra hands on deck.");}
  },{passive:true});
  document.addEventListener("keydown",e=>{
    if(!inMain() || e.ctrlKey || e.metaKey || e.altKey || e.key.length!==1) return;
    code=(code+e.key.toLowerCase()).slice(-9);
    window.clearTimeout(codeTimer); codeTimer=window.setTimeout(()=>{code=""},1800);
    if(code==="warehouse"){code="";toast("WAREHOUSE MODE","Hidden route unlocked for this session.");}
  });
})();
</script>
